[AmmunitionNames]
wp_aa-10a=AA-10A,Alamo,SARH AAM,AA-10A アラモ（ヴィンペル R-27R）は、ソ連製の中距離セミアクティブ・レーダー誘導空対空ミサイル。先行するAA-7ミサイル・シリーズの後継として設計されたAA-10は、ソ連が保有する最新の視程外射程（BVR）空対空ミサイルであり、高速、優れた機動性、対抗手段に強いシーカーを重視している。
wp_aa-10b=AA-10B,Alamo,IR AAM,AA-10B アラモ（ヴィンペル R-27T）は、ソ連製の中距離赤外線誘導空対空ミサイル。先行するAA-7ミサイル・シリーズの後継として設計されたAA-10は、ソ連が保有する最新の視程外射程（BVR）空対空ミサイルであり、高速、優れた機動性、対抗手段に強いシーカーを重視している。
wp_aa-10c=AA-10C,Alamo,SARH AAM,AA-10C アラモ（ヴィンペル R-27ER）は、ソ連製の長距離セミアクティブ・レーダー誘導空対空ミサイル。先行するAA-7ミサイル・シリーズの後継として設計されたAA-10は、ソ連が保有する最新の視程外射程（BVR）空対空ミサイルであり、高速、優れた機動性、対抗手段に強いシーカーを重視している。\n「ロングバーン」型のAA-10C/Dは、AA-10A/Bより大幅に大型のロケットモーターを搭載しており、他に類を見ない最高速度と、大幅に延伸された最大射程を実現している。
wp_aa-10d=AA-10D,Alamo,IR AAM,AA-10D アラモ（ヴィンペル R-27ET）は、ソ連製の長距離赤外線誘導空対空ミサイル。先行するAA-7ミサイル・シリーズの後継として設計されたAA-10は、ソ連が保有する最新の視程外射程（BVR）空対空ミサイルであり、高速、優れた機動性、対抗手段に強いシーカーを重視している。\n「ロングバーン」型のAA-10C/Dは、AA-10A/Bより大幅に大型のロケットモーターを搭載しており、他に類を見ない最高速度と、大幅に延伸された最大射程を実現している。
usn_rim-66h=RIM-66H,SM-2MR,SAM/ASuW,スタンダードミサイル2（SM-2）は、長燃焼時間のサステナーと、ほとんどの脅威に対するバランスの取れた性能を特徴とする、レーダー誘導型の領域防空艦対空ミサイル（副次的な短距離対艦能力を持つ）のファミリーである。スタンダードミサイル2は、SM-1のセミアクティブ・レーダー誘導シーカーを先進的なデータリンク中間誘導に置き換え、飛行の最後の数秒間だけ終末レーダー誘導を行う。SM-2は、イルミネーター（照射レーダー）の数よりも多くのミサイルを同時に飛行させることが可能であり、SM-1を装備する艦艇に対して圧倒的な優位性を提供する。\n\nSM-2MRブロックII（RIM-66H）はSM-2ブロックIIシリーズのイージス（Mk 41 VLS）版であり、Mk 41セルから垂直発射される。これにより発射速度が劇的に向上する一方、最小発射距離は拡大する。
wp_sa-n-1d=SA-N-1D,Goa,SAM/ASuW,SA-N-1D ゴア（M-1 ヴォルナN）は、ソ連最初期の艦載地対空ミサイルシステムの改良型。このバージョンはシースキミング目標に対する有効性が大幅に向上している。
wp_sa-n-3b=SA-N-3B,Goblet,SAM/ASuW,SA-N-3B ゴブレット（M-11 シュトールムN）は、ソ連の艦載地対空ミサイルシステム。多くのミサイル巡洋艦やヘリコプター巡洋艦、STOVL空母に搭載された。二次的な対水上攻撃能力を持ち、このバージョンは低空目標への性能が大幅に向上している。
wp_sa-n-4c=SA-N-4C,Gecko,SAM/ASuW,SA-N-4C ゲッコー（9K33M オサM）は、陸上用のオサ地対空ミサイル（NATO名SA-8 ゲッコー。綴りの違いに注意）の海軍仕様。格納式の旋回発射機に2発のミサイルを装備する。洋上で利用可能なオサの最新モデルであり、低空性能とECCM性能が大幅に向上したほか、全体的な信頼性も高まっている。
wp_sa-n-10=SA-N-10,Grouse,SAM,SA-N-10 グレイル（9K38 イグラ）は、携帯式地対空ミサイル。陸上発射機から使用される場合はNATOでSA-18としても知られる。艦上では点防衛システムとして運用される。
wp_sa-n-12=SA-N-12,Grizzly,SAM/ASuW,SA-N-12 ガドフライ（9M317 ウラガン・トルネード）は、陸上用の9K37 ブーク（SA-17 グリズリー）地対空ミサイルシステムの海軍仕様。エジ（Ezh）は初代ウラガンより射程が延伸され、ECCM性能が向上し、シースキミング・ミサイルへの対処能力も高まっている。
wp_ss-n-22b=SS-N-22B,Sunburn-B,ASM,SS-N-22B サンバーン（3M82 P-270 モスキートM）は、ソ連の水上発射型超音速スタンドオフ対艦兵器。HI-LOプロファイルで飛行し、終末フェーズでは超音速でシースキミング飛行しながら、回避的な蛇行機動（スネーキング）を行って対空防御に対する生存性を高める。\n初期型サンバーンと比べ、1980年代後半のモスキートM（3M82、SS-N-22B）はHI-LO軌道を飛行でき、燃料搭載量の増加により全体の射程が延びたほか、先代より高速かつ低空を飛行する。
wp_ss-1c=SS-1C,Scud-B,TBM,SS-1C スカッドB（R-17 エルブルース 9K72）は、V-2弾道ミサイルを原型とするソ連の戦術弾道ミサイル。低コストと柔軟性から非常に広く拡散した。精密な終末誘導を欠き、発射前に長い燃料注入時間を要するものの、高度な防空網を持たない施設にとっては依然として重大な脅威となりうる。
usn_rum-139a=RUM-139A,VL-ASROC,ASW,RUM-139A VL-ASROC（垂直発射式アスロック）は、スタンドオフ対潜ミサイル。1960年代のRUR-5の暫定的な後継として開発されたRUM-139Aは、Mk 41垂直発射システムからの使用を想定した射程延伸型の対潜ミサイルであり、改良型のMk 46 NEARTIP魚雷を搭載する。冷戦期には正式な調達予算が付かなかったものの、1980年代後半には少数の先行生産弾が利用可能であり、新たに就役したVLS搭載艦に限定的な対潜ミサイル能力を与えている。
usn_mk16=Mk-16,,ASuW Torpedo,Mk 16魚雷は、第二次世界大戦期の直進魚雷であり、1950年代から1960年代にかけて、米国の攻撃型潜水艦が用いる高速・超大威力の対艦魚雷として使われた。誘導機能を持たないが、短距離で命中すれば、大きさを問わずほぼ確実に目標を撃沈できる。Mod 8は、Mod 0の高威力弾頭と、Mod 1魚雷の長い射程を併せ持つ型である。
wp_53-61=53-61M,,WH Torpedo,53-61は、水上艦の撃破を目的としたソ連のウェイク・ホーミング（航跡追尾）重魚雷。ソ連初の航跡追尾魚雷であり、当時としては高速かつ長射程を誇る。
wp_saet-50=SAET-50M,,ASuW Torpedo,SAET-50は、パッシブ・ソナー誘導を備えたソ連の重量級電動対艦魚雷。戦時中のG7es「ツァウンケーニヒ」魚雷を基に開発されたSAET-50は、ソ連初の実用ホーミング魚雷であり、旧式化して高性能な魚雷に置き換えられたものの、特に輸出向けとして冷戦期の相当な期間にわたり保管在庫に残り続けた。
wp_set-53=SET-53M,,ASW Torpedo,SET-53Mは、パッシブ・ソナー誘導を備えたソ連の重量級電動対潜魚雷。SAET-50を基に開発されたSET-53は、ソ連初の重量級対潜魚雷であり、間もなくより高性能な兵器に置き換えられたものの、特に輸出向けとして冷戦期の大半にわたり保管在庫に残り続けた。
rn_dc_mk11=Mark XI,,Depth Bomb,Mark XI航空爆雷は、第二次世界大戦中に設計されたイギリスの航空投下式爆雷であり、20世紀の残りの期間を通じて運用が続けられた。
usn_mk-81=Mk-81,,Bomb,Mk 81は、250ポンド（110kg）の低抵抗汎用通常爆弾（無誘導爆弾）。
