[AmmunitionNames]
it_aspide_1a=Aspide Mk.1A,,SARH AAM,Aspide là tên lửa không đối không tầm trung của Ý, phát triển từ tên lửa Sparrow của Mỹ. Dựa trên AIM-7E, tên lửa này có động cơ cải tiến giúp tăng tầm bắn và tốc độ, đồng thời có đầu dò monopulse được nâng cấp vượt bậc, cho phép phóng ở độ cao thấp và cải thiện khả năng kháng nhiễu ECCM.
fr_r530em=R-530K,,SARH AAM,R530K là tên lửa không đối không tầm ngắn dẫn đường radar bán chủ động của Pháp. Là một trong những tên lửa không đối không tự dẫn đường đầu tiên của Pháp, R530 không phải là vũ khí đặc biệt tin cậy hay mạnh mẽ, nhưng nó có động cơ cháy lâu và tầm bắn khá tốt so với các tên lửa cùng thời.
pla_pl-2b=PL-2B,,IR AAM,PL-2B (霹雳-2) là tên lửa không đối không dẫn đường hồng ngoại của Trung Quốc, chỉ khóa được mục tiêu từ phía sau. PL-2B có mũi dài hơn để chứa đầu dò được cải tiến nhẹ, ngoài ra chỉ là bản nâng cấp nhỏ về độ tin cậy so với PL-2A.
pla_pl-5b=PL-5B,,IR AAM,PL-5B (霹雳-5) là tên lửa không đối không dẫn đường hồng ngoại của Trung Quốc, chỉ khóa được mục tiêu từ phía sau. Được phát triển song song với PL-2B, PL-5B ra đời từ dự án tên lửa dẫn đường radar PL-5A thất bại. Nó dùng đầu dò hồng ngoại phát triển từ PL-2B, nhưng có thân tên lửa tốt hơn về tầm bắn và khả năng cơ động. Chỉ khóa được mục tiêu từ phía sau.
pla_pl-5c=PL-5C,,IR AAM,PL-5C (霹雳-5) là tên lửa không đối không dẫn đường hồng ngoại của Trung Quốc có thể tấn công từ mọi góc độ. Là bản cải tiến lớn so với dòng PL-2 và PL-5B, PL-5C trang bị đầu dò mảng chéo (crossed-array) tiên tiến, cho phép bắn từ mọi góc độ và có khả năng kháng nhiễu đáng kể. Tên lửa cũng có động cơ cháy lâu hơn và khả năng cơ động tốt hơn.
usaf_aim-9p=AIM-9P,Sidewinder,IR AAM,AIM-9P Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Phiên bản Papa là bản xuất khẩu của phiên bản Juliet, với ngòi nổ mới, động cơ mới, đầu dò cải tiến và cho phép bắn từ bên sườn, cùng độ tin cậy cao hơn.
usn_aim-7e2=AIM-7E-2,Sparrow,SARH AAM,AIM-7E-2 "Dogfight" Sparrow là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Echo-2 là biến thể phụ của phiên bản Echo gốc, ra đời sau khi phát hiện những khiếm khuyết về hiệu năng khi đối đầu với tiêm kích tại Việt Nam. Tên lửa có cự ly bắn tối thiểu ngắn hơn, hiệu năng ở độ cao thấp tốt hơn đôi chút và khả năng cơ động trong giai đoạn tăng tốc cao hơn một chút.
usn_aim-7e4=AIM-7E-4,Sparrow,SARH AAM,AIM-7E-4 Sparrow là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Echo-4 là phiên bản nâng cấp của Hải quân Mỹ, nhằm tận dụng radar mạnh hơn đáng kể trên các tiêm kích đời trước, và có đặc tính đầu dò tốt hơn đôi chút trước nhiễu và biện pháp đối kháng.
usn_aim-7f=AIM-7F,Sparrow,SARH AAM,AIM-7F Sparrow là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Foxtrot là bản thiết kế lại thân Sparrow III gốc, với động cơ hai chế độ (boost-sustain) hiện đại cho tầm bắn xa hơn, cùng ngòi nổ cải tiến và đầu dò mạnh hơn, nâng cao hiệu năng ở mọi góc độ.\nTuy vậy, hiệu năng ở độ cao thấp và khả năng kháng nhiễu ECCM của nó vẫn không nổi bật, và đầu dò không thể tận dụng hết tầm bắn xa của tên lửa..
usn_aim-9c=AIM-9C,Sidewinder,SARH AAM,AIM-9C Sidewinder là tên lửa không đối không dẫn đường radar bán chủ động của Mỹ. Charlie là phiên bản Sidewinder dẫn đường radar duy nhất được đưa vào trang bị, giống hệt phiên bản Delta ngoại trừ đầu dò radar bán chủ động, cho phép bắn từ mọi góc độ ở cự ly xa hơn. Do chỉ dành riêng cho F-8 của Hải quân và thường không được phi hành đoàn ưa chuộng, AIM-9C bị loại biên chỉ vài năm sau khi đi vào phục vụ.
usn_aim-9g=AIM-9G,Sidewinder,IR AAM,AIM-9G Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Golf là bản cải tiến so với Delta, với góc phóng rộng hơn, và cũng được xuất khẩu sang các nước khác. Chỉ khóa được mục tiêu từ phía sau.
usn_aim-9h=AIM-9H,Sidewinder,IR AAM,AIM-9H Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Hotel là phiên bản bán dẫn của Golf, với đầu dò nhạy hơn cho phép bắn cả từ bên sườn, cùng khả năng cơ động và độ tin cậy được cải thiện.
usn_aim-9m=AIM-9M,Sidewinder,IR AAM,AIM-9M Sidewinder là tên lửa không đối không dẫn đường hồng ngoại của Mỹ. Biến thể Mike là phiên bản hiện đại nhất đang phục vụ, là bản Lima với khả năng loại bỏ bẫy nhiệt tốt hơn và cự ly đầu dò xa hơn.
wp_aa-10a=R-27R,,SARH AAM,R-27R (NATO: AA-10A Alamo) là tên lửa không đối không tầm trung dẫn đường radar bán chủ động của Liên Xô. Được thiết kế để thay thế dòng tên lửa AA-7 cũ, AA-10 là tên lửa tầm xa ngoài tầm nhìn (BVRAAM) mới nhất của Liên Xô hiện có, nhấn mạnh tốc độ cao, khả năng cơ động tốt và đầu dò chống nhiễu.
wp_aa-10b=R-27T,,IR AAM,R-27T (NATO: AA-10B Alamo) là tên lửa không đối không tầm trung dẫn đường hồng ngoại của Liên Xô. Được thiết kế để thay thế dòng tên lửa AA-7 cũ, AA-10 là tên lửa tầm xa ngoài tầm nhìn (BVRAAM) mới nhất của Liên Xô hiện có, nhấn mạnh tốc độ cao, khả năng cơ động tốt và đầu dò chống nhiễu.
wp_aa-10c=R-27ER,,SARH AAM,R-27ER (NATO: AA-10C Alamo) là tên lửa không đối không tầm xa dẫn đường radar bán chủ động của Liên Xô. Được thiết kế để thay thế dòng tên lửa AA-7 cũ, AA-10 là tên lửa tầm xa ngoài tầm nhìn (BVRAAM) mới nhất của Liên Xô hiện có, nhấn mạnh tốc độ cao, khả năng cơ động tốt và đầu dò chống nhiễu.\nCác phiên bản 'Long-Burn' AA-10C/D có động cơ rocket lớn hơn nhiều so với AA-10A/B, cho tốc độ tối đa vô song và tầm bắn tối đa được mở rộng đáng kể.
wp_aa-10d=R-27ET,,IR AAM,R-27ET (NATO: AA-10D Alamo) là tên lửa không đối không tầm xa dẫn đường hồng ngoại của Liên Xô. Được thiết kế để thay thế dòng tên lửa AA-7 cũ, AA-10 là tên lửa tầm xa ngoài tầm nhìn (BVRAAM) mới nhất của Liên Xô hiện có, nhấn mạnh tốc độ cao, khả năng cơ động tốt và đầu dò chống nhiễu.\nCác phiên bản 'Long-Burn' AA-10C/D có động cơ rocket lớn hơn nhiều so với AA-10A/B, cho tốc độ tối đa vô song và tầm bắn tối đa được mở rộng đáng kể.
wp_aa-11=R-73A,,IR AAM,R-73A (NATO: AA-11 Archer) là tên lửa không đối không tầm ngắn dẫn đường hồng ngoại của Liên Xô. Đây là tên lửa tầm ngắn có hiệu năng cao nhất trong kho vũ khí Liên Xô, vẫn cực kỳ cạnh tranh so với các đối thủ nước ngoài, và là vũ khí cực kỳ nguy hiểm ở cự ly gần từ mọi góc độ.
it_aspide_1=Aspide Mk.1A,,SAM/ASuW,Aspide là tên lửa đất đối không tầm trung của Ý, phát triển từ tên lửa Sparrow của Mỹ. Dựa trên AIM-7E, tên lửa này có động cơ cải tiến giúp tăng tầm bắn và tốc độ, đồng thời có đầu dò monopulse được nâng cấp vượt bậc, cho phép phóng ở độ cao thấp và cải thiện khả năng kháng nhiễu ECCM.\nPhiên bản phóng từ mặt đất có tầm bắn và tốc độ thấp hơn phiên bản phóng từ máy bay, dù vẫn tốt hơn nhiều so với RIM-7E.
rn_seacat_mk2=GWS-24,Seacat,SAM,GWS-24 Seacat là phiên bản nâng cấp của Sea Cat Mk.1 (GWS-20) với hiệu năng ở độ cao thấp tốt hơn, tầm bắn xa hơn, độ tin cậy cao hơn, và được kết hợp với hệ thống điều khiển hỏa lực tiên tiến hơn. Đáng tiếc, đây vẫn là một tên lửa rất kém và hiệu quả đáng ngờ.
usn_rim-66e=RIM-66E,SM-1MR,SAM/ASuW,Standard Missile 1 là dòng tên lửa đất đối không phòng thủ diện rộng dẫn đường radar (có khả năng chống hạm tầm ngắn phụ), đặc trưng bởi động cơ duy trì cháy lâu và hiệu năng cân bằng trước hầu hết các mối đe dọa. Standard Missile 1 được thiết kế như bản nâng cấp đáng tin cậy hơn của RIM-2 Terrier và RIM-24 Tartar trước đó, nhưng vẫn chung các hạn chế về năng lực điều khiển hỏa lực.\n\nSM-1MR Block VI (RIM-66E) là phiên bản Tầm Trung (Medium Range) của dòng SM-1, bản nâng cấp Block VI bao gồm thiết bị điện tử từ SM-2MR Block I (RIM-66C/D) như đầu dò monopulse cải tiến và đầu đạn mới, đồng thời có ngòi nổ cải tiến để bám theo mục tiêu bay sát mặt biển tốt hơn.
usn_rim-66d=RIM-66D,SM-2MR,SAM/ASuW,Standard Missile 2 là dòng tên lửa đất đối không phòng thủ diện rộng dẫn đường radar (có khả năng chống hạm tầm ngắn phụ), đặc trưng bởi động cơ duy trì cháy lâu và hiệu năng cân bằng trước hầu hết các mối đe dọa. Standard Missile 2 thay đầu dò radar bán chủ động của SM-1 bằng dẫn đường giữa hành trình qua liên kết dữ liệu tiên tiến, với radar tự dẫn giai đoạn cuối trong vài giây cuối của chuyến bay. SM-2 cho phép giữ nhiều tên lửa trên không cùng lúc hơn số radar chiếu xạ, mang lại lợi thế vượt trội so với các tàu trang bị SM-1.\n\nSM-2MR Block I (RIM-66D) là phiên bản CG(N)/SM-2(MR) của dòng SM-2MR, chỉ dùng trên các tuần dương hạm lớp Virginia được tái trang bị, và giống hệt RIM-66C (AEGIS) ở mọi khía cạnh ngoại trừ có ít kênh điều khiển hỏa lực hơn và cần thời gian chiếu xạ giai đoạn cuối lâu hơn.
usn_rim-66g=RIM-66G,SM-2MR,SAM/ASuW,Standard Missile 2 là dòng tên lửa đất đối không phòng thủ diện rộng dẫn đường radar (có khả năng chống hạm tầm ngắn phụ), đặc trưng bởi động cơ duy trì cháy lâu và hiệu năng cân bằng trước hầu hết các mối đe dọa. Standard Missile 2 thay đầu dò radar bán chủ động của SM-1 bằng dẫn đường giữa hành trình qua liên kết dữ liệu tiên tiến, với radar tự dẫn giai đoạn cuối trong vài giây cuối của chuyến bay. SM-2 cho phép giữ nhiều tên lửa trên không cùng lúc hơn số radar chiếu xạ, mang lại lợi thế vượt trội so với các tàu trang bị SM-1.\n\nSM-2MR Block II (RIM-66G) là phiên bản AEGIS (Mark 26) của dòng SM-2 Block II, với tầng đẩy mới giúp tăng đáng kể tầm bắn, và ngòi nổ mới để cải thiện hiệu năng chống mục tiêu bay thấp và tốc độ cao.
usn_rim-66h=RIM-66H,SM-2MR,SAM/ASuW,Standard Missile 2 là dòng tên lửa đất đối không phòng thủ diện rộng dẫn đường radar (có khả năng chống hạm tầm ngắn phụ), đặc trưng bởi động cơ duy trì cháy lâu và hiệu năng cân bằng trước hầu hết các mối đe dọa. Standard Missile 2 thay đầu dò radar bán chủ động của SM-1 bằng dẫn đường giữa hành trình qua liên kết dữ liệu tiên tiến, với radar tự dẫn giai đoạn cuối trong vài giây cuối của chuyến bay. SM-2 cho phép giữ nhiều tên lửa trên không cùng lúc hơn số radar chiếu xạ, mang lại lợi thế vượt trội so với các tàu trang bị SM-1.\n\nSM-2MR Block II (RIM-66H) là phiên bản AEGIS (bệ phóng thẳng đứng Mark 41 VLS) của dòng SM-2 Block II, phóng thẳng đứng từ ô phóng Mk-41, giúp tăng đáng kể tốc độ bắn nhưng đổi lại cự ly phóng tối thiểu bị mở rộng.
usn_rim-67c=RIM-67C,SM-2ER,SAM/ASuW,Standard Missile 2 là dòng tên lửa đất đối không phòng thủ diện rộng dẫn đường radar (có khả năng chống hạm tầm ngắn phụ), đặc trưng bởi động cơ duy trì cháy lâu và hiệu năng cân bằng trước hầu hết các mối đe dọa. Standard Missile 2 thay đầu dò radar bán chủ động của SM-1 bằng dẫn đường giữa hành trình qua liên kết dữ liệu tiên tiến, với radar tự dẫn giai đoạn cuối trong vài giây cuối của chuyến bay. SM-2 cho phép giữ nhiều tên lửa trên không cùng lúc hơn số radar chiếu xạ, mang lại lợi thế vượt trội so với các tàu trang bị SM-1.\n\nSM-2ER Block II (RIM-67C) là phiên bản Tầm Mở Rộng (Extended Range) của dòng SM-2 Block II, với tầng đẩy mới giúp tăng đáng kể tầm bắn, và ngòi nổ mới để cải thiện hiệu năng chống mục tiêu bay thấp và tốc độ cao.
wp_sa-n-1d=V-601M,Volna-N,SAM/ASuW,M-1 Volna-N (NATO: SA-N-1D Goa) là phiên bản cải tiến của hệ thống tên lửa hạm đối không sớm nhất của Liên Xô. Phiên bản này có hiệu quả được cải thiện đáng kể trước mục tiêu bay sát mặt biển.
wp_sa-n-3b=V-611M,Shtorm-N,SAM/ASuW,M-11 Shtorm-N (NATO: SA-N-3B Goblet) là hệ thống tên lửa hạm đối không của Liên Xô. Hệ thống được lắp đặt trên nhiều lớp tuần dương hạm tên lửa và tàu sân bay trực thăng/STOVL của Liên Xô. Nó có khả năng phụ là chống mặt nước, và phiên bản này có hiệu năng chống mục tiêu bay thấp được cải thiện đáng kể.
wp_sa-n-4c=9M33M5,Osa-MA2,SAM/ASuW,M-4 Osa (NATO: SA-N-4 Gekko) là phiên bản hải quân của hệ thống tên lửa đất đối không trên bộ Osa (NATO: SA-8 Gecko (lưu ý cách viết khác nhau)) với hai tên lửa trên bệ phóng xoay có thể thu gọn. Đây là mẫu Osa mới nhất hiện có trên biển, với hiệu năng ở độ cao thấp và khả năng kháng nhiễu ECCM được cải thiện vượt bậc, cùng độ tin cậy tổng thể cao hơn.
wp_sa-n-10=9M39,Igla,SAM,9K38 Igla (NATO: SA-N-10 Grail) là tên lửa phòng không vác vai, còn được NATO gọi là SA-18 khi dùng từ bệ phóng mặt đất. Trên tàu, nó được dùng như hệ thống phòng thủ điểm.
wp_sa-n-12=9M317,Uragan,SAM/ASuW,9M317 Uragan-Tornado (NATO: SA-N-12 Gadfly) là phiên bản hải quân của hệ thống tên lửa đất đối không trên bộ 9K37 Buk (SA-17 Grizzly). Ezh được cải tiến so với Uragan gốc với tầm bắn xa hơn, khả năng kháng nhiễu ECCM tốt hơn và năng lực chống tên lửa bay sát mặt biển cao hơn.
usn_rgm-8h=RGM-8H,Talos ARM,ARM,RGM-8H Talos là phiên bản chống radar của tên lửa phòng không RIM-8 Talos, tận dụng thân tên lửa cỡ lớn để đạt tầm bắn rất xa và tốc độ cao đối với một ARM phóng từ tàu. Dù có nguồn gốc từ SAM, RGM-8H không có năng lực phòng không và chỉ có thể tấn công mục tiêu mặt đất đang chủ động phát xạ radar.
is_gabriel_3=Gabriel 3,,ASM,Gabriel 3 là tên lửa chống hạm tầm ngắn của Israel, có khả năng bay sát mặt biển và đầu dò radar chủ động. Đây là bản nâng cấp của Gabriel 2, với mũi được thiết kế lại để chứa đầu dò radar chủ động tiên tiến, cho phép hoạt động theo kiểu "bắn và quên".
is_gabriel_3as=Gabriel 3AS,,ASM,Gabriel 3AS là tên lửa chống hạm tầm ngắn của Israel, có khả năng bay sát mặt biển và đầu dò radar chủ động. Đây là phiên bản phóng từ máy bay của Gabriel 3, với tầm bắn được cải thiện và thân được thiết kế lại.
fr_sm-39=SM39,Exocet,ASM,SM39 Exocet là tên lửa chống hạm tấn công ngoài tầm phòng không của Pháp. Đây là lựa chọn thay thế phổ biến cho Harpoon trong khối NATO và nhiều quốc gia khác. MM38 là biến thể phóng từ tàu ngầm, với khả năng kháng nhiễu ECCM tốt hơn và tầm bắn xa hơn Exocet phóng từ tàu gốc, do dựa trên phiên bản AM-39 Mod 2 nâng cấp.
plan_hy-4=HY-4,,ASM,HY-4 là phiên bản phát triển của Trung Quốc từ tên lửa HY-2, với động cơ phản lực turbo thay cho động cơ rocket nhiên liệu lỏng ban đầu. Điều này giúp cải thiện đáng kể tầm bắn, dù thân tên lửa cồng kềnh khiến HY-4 bay ở độ cao tương đối lớn và tốc độ chậm trong phần lớn hành trình.
wp_ss-n-22b=P-270M,Moskit-M,ASM,3M82 P-270 Moskit-M (NATO: SS-N-22B Sunburn) là vũ khí chống hạm tấn công từ xa siêu âm phóng từ tàu mặt nước của Liên Xô. Nó bay biên dạng CAO-THẤP với pha cuối lướt mặt biển ở tốc độ siêu âm, trong đó tên lửa thực hiện cơ động lượn vòng rắn bò để tăng khả năng sống sót trước phòng không.\nSo với mẫu Sunburn gốc, Moskit-M (3M82, SS-N-22B) cuối thập niên 1980 có khả năng bay theo quỹ đạo CAO-THẤP và dung tích nhiên liệu lớn hơn cho tầm bắn tổng thể xa hơn, đồng thời bay nhanh hơn và thấp hơn so với tiền nhiệm.
fr_as11=AS.11,,Land Attack,SS.11/AS.11 là tên lửa chống tăng tầm ngắn dẫn đường bằng lệnh điều khiển của Pháp. Phiên bản này có đầu đạn bán xuyên giáp để tấn công xuồng nhỏ, thay vì đầu đạn nổ lõm để tấn công xe tăng.
usa_bgm-71c=BGM-71C,I-TOW,Land Attack,BGM-71 I-TOW là tên lửa chống tăng dẫn đường bằng dây của Mỹ. Vũ khí này được dùng trên cả trực thăng và xe thiết giáp. Đây là phiên bản I-TOW nâng cấp, với tầm bắn được cải thiện (như BGM-71B) và đầu dò kích nổ từ xa (stand-off probe) để xuyên giáp xe tăng hiện đại, dù vẫn có thể gặp khó khăn trước các xe tăng chiến đấu mới nhất của Liên Xô.
usa_bgm-71d=BGM-71D,TOW 2,Land Attack,BGM-71D TOW 2 là tên lửa chống tăng dẫn đường bằng dây của Mỹ. Vũ khí này được dùng trên cả trực thăng và xe thiết giáp. Đây là bản thiết kế lại của BGM-71 TOW gốc với đầu đạn lớn hơn nhiều và động cơ cải tiến, cho phép dễ dàng tiêu diệt các mối đe dọa thiết giáp mới nhất.
wp_ss-1c=R-17,Elbrus,TBM,R-17 Elbrus 9K72 (NATO: SS-1C Scud-B) là tên lửa đạn đạo chiến thuật của Liên Xô, ban đầu phát triển từ tên lửa đạn đạo V-2, và được phổ biến rất rộng rãi nhờ chi phí thấp và tính linh hoạt. Dù thiếu dẫn đường giai đoạn cuối chính xác và cần thời gian nạp nhiên liệu dài trước khi phóng, các tên lửa này vẫn có thể là mối đe dọa đáng kể đối với các cơ sở không có phòng không tiên tiến.
usn_rum-139a=RUM-139A,VL-ASROC,ASW,RUM-139A VL-ASROC (ASROC phóng thẳng đứng) là tên lửa chống ngầm tấn công từ xa. Được phát triển như người kế nhiệm tạm thời của RUR-5 thập niên 1960, RUM-139A là tên lửa chống ngầm tầm xa mở rộng dùng với Hệ thống Phóng Thẳng đứng Mark 41, và mang ngư lôi Mark 46 NEARTIP cải tiến. Dù về mặt kỹ thuật chưa được cấp vốn mua sắm trong Chiến tranh Lạnh, một số quả tiền sản xuất có sẵn vào cuối thập niên 1980, mang lại năng lực tên lửa chống ngầm hạn chế cho các tàu chiến VLS mới biên chế.
fr_l5_mod3=L5,Mod 3,ASW Torpedo,Ngư lôi L5 của Pháp là ngư lôi chống ngầm hạng trung 55cm. Đây là phiên bản nhanh hơn, tầm xa hơn của ngư lôi chống ngầm L3, nhằm theo kịp cự ly phát hiện sonar xa hơn và tốc độ tàu ngầm cao hơn.
fr_f17_mod1=F17,Mod 1,ASuW Torpedo,Ngư lôi F17 của Pháp là ngư lôi chống hạm hạng nặng 53cm dẫn đường bằng dây. Đây là phiên bản nhanh hơn, tầm xa hơn của ngư lôi chống hạm E15, với dẫn đường bằng dây để cơ động hoặc chạy bên dưới tầng nhiệt (layer), và hai chế độ tốc độ.
fr_f17_mod2=F17,Mod 2,Torpedo,Ngư lôi F17 của Pháp là ngư lôi lưỡng dụng hạng nặng 53cm dẫn đường bằng dây. Đây là phiên bản nâng cấp của ngư lôi F17 gốc, với khả năng chống ngầm nhờ đầu dò chủ động/thụ động, tốc độ nhanh hơn, độ sâu lặn lớn hơn và tầm xa hơn.
fr_f17p=F17P,,Torpedo,Ngư lôi F17P ("Polyvalent") của Pháp là ngư lôi lưỡng dụng hạng nặng 53cm dẫn đường bằng dây. Đây là phiên bản nâng cấp của ngư lôi F17 gốc, dành riêng cho xuất khẩu, với khả năng chống ngầm nhờ đầu dò chủ động/thụ động, biến nó thành ngư lôi lưỡng dụng có thể dùng từ tàu mặt nước và tàu ngầm.
plan_yu-1g=Yu-1G,,ASuW Torpedo,Yu-1G (Ngư-1A) là ngư lôi hạng nặng đầu tiên do Trung Quốc tự sản xuất. Đây là bản nâng cấp của ngư lôi Yu-1, được bổ sung khả năng tự dẫn thụ động để tấn công hiệu quả hơn các tàu đang cơ động.
rn_mark8_mod4=MkVIII,,ASuW Torpedo,Ngư lôi Mark VIII Mod 4 của Anh là ngư lôi chống hạm chạy thẳng ra mắt trong Thế Chiến 2. Đây là phiên bản cuối cùng của dòng Mark 8 phóng từ tàu ngầm thập niên 1920, và được Hải quân Hoàng gia sử dụng đến tận thập niên 1980, do thiếu vũ khí chống hạm thay thế thích hợp cho đến sau Chiến tranh Lạnh.
rn_mark20s=Mk20S,Bidder,ASW Torpedo,Mark 20S "Bidder" là ngư lôi chống ngầm hạng trung của Anh thập niên 1950, và bị coi là lỗi thời ngay trước khi đi vào phục vụ. Mark 20S là phiên bản phóng từ tàu ngầm của ngư lôi này, và dù là ngư lôi tự dẫn đầu tiên thuộc loại này của Hải quân Hoàng gia, nó có độ tin cậy cực kém, tầm ngắn, tốc độ chậm và đầu dò kém, khiến nó không đủ sức đối phó mục tiêu hiện đại. Vũ khí này được giữ lại phục vụ đến thập niên 1970 nhờ khả năng phóng từ các ống phóng ngư lôi "đối phó" ở đuôi tàu ngầm lớp Oberon và Porpoise.
rn_mark23=Mk23,Grog,Torpedo,Mark 23 "Grog" là ngư lôi chống ngầm hạng trung của Anh thập niên 1950 với khả năng chống hạm phụ, và bị coi là lỗi thời ngay trước khi đi vào phục vụ. Mark 23 là bản nâng cấp lớn của ngư lôi Mark 20 gốc, với đoạn pin mở rộng và khả năng dẫn đường bằng dây, dù vẫn thừa hưởng đầu dò cực kém và tốc độ chậm của Bidder. Do độ tin cậy và hiệu năng kém của vũ khí này, năng lực của nó trước tàu ngầm và tàu mặt nước hiện đại là rất đáng ngờ.
usn_mk37_mod3=Mk-37 Mod 3,,Torpedo,Ngư lôi Mark 37 là ngư lôi chống ngầm hạng nhẹ tiêu chuẩn của Hải quân Mỹ được dùng bởi nhiều quốc gia. Ra mắt năm 1959, nó trở nên quá chậm và kém hiệu quả để đối đầu với tàu ngầm hiệu năng cao hiện đại của Liên Xô. Ngư lôi Mk-37 Mod 3 có đầu dò mới để cải thiện độ tin cậy và cự ly bắt mục tiêu, dù phần còn lại của ngư lôi không thay đổi so với Mod 0 gốc.
usn_mk37_mod2=Mk-37 Mod 2,,Torpedo,Ngư lôi Mark 37 là ngư lôi chống ngầm hạng nhẹ tiêu chuẩn của Hải quân Mỹ được dùng bởi nhiều quốc gia. Ra mắt năm 1959, nó trở nên quá chậm và kém hiệu quả để đối đầu với tàu ngầm hiệu năng cao hiện đại của Liên Xô. Ngư lôi Mk-37 Mod 2 có đầu dò mới để cải thiện độ tin cậy và cự ly bắt mục tiêu, dù phần còn lại của ngư lôi không thay đổi so với Mod 1 dẫn đường bằng dây.
usn_mk37c=Mk-37C,,Torpedo,Ngư lôi Mark 37C là phiên bản nâng cấp của ngư lôi Mk-37 của Hải quân Mỹ, với nhiên liệu Otto và dẫn đường bằng dây, và là bước cải tiến đáng kể so với ngư lôi gốc. Chỉ được các đối tác xuất khẩu sử dụng từ giữa thập niên 1970, Mk-37C (NT-37C) có hệ động lực cải tiến cho tốc độ cao hơn 150% và tầm xa gần gấp đôi, đổi lại ngư lôi ồn hơn một chút.
usn_mk37e=Mk-37E,,Torpedo,Ngư lôi Mark 37E là phiên bản nâng cấp của ngư lôi Mk-37C với khả năng bám vệt nước (wake-homing) và đầu dò được thiết kế lại. Chỉ được các đối tác xuất khẩu sử dụng, Mk-37E (NT-37E) có năng lực chống hạm được nâng cấp và những tinh chỉnh nhỏ cho hệ động lực, tạo nên ngư lôi chống ngầm và chống hạm rất đáng gờm vào giữa thập niên 1980.
usn_mk46_mod5_air=Mk-46,NEARTIP,Torpedo,Ngư lôi Mark 46 Mod 5 NEARTIP là chuẩn NATO cho ngư lôi hạng nhẹ dùng bởi nhiều quốc gia. Được thiết kế để tấn công tàu ngầm hiệu năng cao hiện đại của Liên Xô, biến thể này là loại thả từ trên không.\n\nMk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) là bản chế tạo lại hoàn toàn của ngư lôi Mk46, cho tầm xa hơn nhờ giai đoạn di chuyển chậm và êm hơn, cải thiện khả năng chống đối kháng, và nâng cấp ngư lôi để có thể bám theo tàu ngầm ở vùng nước nông và đang nổi, dù hiệu quả còn hạn chế.
usn_mk46_mod5_ship=Mk-46,NEARTIP,Torpedo,Ngư lôi Mark 46 Mod 5 NEARTIP là chuẩn NATO cho ngư lôi hạng nhẹ dùng bởi nhiều quốc gia. Được thiết kế để tấn công tàu ngầm hiệu năng cao hiện đại của Liên Xô, biến thể này là loại phóng từ tàu.\n\nMk-46 Mod 5 NEARTIP (NEAR Term Improvement Program) là bản chế tạo lại hoàn toàn của ngư lôi Mk46, cho tầm xa hơn nhờ giai đoạn di chuyển chậm và êm hơn, cải thiện khả năng chống đối kháng, và nâng cấp ngư lôi để có thể bám theo tàu ngầm ở vùng nước nông và đang nổi, dù hiệu quả còn hạn chế.
usn_mk48_mod4=Mk-48,,Torpedo,Mark 48 Mod 4 là ngư lôi lưỡng dụng hạng nặng của Mỹ. Đây là ngư lôi rất nhanh, tầm xa, có khả năng dẫn đường bằng dây và đầu dò rất tinh vi. Phiên bản Mod 4 là bản nâng cấp thập niên 1980, bổ sung cải tiến đầu dò để bám theo các mục tiêu hiện đại nhất, như tàu ngầm hạt nhân lớp Alfa, và có dẫn đường bằng dây hai chiều giúp tăng khả năng loại bỏ đối kháng. 
usn_mk48_mod4_adcap=Mk-48 ADCAP,,Torpedo,Mark 48 Mod 4 (ADCAP) là ngư lôi lưỡng dụng hạng nặng của Mỹ. Đây là ngư lôi rất nhanh, tầm xa, có khả năng dẫn đường bằng dây và đầu dò rất tinh vi. Phiên bản Mod 4 ADCAP (tách biệt với chương trình chế tạo mới Mk-48 Mod 5 ADCAP) là bản nâng cấp năm 1985 cho các ngư lôi Mod 4 hiện có với đĩa quay (swashplate) và bơm nhiên liệu mới, đẩy giới hạn của ngư lôi hiện có xa hơn nữa với tốc độ giai đoạn cuối nhanh hơn 65 hải lý/giờ, cùng các cải tiến đầu dò để tăng khả năng loại bỏ đối kháng.
wp_53-61=53-61M,,WH Torpedo,53-61 là ngư lôi hạng nặng dẫn đường bằng vệt nước (wake-homing) của Liên Xô, được thiết kế để tiêu diệt tàu mặt nước. Đây là ngư lôi bám vệt nước đầu tiên của Liên Xô, với tốc độ và tầm xa cao so với thời đại của nó.
wp_saet-50=SAET-50M,,ASuW Torpedo,SAET-50 là ngư lôi chống hạm chạy điện hạng nặng của Liên Xô với dẫn đường sonar thụ động. Phát triển từ ngư lôi G7es 'Zaunkönig' thời chiến, SAET-50 là ngư lôi tự dẫn đầu tiên của Liên Xô đi vào phục vụ, và dù bị coi là lỗi thời và được thay bằng các ngư lôi mạnh hơn, nó vẫn nằm trong kho trong phần lớn thời gian Chiến tranh Lạnh, đặc biệt là trong biên chế xuất khẩu.
wp_set-53=SET-53M,,ASW Torpedo,SET-53M là ngư lôi chống ngầm chạy điện hạng nặng của Liên Xô với dẫn đường sonar thụ động. Phát triển từ SAET-50, SET-53 là ngư lôi chống ngầm hạng nặng đầu tiên của Liên Xô được chế tạo, và dù nhanh chóng được thay thế bằng các hệ thống mạnh hơn, những vũ khí này vẫn nằm trong kho trong phần lớn thời gian Chiến tranh Lạnh, đặc biệt là trong biên chế xuất khẩu.
wp_test-71m=TEST-71M,,ASW Torpedo,TEST-71M là ngư lôi chống ngầm hạng nặng dẫn đường bằng dây của Liên Xô. TEST-71M có phần dẫn đường kỹ thuật số cải tiến và bộ dẫn đường bằng dây được nâng cấp để gỡ bỏ các hạn chế trước đây về dẫn đường bằng dây, cho phép phóng linh hoạt hơn.
rn_dc_mk11=MkXI,,Depth Bomb,Bom chìm Mark XI là bom chìm thả từ trên không của Anh được thiết kế trong Thế Chiến II và vẫn phục vụ suốt phần còn lại của thế kỷ 20.
usaf_gbu-15=GBU-15,,Guided Bomb,GBU-15(V)2 là bom lượn dẫn đường hồng ngoại được Không quân Mỹ dùng trên một số máy bay chiến thuật siêu âm, như F-111 và F-4E, và được xuất khẩu sang nhiều quốc gia. Vũ khí này có đầu dò ảnh hồng ngoại (IIR) rất tin cậy và dùng được trong mọi điều kiện thời tiết, đồng thời có liên kết dữ liệu để đổi mục tiêu và truyền dữ liệu đầu dò về bệ phóng.
usn_gbu-24=GBU-24,Paveway III,Guided Bomb,GBU-24 Paveway III là bom dẫn đường laser tầm xa mở rộng 2000 lb (907 kg) của Mỹ. Đây là bản nâng cấp so với Paveway II với dẫn đường được cải thiện và tầm lượn xa hơn, cùng độ tin cậy cao hơn và biên dạng bay thấp hiệu quả hơn.
usn_mk-81=Mk-81,,Bomb,Mark 81 là bom thông thường cản thấp 250 lb (110 kg).
usn_mk-82=Mk-82,,Bomb,Mark 82 là bom thông thường cản thấp 500 lb (227 kg).
wp_fab-1500_m54=FAB-1500 M-54,,Bomb,FAB-1500 là bom thông thường thả từ máy bay cỡ 1500 kg (3300 lb) thiết kế bởi Liên Xô với đầu đạn nổ mạnh, chủ yếu dùng bởi Liên Xô và đồng minh. Đây là mẫu 1500kg trong dòng bom nổ mạnh cỡ lớn, và chủ yếu dùng để tấn công các mục tiêu kiên cố như tàu chiến lớn, boongke hoặc sân bay.
wp_fab-3000_m54=FAB-3000 M-54,,Bomb,FAB-3000 là bom thông thường thả từ máy bay cỡ 3000 kg (6600 lb) thiết kế bởi Liên Xô với đầu đạn nổ mạnh, chủ yếu dùng bởi Liên Xô và đồng minh. Đây là mẫu 3000kg trong dòng bom nổ mạnh cỡ lớn, và chủ yếu dùng để tấn công các mục tiêu kiên cố như tàu chiến lớn, boongke hoặc sân bay.
wp_fab-9000_m54=FAB-9000 M-54,,Bomb,FAB-1500 là bom thông thường thả từ máy bay cỡ 9000 kg (20.000 lb) thiết kế bởi Liên Xô với đầu đạn nổ mạnh, chủ yếu dùng bởi Liên Xô và đồng minh. Đây là mẫu 9000kg trong dòng bom nổ mạnh cỡ lớn, và là một trong những quả bom thông thường lớn nhất từng được dùng trong chiến đấu, tập trung vào việc san phẳng các mục tiêu kiên cố.
