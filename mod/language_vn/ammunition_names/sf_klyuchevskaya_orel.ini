wp_mg-74=MG-74,Korund-2,Bẫy mồi,MG-74 Korund-2 là thiết bị giả lập tàu ngầm thủy âm tự hành thế hệ ba. Khác với MG-44 trước đó, nó có thể phóng từ ống phóng 533mm tiêu chuẩn, và có khả năng tạo tiếng ồn, phát xạ đánh lừa hoặc gây nhiễu âm thanh rất tinh vi, đồng thời cũng có thể thả từ máy bay.
