[AllowedVessels]
wp_rkr_kirov=Buque insignia de la Flota del Norte de la Bandera Roja, este crucero de misiles guiados de propulsión nuclear ha sido transferido debido a las contingencias de la guerra. Está armado con una batería de 20x misiles antibuque SS-N-19 Shipwreck con 270nm de alcance y guía avanzada en enjambre. También cuenta con 96x celdas de SAM SA-N-6 y una excelente suite de sonar. \n\nEste buque se emplea mejor como insignia de escuadra, bien protegido por escoltas ASW.
wp_rkr_slava=Buque insignia de la Flota del Pacífico de la Bandera Roja, este crucero de misiles guiados lleva una impresionante batería de 16x misiles antibuque SS-N-12 Sandbox con 300nm de alcance y guía en enjambre. Combinados con los propios 16x SS-N-19 del TBILISI, puedes lanzar una salva combinada de 32 misiles, una vez, en caso de necesidad. También lleva 64x celdas de SAM SA-N-6 para defensa aérea de la flota y un VDS.
wp_takr_kiev=Un portaaviones V/STOL con capacidad para hasta 36x Yak-38 Forger, Ka-25 Hormone y Ka-27 Helix, este es un buque diseñado para ASW de área y defensa aérea local. También lleva una batería de 8x SS-N-12 Sandbox para un golpe ofensivo de largo alcance. \n\nNOTA: la capacidad de recarga del SS-N-12 no funciona completamente; puedes obtener hasta 2x recargas por misión, así que no confíes en esta característica. \n\nNOTA: en difícil, este portaaviones no viene con su propio grupo aéreo.
wp_cv_orel=La clase Orel, Proyecto 1160, es el primer verdadero portaaviones de flota de la Armada Soviética, con catapultas, sistema de frenado y capacidad para hasta 60 aeronaves: cazas MiG-23A Flogger, aeronaves de ataque y guerra electrónica Ko-45, aeronaves ASW y AEW P-42 y P-42RLDN, además de helicópteros Ka-27 Helix. Le da a la fuerza operativa una defensa aérea de flota real, ataque de largo alcance y un cuadro radar aéreo. También monta 16x misiles antibuque SS-N-19 Shipwreck, SAM SA-N-7 y SA-N-4 y CIWS, pero es el casco más valioso de la flota y un reemplazo es extremadamente costoso, así que mantenlo escoltado.
wp_kr_sverdlov=Obsoletos en la era moderna de los misiles, estos cruceros ligeros aún son muy capaces en el papel de bombardeo de superficie e incursión contra el comercio. Con profundos pañoles de 6" y una protección decente, estos buques superarán en alcance y potencia de fuego a casi cualquier buque de guerra de la OTAN que encuentren.
wp_bpk_kara=El crucero de misiles guiados de la clase Kara es un buque bien equilibrado, con enfoque ASW y AAW. Lleva 8x misiles ASW multipropósito SS-N-14 Silex-B, permitiendo ataques a distancia contra submarinos de la OTAN equipados con Mk-48. También posee una batería SAM decente, con SA-N-3 de doble brazo para defensa aérea de área y SA-N-4 en las alas para defensa puntual. Junto con un hangar de helicóptero y VDS, la clase Kara es un buen combatiente de superficie multipropósito.
wp_bpk_kresta2=El crucero de misiles guiados de la clase Kresta II es una modificación con enfoque ASW de la clase Kresta I. Esta clase cambia 4x SS-N-3 Sepal por 8x misiles ASW a distancia SS-N-14 Silex-A y una batería SA-N-3 de mayor alcance. También lleva un hangar de helicóptero para una variante única de Ka-25.
wp_rkr_kresta1=El crucero de misiles guiados de la clase Kresta I se basa en la clase Kynda, cambiando la mitad de su batería SS-N-3B Sepal por mejor comportamiento marinero, defensa aérea y alcance. También tiene un hangar de helicóptero para una variante única de Ka-25.
wp_rkr_kynda=El crucero de misiles guiados de la clase Kynda está diseñado con un fuerte enfoque ASuW. Con 8x SS-N-3B Sepal y 8 recargas adicionales, es una plataforma diseñada para el trabajo antibuque a distancia. Sin embargo, tiene una capacidad ASW y AAW muy limitada, y por ello requiere escoltas AAW y ASW para operar con eficacia.
wp_em_sovremenny=El destructor de la clase Sovremennyy es un buque bien equilibrado, con enfoque ASuW y antiaéreo. Lleva 8x misiles supersónicos SS-N-22 Sunburn de vuelo rasante, que devastarán a la mayoría de los combatientes de superficie. El doble SA-N-7 ofrece una alta cadencia de fuego, hasta 6 objetivos individuales y buena discriminación de objetivos a baja altura. También posee un hangar que admite cualquier variante de Ka-25 o Ka-27, y una muy buena suite ESM. Por último, cuenta con 2 montajes dobles de 130mm, de alta cadencia y largo alcance, siendo uno de los pocos buques de guerra soviéticos que puede superar en alcance al 5"/54.
wp_bpk_udaloy=El destructor de la clase Udaloy está diseñado con un enfoque ASW puro. Con 8x misiles ASW multipropósito SS-N-14 Silex-B, tiene capacidad de ataque a distancia contra el torpedo Mk-48. También tiene una batería SA-N-9 orientada a la defensa puntual, ofreciendo defensa de muy corto alcance contra ataques de saturación a baja altura. Con 2 hangares de helicóptero y una excelente suite de sonar, este es el mejor buque ASW de la URSS.
wp_bpk_kashin=La clase Kashin es una serie de destructores con enfoque AAW y ASW, que data de los años 60. Los buques de la clase Kashin de la Flota del Pacífico nunca recibieron la modernización del Proyecto 61MP, y por ello permanecen sin CIWS, VDS ni baterías SS-N-2. Sus débiles capacidades de defensa aérea significan que deben emplearse solo contra amenazas de superficie y aéreas de baja intensidad.
wp_bpk_kanin=La clase Kanin es una serie de destructores con enfoque AAW, que data de los años 60. Están equipados con CIWS, pero siguen siendo muy débiles frente a ataques aéreos y de misiles a bajo nivel.
wp_skr_krivak1=La clase Krivak I es una serie de unidades de trabajo con defensa aérea de corto alcance y capacidad ASW a distancia. Están equipadas con VDS, pero carecen de hangar de helicóptero, lo que limita sus búsquedas ASW. Su falta de CIWS y el pobre rendimiento de su SAM a baja altura hacen que se empleen mejor junto a cruceros soviéticos más grandes.
wp_skr_krivak2=La clase Krivak II es una mejora sobre la anterior clase Krivak I. Lleva el misil ASW multipropósito mejorado SS-N-14 Silex-B, proporcionando capacidad ASuW de corto alcance. También están mejor artillados, con cañones automáticos dobles de 4", ofreciendo un decente bombardeo costero y capacidad de artillería. Sin embargo, comparten las mismas debilidades que la Krivak I, con un AAW anémico y solo detección ASW de corto alcance.

[AllowedHelicopters]
wp_ka-25=El Ka-25PL es un helicóptero ASW decente, capaz de operar desde cualquier hangar soviético. Tiene carga útil limitada, obligando a elegir entre cargas de sonoboyas o torpedos. Sin embargo, cuenta con un sonar de inmersión decente y radar de búsqueda de superficie. El Ka-25PL también dispone de cargas de bombas y cohetes, permitiendo un trabajo ASuW limitado donde existe poca o ninguna amenaza aérea. \n\nNOTA: puede transportar 10 pasajeros.
wp_ka-25ts=El Ka-25TS es un helicóptero MPA de propósito específico, con un radar de búsqueda de superficie de largo alcance para la designación de blancos a distancia de las salvas de SS-N-3 Sepal, SS-N-12 Sandbox y SS-N-19 Shipwreck. Estos helicópteros no sobrevivirán frente a cazas hostiles, así que se emplean mejor a baja altitud con el radar apagado, asomándose solo para la adquisición de blancos. \n\nNOTA: puede transportar 10 pasajeros.
wp_ka-27=El Ka-27PL es una mejora de mayor alcance del Ka-25PL. Aporta aumentos significativos en carga útil y autonomía. Sus cargas ASW están equilibradas, eliminando las limitaciones de caza/captura del Ka-25PL. Como su predecesor, incluye sonar de inmersión y radar de búsqueda de superficie. La carga de ataque lleva más carga útil y a mucho mayor alcance que el Yak-38. \n\nNOTA: puede transportar 10 pasajeros.
wp_ka-29=El Ka-29 es una variante de ataque del Ka-27PL. Lleva misiles antitanque guiados, cohetes, bombas y un autocañón de 30mm para trabajo de ataque terrestre. \n\nNOTA: puede transportar 16 pasajeros.

[AllowedAircraft]
wp_yak-38=El Yak-38 Forger es un caza-bombardero V/STOL, adecuado para trabajo ASuW de bajo riesgo y defensa aérea local. Al carecer de radar y tanques externos, el Yak-38 tiene alcance y capacidad limitados. Se emplea mejor para interceptar aviones de patrulla marítima y bombarderos sin escolta de la OTAN. También es un medio económico de hundir tráfico mercante desarmado y buques de superficie de la JMSDF y la Armada estadounidense pobremente armados. En conjunto, están pensados para proteger a la fuerza operativa de misiles aéreos de largo alcance y para preservar los preciados misiles antibuque.\n\nNOTA: a pesar de la descripción en el juego, el alcance efectivo con cargas ASuW es de unas 100nm.
wp_mig-23a=El MiG-23A Flogger es un caza-bombardero supersónico, adecuado para defensa aérea local y trabajo ASuW limitado. Tiene un radar de búsqueda aérea decente, un IRST de baja resolución y lleva misiles aire-aire de medio alcance. Para combate cerrado, el MiG-23A puede equipar el AA-11 Archer, un misil aire-aire IR de corto alcance muy maniobrable. También lleva cargas de ataque limitadas. Este caza es superior a los F-4 predominantes en toda la campaña, pero necesita apoyo de interferencia contra los F-14.
wp_taifun=El Ko-45 es una aeronave de ataque embarcada subsónica, la respuesta soviética al A-6 Intruder. Lleva una pesada carga antibuque y de ataque terrestre a distancia, con opciones de precisión y SEAD, y también puede volar como cisterna. Es el brazo de ataque del ala aérea de la clase Orel.
wp_taifun_ew=El Ko-45E es la versión de guerra electrónica del Ko-45, en el papel del EA-6 Prowler. Su equipo de interferencia degrada los radares y los enganches SAM enemigos para el paquete de ataque, y puede llevar misiles antirradiación para SEAD. Hay muy pocos disponibles; no los arriesgues innecesariamente.
wp_p-42=El P-42 es una aeronave ASW y de patrulla marítima embarcada, comparable al S-3 Viking. Con sonoboyas y torpedos, extiende la pantalla ASW de la fuerza operativa mucho más allá del alcance de los helicópteros y le da al portaaviones una plataforma de búsqueda de superficie de larga autonomía.
wp_mig-25pd=El MiG-25PD Foxbat es un interceptor supersónico diseñado para interceptar bombarderos de gran altitud. Es muy rápido, tiene un radar de búsqueda aérea decente, IRST y misiles aire-aire de medio alcance. Comparado con el MiG-23A, tiene mejor radar de búsqueda aérea, un misil aire-aire de mayor alcance y casi el doble de alcance; pero se limita a papeles aire-aire.
wp_su-24m=El Su-24M es un bombardero supersónico de bajo nivel. Es el bombardero táctico más capaz de la URSS. Para trabajo ASuW a distancia, puede equipar misiles antibuque de vuelo rasante AS-13 Kingbolt o misiles antirradiación a distancia AS-11 Kilter.
wp_il-38=El Il-38 May es una aeronave MPA de largo alcance comparable al P-3C de la OTAN. Puede desplegar el torpedo ASW AT-2 o bombas de profundidad PLAB-100. También cuenta con un impresionante contingente de 144x sonoboyas RGB-1.
wp_tu-95rt=El Tu-95RT Bear es una aeronave MPA de largo alcance. Tiene radar de búsqueda de superficie de largo alcance y una buena suite ESM. Esta plataforma aumenta significativamente la conciencia situacional de tu fuerza operativa frente a contactos de superficie. Sin embargo, no es capaz de sobrevivir frente a cazas enemigos, así que no la dejes sin escolta.
wp_tu-16k=El Tu-16K Badger es un bombardero estratégico subsónico. Equipa el misil antibuque a distancia AS-6 Kingfish, que tiene un modo secundario de ataque terrestre. También puede llevar el misil de interferencia a distancia AS-2B Kipper. Esta es una plataforma de misiles antibuque adecuada contra cualquier amenaza de superficie, salvo los CVBG estadounidenses.
wp_tu-22m2=El Tu-22M2 Backfire es un bombardero estratégico supersónico. Equipa el misil antibuque a distancia AS-4 Kitchen o el misil de ataque terrestre AS-4B. Su alta velocidad y alcance a distancia le otorgan cierto margen de supervivencia incluso frente a los CVBG estadounidenses.
wp_tu-16p=Una modificación del Badger, el Tu-16P Badger-J es una aeronave de guerra electrónica de largo alcance. Su único propósito es desplegar el equipo de interferencia Buket, que tiene 135nm de alcance. Este es un activo valioso que puede proteger a los cazas de misiles aire-aire enemigos de largo alcance o cegar a las fuerzas de superficie enemigas.
wp_p-42_rldn=Debido a las exigencias de la guerra, este prototipo de aeronave AEW ha sido puesto apresuradamente en servicio operativo limitado. Puede proporcionar detección de largo alcance de contactos aéreos y de superficie hasta 216 nm, complementada con una buena suite ESM. Este es un gran multiplicador de fuerza para tu fuerza operativa, ya que detectará misiles de vuelo rasante y atacantes de bajo nivel mucho antes que los equipos de búsqueda aérea embarcados en tus buques.
