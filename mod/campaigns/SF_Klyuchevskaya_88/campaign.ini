MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=NOTE: this is a detached mission using a seperate task force. You will command an assigned task force, and your task force will not deploy. Completing this mission will allow certain units to join your task force later in the campaign.
MissionSpecialNote_ja=注：これは別個の任務部隊を用いる分遣任務である。貴官は指定された任務部隊を指揮するが、貴任務部隊は出撃しない。本任務を完了すれば、一部のユニットが以後のキャンペーンで貴任務部隊に合流できるようになる。
MissionSpecialNote_cn=注意：这是一次使用独立特遣舰队的分离任务。本任务中你将指挥被指派的特遣舰队，你自己的特遣舰队不会出动。完成本任务将使某些单位在战役后续阶段加入你的特遣舰队。
MissionSpecialNote_es=NOTA: esta es una misión independiente que usa una fuerza operativa separada. Comandarás una fuerza operativa asignada, y tu fuerza operativa no se desplegará. Completar esta misión permitirá que ciertas unidades se unan a tu fuerza operativa más adelante en la campaña.
MissionSpecialNote_ko=참고: 이번 임무는 별도의 기동부대를 사용하는 독립 임무이다. 배정된 기동부대를 지휘하며, 귀관의 기동부대는 출동하지 않는다. 이 임무를 완료하면 이후 캠페인에서 특정 유닛이 기동부대에 합류할 수 있다.
MissionSpecialNote_vn=GHI CHÚ: đây là một nhiệm vụ tách biệt sử dụng một lực lượng đặc nhiệm riêng. Bạn sẽ chỉ huy một lực lượng đặc nhiệm được chỉ định riêng, và lực lượng đặc nhiệm của bạn sẽ không xuất kích. Hoàn thành nhiệm vụ này sẽ giúp một số đơn vị gia nhập lực lượng đặc nhiệm của bạn sau này trong chiến dịch.
MissionSpecialNote_fr=NOTE : ceci est une mission détachée utilisant une force opérationnelle distincte. Vous commanderez une force opérationnelle assignée, et votre force opérationnelle ne sera pas déployée. Réussir cette mission permettra à certaines unités de rejoindre votre force opérationnelle plus tard dans la campagne.
MissionSpecialNote_de=HINWEIS: Dies ist eine abgesetzte Mission mit einer eigenständigen Task Force. Sie befehligen eine zugewiesene Task Force, Ihre eigene Task Force wird nicht ausgesandt. Der Abschluss dieser Mission ermöglicht bestimmten Einheiten, später in der Kampagne Ihrer Task Force beizutreten.
MissionSpecialNote_ru=ПРИМЕЧАНИЕ: это отдельная миссия с использованием другого оперативного соединения. Вы будете командовать назначенным соединением, ваше собственное оперативное соединение в бой не выйдет. Успешное выполнение этой миссии позволит некоторым юнитам позже присоединиться к вашему соединению.

