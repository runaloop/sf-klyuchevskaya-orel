MissionIntro_es=SF Klyuchevskaya transita las Islas Kuriles.
MissionIntro_ko=클류쳅스카야 기동부대가 쿠릴 열도를 통과한다.
MissionIntro_vn=SF Klyuchevskaya di chuyển qua Quần đảo Kuril.
MissionIntro_fr=SF Klyuchevskaya traverse les îles Kouriles.
MissionIntro_de=SF Klyuchevskaya durchquert die Kurilen.
MissionIntro_ru=КУГ «Ключевская» проходит Курильские острова.
MissionResupplyRules_en=Due to tight operational schedule, no repair or rearmament facilities available post mission. As we are away from home waters, reinforcements in the next few missions will be limited. 
MissionResupplyRules_ja=作戦日程が厳しいため、任務終了後の修理・補給施設は利用できない。母国水域を離れているため、以後数回の任務における増援は限定的となる。
MissionResupplyRules_cn=由于行动日程紧张，任务结束后没有维修或补给设施可用。随着我们远离本土海域，接下来几个任务中的增援将会有限。
MissionResupplyRules_es=Debido al calendario operativo ajustado, no habrá instalaciones de reparación ni rearme disponibles después de la misión. Como estamos lejos de aguas natales, los refuerzos en las próximas misiones serán limitados.
MissionResupplyRules_ko=빠듯한 작전 일정으로 인해, 임무 종료 후 수리 및 재무장 시설을 이용할 수 없다. 본토 해역을 벗어나 있으므로, 이후 몇 차례의 임무에서는 증원이 제한된다.
MissionResupplyRules_vn=Do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang sau nhiệm vụ này. Vì chúng ta đang ở xa hải phận nhà, viện binh trong các nhiệm vụ sắp tới sẽ bị hạn chế.
MissionResupplyRules_fr=En raison d'un calendrier opérationnel serré, aucune installation de réparation ou de réarmement ne sera disponible après la mission. Comme nous sommes loin de nos eaux territoriales, les renforts seront limités dans les prochaines missions.
MissionResupplyRules_de=Aufgrund des engen Einsatzplans stehen nach dieser Mission keine Reparatur- oder Bewaffnungseinrichtungen zur Verfügung. Da wir uns fern der Heimatgewässer befinden, werden die Verstärkungen in den nächsten Missionen begrenzt sein.
MissionResupplyRules_ru=Из-за плотного графика операции после этой миссии пункты пополнения запасов и ремонта недоступны. Поскольку мы находимся вдали от родных вод, подкрепления в следующих миссиях будут ограничены.

