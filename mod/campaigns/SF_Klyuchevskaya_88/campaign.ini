MissionIntro_en=SF Klyuchevskaya attacks Misawa Air Base.
MissionIntro_ja=SFクリュチェフスカヤは三沢基地を攻撃する。
MissionIntro_cn=克柳切夫斯卡亚特遣舰队进攻三泽空军基地。
MissionIntro_es=SF Klyuchevskaya ataca la Base Aérea de Misawa.
MissionIntro_ko=클류쳅스카야 기동부대가 미사와 공군기지를 공격한다.
MissionIntro_vn=SF Klyuchevskaya tấn công Căn cứ Không quân Misawa.
