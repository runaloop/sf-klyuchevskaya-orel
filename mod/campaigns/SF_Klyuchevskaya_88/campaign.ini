MissionIntro_fr=SF Klyuchevskaya se ravitaille auprès d'une force de ravitaillement amie.
MissionIntro_de=SF Klyuchevskaya nimmt Nachschub von einem befreundeten Versorgungsverband auf.
MissionIntro_ru=КУГ «Ключевская» пополняет запасы от дружественной группы снабжения.
MissionResupplyRules_en=More ships have been added to the roster. Your task force will complete replenishment with a friendly resupply force. Resupply and repair will not be available post mission. As we are leaving home waters, reinforcements in the next few missions will be limited. 
MissionResupplyRules_ja=艦名簿に艦艇が追加された。貴任務部隊は友軍の補給部隊との補給作業を完了する。任務終了後の補給・修理は利用できない。母国水域を離れるため、以後数回の任務における増援は限定的となる。
MissionResupplyRules_cn=名册中已增加更多舰艇。特遣舰队将与一支友军补给部队完成补给。任务结束后无法进行补给或维修。随着我们离开本土海域，接下来几个任务中的增援将会有限。
MissionResupplyRules_es=Se han añadido más buques al escalafón. Tu fuerza operativa completará el reabastecimiento con una fuerza de reabastecimiento amiga. El reabastecimiento y la reparación no estarán disponibles después de la misión. Como estamos abandonando aguas natales, los refuerzos en las próximas misiones serán limitados.
MissionResupplyRules_ko=전력 목록에 함선이 추가되었다. 기동부대는 우호적인 재보급 부대와 함께 재보급을 완료한다. 임무 종료 후 재보급과 수리를 받을 수 없다. 본토 해역을 벗어나므로, 이후 몇 차례의 임무에서는 증원이 제한된다.
MissionResupplyRules_vn=Nhiều tàu hơn đã được bổ sung vào danh sách quân số. Lực lượng đặc nhiệm của bạn sẽ hoàn thành tiếp tế với một lực lượng tiếp tế của quân bạn. Tiếp tế và sửa chữa sẽ không khả dụng sau nhiệm vụ. Vì chúng ta đang rời khỏi hải phận nhà, viện binh trong các nhiệm vụ sắp tới sẽ bị hạn chế.
MissionResupplyRules_fr=Davantage de navires ont été ajoutés à l'effectif. Votre force opérationnelle achèvera son ravitaillement avec une force de ravitaillement amie. Le ravitaillement et les réparations ne seront pas disponibles après la mission. Comme nous quittons nos eaux territoriales, les renforts seront limités dans les prochaines missions.
MissionResupplyRules_de=Weitere Schiffe wurden dem Bestand hinzugefügt. Ihre Task Force schließt die Versorgung mit einem befreundeten Nachschubverband ab. Nachschub und Reparatur stehen nach der Mission nicht zur Verfügung. Da wir die Heimatgewässer verlassen, werden die Verstärkungen in den nächsten Missionen begrenzt sein.
MissionResupplyRules_ru=В состав соединения добавлены новые корабли. Ваше оперативное соединение завершит пополнение запасов от дружественной группы снабжения. После этой миссии пополнение запасов и ремонт будут недоступны. Поскольку мы уходим из родных вод, подкрепления в следующих миссиях будут ограничены.

