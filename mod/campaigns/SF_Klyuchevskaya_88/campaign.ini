MissionIntro_en=K-242 and K-525 ambush NIMITZ CVBG. Additional submarines may be attached depending on friendly logistical situation. Losses are expected and any units lost in this mission will not affect future missions.
MissionIntro_ja=K-242とK-525がニミッツ空母戦闘群を待ち伏せする。友軍の後方支援状況によっては、追加の潜水艦が配属される場合がある。損失は想定されており、本任務で失われたユニットは以後の任務に影響しない。
MissionIntro_cn=K-242和K-525伏击尼米兹号航母战斗群。视友军后勤状况，可能会有额外潜艇加入。预计会有损失，本任务中损失的单位不会影响后续任务。
MissionIntro_es=El K-242 y el K-525 emboscan al CVBG del NIMITZ. Pueden asignarse submarinos adicionales según la situación logística amiga. Se esperan pérdidas, y cualquier unidad perdida en esta misión no afectará a las misiones futuras.
MissionIntro_ko=K-242와 K-525가 니미츠 항모전투단을 매복 공격한다. 우호적인 병참 상황에 따라 추가 잠수함이 배속될 수 있다. 손실이 예상되며, 이번 임무에서 잃은 유닛은 이후 임무에 영향을 주지 않는다.
MissionIntro_vn=K-242 và K-525 phục kích Biên đội tàu sân bay tấn công NIMITZ. Các tàu ngầm bổ sung có thể được điều động tùy theo tình hình hậu cần của quân bạn. Tổn thất là điều dự kiến và bất kỳ đơn vị nào bị mất trong nhiệm vụ này sẽ không ảnh hưởng đến các nhiệm vụ sau.
MissionIntro_fr=Le K-242 et le K-525 tendent une embuscade au CVBG du NIMITZ. Des sous-marins supplémentaires pourront être attachés selon la situation logistique amie. Des pertes sont à prévoir, et toute unité perdue durant cette mission n'affectera pas les missions futures.
MissionIntro_de=Die K-242 und die K-525 legen der NIMITZ-Trägerkampfgruppe einen Hinterhalt. Je nach logistischer Lage bei den befreundeten Kräften können weitere U-Boote zugeteilt werden. Verluste sind einzuplanen, verlorene Einheiten in dieser Mission wirken sich nicht auf künftige Missionen aus.
MissionIntro_ru=К-242 и К-525 устраивают засаду на авианосную группу НИМИЦ. В зависимости от дружественной логистической обстановки могут быть приданы дополнительные подводные лодки. Потери ожидаемы, любые юниты, потерянные в этой миссии, не повлияют на последующие миссии.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=NOTE: This is a detached submarine operation. You will command an assigned submarine for this mission only, and your task force will not deploy. Completing this mission will improve odds in future missions.
MissionSpecialNote_ja=注：これは分遣された潜水艦単独作戦である。貴官は本任務に限り指定された潜水艦を指揮し、貴任務部隊は出撃しない。本任務を完了すれば、以後の任務での戦況が有利となる。
MissionSpecialNote_cn=注意：这是一次独立潜艇行动。本任务中你只指挥被指派的潜艇，特遣舰队不会出动。完成本任务将提高后续任务的胜算。
MissionSpecialNote_es=NOTA: esta es una operación de submarino independiente. Comandarás un submarino asignado solo para esta misión, y tu fuerza operativa no se desplegará. Completar esta misión mejorará las probabilidades en misiones futuras.
MissionSpecialNote_ko=참고: 이번 임무는 독립된 잠수함 작전이다. 이번 임무에서만 배정된 잠수함을 지휘하며, 기동부대는 출동하지 않는다. 이 임무를 완료하면 이후 임무에서 유리한 조건을 얻을 수 있다.
MissionSpecialNote_vn=GHI CHÚ: Đây là một chiến dịch tàu ngầm tách biệt. Bạn sẽ chỉ huy một tàu ngầm được chỉ định riêng cho nhiệm vụ này, và lực lượng đặc nhiệm của bạn sẽ không xuất kích. Hoàn thành nhiệm vụ này sẽ cải thiện cơ hội trong các nhiệm vụ sau.
MissionSpecialNote_fr=NOTE : ceci est une opération sous-marine détachée. Vous commanderez un sous-marin assigné pour cette seule mission, et votre force opérationnelle ne sera pas déployée. Réussir cette mission améliorera vos chances dans les missions futures.
MissionSpecialNote_de=HINWEIS: Dies ist ein abgesetzter U-Boot-Einsatz. Sie befehligen für diese Mission ausschließlich ein zugewiesenes U-Boot, Ihre Task Force wird nicht ausgesandt. Der Abschluss dieser Mission verbessert die Aussichten in künftigen Missionen.
MissionSpecialNote_ru=ПРИМЕЧАНИЕ: это отдельная операция подводной лодки. В этой миссии вы будете командовать только назначенной подводной лодкой, ваше оперативное соединение в бой не выйдет. Успешное выполнение этой миссии повысит шансы на успех в дальнейших миссиях.

