MissionResupplyRules_en=More ships have been added to the roster. This is the final mission. Expend as many missiles as you need, and when you run out of missiles, close to guns. 
MissionResupplyRules_ja=艦名簿に艦艇が追加された。これが最終任務である。ミサイルは必要な限り使い尽くし、撃ち尽くしたら砲撃距離まで肉薄せよ。
MissionResupplyRules_cn=名册中已增加更多舰艇。这是最后一次任务。放手使用你需要的所有导弹，弹尽之后转入炮战。
MissionResupplyRules_es=Se han añadido más buques al escalafón. Esta es la misión final. Gasta tantos misiles como necesites, y cuando se te acaben, cierra distancia para usar los cañones.
