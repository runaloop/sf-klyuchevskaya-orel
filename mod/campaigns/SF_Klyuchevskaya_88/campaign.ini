[File] # Location of this file - required for all systems to work properly
Base=campaigns/SF_Klyuchevskaya_88/campaign.ini

[Campaign] # Overall campaign details
Type=Linear
Difficulty=5
Length=34
BackgroundImage=campaigns/SF_Klyuchevskaya_88/art/sheets/SF Klyuchevskaya Cover.jpg
DisplayFormat=MapView

[TaskForceMode] # Rules for setup of Task Force Mode
Enabled=True

; FLAGSHIP REQUIREMENT - with flagship required, player loses the mission if the flagship is destroyed
TaskForceRequireFlagship=False

; TASK FORCE NAMES
; name options will allow a preset list to be randomized
DefaultTaskForceName=Strike Force Klyuchevskaya
TaskForceNameOptions=Strike Force Klyuchevskaya|SF Klyuchevskaya|TBILISI SAG

; COMMANDER SETTINGS - commander names, ranks, navy display data, and discounts
CommanderSettingsFile=commander_settings.ini

; ROSTER OF WHITELISTED UNITS - missions can further restrict what is allowed to be purchased
RosterFile=player_task_force_roster.ini

; DIFFICULTY SETTINGS
TaskForceDifficultyPresets=Easy|Moderate|Difficult
DefaultTaskForceDifficultyPreset=Moderate

; AIRWING PURCHASE RULES - if TRUE, ships come with their airwing for free - replacements must be bought - if FALSE, legacy behavior where ships come empty and airwing must be purchased
ShipIncludesAirwing=True

; POINTS
StartingPoints=635
PointCap=635

; CSAR RULES = 100 survivors rescued reward 1 pt to available points
CSARPointModifier=4

; LOADOUT RULES
; PurchaseLoadouts: if True, ship loadouts must be bought for each unit from TF Builder after they are unlocked. If not set or false, loadouts are available for all units after unlock.
PurchaseLoadouts=False

; Ship loadouts - basic are unlocked immediately; locked must be unlocked via completing a mission
BasicShipLoadoutVariants=Default|Late|
LockedShipLoadoutVariants=LandAttack|AntiShip

; CREW SKILL RULES
CrewSkillInitial=Trained
CrewSkillThresholds=Trained:1|Seasoned:2|Veterans:5|Ultra:8

; SHIP LOSS POINT RETURN RULES
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5

; REPAIR RULES
DamageToAllowRepair=Light,Moderate
DamageToDisallowRepair=Heavy
RepairPointsCost=Light,0.1|Moderate,0.25

[TaskForceModeDifficulty_Easy]
Name=Easy
StartingPoints=850
PointCap=850
ShipIncludesAirwing=True
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|LandAttack|AntiShip
RepairCostModifier=0.75
UnitDecommissionPointReturnModifier=0.35
UnitDismissPointReturnModifier=0.65
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Moderate]
Name=Moderate
StartingPoints=635
PointCap=635
ShipIncludesAirwing=True
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|LandAttack|AntiShip
RepairCostModifier=1
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Difficult]
Name=Difficult
StartingPoints=500
PointCap=500
ShipIncludesAirwing=True
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|LandAttack|AntiShip
RepairCostModifier=1.25
UnitDecommissionPointReturnModifier=0.15
UnitDismissPointReturnModifier=0.35
CrewSkillInitial=Green

[Language_en] # Campaign title and details, localized
Name=SF Klyuchevskaya '88: Orel Edition (USSR - Task Force Mode)
Description=SF Klyuchevskaya '88 is a linear campaign depicting war in the Northwestern Pacific in 1988. You begin with TAVKR TBILISI, a Project 1160 Orel-class carrier, and her air wing while you build a Task Force to escort her. <LineBreak/><LineBreak/>Resupply and repair is NOT available at most points in the campaign, so limit unnecessary losses and use your weapons wisely!

[Language_ja]
Name=SF Klyuchevskaya '88: Orel Edition (ソ連――任務部隊モード)
Description=SF Klyuchevskaya '88は、1988年の北西太平洋における戦争を描いた一本道のキャンペーンである。貴官はプロジェクト1160「オリョール」級空母TAVKRトビリシとその航空団を率いて出撃し、これを護衛する任務部隊を編成していく。<LineBreak/><LineBreak/>本キャンペーンの大半において補給・修理は利用できない。無用な損失を避け、兵装は賢く使え！

[Language_cn]
Name=SF Klyuchevskaya '88: Orel Edition (苏联 — 特遣舰队模式)
Description=SF Klyuchevskaya '88是一场线性战役，描绘了1988年西北太平洋的战争。你从TAVKR 第比利斯（一艘1160型雕级航母）及其航空联队开始，同时组建一支特遣舰队为其护航。<LineBreak/><LineBreak/>本战役大部分阶段都无法补给或维修，因此请减少不必要的损失，谨慎使用武器！

[Language_es]
Name=SF Klyuchevskaya '88: Orel Edition (URSS - Modo Fuerza Operativa)
Description=SF Klyuchevskaya '88 es una campaña lineal que representa la guerra en el noroeste del Pacífico en 1988. Comienzas con el TAVKR TBILISI, un portaaviones de la clase Orel, Proyecto 1160, y su ala aérea, mientras formas una fuerza operativa para escoltarlo. <LineBreak/><LineBreak/>El reabastecimiento y la reparación NO están disponibles en la mayoría de los puntos de la campaña, así que limita las pérdidas innecesarias y usa tus armas con inteligencia.

[Language_ko]
Name=SF Klyuchevskaya '88: Orel Edition (소련 - 기동부대 모드)
Description=SF Klyuchevskaya '88은 1988년 북서태평양에서 벌어지는 전쟁을 그린 선형 캠페인입니다. 귀관은 프로젝트 1160 오룔급 항공모함인 TAVKR 트빌리시와 그 항공단으로 시작하며, 트빌리시를 호위할 기동부대를 편성해 나갑니다. <LineBreak/><LineBreak/>캠페인 대부분의 지점에서 재보급과 수리를 받을 수 없으므로, 불필요한 손실을 줄이고 무기를 신중하게 사용하십시오!

[Language_vn]
Name=SF Klyuchevskaya '88: Orel Edition (Liên Xô - Task Force Mode)
Description=SF Klyuchevskaya '88 là một chiến dịch tuyến tính mô tả cuộc chiến ở Tây Bắc Thái Bình Dương năm 1988. Bạn bắt đầu với TAVKR TBILISI, một tàu sân bay lớp Project 1160 Orel, cùng không đoàn của nó, trong khi xây dựng một Lực lượng đặc nhiệm để hộ tống nó. <LineBreak/><LineBreak/>Việc tiếp tế và sửa chữa KHÔNG khả dụng ở hầu hết các thời điểm trong chiến dịch, vì vậy hãy hạn chế tổn thất không cần thiết và sử dụng vũ khí một cách khôn ngoan!

[Language_fr]
Name=SF Klyuchevskaya '88: Orel Edition (URSS - Mode Force Opérationnelle)
Description=SF Klyuchevskaya '88 est une campagne linéaire qui dépeint la guerre dans le Pacifique Nord-Ouest en 1988. Vous commencez avec le TAVKR TBILISI, un porte-avions de classe Orel (Projet 1160), et son groupe aérien, tandis que vous constituez une Force Opérationnelle pour l'escorter. <LineBreak/><LineBreak/>Le ravitaillement et les réparations ne sont PAS disponibles à la plupart des points de la campagne, alors limitez les pertes inutiles et utilisez vos armes avec discernement !

[Language_de]
Name=SF Klyuchevskaya '88: Orel Edition (UdSSR - Task-Force-Modus)
Description=SF Klyuchevskaya '88 ist eine lineare Kampagne, die einen Krieg im Nordwestpazifik im Jahr 1988 darstellt. Sie beginnen mit dem TAVKR TBILISI, einem Flugzeugträger des Projekts 1160 der Orel-Klasse, und seiner Trägergruppe, während Sie eine Task Force aufbauen, um ihn zu eskortieren. <LineBreak/><LineBreak/>Nachschub und Reparatur stehen an den meisten Punkten der Kampagne NICHT zur Verfügung, begrenzen Sie also unnötige Verluste und setzen Sie Ihre Waffen mit Bedacht ein!

[Language_ru]
Name=SF Klyuchevskaya '88: Orel Edition (СССР — режим оперативного соединения)
Description=SF Klyuchevskaya '88 — линейная кампания, описывающая войну в северо-западной части Тихого океана в 1988 году. Вы начинаете с ТАВКР ТБИЛИСИ, авианосцем проекта 1160 «Орёл», и его авиакрылом, формируя оперативное соединение для его охранения. <LineBreak/><LineBreak/>Пополнение запасов и ремонт НЕ доступны на большей части кампании, поэтому избегайте ненужных потерь и разумно расходуйте вооружение!

