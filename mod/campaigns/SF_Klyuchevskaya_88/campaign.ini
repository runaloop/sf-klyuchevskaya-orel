MissionIntro_es=SF Klyuchevskaya se enfrenta al CVBG del CONSTELLATION.
MissionIntro_ko=클류쳅스카야 기동부대가 컨스텔레이션 항모전투단과 맞선다.
MissionIntro_vn=SF Klyuchevskaya đối đầu với Biên đội tàu sân bay tấn công CONSTELLATION.
