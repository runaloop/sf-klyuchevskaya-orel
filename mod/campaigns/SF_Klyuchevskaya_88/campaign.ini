MissionIntro_en=SF Klyuchevskaya breaks through the Soya Strait. NOTE: As you will be transiting a narrow channel, a line ahead formation is recommended.
MissionIntro_ja=SFクリュチェフスカヤは宗谷海峡を強行突破する。注：狭い海峡を通過するため、単縦陣での航行が推奨される。
MissionIntro_cn=克柳切夫斯卡亚特遣舰队突破宗谷海峡。注意：由于将通过狭窄水道，建议采用单纵队队形。
MissionIntro_es=SF Klyuchevskaya rompe a través del Estrecho de Soya. NOTA: como transitarás un canal estrecho, se recomienda una formación en línea de fila.
MissionIntro_ko=클류쳅스카야 기동부대가 소야 해협을 돌파한다. 참고: 좁은 해협을 통과하므로 단종진 대형을 권장한다.
MissionIntro_vn=SF Klyuchevskaya vượt qua eo biển Soya. GHI CHÚ: Vì sẽ phải di chuyển qua một luồng hẹp, nên áp dụng đội hình hàng dọc.
MissionIntro_fr=SF Klyuchevskaya force le passage du détroit de Soya. NOTE : comme vous allez traverser un chenal étroit, une formation en ligne de file est recommandée.
MissionIntro_de=SF Klyuchevskaya durchbricht die Soya-Straße. HINWEIS: Da Sie eine enge Meerenge durchqueren, wird eine Kiellinienformation empfohlen.
MissionIntro_ru=КУГ «Ключевская» прорывается через пролив Лаперуза. ПРИМЕЧАНИЕ: поскольку предстоит проход узким каналом, рекомендуется строй кильватерной колонны.
MissionResupplyRules_en=Due to tight operational schedule, no repair or rearmament facilities available post mission. As we are leaving home waters, reinforcements in the next few missions will be limited. 
MissionResupplyRules_ja=作戦日程が厳しいため、任務終了後の修理・補給施設は利用できない。母国水域を離れるため、以後数回の任務における増援は限定的となる。
MissionResupplyRules_cn=由于行动日程紧张，任务结束后没有维修或补给设施可用。随着我们离开本土海域，接下来几个任务中的增援将会有限。
MissionResupplyRules_es=Debido al calendario operativo ajustado, no habrá instalaciones de reparación ni rearme disponibles después de la misión. Como estamos abandonando aguas natales, los refuerzos en las próximas misiones serán limitados.
MissionResupplyRules_ko=빠듯한 작전 일정으로 인해, 임무 종료 후 수리 및 재무장 시설을 이용할 수 없다. 본토 해역을 벗어나므로, 이후 몇 차례의 임무에서는 증원이 제한된다.
MissionResupplyRules_vn=Do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang sau nhiệm vụ này. Vì chúng ta đang rời khỏi hải phận nhà, viện binh trong các nhiệm vụ sắp tới sẽ bị hạn chế.
MissionResupplyRules_fr=En raison d'un calendrier opérationnel serré, aucune installation de réparation ou de réarmement ne sera disponible après la mission. Comme nous quittons nos eaux territoriales, les renforts seront limités dans les prochaines missions.
MissionResupplyRules_de=Aufgrund des engen Einsatzplans stehen nach dieser Mission keine Reparatur- oder Bewaffnungseinrichtungen zur Verfügung. Da wir die Heimatgewässer verlassen, werden die Verstärkungen in den nächsten Missionen begrenzt sein.
MissionResupplyRules_ru=Из-за плотного графика операции после этой миссии пункты пополнения запасов и ремонта недоступны. Поскольку мы уходим из родных вод, подкрепления в следующих миссиях будут ограничены.

