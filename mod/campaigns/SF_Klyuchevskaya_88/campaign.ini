MissionResupplyRules_fr=Davantage de navires ont été ajoutés à l'effectif. Ceci est la mission finale. Dépensez autant de missiles que nécessaire, et lorsque vous n'en avez plus, engagez au canon.
MissionResupplyRules_de=Weitere Schiffe wurden dem Bestand hinzugefügt. Dies ist die letzte Mission. Verschießen Sie so viele Flugkörper, wie Sie brauchen, und gehen Sie, wenn die Flugkörper aufgebraucht sind, auf Geschützreichweite.
MissionResupplyRules_ru=В состав соединения добавлены новые корабли. Это последняя миссия. Расходуйте столько ракет, сколько нужно, а когда ракеты закончатся — сближайтесь и бейте из орудий.

