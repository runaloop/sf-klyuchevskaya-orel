MissionIntro_en=SF Klyuchevskaya screens an friendly landing operation. NOTE: allowing certain units to survive will allow them to join your task force after the mission ends.
MissionIntro_ja=SFクリュチェフスカヤは友軍の上陸作戦を掩護する。注：一部のユニットを生存させれば、任務終了後に貴任務部隊へ合流させることができる。
MissionIntro_cn=克柳切夫斯卡亚特遣舰队为一次友军登陆行动提供掩护。注意：让某些单位存活下来将使其在任务结束后加入你的特遣舰队。
MissionIntro_es=SF Klyuchevskaya protege una operación de desembarco amiga. NOTA: permitir que ciertas unidades sobrevivan les permitirá unirse a tu fuerza operativa después de que termine la misión.
MissionIntro_ko=클류쳅스카야 기동부대가 우호적인 상륙 작전을 엄호한다. 참고: 특정 유닛을 생존시키면 임무 종료 후 기동부대에 합류시킬 수 있다.
MissionIntro_vn=SF Klyuchevskaya bảo vệ một chiến dịch đổ bộ của quân bạn. GHI CHÚ: để cho một số đơn vị nhất định sống sót sẽ giúp chúng gia nhập lực lượng đặc nhiệm của bạn sau khi nhiệm vụ kết thúc.
MissionIntro_fr=SF Klyuchevskaya couvre une opération de débarquement amie. NOTE : laisser certaines unités survivre leur permettra de rejoindre votre force opérationnelle une fois la mission terminée.
MissionIntro_de=SF Klyuchevskaya deckt eine befreundete Landungsoperation. HINWEIS: Wenn bestimmte Einheiten überleben, können sie nach der Mission Ihrer Task Force beitreten.
MissionIntro_ru=КУГ «Ключевская» обеспечивает прикрытие дружественной десантной операции. ПРИМЕЧАНИЕ: если некоторые юниты уцелеют, после миссии они присоединятся к вашему оперативному соединению.
MissionResupplyRules_en=Your task force will RV with a friendly replenishment force after this mission. Resupply and repair will be available post mission. As we are away from home waters, reinforcements in the next few missions will be limited. 
MissionResupplyRules_ja=貴任務部隊は本作戦後、友軍の補給部隊と会合する。任務終了後、補給と修理が利用可能となる。母国水域を離れているため、以後数回の任務における増援は限定的となる。
MissionResupplyRules_cn=本任务结束后，特遣舰队将与一支友军补给部队会合。任务结束后可进行补给和维修。随着我们远离本土海域，接下来几个任务中的增援将会有限。
MissionResupplyRules_es=Tu fuerza operativa se reunirá con una fuerza de reabastecimiento amiga después de esta misión. El reabastecimiento y la reparación estarán disponibles después de la misión. Como estamos lejos de aguas natales, los refuerzos en las próximas misiones serán limitados.
MissionResupplyRules_ko=이번 임무 이후 기동부대는 우호적인 재보급 부대와 합류한다. 임무 종료 후 재보급과 수리를 받을 수 있다. 본토 해역을 벗어나 있으므로, 이후 몇 차례의 임무에서는 증원이 제한된다.
MissionResupplyRules_vn=Lực lượng đặc nhiệm của bạn sẽ gặp một lực lượng tiếp tế của quân bạn sau nhiệm vụ này. Tiếp tế và sửa chữa sẽ khả dụng sau nhiệm vụ. Vì chúng ta đang ở xa hải phận nhà, viện binh trong các nhiệm vụ sắp tới sẽ bị hạn chế.
MissionResupplyRules_fr=Votre force opérationnelle fera son RV avec une force de ravitaillement amie après cette mission. Le ravitaillement et les réparations seront disponibles après la mission. Comme nous sommes loin de nos eaux territoriales, les renforts seront limités dans les prochaines missions.
MissionResupplyRules_de=Ihre Task Force trifft nach dieser Mission mit einem befreundeten Nachschubverband zusammen. Nachschub und Reparatur stehen nach der Mission zur Verfügung. Da wir uns fern der Heimatgewässer befinden, werden die Verstärkungen in den nächsten Missionen begrenzt sein.
MissionResupplyRules_ru=После этой миссии ваше оперативное соединение встретится с дружественной группой снабжения. Пополнение запасов и ремонт будут доступны после миссии. Поскольку мы находимся вдали от родных вод, подкрепления в следующих миссиях будут ограничены.

