MissionIntro_es=El K-242 acecha a un grupo ASW de la JMSDF.
MissionIntro_ko=K-242가 일본 해상자위대 대잠 그룹을 추적한다.
MissionIntro_vn=K-242 bí mật theo dõi một biên đội chống ngầm của JMSDF.
MissionIntro_fr=Le K-242 traque un groupe ASM de la JMSDF.
MissionIntro_de=Die K-242 beschleicht eine ASW-Gruppe der JMSDF.
MissionIntro_ru=К-242 выслеживает противолодочную группу Морских сил самообороны Японии.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=NOTE: This is a detached submarine operation. You will command an assigned submarine for this mission only, and your task force will not deploy. Completing this mission will improve odds in future missions.
MissionSpecialNote_ja=注：これは分遣された潜水艦単独作戦である。貴官は本任務に限り指定された潜水艦を指揮し、貴任務部隊は出撃しない。本任務を完了すれば、以後の任務での戦況が有利となる。
MissionSpecialNote_cn=注意：这是一次独立潜艇行动。本任务中你只指挥被指派的潜艇，特遣舰队不会出动。完成本任务将提高后续任务的胜算。
MissionSpecialNote_es=NOTA: esta es una operación de submarino independiente. Comandarás un submarino asignado solo para esta misión, y tu fuerza operativa no se desplegará. Completar esta misión mejorará las probabilidades en misiones futuras.
MissionSpecialNote_ko=참고: 이번 임무는 독립된 잠수함 작전이다. 이번 임무에서만 배정된 잠수함을 지휘하며, 기동부대는 출동하지 않는다. 이 임무를 완료하면 이후 임무에서 유리한 조건을 얻을 수 있다.
MissionSpecialNote_vn=GHI CHÚ: Đây là một chiến dịch tàu ngầm tách biệt. Bạn sẽ chỉ huy một tàu ngầm được chỉ định riêng cho nhiệm vụ này, và lực lượng đặc nhiệm của bạn sẽ không xuất kích. Hoàn thành nhiệm vụ này sẽ cải thiện cơ hội trong các nhiệm vụ sau.
MissionSpecialNote_fr=NOTE : ceci est une opération sous-marine détachée. Vous commanderez un sous-marin assigné pour cette seule mission, et votre force opérationnelle ne sera pas déployée. Réussir cette mission améliorera vos chances dans les missions futures.
MissionSpecialNote_de=HINWEIS: Dies ist ein abgesetzter U-Boot-Einsatz. Sie befehligen für diese Mission ausschließlich ein zugewiesenes U-Boot, Ihre Task Force wird nicht ausgesandt. Der Abschluss dieser Mission verbessert die Aussichten in künftigen Missionen.
MissionSpecialNote_ru=ПРИМЕЧАНИЕ: это отдельная операция подводной лодки. В этой миссии вы будете командовать только назначенной подводной лодкой, ваше оперативное соединение в бой не выйдет. Успешное выполнение этой миссии повысит шансы на успех в дальнейших миссиях.

