Description_en=Feb, 1988 Red Banner Pacific Fleet is ordered to execute CONPLAN ORANGE 1-4, an all-out attack against Japanese and American assets in the Western Pacific. 
Description_ja=1988年2月　赤旗太平洋艦隊は、西太平洋における日米両国の資産に対する全面攻撃、作戦計画オレンジ1-4の発動を命じられる。
Description_cn=1988年2月，红旗太平洋舰队奉命执行橙色作战计划1-4，对西太平洋的日美目标发起全面进攻。
Description_es=Feb, 1988 Se ordena a la Flota del Pacífico de la Bandera Roja ejecutar el CONPLAN ORANGE 1-4, un ataque total contra activos japoneses y estadounidenses en el Pacífico occidental.
Description_ko=1988년 2월, 적기 태평양 함대는 서태평양의 일본 및 미국 자산에 대한 전면 공격 작전인 CONPLAN ORANGE 1-4를 실행하라는 명령을 받는다.
Description_vn=Tháng 2, 1988. Hạm đội Thái Bình Dương Cờ Đỏ được lệnh thực hiện CONPLAN ORANGE 1-4, một cuộc tấn công toàn diện nhằm vào các lực lượng Nhật Bản và Mỹ ở Tây Thái Bình Dương.
Description_fr=Févr. 1988. La Flotte du Pacifique de la Bannière Rouge reçoit l'ordre d'exécuter le CONPLAN ORANGE 1-4, une attaque totale contre les forces japonaises et américaines dans le Pacifique occidental.
Description_de=Feb. 1988 Die Rotbanner-Pazifikflotte erhält den Befehl, CONPLAN ORANGE 1-4 auszuführen, einen umfassenden Angriff auf japanische und amerikanische Stellungen im Westpazifik.
Description_ru=Февраль 1988. Краснознамённому Тихоокеанскому флоту приказано выполнить план «ОРАНЖ» 1-4 — тотальное наступление на японские и американские силы в западной части Тихого океана.
