MissionResupplyRules_en=As we are operating far from home, resupply and repair will not be available post mission. As we are away home waters, reinforcements in the next few missions will be limited. 
MissionResupplyRules_ja=母国から遠く離れて作戦行動中のため、任務終了後の補給・修理は利用できない。母国水域を離れているため、以後数回の任務における増援は限定的となる。
MissionResupplyRules_cn=由于我们在远离本土的海域行动，任务结束后无法进行补给或维修。随着我们远离本土海域，接下来几个任务中的增援将会有限。
MissionResupplyRules_es=Como estamos operando lejos de casa, el reabastecimiento y la reparación no estarán disponibles después de la misión. Como estamos lejos de aguas natales, los refuerzos en las próximas misiones serán limitados.
MissionResupplyRules_ko=본토에서 멀리 떨어져 작전 중이므로, 임무 종료 후 재보급과 수리를 받을 수 없다. 본토 해역을 벗어나 있으므로, 이후 몇 차례의 임무에서는 증원이 제한된다.
MissionResupplyRules_vn=Vì chúng ta đang hoạt động xa quê nhà, tiếp tế và sửa chữa sẽ không khả dụng sau nhiệm vụ. Vì chúng ta đang ở xa hải phận nhà, viện binh trong các nhiệm vụ sắp tới sẽ bị hạn chế.
MissionResupplyRules_fr=Comme nous opérons loin de nos bases, le ravitaillement et les réparations ne seront pas disponibles après la mission. Comme nous sommes loin de nos eaux territoriales, les renforts seront limités dans les prochaines missions.
MissionResupplyRules_de=Da wir fern der Heimat operieren, stehen nach dieser Mission Nachschub und Reparatur nicht zur Verfügung. Da wir uns fern der Heimatgewässer befinden, werden die Verstärkungen in den nächsten Missionen begrenzt sein.
MissionResupplyRules_ru=Поскольку мы действуем далеко от родных вод, пополнение запасов и ремонт после этой миссии будут недоступны. Поскольку мы находимся вдали от родных вод, подкрепления в следующих миссиях будут ограничены.

