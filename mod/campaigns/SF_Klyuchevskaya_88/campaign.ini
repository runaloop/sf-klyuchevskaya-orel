Description_en=Jan, 1988 The Soviet Union is increasingly concerned with American and Japanese presence in the Northern Pacific. SF Klyuchevskaya is ordered to patrol the Sea of Okhtosk and demonstrate Soviet resolve. 
Description_ja=1988年1月　ソ連は北太平洋における米日両国の軍事的プレゼンスの増大に強い懸念を抱いている。SFクリュチェフスカヤはオホーツク海を巡視し、ソ連の決意を示すよう命じられる。
Description_cn=1988年1月，苏联对美国和日本在北太平洋的存在日益担忧。克柳切夫斯卡亚特遣舰队奉命在鄂霍次克海巡逻，以彰显苏联的决心。
Description_es=Ene, 1988 La Unión Soviética está cada vez más preocupada por la presencia americana y japonesa en el norte del Pacífico. Se ordena a SF Klyuchevskaya patrullar el Mar de Ojotsk y demostrar la determinación soviética.
Description_ko=1988년 1월, 소련은 북태평양에서 늘어나는 미국과 일본의 존재에 점점 우려를 느끼고 있다. 클류쳅스카야 기동부대는 오호츠크해를 순찰하며 소련의 결의를 보여주라는 명령을 받는다.
Description_vn=Tháng 1, 1988. Liên Xô ngày càng lo ngại về sự hiện diện của Mỹ và Nhật Bản ở Bắc Thái Bình Dương. SF Klyuchevskaya được lệnh tuần tra biển Okhotsk và thể hiện quyết tâm của Liên Xô.
Description_fr=Janv. 1988. L'Union soviétique s'inquiète de plus en plus de la présence américaine et japonaise dans le Pacifique Nord. SF Klyuchevskaya reçoit l'ordre de patrouiller en mer d'Okhotsk et de démontrer la détermination soviétique.
Description_de=Jan. 1988 Die Sowjetunion sieht die amerikanische und japanische Präsenz im Nordpazifik mit wachsender Sorge. SF Klyuchevskaya erhält den Befehl, das Ochotskische Meer zu patrouillieren und sowjetische Entschlossenheit zu demonstrieren.
Description_ru=Январь 1988. Советский Союз всё больше обеспокоен присутствием американцев и японцев в северной части Тихого океана. корабельная ударная группа «Ключевская» получает приказ патрулировать Охотское море и продемонстрировать решимость СССР.
