MissionIntro_de=SF Klyuchevskaya greift den Luftwaffenstützpunkt Misawa an.
MissionIntro_ru=КУГ «Ключевская» атакует авиабазу Мисава.
MissionResupplyRules_en=More ships have been added to the roster. Due to tight operational schedule, no repair or rearmament facilities available post mission. As we are leaving home waters, reinforcements in the next few missions will be limited. 
MissionResupplyRules_ja=艦名簿に艦艇が追加された。作戦日程が厳しいため、任務終了後の修理・補給施設は利用できない。母国水域を離れるため、以後数回の任務における増援は限定的となる。
MissionResupplyRules_cn=名册中已增加更多舰艇。由于行动日程紧张，任务结束后没有维修或补给设施可用。随着我们离开本土海域，接下来几个任务中的增援将会有限。
MissionResupplyRules_es=Se han añadido más buques al escalafón. Debido al calendario operativo ajustado, no habrá instalaciones de reparación ni rearme disponibles después de la misión. Como estamos abandonando aguas natales, los refuerzos en las próximas misiones serán limitados.
MissionResupplyRules_ko=전력 목록에 함선이 추가되었다. 빠듯한 작전 일정으로 인해, 임무 종료 후 수리 및 재무장 시설을 이용할 수 없다. 본토 해역을 벗어나므로, 이후 몇 차례의 임무에서는 증원이 제한된다.
MissionResupplyRules_vn=Nhiều tàu hơn đã được bổ sung vào danh sách quân số. Do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang sau nhiệm vụ này. Vì chúng ta đang rời khỏi hải phận nhà, viện binh trong các nhiệm vụ sắp tới sẽ bị hạn chế.
MissionResupplyRules_fr=Davantage de navires ont été ajoutés à l'effectif. En raison d'un calendrier opérationnel serré, aucune installation de réparation ou de réarmement ne sera disponible après la mission. Comme nous quittons nos eaux territoriales, les renforts seront limités dans les prochaines missions.
MissionResupplyRules_de=Weitere Schiffe wurden dem Bestand hinzugefügt. Aufgrund des engen Einsatzplans stehen nach dieser Mission keine Reparatur- oder Bewaffnungseinrichtungen zur Verfügung. Da wir die Heimatgewässer verlassen, werden die Verstärkungen in den nächsten Missionen begrenzt sein.
MissionResupplyRules_ru=В состав соединения добавлены новые корабли. Из-за плотного графика операции после этой миссии пункты пополнения запасов и ремонта недоступны. Поскольку мы уходим из родных вод, подкрепления в следующих миссиях будут ограничены.

