[AllowedVessels]
wp_rkr_kirov=적기 북방 함대의 기함인 이 원자력 추진 미사일 순양함은 전황에 따라 전출되었다. SS-N-19 쉽렉 대함미사일 20기(사거리 270해리, 첨단 편대유도 방식)를 탑재하고 있으며, SA-N-6 함대공미사일 96셀과 우수한 소나 체계를 갖추고 있다.\n\n이 함은 대잠 호위함들의 엄호를 받는 전대 기함으로 운용하는 것이 가장 효과적이다.
wp_rkr_slava=적기 태평양 함대의 기함인 이 미사일 순양함은 SS-N-12 샌드박스 대함미사일 16기(사거리 300해리, 편대유도 방식)로 강력한 화력을 갖추고 있다. TBILISI 자체의 SS-N-19 16기와 결합하면, 필요시 32발의 통합 미사일 공격을 단 한 번 가할 수 있다. 또한 함대 방공을 위한 SA-N-6 미사일 64셀과 예인식 소나(VDS)를 갖추고 있다.
wp_takr_kiev=최대 36기의 Yak-38 포저, Ka-25 호르몬, Ka-27 헬릭스를 탑재할 수 있는 이 V/STOL 항공모함은 지역 대잠전과 국지 방공을 위해 설계된 함이다. 또한 장거리 공격력을 위한 SS-N-12 샌드박스 8기도 탑재한다.\n\n참고: SS-N-12의 재장전 기능은 완전히 작동하지 않으며, 임무당 최대 2회 재장전만 가능할 수 있으므로 이 기능에 의존하지 말 것.\n\n참고: 어려움 난이도에서는 이 항모에 자체 항공단이 편성되지 않는다.
wp_cv_orel=프로젝트 1160 오룔급은 소련 해군 최초의 진정한 함대 항공모함으로, 캐터펄트와 착함 유도 장치를 갖추고 있으며 최대 60기의 항공기를 탑재할 수 있다: MiG-23A 플로거 전투기, Ko-45 공격 및 전자전 항공기, P-42 대잠초계기 및 P-42RLDN 조기경보기, 그리고 Ka-27 헬릭스 헬리콥터이다. 이 함은 기동부대에 진정한 함대 방공, 원거리 타격, 공중 레이더 정보를 제공한다. 또한 SS-N-19 쉽렉 대함미사일 16기, SA-N-7 및 SA-N-4 함대공미사일, 근접방어체계(CIWS)를 탑재하고 있으나, 함대에서 가장 귀중한 함체이며 대체 비용이 극히 높으므로 반드시 호위를 받으며 운용해야 한다.
wp_kr_sverdlov=현대 미사일 시대에는 구식이 된 이 경순양함은 여전히 함포 사격 및 상선 습격 임무에서 매우 유능하다. 6인치 함포의 깊은 탄약고와 상당한 방어력을 갖추고 있어, 마주치는 거의 모든 NATO 군함을 사거리와 화력에서 압도한다.
wp_bpk_kara=카라급 미사일 순양함은 대잠전과 대공전에 중점을 둔 균형 잡힌 미사일 순양함이다. 8기의 SS-N-14 사일렉스-B 범용 대잠미사일을 탑재하여 Mk-48 어뢰로 무장한 NATO 잠수함에 대한 원거리 공격이 가능하다. 또한 지역 방공을 위한 양방향 SA-N-3, 근접 방어를 위한 SA-N-4 등 상당한 대공미사일 전력도 갖추고 있다. 헬리콥터 격납고와 예인식 소나(VDS)를 결합하여, 카라급은 우수한 다목적 수상 전투함이다.
wp_bpk_kresta2=크레스타 II급 미사일 순양함은 크레스타 I급을 대잠전에 특화하여 개수한 함이다. 이 급은 SS-N-3 세팔 4기를 SS-N-14 사일렉스-A 원거리 대잠미사일 8기와 더 긴 사거리의 SA-N-3 미사일로 교체했다. 또한 Ka-25 변형기 1기를 위한 헬리콥터 격납고도 갖추고 있다.
wp_rkr_kresta1=크레스타 I급 미사일 순양함은 킨다급을 기반으로 하며, SS-N-3B 세팔 미사일 전력의 절반을 항해 성능, 방공, 항속거리 개선으로 대체했다. 또한 Ka-25 변형기 1기를 위한 헬리콥터 격납고도 갖추고 있다.
wp_rkr_kynda=킨다급 미사일 순양함은 강력한 대함전 능력에 중점을 두어 설계되었다. SS-N-3B 세팔 8기와 추가 재장전분 8기를 갖추어, 원거리 대함 공격을 위한 플랫폼이다. 그러나 대잠 및 대공 능력이 매우 제한적이므로 효과적으로 운용하려면 대공 및 대잠 호위가 필요하다.
wp_em_sovremenny=소브레멘니급 구축함은 대함전과 대공전에 중점을 둔 균형 잡힌 구축함이다. SS-N-22 썬번 초음속 시스키밍 미사일 8기를 탑재하여 대부분의 수상 전투함에 치명적인 타격을 가할 수 있다. 쌍련 SA-N-7은 높은 발사율을 제공하여 최대 6개의 개별 표적에 동시 대응이 가능하며 저고도 표적 식별 능력도 우수하다. 또한 Ka-25 또는 Ka-27 계열 헬리콥터 어떤 것이든 수납할 수 있는 격납고와 매우 우수한 전자지원(ESM) 체계를 갖추고 있다. 끝으로 130mm 쌍련포 2기를 탑재하여 높은 발사율과 긴 사거리를 자랑하며, 5인치/54구경장을 사거리로 능가할 수 있는 몇 안 되는 소련 군함 중 하나이다.
wp_bpk_udaloy=우달로이급 구축함은 순수한 대잠전에 중점을 두어 설계되었다. 8기의 SS-N-14 사일렉스-B 범용 대잠미사일을 탑재하여 Mk-48 어뢰에 대한 원거리 대응 능력을 갖추고 있다. 또한 근접방어에 특화된 SA-N-9를 탑재하여 저고도 집중공격에 대한 초근접 방어를 제공한다. 헬리콥터 격납고 2기와 우수한 소나 체계를 갖춘 이 함은 소련 최고의 대잠함이다.
wp_bpk_kashin=카신급은 1960년대부터 이어진 대공 및 대잠 중점 구축함 계열이다. 태평양 함대의 카신급은 프로젝트 61MP 개수를 받지 못해 근접방어체계(CIWS), 예인식 소나(VDS), SS-N-2 미사일을 갖추지 못했다. 방공 능력이 약하므로 저위협 수상 및 공중 표적에 대해서만 운용해야 한다.
wp_bpk_kanin=카닌급은 1960년대부터 이어진 대공 중점 구축함 계열이다. 근접방어체계(CIWS)를 갖추고 있으나 저고도 공중 및 미사일 공격에는 여전히 매우 취약하다.
wp_skr_krivak1=크리박 I급은 단거리 방공 능력과 원거리 대잠 능력을 갖춘 다목적 주력함 계열이다. 예인식 소나(VDS)를 갖추고 있으나 헬리콥터 격납고가 없어 대잠 수색 범위가 제한된다. 근접방어체계(CIWS)가 없고 저고도 대공미사일 성능이 부족하므로, 대형 소련 순양함과 함께 운용하는 것이 가장 효과적이다.
wp_skr_krivak2=크리박 II급은 앞선 크리박 I급을 개량한 함이다. 개량된 SS-N-14 사일렉스-B 범용 대잠미사일을 탑재하여 단거리 대함 능력을 제공한다. 또한 4인치 쌍련 자동포로 무장을 강화하여 상당한 해안포격 및 함포 사격 능력을 갖추고 있다. 그러나 크리박 I급과 동일한 약점, 즉 빈약한 대공전 능력과 단거리 대잠 탐지 능력만을 공유한다.

[AllowedHelicopters]
wp_ka-25=Ka-25PL은 모든 소련 헬리콥터 격납고에 수납 가능한 무난한 대잠 헬리콥터이다. 탑재량이 제한되어 소노부이 또는 어뢰 중 하나만 실을 수 있다. 다만 우수한 딥핑 소나와 수상탐색 레이더를 갖추고 있다. Ka-25PL은 폭탄 및 로켓 무장도 장착할 수 있어, 대공 위협이 거의 없는 지역에서 제한적인 대함 임무도 수행할 수 있다.\n\n참고: 승객 10명 수송 가능.
wp_ka-25ts=Ka-25TS는 SS-N-3 세팔, SS-N-12 샌드박스, SS-N-19 쉽렉의 원거리 사격통제를 위해 장거리 수상탐색 레이더를 탑재한 전용 해상초계 헬리콥터이다. 이 헬리콥터는 적 전투기에 대해 생존할 수 없으므로, 레이더를 끈 채 저고도로 비행하다가 표적 획득 시에만 상승하는 방식으로 운용하는 것이 가장 좋다.\n\n참고: 승객 10명 수송 가능.
wp_ka-27=Ka-27PL은 Ka-25PL을 더 긴 항속거리로 개량한 헬리콥터이다. 탑재량과 체공시간이 크게 늘어났다. 대잠 무장 구성이 균형을 이루어 Ka-25PL의 헌터/킬러 제한이 사라졌다. 전작과 마찬가지로 딥핑 소나와 수상탐색 레이더를 갖추고 있다. 공격형 무장 구성은 Yak-38보다 훨씬 긴 사거리에서 더 무거운 탑재량을 운용할 수 있다.\n\n참고: 승객 10명 수송 가능.
wp_ka-29=Ka-29는 Ka-27PL의 공격 헬리콥터 파생형이다. 대전차미사일(ATGM), 로켓, 폭탄, 30mm 기관포를 탑재하여 지상 공격 임무를 수행한다.\n\n참고: 승객 16명 수송 가능.

[AllowedAircraft]
wp_yak-38=Yak-38 포저는 저위험 대함 임무와 국지 방공에 적합한 V/STOL 전투공격기이다. 레이더와 보조연료탱크가 없어 항속거리와 능력이 제한적이다. NATO의 해상초계기(MPA)와 무호위 폭격기를 요격하는 데 가장 적합하다. 또한 무장이 약한 일본 해상자위대 및 미 해군 수상함이나 무장하지 않은 상선을 저비용으로 격침하는 수단으로도 유용하다. 전반적으로 이 기체는 기동부대를 원거리 공중발사 미사일로부터 보호하고 귀중한 대함미사일을 절약하기 위한 용도로 설계되었다.\n\n참고: 게임 내 설명과는 달리, 대함 무장 구성의 실제 유효 사거리는 약 100해리이다.
wp_mig-23a=MiG-23A 플로거는 국지 방공과 제한적인 대함 임무에 적합한 초음속 전투공격기이다. 무난한 공대공 수색 레이더와 해상도가 낮은 적외선 수색추적장비(IRST)를 갖추고 있으며 중거리 공대공미사일을 탑재한다. 근접전에서는 MiG-23A에 매우 기동성이 뛰어난 단거리 적외선 유도 공대공미사일인 AA-11 아처를 장착할 수 있다. 또한 제한적인 공격용 무장 구성도 탑재할 수 있다. 이 전투기는 전역 전반에 걸쳐 등장하는 F-4보다 우세하지만, F-14를 상대하려면 전자전 지원이 필요하다.
wp_taifun=Ko-45는 아음속 함재 공격기로, 소련의 A-6 인트루더 대응 기종이다. 정밀 타격 및 SEAD(방공망제압) 옵션을 갖춘 무거운 원거리 대함·대지 공격 무장을 탑재할 수 있으며, 공중급유기로도 운용할 수 있다. 오룔급 항공단의 타격 전력이다.
wp_taifun_ew=Ko-45E는 Ko-45의 전자전 버전으로, EA-6 프라울러에 대응하는 역할을 맡는다. 재머가 적의 레이더와 SAM 교전 능력을 저하시켜 타격 편대를 지원하며, SEAD를 위한 대레이더미사일도 탑재할 수 있다. 보유 수량이 매우 적으므로 불필요하게 위험에 노출시키지 말 것.
wp_p-42=P-42는 S-3 바이킹에 대응하는 함재 대잠초계기이다. 소노부이와 어뢰를 탑재하여 기동부대의 대잠 방어선을 헬리콥터 작전반경 훨씬 너머까지 확장하며, 항모에 장시간 체공 가능한 수상탐색 플랫폼을 제공한다.
wp_mig-25pd=MiG-25PD 폭스배트는 고고도 폭격기를 요격하기 위해 설계된 초음속 요격기이다. 매우 빠르며, 무난한 공대공 수색 레이더, IRST, 중거리 공대공미사일을 갖추고 있다. MiG-23A와 비교하면 공대공 수색 레이더가 더 우수하고 공대공미사일 사거리가 더 길며 항속거리도 거의 두 배에 달하지만, 공대공 임무로만 제한된다.
wp_su-24m=Su-24M은 초음속 저고도 폭격기이다. 소련의 가장 유능한 전술폭격기이다. 원거리 대함 공격을 위해 시스키밍 대함미사일인 AS-13 킹볼트 또는 원거리 대레이더미사일인 AS-11 킬터를 장착할 수 있다.
wp_il-38=Il-38 메이는 NATO의 P-3C에 대응하는 장거리 해상초계기(MPA)이다. AT-2 대잠어뢰 또는 PLAB-100 폭뢰를 투하할 수 있다. 또한 144발이라는 인상적인 RGB-1 소노부이도 탑재한다.
wp_tu-95rt=Tu-95RT 베어는 장거리 해상초계기(MPA)이다. 장거리 수상탐색 레이더와 우수한 전자지원(ESM) 체계를 갖추고 있다. 이 기종은 기동부대의 수상 표적에 대한 상황인식을 크게 향상시킨다. 그러나 적 전투기에 대해서는 생존할 수 없으므로 호위 없이 남겨두지 말 것.
wp_tu-16k=Tu-16K 뱃저는 아음속 전략폭격기이다. 보조적으로 대지공격 모드를 갖춘 원거리 대함미사일 AS-6 킹피셔를 장착한다. 또한 원거리 재밍미사일 AS-2B 키퍼도 탑재할 수 있다. 미 해군 항모전투단을 제외한 모든 수상 위협에 적합한 대함미사일 플랫폼이다.
wp_tu-22m2=Tu-22M2 백파이어는 초음속 전략폭격기이다. 원거리 대함미사일 AS-4 키친 또는 대지공격형 AS-4B를 장착한다. 높은 속도와 원거리 발사 능력으로 미 해군 항모전투단을 상대로도 어느 정도의 생존 여유를 갖는다.
wp_tu-16p=뱃저의 개조형인 Tu-16P 뱃저-J는 장거리 전자전기이다. 유일한 임무는 사거리 135해리의 BUKET 전자방해장비(ECM) 재머를 운용하는 것이다. 이는 전투기를 적의 원거리 공대공미사일로부터 엄호하거나 적 수상 전력의 눈을 가릴 수 있는 귀중한 자산이다.
wp_p-42_rldn=전황상 긴급 요청으로, 이 시제 조기경보기는 제한적인 실전 배치에 급히 투입되었다. 216해리에 이르는 원거리에서 공중 및 수상 표적을 탐지할 수 있으며, 우수한 전자지원(ESM) 체계도 갖추고 있다. 이 기체는 기동부대에 있어 중요한 전력승수로, 함재 대공수색 장비보다 훨씬 먼저 시스키밍 미사일과 저고도 공격기를 탐지해낸다.
