CitationText_cn=表彰其在日本钏路附近登陆行动中展现的卓越指挥与作风。
CitationText_es=Por su liderazgo y conducta sobresalientes al dirigir operaciones de desembarco cerca de Kushiro, Japón.
CitationText_ko=일본 구시로 인근 상륙 작전을 수행하며 보인 뛰어난 지휘력과 행동에 대하여.
CitationText_vn=Vì khả năng chỉ huy và tác phong xuất sắc khi tiến hành các chiến dịch đổ bộ gần Kushiro, Nhật Bản.
CitationText_fr=Pour son leadership et sa conduite exemplaires lors des opérations de débarquement près de Kushiro, au Japon.
CitationText_de=Für herausragende Führung und Haltung bei der Durchführung von Landungsoperationen nahe Kushiro, Japan verliehen hat.
CitationText_ru=За выдающееся командование и образцовые действия при проведении десантной операции у Кусиро, Япония.

