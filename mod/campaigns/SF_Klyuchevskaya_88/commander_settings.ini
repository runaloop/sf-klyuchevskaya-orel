CitationText_es=Por su acción de combate decisiva al romper el Estrecho de Soya mientras comandaba {TaskForceName}.
CitationText_ko={TaskForceName}를 지휘하며 소야 해협을 돌파하는 결정적인 전투 행동에 대하여.
