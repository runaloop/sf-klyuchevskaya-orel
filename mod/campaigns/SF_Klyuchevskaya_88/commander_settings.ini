CitationText_de=Für entscheidendes Kampfhandeln beim Durchbruch durch die Soya-Straße im Kommando über {TaskForceName} verliehen hat.
CitationText_ru=За решительные боевые действия при прорыве через пролив Лаперуза при командовании КУГ «Ключевская».

