CitationText_en=For exceptional leadership and conduct defeating superior enemy air and naval forces while commanding {TaskForceName}.
CitationText_ja={TaskForceName}を指揮し、優勢な敵の空中・海上戦力を打ち破る卓越した指揮統率と行動を示したことに対して。
CitationText_cn=表彰其在指挥{TaskForceName}期间展现的非凡领导才能与作风，击败数量占优的敌方空中和海上力量。
CitationText_es=Por su liderazgo y conducta excepcionales al derrotar a fuerzas aéreas y navales enemigas superiores mientras comandaba {TaskForceName}.
CitationText_ko={TaskForceName}를 지휘하며 우세한 적의 항공 및 해상 전력을 격파한 뛰어난 지휘력과 행동에 대하여.
CitationText_vn=Vì khả năng chỉ huy và tác phong xuất sắc khi đánh bại các lực lượng không quân và hải quân vượt trội của đối phương trong khi chỉ huy {TaskForceName}.
CitationText_fr=Pour un leadership et une conduite exceptionnels dans la défaite de forces aériennes et navales ennemies supérieures en commandant {TaskForceName}.
CitationText_de=Für außerordentliche Führung und Haltung bei der Niederlage überlegener feindlicher Luft- und Seestreitkräfte im Kommando über {TaskForceName} verliehen hat.
CitationText_ru=За исключительное командование и образцовые действия при разгроме превосходящих сил вражеской авиации и флота при командовании КУГ «Ключевская».

