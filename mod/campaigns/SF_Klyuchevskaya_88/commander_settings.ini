CitationText_cn=表彰其成功摧毁千岛群岛敌方封锁部队。
CitationText_es=Por destruir con éxito a las fuerzas de bloqueo enemigas en las Islas Kuriles.
CitationText_ko=쿠릴 열도에서 적 봉쇄 부대를 성공적으로 격파한 것에 대하여.
