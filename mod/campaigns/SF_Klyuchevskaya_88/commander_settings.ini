CitationText_en=For decisive combat action defending the Motherland while commanding {TaskForceName}.
CitationText_ja={TaskForceName}を指揮し、祖国防衛のための果断な戦闘行動を遂行したことに対して。
CitationText_cn=表彰其在指挥{TaskForceName}保卫祖国的战斗中所展现的决定性作战行动。
CitationText_es=Por su acción de combate decisiva en defensa de la Patria mientras comandaba {TaskForceName}.
CitationText_ko={TaskForceName}를 지휘하며 조국을 수호하는 결정적인 전투 행동에 대하여.
CitationText_vn=Vì hành động chiến đấu quyết định trong việc bảo vệ Tổ quốc khi chỉ huy {TaskForceName}.
CitationText_fr=Pour des actions de combat décisives dans la défense de la Patrie en commandant {TaskForceName}.
CitationText_de=Für entscheidendes Kampfhandeln zur Verteidigung des Vaterlandes im Kommando über {TaskForceName} verliehen hat.
CitationText_ru=За решительные боевые действия в защиту Родины при командовании КУГ «Ключевская».

