[AllowedVessels]
wp_rkr_kirov=Soái hạm của Hạm đội Phương Bắc Cờ Đỏ, tuần dương hạm tên lửa dẫn đường chạy bằng năng lượng hạt nhân này được điều chuyển đến đây do tình huống chiến tranh. Nó được trang bị một dàn 20 tên lửa chống hạm SS-N-19 SHIPWRECK với tầm bắn 270 hải lý và hệ thống dẫn đường bầy tiên tiến. Nó còn có 96 ống phóng SA-N-6 SAM và một hệ thống sonar xuất sắc. \n\nCon tàu này phát huy hiệu quả tốt nhất khi làm soái hạm của một hải đoàn, được các tàu hộ tống chống ngầm bảo vệ chặt chẽ.
wp_rkr_slava=Soái hạm của Hạm đội Thái Bình Dương Cờ Đỏ, tuần dương hạm tên lửa dẫn đường này mang một dàn 16 tên lửa chống hạm SS-N-12 SANDBOX ấn tượng với tầm bắn 300 hải lý và dẫn đường bầy. Kết hợp với 16 tên lửa SS-N-19 của chính TBILISI, bạn có thể tung ra một đợt phóng loạt kết hợp 32 tên lửa, một lần duy nhất, nếu tình huống đòi hỏi. Nó còn có 64 ống phóng SA-N-6 SAM để bảo vệ không phận cho toàn hạm đội và một hệ thống VDS.
wp_takr_kiev=Đây là tàu sân bay V/STOL có sức chứa tối đa 36 máy bay Yak-38 FORGER, Ka-25 HORMONE và Ka-27 HELIX, được thiết kế cho nhiệm vụ chống ngầm khu vực và phòng không tại chỗ. Nó còn mang một dàn 8 tên lửa SS-N-12 SANDBOX để tạo sức tấn công tầm xa. \n\nLƯU Ý: khả năng nạp lại đạn của SS-N-12 không hoạt động đầy đủ, bạn có thể được nạp lại tối đa 2 lần mỗi nhiệm vụ, vì vậy đừng phụ thuộc vào tính năng này. \n\nLƯU Ý: ở mức khó, tàu sân bay này không có sẵn không đoàn riêng.
wp_cv_orel=Lớp OREL thuộc Đề án 1160 là tàu sân bay hạm đội đích thực đầu tiên của Hải quân Liên Xô, có máy phóng, thiết bị hãm đà và sức chứa tối đa 60 máy bay: tiêm kích MiG-23A FLOGGER, máy bay tấn công và tác chiến điện tử Ko-45, máy bay chống ngầm P-42 và máy bay cảnh báo sớm trên không P-42RLDN, cùng trực thăng Ka-27 HELIX. Con tàu mang lại cho lực lượng đặc nhiệm khả năng phòng không hạm đội thực sự, tấn công từ xa và một bức tranh radar trên không. Nó còn được trang bị 16 tên lửa chống hạm SS-N-19 SHIPWRECK, các hệ thống SAM SA-N-7 và SA-N-4, cùng CIWS, nhưng đây là con tàu có giá trị nhất của hạm đội và việc thay thế nó cực kỳ tốn kém, vì vậy hãy luôn bảo vệ nó bằng lực lượng hộ tống.
wp_kr_sverdlov=Đã lạc hậu trong thời đại tên lửa hiện đại, các tuần dương hạm hạng nhẹ này vẫn rất hiệu quả trong vai trò bắn phá bờ biển và săn tàu buôn. Với hầm đạn pháo 6 inch dồi dào và khả năng bảo vệ tốt, những con tàu này có thể áp đảo về tầm bắn và hỏa lực gần như bất kỳ tàu chiến NATO nào mà chúng chạm mặt.
wp_bpk_kara=Tuần dương hạm tên lửa lớp KARA là một tuần dương hạm cân bằng tốt, tập trung vào tác chiến chống ngầm và phòng không. Nó mang 8 tên lửa chống ngầm đa năng SS-N-14 SILEX-B, cho phép tấn công từ xa nhằm vào các tàu ngầm NATO trang bị ngư lôi Mk-48. Nó còn có một dàn SAM khá tốt, với hệ thống SA-N-3 hai đầu để phòng không khu vực và SA-N-4 lắp ở mạn tàu để phòng thủ điểm. Kết hợp với nhà chứa trực thăng và hệ thống VDS, lớp KARA là một tàu chiến mặt nước đa năng đáng gờm.
wp_bpk_kresta2=Tuần dương hạm tên lửa lớp KRESTA II là một biến thể tập trung vào chống ngầm của lớp KRESTA I. Lớp tàu này đánh đổi 4 tên lửa SS-N-3 SEPAL để lấy 8 tên lửa chống ngầm tầm xa SS-N-14 SILEX-A và một dàn SA-N-3 có tầm bắn xa hơn. Nó còn có một nhà chứa trực thăng cho một chiếc Ka-25 biến thể.
wp_rkr_kresta1=Tuần dương hạm tên lửa lớp KRESTA I được phát triển dựa trên lớp KYNDA, đánh đổi một nửa dàn tên lửa SS-N-3B SEPAL để có khả năng đi biển, phòng không và tầm hoạt động tốt hơn. Nó cũng có một nhà chứa trực thăng cho một chiếc Ka-25 biến thể.
wp_rkr_kynda=Tuần dương hạm tên lửa lớp KYNDA được thiết kế tập trung mạnh vào tác chiến chống hạm. Với 8 tên lửa SS-N-3B SEPAL và thêm 8 lần nạp lại, đây là một nền tảng được thiết kế cho các đòn tấn công chống hạm từ xa. Tuy nhiên, nó có khả năng chống ngầm và phòng không rất hạn chế, nên cần có tàu hộ tống chống ngầm và phòng không để hoạt động hiệu quả.
wp_em_sovremenny=Tàu khu trục lớp SOVREMENNYY là một khu trục hạm cân bằng tốt, tập trung vào tác chiến chống hạm và phòng không. Nó mang 8 tên lửa siêu âm bay sát mặt biển SS-N-22 SUNBURN, có thể hủy diệt hầu hết các tàu chiến mặt nước. Hệ thống SA-N-7 hai bệ phóng cho tốc độ bắn cao, có thể đối phó tối đa 6 mục tiêu riêng biệt và khả năng phân biệt mục tiêu bay thấp tốt. Nó còn có nhà chứa trực thăng phù hợp cho bất kỳ biến thể Ka-25 hay Ka-27 nào, cùng một hệ thống ESM rất tốt. Cuối cùng, nó có 2 tháp pháo đôi 130mm với tốc độ bắn cao và tầm xa, là một trong số ít tàu chiến Liên Xô có thể áp đảo tầm bắn của pháo 5"/54.
wp_bpk_udaloy=Tàu khu trục lớp UDALOY được thiết kế thuần túy cho nhiệm vụ chống ngầm. Với 8 tên lửa chống ngầm đa năng SS-N-14 SILEX-B, nó có khả năng tấn công từ xa để đối phó ngư lôi Mk-48. Nó còn có dàn SA-N-9 tập trung vào phòng thủ điểm, cung cấp khả năng phòng thủ ở cực gần chống lại các đợt tấn công bão hòa ở độ cao thấp. Với 2 nhà chứa trực thăng và một hệ thống sonar xuất sắc, đây là tàu chống ngầm tốt nhất của Liên Xô.
wp_bpk_kashin=Lớp KASHIN là một dòng tàu khu trục tập trung vào phòng không và chống ngầm, có từ những năm 1960. Các tàu lớp KASHIN của Hạm đội Thái Bình Dương chưa từng được nâng cấp theo Đề án 61MP, nên vẫn thiếu CIWS, VDS hoặc dàn tên lửa SS-N-2. Khả năng phòng không yếu của chúng có nghĩa là chỉ nên sử dụng chúng để đối phó các mối đe dọa trên không và trên mặt biển ở mức thấp.
wp_bpk_kanin=Lớp KANIN là một dòng tàu khu trục tập trung vào phòng không, có từ những năm 1960. Chúng được trang bị CIWS nhưng vẫn rất yếu trước các đợt tấn công bằng máy bay và tên lửa ở độ cao thấp.
wp_skr_krivak1=Lớp KRIVAK I là một dòng tàu chủ lực đa dụng, có khả năng phòng không tầm ngắn và tấn công chống ngầm từ xa. Chúng được trang bị VDS nhưng thiếu nhà chứa trực thăng, hạn chế khả năng tìm kiếm tàu ngầm. Việc thiếu CIWS và hiệu năng SAM kém ở độ cao thấp có nghĩa là chúng phát huy hiệu quả tốt nhất khi phối hợp cùng các tuần dương hạm lớn hơn của Liên Xô.
wp_skr_krivak2=Lớp KRIVAK II là bản cải tiến của lớp KRIVAK I trước đó. Nó mang tên lửa chống ngầm đa năng SS-N-14 SILEX-B đã được cải tiến, mang lại khả năng chống hạm tầm ngắn. Chúng cũng được tăng cường hỏa lực pháo, với tháp pháo đôi tự động 4 inch, cho khả năng bắn phá bờ biển và tác chiến bằng pháo khá tốt. Tuy nhiên, chúng có cùng những nhược điểm như KRIVAK I, với khả năng phòng không yếu và chỉ phát hiện chống ngầm ở tầm ngắn.

[AllowedHelicopters]
wp_ka-25=Ka-25PL là trực thăng chống ngầm khá tốt, có thể triển khai trên mọi nhà chứa trực thăng của tàu Liên Xô. Tải trọng hạn chế buộc nó phải chọn giữa cấu hình phao thủy âm hoặc ngư lôi. Tuy vậy, nó có sonar nhúng và radar tìm kiếm mặt biển khá tốt. Ka-25PL cũng có cấu hình bom và rocket, cho phép thực hiện các nhiệm vụ chống hạm hạn chế ở những nơi ít hoặc không có mối đe dọa trên không. \n\nLƯU Ý: Có thể chở 10 hành khách.
wp_ka-25ts=Ka-25TS là trực thăng tuần tra biển được thiết kế chuyên dụng, mang radar tìm kiếm mặt biển tầm xa để cung cấp dữ liệu chỉ thị mục tiêu từ xa cho các đợt phóng tên lửa SS-N-3 SEPAL, SS-N-12 SANDBOX và SS-N-19 SHIPWRECK. Những trực thăng này sẽ không thể sống sót trước tiêm kích đối phương, vì vậy nên sử dụng chúng ở độ cao thấp với radar tắt, chỉ bật lên để thu thập dữ liệu mục tiêu. \n\nLƯU Ý: Có thể chở 10 hành khách.
wp_ka-27=Ka-27PL là bản nâng cấp có tầm hoạt động xa hơn của Ka-25PL. Nó mang lại sự gia tăng đáng kể về tải trọng và độ bền bay. Các cấu hình chống ngầm của nó được cân bằng hơn, loại bỏ hạn chế "thợ săn/sát thủ" của Ka-25PL. Giống như tiền nhiệm, nó có sonar nhúng và radar tìm kiếm mặt biển. Cấu hình tấn công của nó mang tải trọng nặng hơn với tầm bay xa hơn nhiều so với Yak-38. \n\nLƯU Ý: Có thể chở 10 hành khách.
wp_ka-29=Ka-29 là biến thể trực thăng tấn công của Ka-27PL. Nó mang tên lửa chống tăng có điều khiển, rocket, bom và pháo tự động 30mm cho các nhiệm vụ tấn công mặt đất. \n\nLƯU Ý: Có thể chở 16 hành khách.

[AllowedAircraft]
wp_yak-38=Yak-38 FORGER là tiêm kích - cường kích V/STOL, phù hợp cho các nhiệm vụ chống hạm rủi ro thấp và phòng không tại chỗ. Do thiếu radar và không có thùng dầu phụ, Yak-38 bị hạn chế về tầm bay và khả năng tác chiến. Nó được dùng tốt nhất để đánh chặn máy bay tuần tra biển và máy bay ném bom không có hộ tống của NATO. Đây cũng là phương tiện tiết kiệm để đánh chìm tàu buôn không vũ trang và các tàu mặt nước trang bị yếu của JMSDF và Hải quân Mỹ. Nói chung, chúng được dùng để bảo vệ lực lượng đặc nhiệm khỏi các tên lửa phóng từ máy bay tầm xa và để giữ lại những tên lửa chống hạm quý giá.\n\nLƯU Ý: Mặc dù mô tả trong game ghi khác, tầm hoạt động hiệu quả với cấu hình chống hạm chỉ khoảng 100 hải lý.
wp_mig-23a=MiG-23A FLOGGER là tiêm kích - cường kích siêu âm, phù hợp cho phòng không tại chỗ và các nhiệm vụ chống hạm hạn chế. Nó có radar tìm kiếm trên không khá tốt, hệ thống IRST độ phân giải kém và mang tên lửa không đối không tầm trung. Trong không chiến quần vòng, MiG-23A có thể trang bị AA-11 ARCHER, một tên lửa không đối không hồng ngoại tầm ngắn có khả năng cơ động cao. Nó cũng mang được cấu hình tấn công hạn chế. Tiêm kích này vượt trội hơn các máy bay F-4 phổ biến trong suốt chiến dịch, nhưng cần được hỗ trợ gây nhiễu khi đối đầu với F-14.
wp_taifun=Ko-45 là máy bay tấn công cận âm hoạt động trên tàu sân bay, câu trả lời của Liên Xô cho A-6 INTRUDER. Nó mang được tải trọng lớn cho các đòn tấn công chống hạm và tấn công mặt đất từ xa, với các phương án dẫn đường chính xác và chế áp phòng không đối phương (SEAD), và cũng có thể bay như một máy bay tiếp dầu. Đây là lực lượng tấn công chủ lực của không đoàn lớp OREL.
wp_taifun_ew=Ko-45E là phiên bản tác chiến điện tử của Ko-45, đảm nhiệm vai trò tương tự EA-6 PROWLER. Bộ gây nhiễu của nó làm suy giảm radar và khả năng bắn SAM của đối phương nhằm hỗ trợ đội hình tấn công, và nó có thể mang tên lửa chống bức xạ để thực hiện SEAD. Số lượng máy bay này rất ít, đừng để chúng gặp rủi ro không cần thiết.
wp_p-42=P-42 là máy bay chống ngầm và tuần tra biển hoạt động trên tàu sân bay, tương đương với S-3 VIKING. Với phao thủy âm và ngư lôi, nó mở rộng màn chống ngầm của lực lượng đặc nhiệm ra xa hơn nhiều so với tầm hoạt động của trực thăng, và mang lại cho tàu sân bay một nền tảng tìm kiếm mặt biển có độ bền bay cao.
wp_mig-25pd=MiG-25PD FOXBAT là máy bay đánh chặn siêu âm được thiết kế để đánh chặn máy bay ném bom bay ở độ cao lớn. Nó có tốc độ rất cao, radar tìm kiếm trên không khá tốt, IRST và tên lửa không đối không tầm trung. So với MiG-23A, nó có radar tìm kiếm trên không tốt hơn, tên lửa không đối không tầm xa hơn và tầm hoạt động gần gấp đôi; nhưng chỉ giới hạn ở vai trò không đối không.
wp_su-24m=Su-24M là máy bay ném bom siêu âm, hoạt động ở độ cao thấp. Đây là máy bay ném bom chiến thuật có năng lực nhất của Liên Xô. Cho các nhiệm vụ chống hạm từ xa, nó có thể trang bị tên lửa chống hạm bay sát mặt biển AS-13 KINGBOLT hoặc tên lửa chống bức xạ tầm xa AS-11 KILTER.
wp_il-38=Il-38 MAY là máy bay tuần tra biển tầm xa, tương đương với P-3C của NATO. Nó có thể triển khai ngư lôi chống ngầm AT-2 hoặc bom chìm PLAB-100. Nó còn mang một số lượng đáng kinh ngạc là 144 phao thủy âm RGB-1.
wp_tu-95rt=Tu-95RT BEAR là máy bay tuần tra biển tầm xa. Nó có radar tìm kiếm mặt biển tầm xa và một hệ thống ESM tốt. Nền tảng này giúp gia tăng đáng kể khả năng nhận thức tình huống của lực lượng đặc nhiệm đối với các mục tiêu mặt nước. Tuy nhiên, nó không thể sống sót trước tiêm kích đối phương, vì vậy đừng để nó hoạt động mà không có hộ tống.
wp_tu-16k=Tu-16K BADGER là máy bay ném bom chiến lược cận âm. Nó trang bị tên lửa chống hạm từ xa AS-6 KINGFISH, có thêm chế độ tấn công mặt đất phụ. Nó cũng có thể mang tên lửa gây nhiễu từ xa AS-2B KIPPER. Đây là nền tảng phóng tên lửa chống hạm phù hợp để đối phó mọi mối đe dọa trên mặt biển, ngoại trừ các cụm tác chiến tàu sân bay (CVBG) của Mỹ.
wp_tu-22m2=Tu-22M2 BACKFIRE là máy bay ném bom chiến lược siêu âm. Nó trang bị tên lửa chống hạm từ xa AS-4 KITCHEN hoặc tên lửa tấn công mặt đất AS-4B. Tốc độ cao và tầm bắn xa của nó mang lại một mức độ khả năng sống sót nhất định, ngay cả khi đối đầu với các cụm tác chiến tàu sân bay của Mỹ.
wp_tu-16p=Là một biến thể của BADGER, TU-16P BADGER-J là máy bay tác chiến điện tử tầm xa. Nhiệm vụ duy nhất của nó là triển khai máy gây nhiễu ECM BUKET, có tầm hoạt động 135 hải lý. Đây là một khí tài quý giá, có thể che chắn tiêm kích của ta khỏi tên lửa không đối không tầm xa của đối phương hoặc gây mù các lực lượng mặt nước của đối phương.
wp_p-42_rldn=Do tình huống chiến tranh cấp bách, mẫu máy bay cảnh báo sớm trên không nguyên mẫu này đã được đưa vào phục vụ giới hạn một cách gấp gáp. Nó có thể phát hiện mục tiêu trên không và trên mặt biển từ xa lên đến 216 hải lý, được hỗ trợ bởi một hệ thống ESM tốt. Đây là yếu tố nhân sức mạnh quan trọng cho lực lượng đặc nhiệm của bạn, vì nó sẽ phát hiện tên lửa bay sát mặt biển và các máy bay tấn công ở độ cao thấp từ rất xa trước khi radar tìm kiếm trên không của tàu chiến phát hiện được.
