[AllowedVessels]
wp_rkr_kirov=Flagship of the Red Banner Northern Fleet, this nuclear-powered guided missile cruiser has been transferred due to war contingencies. It is armed with a battery of 20x SS-N-19 SHIPWRECK anti-ship missiles with 270nm range and advanced swarm guidance. It also has 96x cells of SA-N-6 SAMs and an excellent sonar suite. \n\nThis ship is best used as a squadron flagship, well screened by ASW escorts. 
wp_rkr_slava=Flagship of the Red Banner Pacific Fleet, this guided missile cruiser carries an impressive battery of 16x SS-N-12 SANDBOX anti-ship missiles with 300nm range and swarm guidance. Coupled with TBILISI's own 16x SS-N-19s, you can deliver a combined 32x missile salvo, once, should the need arise. It also carries 64x cells of SA-N-6 SAMs for fleet air defense and a VDS. 
wp_takr_kiev=A V/STOL carrier with a capacity of up to 36x Yak-38 FORGERS, Ka-25 HORMONE and Ka-27 HELIX, this is a vessel designed for area ASW and local air defense. It also carries a battery of 8x SS-N-12 SANDBOX for long-range offensive punch. \n\nNOTE: the SS-N-12 reload capability does not fully function, you may get up to 2x reloads every mission so don't rely on this feature. \n\nNOTE: on difficult, this carrier does not come with its own airgroup. 
wp_cv_orel=The Project 1160 OREL-class is the Soviet Navy's first true fleet carrier, with catapults, arresting gear and a capacity of up to 60 aircraft: MiG-23A FLOGGER fighters, Ko-45 strike and EW aircraft, P-42 ASW and P-42RLDN AEW aircraft, plus Ka-27 HELIX helicopters. She gives the task force real fleet air defense, stand-off strike and an airborne radar picture. She also mounts 16x SS-N-19 SHIPWRECK anti-ship missiles, SA-N-7 and SA-N-4 SAMs and CIWS, but she is the most valuable hull in the fleet and a replacement is extremely expensive, so keep her escorted.
wp_kr_sverdlov=Obselete in the modern missile age, these Light Cruisers are still very capable in the surface bombardment and merchant raiding role. With deep magazines of 6" and decent protection, these ships will outrange and outgun almost any NATO warship it catches. 
wp_bpk_kara=The KARA-Class guided missile cruiser is a well-balanced missile-cruiser with an ASW and AAW focus. It carries 8x SS-N-14 SILEX-B multi-role ASW missiles, enabling stand-off attacks against Mk-48 equipped NATO submarines. It also possesses a decent SAM battery with double-ended SA-N-3 for area air defense and wing-mounted SA-N-4 for point defense. Coupled with a helicopter hanger and VDS, the KARA-Class is a good multi-role surface combatant. 
wp_bpk_kresta2=The KRESTA II-Class guided missile cruiser is an ASW focused modification to the KRESTA I-Class. This class trades 4x SS-N-3 SEPALs for 8x SS-N-14 SILEX-A stand-off ASW missiles and a longer-ranged SA-N-3 battery. It also carries a helicopter hanger for a single Ka-25 variant. 
wp_rkr_kresta1=The KRESTA I-Class guided missile cruiser is based on the KYNDA-Class, trading half its SS-N-3B SEPAL battery for improved sea-keeping, air-defense and range. It also has a helicopter hanger for a single Ka-25 variant. 
wp_rkr_kynda=The KYNDA-Class guided missile cruiser is designed with a heavy ASuW focus. With 8x SS-N-3B SEPAL and an additional 8 reloads, this is a platform designed for stand-off anti-ship work. It however has very limited ASW and AAW capability and thus requires AAW and ASW escorts to function effectively. 
wp_em_sovremenny=The SOVREMENNYY-Class destroyer is a well-balanced destroyer with an ASuW and AA focus. It carries 8x SS-N-22 SUNBURN supersonic sea-skimming missiles that will devastate most surface combatants. The double SA-N-7 provides a high rate of fire, up to 6 individual targets and good low-altitude target discrimination. It also possesses a hanger that can fit any Ka-25 or Ka-27 variant and a very good ESM suite. Finally, it has 2 twin 130mm guns, with high rate of fire and long range, being one of few Soviet warships that can outrange the 5"/54. 
wp_bpk_udaloy=The UDALOY-Class destroyer is designed for a pure ASW focus. With 8x SS-N-14 SILEX-B multirole ASW missiles, it has stand-off capability against the Mk-48 torpedo. It also has a point-defense focused SA-N-9 battery, offering very-short-range defense against low-altitude saturation attacks. With 2 helicopter hangers and an excellent sonar suite, this is the USSR's best ASW ship. 
wp_bpk_kashin=The KASHIN-Class is a series of AAW and ASW focused destroyers, dating back to the 60s. The Pacific Fleet KASHIN-Class never received the Project-61MP upgrade and thus remain without CIWS, VDS, or SS-N-2 batteries. Their weak air-defense capabilities mean they should be used only against low-threat surface and air threats. 
wp_bpk_kanin=The KANIN-Class is a series of AAW focused destroyers, dating back to the 60s. They are equipped with CIWS but remain very weak against low-level air and missile attack. 
wp_skr_krivak1=The KRIVAK I-Class is a series a workhorse unit with short-range air defense and stand-off ASW capability. They are equipped with VDS but lack helicopter hangers, limiting their ASW searches. Their lack of CIWS and poor low-altitude SAM performance means they are best used in concert with larger Soviet cruisers.
wp_skr_krivak2=The KRIVAK II-Class is an improvement on the preceding KRIVAK I-Class. It carries the improved SS-N-14 SILEX-B multi-role ASW missile, providing short-ranged ASuW capability. They are also upgunned, with twin 4" automatic guns, providing decent shore bombardment and gunnery capability. They however share the same weaknesses as the KRIVAK I, with anemic AAW and only short-ranged ASW detection. 

[AllowedHelicopters]
wp_ka-25=The Ka-25PL are decent ASW helicopters, capable of being fitted in all Soviet heli hangers. They have limited payload, forcing either sonobuoy or torpedo loadouts. They however have a decent dipping sonar and surface-search radar. The KA-25PL also comes with bomb and rocket loadouts, enabling limited ASuW work where little or no AA threat exists. \n\nNOTE: Can transport 10 passengers. 
wp_ka-25ts=The Ka-25TS is a purpose-built MPA helicopter, mounting a long-ranged surface-search radar for stand-off targeting of SS-N-3 SEPAL, SS-N-12 SANDBOX and SS-N-19 SHIPWRECK salvos. These helicopters will not survive hostile fighters, so they are best employed at low-altitude with radars off, popping up for target acquisition only. \n\nNOTE: Can transport 10 passengers. 
wp_ka-27=The Ka-27PL is a longer-ranged upgrade to the KA-25PL. It brings significant increases in payload and endurance. Its ASW loadouts are balanced, removing the Hunter/Killer limitations of the KA-25PL. Like its predecessor, it comes with dipping sonar and surface-search radar. The Strike loadout carries heavier payload at much longer range than the Yak-38. \n\nNOTE: Can transport 10 passengers. 
wp_ka-29=The Ka-29 is an attack helicopter variant of the KA-27PL. It carries ATGMs, rockets, bombs and a 30mm autocannon for ground attack work. \n\nNOTE: Can transport 16 passengers. 

[AllowedAircraft]
wp_yak-38=The Yak-38 FORGER is a V/STOL fighter-bomber, suitable for low risk ASuW work and local air defense. Lacking radar and drop tanks, the Yak-38 is limited in range and capability. It is best used for interdicting NATO MPA and unescorted bombers. It is also an economical means of sinking unarmed merchant traffic and poorly armed JMSDF and USN surface ships. Overall, they are intended to protect the task force from stand-off air-launched missiles and to preserve precious anti-ship missiles.\n\nNOTE: Despite in-game description, effective range with ASuW loadouts is around 100nm. 
wp_mig-23a=The MiG-23A FLOGGER is a supersonic fighter-bomber, suitable for local air defense and limited ASuW work. It has a decent air-search radar, poor-resolution IRST and carries medium-range AAMs. For dogfights, the MiG-23A can equip the AA-11 ARCHER, a highly-manoeuvrable short range IR AAM. It also carries limited strike loadouts. This fighter is superior to the F-4s prevalent throughout the campaign, but needs jamming support against F-14s. 
wp_taifun=The Ko-45 is a subsonic carrier-based attack aircraft, the Soviet answer to the A-6 INTRUDER. It carries a heavy stand-off anti-ship and land-attack load with precision and SEAD options, and can also fly as a tanker. It is the strike arm of the OREL-class air wing.
wp_taifun_ew=The Ko-45E is the electronic warfare version of the Ko-45, in the role of the EA-6 PROWLER. Its jammer degrades enemy radars and SAM engagements for the strike package, and it can carry anti-radiation missiles for SEAD. Very few are available, do not risk them needlessly.
wp_p-42=The P-42 is a carrier-based ASW and maritime patrol aircraft comparable to the S-3 VIKING. With sonobuoys and torpedoes it extends the task force's ASW screen far beyond helicopter range and gives the carrier a long-endurance surface-search platform.
wp_mig-25pd=The MiG-25PD FOXBAT is a supersonic interceptor designed for intercepting high-altitude bombers. It is very fast, has decent air-search radar, IRST and medium-range AAMs. Compared to the MiG-23A, it has better air-search radar, longer-ranged AAM and almost double the range; but limited to AA roles. 
wp_su-24m=The Su-24M is a supersonic, low-level bomber. It is the USSR's most capable tactical bomber. For stand-off ASuW work, it can equip either AS-13 KINGBOLT sea-skimming ASMs or AS-11 KILTER stand-off anti-radiation missiles. 
wp_il-38=The Il-38 MAY is a long range MPA comparable to the NATO P-3C. It can deploy the AT-2 ASW torpedo or PLAB-100 depth bombs. It also has an impressive 144x RGB-1 sonobuoys. 
wp_tu-95rt=The Tu-95RT BEAR is a long-range MPA. It has long-range surface-search radar and a good ESM suite. This platform significantly increases your task force's situational awareness against surface contacts. It is, however, not survivable against enemy fighters, so don't leave it unescorted. 
wp_tu-16k=The Tu-16K BADGER is a subsonic strategic bomber. It equips the AS-6 KINGFISH stand-off ASM, which has a secondary land-attack mode. It can also carry the AS-2B KIPPER stand-off jamming missile. This is a ASM platform suitable for all surface threats short of US CVBGs. 
wp_tu-22m2=The Tu-22M2 BACKFIRE is a supersonic strategic bomber. It equips the AS-4 KITCHEN stand-off ASM or the AS-4B land attack missile. Its high speed and stand-off range grant some margin of survivability even against US CVBGs. 
wp_tu-16p=A modification of the BADGER, the TU-16P BADGER-J is a long range EW aircraft. Its only purpose is to deploy the BUKET ECM jammer, which has 135nm range. This is a valuable asset that can screen fighters from long-range enemy AAMs or blind enemy surface forces. 
wp_p-42_rldn=Due to war exigencies, this prototype AEW aircraft has been rushed into limited operational service. It can provide long-range detection of air and surface contacts out to 216 nm, supplemented with a good ESM suite. This is a major force multiplier for your task force, as it will detect sea-skimming missiles and low-level attackers long before your ship-based air-search sets. 