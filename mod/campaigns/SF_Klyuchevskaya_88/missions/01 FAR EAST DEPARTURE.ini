Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=DEPARTURE MESSAGE-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting successful departure from Fokino.\n\n2. (S) Your contact report regarding JMSDF SSK of highest concern to Kremlin. Maintain vigilence and expect situation to change shortly. \n\n3. (S) Note: in accordance with sailing schedule, no repair or rearmament facilities available post mission. \n\n3. (S) Excellent work, Comrade. increase vigilence for upcoming Soya Strait transit. KTOF sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=CONTACT REPORT-UNK SSK\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting unknown SSK at mouth of harbor. \n\n2. (S) Sink unknown SSK immediately. Contact report forwarded to higher command. \n\n3. (S) The capitalist spies cannot be allowed in our territorial waters. Retrieve survivors if possible. KTOF sends.\nButtonText=Continue Playing\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 1 </size>\FAR EAST DEPARTURE\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName} is to RV with TAVKR TBILISI. TBILISI's air wing is already airborne, land it aboard the carrier. Once the air wing is landed, proceed to exit area. \n\nNote: use the rebase tool to let your aircraft land on TBILISI. \nButtonText=Start mission\nPopupStyle=Intro
