Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=MESSAGE DE DÉPART-MISSION ACCOMPLIE\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant le départ réussi de Fokino.\n\n2. (S) Votre rapport de contact concernant un SSK de la JMSDF est de la plus haute préoccupation pour le Kremlin. Restez vigilants, la situation devrait évoluer prochainement. \n\n3. (S) Remarque : conformément au calendrier de navigation, aucune installation de réparation ou de réarmement ne sera disponible après la mission. \n\n3. (S) Excellent travail, camarade. Redoublez de vigilance pour le prochain transit du détroit de Soya. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=RAPPORT DE CONTACT-SSK INCONNU\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant un SSK inconnu à l'entrée du port. \n\n2. (S) Coulez immédiatement ce SSK inconnu. Rapport de contact transmis au commandement supérieur. \n\n3. (S) Les espions capitalistes ne peuvent être tolérés dans nos eaux territoriales. Récupérez les survivants si possible. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 1 </size>\DÉPART D'EXTRÊME-ORIENT\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName} doit faire son RV avec le TAVKR TBILISI. Le groupe aérien du TBILISI est déjà en vol, faites-le atterrir à bord du porte-avions. Une fois le groupe aérien posé, gagnez la zone de sortie. \n\nRemarque : utilisez l'outil de rebasage pour faire atterrir vos aéronefs sur le TBILISI. \nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=Sous-marin inconnu coulé\nBody=Des bruits de rupture de coque sont entendus au sonar. Le sous-marin inconnu est en train de sombrer.\nButtonText=Continuer la partie\nPopupStyle=Notification
Objective_ExitHarbour=Atteindre la zone de sortie
Objective_SinkSub=Couler le sous-marin inconnu
