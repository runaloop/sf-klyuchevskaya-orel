Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=出港報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) フォキノからの出港成功を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 貴官の報告した海上自衛隊の通常型潜水艦（SSK）に関する接触情報は、クレムリンにとって最重要関心事項である。警戒を継続し、事態が近く変化することを予期せよ。\n\n3. (S) 注：航海予定表に従い、任務終了後の修理・補給施設は利用できない。\n\n3. (S) 見事な働きだ、同志。来たる宗谷海峡通過に向け、警戒を強化せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=接触報告――未確認SSK\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 港口における未確認の通常型潜水艦（SSK）を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 未確認SSKを直ちに撃沈せよ。接触報告は上級司令部へ転送済みである。\n\n3. (S) 資本主義者のスパイをわが領海内に許してはならない。可能であれば生存者を収容せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第1部 </size>\極東出撃\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName}はTAVKRトビリシと会合せよ。トビリシの航空団は既に発艦済みであり、これを空母上に着艦させよ。航空団の着艦が完了したら、脱出エリアへ進出せよ。\n\n注：機体をトビリシに着艦させるにはリベース・ツールを使用せよ。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=未確認潜水艦を撃沈\nBody=ソナーに船体破壊音を確認。未確認潜水艦は沈没中である。\nButtonText=作戦続行\nPopupStyle=Notification
Objective_ExitHarbour=脱出エリアへの到達
Objective_SinkSub=未確認潜水艦の撃沈
