Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=ĐIỆN XUẤT PHÁT-HOÀN THÀNH NHIỆM VỤ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc xuất phát thành công từ Fokino.\n\n2. (S) Báo cáo tiếp xúc của các đồng chí về tàu ngầm diesel-điện của JMSDF là mối quan tâm hàng đầu của Kremlin. Duy trì cảnh giác và dự kiến tình hình sẽ thay đổi trong thời gian ngắn tới. \n\n3. (S) Ghi chú: theo đúng lịch trình hành quân, không có cơ sở sửa chữa hay tái vũ trang sau nhiệm vụ này. \n\n3. (S) Làm tốt lắm, đồng chí. Tăng cường cảnh giác cho lượt vượt eo biển Soya sắp tới. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=BÁO CÁO TIẾP XÚC-TÀU NGẦM DIESEL LẠ\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về tàu ngầm diesel-điện lạ ở cửa cảng. \n\n2. (S) Đánh chìm tàu ngầm lạ ngay lập tức. Báo cáo tiếp xúc đã được chuyển lên cấp trên. \n\n3. (S) Không thể để gián điệp tư bản xâm nhập hải phận của chúng ta. Cứu sống sót nếu có thể. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 1 </size>\XUẤT PHÁT TỪ VIỄN ĐÔNG\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName} phải gặp gỡ với TAVKR TBILISI. Không đoàn của TBILISI đã cất cánh sẵn, hãy cho hạ cánh trở lại tàu sân bay. Sau khi không đoàn đã hạ cánh xong, tiến đến khu vực thoát ly. \n\nGhi chú: dùng công cụ chuyển căn cứ để cho máy bay của bạn hạ cánh trên TBILISI. \nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=Tàu ngầm lạ đã bị đánh chìm\nBody=Nghe thấy tiếng vỏ tàu vỡ trên sonar. Tàu ngầm lạ đang chìm.\nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Objective_ExitHarbour=Đến khu vực thoát ly
Objective_SinkSub=Đánh chìm tàu ngầm lạ
