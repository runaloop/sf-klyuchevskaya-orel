Taskforce2ExitareaMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=离场消息——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于成功驶离富基诺的电文报告。\n\n2. (S) 你部关于日本海上自卫队常规潜艇的接触报告已引起克里姆林高度关注。请保持警戒，预计局势将很快发生变化。\n\n3. (S) 注意：依照航行计划，任务结束后没有维修或补给设施可用。\n\n3. (S) 干得好，同志。请为即将到来的宗谷海峡穿越提高警戒。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=接触报告——不明常规潜艇\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于港口出口处发现不明常规潜艇的电文报告。\n\n2. (S) 立即击沉该不明潜艇。接触报告已上报上级指挥部。\n\n3. (S) 绝不能让资本主义间谍进入我国领海。如有可能请救援幸存者。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 1 </size>\远东启航\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName}将与TAVKR 第比利斯会合。第比利斯的航空联队已经起飞，请将其降落到航母上。航空联队降落完毕后，前往离场区域。\n\n注意：使用重新部署工具让你的飞机降落到第比利斯上。\nButtonText=开始任务\nPopupStyle=Intro
