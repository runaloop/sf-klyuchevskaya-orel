Taskforce2ExitareaMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=СООБЩЕНИЕ ОБ ОТБЫТИИ — ЗАДАНИЕ ВЫПОЛНЕНО\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об успешном выходе из Фокино.\n\n2. (С) Ваш доклад об обнаружении дизель-электрической подлодки Морских сил самообороны Японии вызывает наибольшую озабоченность в Кремле. Сохраняйте бдительность, обстановка может измениться в ближайшее время. \n\n3. (С) Примечание: согласно графику похода, после выполнения задания пункты ремонта и пополнения боезапаса недоступны. \n\n3. (С) Отличная работа, товарищ. Повысьте бдительность перед предстоящим проходом пролива Лаперуза. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ДОКЛАД ОБ ОБНАРУЖЕНИИ — НЕИЗВЕСТНАЯ ПЛ\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об обнаружении неизвестной дизель-электрической подлодки на входе в гавань. \n\n2. (С) Немедленно уничтожить неизвестную подлодку. Доклад об обнаружении передан вышестоящему командованию. \n\n3. (С) Капиталистическим шпионам не место в наших территориальных водах. При возможности поднять выживших. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 1 </size>\ДАЛЬНЕВОСТОЧНЫЙ ПОХОД\n<size=24>08 0000Z ФЕВ 88</size>\\nBody=КУГ «Ключевская» должно встретиться (RV) с ТАВКР ТБИЛИСИ. Авиакрыло ТБИЛИСИ уже в воздухе — примите его на борт авианосца. После посадки авиакрыла следуйте в район выхода. \n\nПримечание: используйте инструмент перебазирования, чтобы посадить свои самолёты на ТБИЛИСИ. \nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=Неизвестная подлодка потоплена\nBody=Гидроакустики слышат звуки разрушения корпуса. Неизвестная подлодка тонет.\nButtonText=Продолжить\nPopupStyle=Notification
Objective_ExitHarbour=Достичь района выхода
Objective_SinkSub=Уничтожить неизвестную подлодку
