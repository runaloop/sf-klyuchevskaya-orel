Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=MENSAJE DE PARTIDA-MISIÓN CUMPLIDA\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la partida exitosa desde Fokino.\n\n2. (S) Su informe de contacto sobre el SSK de la JMSDF es de máxima preocupación para el Kremlin. Mantenga la vigilancia y espere que la situación cambie en breve. \n\n3. (S) Nota: de acuerdo con el calendario de navegación, no habrá instalaciones de reparación ni rearme disponibles después de la misión. \n\n3. (S) Excelente trabajo, camarada. Aumente la vigilancia para el próximo tránsito del Estrecho de Soya. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=INFORME DE CONTACTO-SSK DESCONOCIDO\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de un SSK desconocido en la boca del puerto. \n\n2. (S) Hunda el SSK desconocido de inmediato. Informe de contacto remitido al mando superior. \n\n3. (S) No se puede permitir a los espías capitalistas en nuestras aguas territoriales. Recupere a los supervivientes si es posible. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 1 </size>\PARTIDA DEL LEJANO ORIENTE\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName} debe reunirse con el TAVKR TBILISI. El ala aérea del TBILISI ya está en el aire, hágala aterrizar a bordo del portaaviones. Una vez que el ala aérea haya aterrizado, diríjase al área de salida. \n\nNota: use la herramienta de reasignación para que sus aeronaves aterricen en el TBILISI. \nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=Submarino desconocido hundido\nBody=Se oyen ruidos de rotura de casco en el sonar. El submarino desconocido se está hundiendo.\nButtonText=Seguir jugando\nPopupStyle=Notification
