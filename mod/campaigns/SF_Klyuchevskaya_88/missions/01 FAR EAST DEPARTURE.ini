Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=출항 보고-임무 완료\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 포키노에서의 성공적인 출항을 알리는 귀 부대의 통신을 수신했음을 확인한다.\n\n2. (S) 귀 부대가 보고한 일본 해상자위대 잠수함 접촉 보고는 크렘린의 최대 관심사이다. 경계를 유지하고 조만간 상황이 변화할 것을 예상하라. \n\n3. (S) 참고: 항해 일정에 따라 임무 종료 후 수리 및 재무장 시설은 이용할 수 없다. \n\n3. (S) 훌륭한 성과다, 동무. 다가오는 소야 해협 통과에 대비해 경계를 강화하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=접촉 보고-미확인 잠수함\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 항구 입구에서 미확인 잠수함을 발견했다는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 즉시 미확인 잠수함을 격침하라. 접촉 보고는 상급 지휘부로 전달되었다. \n\n3. (S) 제국주의 스파이를 우리 영해에 들여놓을 수 없다. 가능하다면 생존자를 구조하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제1부 </size>\극동 출항\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName}는 TAVKR 트빌리시와 집결해야 한다. 트빌리시의 항공단은 이미 발진해 있으니 항공모함에 착함시켜라. 항공단 착함이 끝나면 탈출 구역으로 향하라. \n\n참고: 리베이스 도구를 사용해 항공기를 트빌리시에 착함시킬 수 있다. \nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=미확인 잠수함 격침\nBody=소나에서 선체 파괴음이 들린다. 미확인 잠수함이 침몰하고 있다.\nButtonText=계속 진행\nPopupStyle=Notification
