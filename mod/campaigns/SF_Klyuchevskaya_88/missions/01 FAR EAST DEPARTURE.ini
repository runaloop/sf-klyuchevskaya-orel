Taskforce2ExitareaMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=AUSLAUFMELDUNG - AUFTRAG ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über das erfolgreiche Auslaufen aus Fokino.\n\n2. (S) Ihre Kontaktmeldung über ein U-Boot der JMSDF ist für den Kreml von höchster Bedeutung. Wachsamkeit bewahren, Lageänderung in Kürze erwartet. \n\n3. (S) Hinweis: Gemäß Fahrplan stehen nach dieser Mission keine Reparatur- oder Bewaffnungseinrichtungen zur Verfügung. \n\n3. (S) Ausgezeichnete Arbeit, Genosse. Erhöhen Sie die Wachsamkeit für den bevorstehenden Durchgang durch die Soya-Straße. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SubfoundMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=KONTAKTMELDUNG - UNBEK. U-BOOT\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über ein unbekanntes U-Boot am Hafeneingang. \n\n2. (S) Unbekanntes U-Boot sofort versenken. Kontaktmeldung an höheres Kommando weitergeleitet. \n\n3. (S) Die kapitalistischen Spione dürfen nicht in unseren Hoheitsgewässern geduldet werden. Überlebende bergen, falls möglich. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 1 </size>\AUFBRUCH IN DEN FERNEN OSTEN\n<size=24>08 0000Z FEB 88</size>\\nBody={TaskForceName} soll sich mit TAVKR TBILISI treffen. Die Trägergruppe der TBILISI ist bereits in der Luft, landen Sie sie an Bord des Trägers. Sobald die Trägergruppe gelandet ist, begeben Sie sich zum Ausfahrtgebiet. \n\nHinweis: Nutzen Sie das Umbasierungswerkzeug, um Ihre Flugzeuge auf der TBILISI landen zu lassen. \nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2SubsunkMessage=Title=Unbekanntes U-Boot versenkt\nBody=Rumpfbruchgeräusche im Sonar zu hören. Das unbekannte U-Boot sinkt.\nButtonText=Weiterspielen\nPopupStyle=Notification
Objective_ExitHarbour=Ausfahrtgebiet erreichen
Objective_SinkSub=Unbekanntes U-Boot versenken
