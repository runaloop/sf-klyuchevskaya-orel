Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제2부 </size>\소야 해협 통과\n<size=24>08 2330Z FEB 88</size>\\nBody={TaskForceName}는 소야 해협을 통과해야 한다. "클류쳅스카야 산 등반" 통신이 곧 수신될 예정이며, 이는 일본 및 미국 전력에 대한 교전 개시를 의미한다. \n\n참고: 촉박한 작전 일정으로 인해 임무 종료 후 수리 및 재무장 시설은 이용할 수 없을 것이다. 탄약을 신중히 사용하라.\nButtonText=임무 시작\nPopupStyle=Intro
Objective_FlagshipSurvive={FlagshipName}는 생존해야 한다
