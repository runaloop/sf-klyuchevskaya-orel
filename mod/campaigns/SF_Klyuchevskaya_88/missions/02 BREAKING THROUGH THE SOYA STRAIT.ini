Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=通過報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 宗谷海峡通過成功を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 注：作戦日程が厳しいため、任務終了後の修理・補給施設は利用できない。\n\n3. (S) 見事な働きだ、同志。千島列島通過に備え、待機を継続せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
