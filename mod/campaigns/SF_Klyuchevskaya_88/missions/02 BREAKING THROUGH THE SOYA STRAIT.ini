Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=BÁO CÁO VƯỢT EO-HOÀN THÀNH NHIỆM VỤ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc vượt eo biển Soya thành công.\n\n2. (S) Ghi chú: do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang sau nhiệm vụ này. \n\n3. (S) Làm tốt lắm, đồng chí. Duy trì trạng thái sẵn sàng để vượt Quần đảo Kuril. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
