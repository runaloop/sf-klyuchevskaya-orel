Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第2部 </size>\宗谷海峡通過中\n<size=24>08 2330Z FEB 88</size>\\nBody={TaskForceName}は宗谷海峡を通過しなければならない。まもなく「クリュチェフスカヤ山に登れ」の命令が下され、日米両国部隊への交戦が開始される見込みである。\n\n注：作戦日程が厳しいため、任務終了後の修理・補給施設の利用は見込めない。弾薬は賢く使用せよ。\nButtonText=任務開始\nPopupStyle=Intro
