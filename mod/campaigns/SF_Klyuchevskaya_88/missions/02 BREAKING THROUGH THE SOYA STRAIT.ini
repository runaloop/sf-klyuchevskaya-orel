Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 2 </size>\VƯỢT EO BIỂN SOYA\n<size=24>08 2330Z FEB 88</size>\\nBody={TaskForceName} phải vượt qua eo biển Soya. Điện "Trèo núi Klyuchevskaya" dự kiến sẽ đến trong thời gian ngắn tới, mở đầu chiến sự với lực lượng Nhật Bản và Mỹ. \n\nGhi chú: do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang được dự kiến sau nhiệm vụ này. Hãy sử dụng đạn dược một cách khôn ngoan.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
