Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 7 </size>\KẺ SĂN MỒI ĐỈNH CAO\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName} đã hoàn tất hoạt động tiếp tế. Hộ tống lực lượng tiếp tế đến eo biển Tsugaru và nhiệm vụ của các đồng chí sẽ hoàn thành. \n\nGhi chú: lực lượng tiếp tế đang di chuyển đến Fokino để tái trang bị. Tiếp tế và sửa chữa sẽ không khả dụng sau nhiệm vụ.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=BÁO CÁO TIẾP XÚC-TÀU NGẦM BỊ ĐÁNH CHÌM\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt tàu ngầm đối phương. \n\n2. (S) Một lực lượng đặc nhiệm khác sẽ hộ tống lực lượng tiếp tế đến Fokino. \n\n3. (S) Di chuyển về phía nam đến OPBOX Bogotyr để nhận nhiệm vụ mới. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=BÁO CÁO THIỆT HẠI - MẤT TÀU CHỞ DẦU\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc mất phương tiện tiếp tế của quân bạn. \n\n2. (S) Việc mất các tàu chở dầu (AOR) này làm giảm đáng kể khả năng tiếp tế trên biển ở khu vực Thái Bình Dương. \n\n3. (S) Đánh chìm toàn bộ tàu ngầm còn lại và rút khỏi khu vực.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=CẢNH BÁO TÀU NGẦM\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) TÌNH HÌNH: SIGINT cho thấy lưu lượng liên lạc tàu ngầm-vệ tinh băng tần ULF của Mỹ gần vị trí của các đồng chí. Không có phương tiện tàu ngầm của quân bạn trong khu vực tác chiến của các đồng chí. \n\n2. (TS) ĐÁNH GIÁ: Khả năng cao các tàu ngầm hạt nhân tấn công (SSN) của USN đang chuẩn bị mai phục lực lượng của các đồng chí. Các vị trí khả nghi của đối phương sẽ được truyền đến các đồng chí sau khi được tam giác định vị. \n\n3. (TS) NHẬN XÉT: Cũng có khả năng có tàu ngầm diesel-điện (SSK) của JMSDF trong khu vực. Khuyến nghị các đồng chí kích hoạt radar tìm kiếm trên không vì tên lửa harpoon phóng từ tàu ngầm sẽ tạm thời nhô lên độ cao 2000 ft khi phóng. \n\nFLASH FLASH FLASH\nButtonText=Xác nhận và tiếp tục\nPopupStyle=NavalMessage
Taskforce2Timer1forSSNspotMessage=Title=Vị trí SSN khả nghi 1\nBody=DATUM A01 đã được xác định. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
