Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 7 </size>\RAUBTIERE AN DER SPITZE\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName} hat die Versorgungsoperationen abgeschlossen. Eskortieren Sie den Nachschubverband zur Tsugaru-Straße, dann ist Ihr Auftrag erfüllt. \n\nHinweis: Nachschubverband übersetzt nach Fokino zum Auffüllen. Nachschub und Reparatur stehen nach der Mission nicht zur Verfügung.\nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=KONTAKTMELDUNG - U-BOOT VERSENKT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung feindlicher U-Boote. \n\n2. (S) Eine andere Task Force wird den Nachschubverband nach Fokino eskortieren. \n\n3. (S) Südwärts übersetzen zum OPGEBIET BOGATYR für neue Aufträge. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=SCHADENSMELDUNG - VERSORGER VERLOREN\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Zerstörung befreundeter Versorgungseinheiten. \n\n2. (S) Der Verlust dieser Versorger verringert die Fähigkeit zur Versorgung auf See im Pazifiktheater erheblich. \n\n3. (S) Alle verbleibenden U-Boote versenken und sich aus dem Gebiet zurückziehen.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=U-BOOT-WARNUNG\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (TS) LAGE: SIGINT zeigt amerikanischen ULF-U-Boot-Satellitenfunkverkehr in Ihrer Nähe. Keine befreundeten U-Boote in Ihrem Einsatzgebiet. \n\n2. (TS) EINSCHÄTZUNG: Hohe Wahrscheinlichkeit, dass USN-Atom-U-Boote einen Hinterhalt gegen Ihre Kräfte vorbereiten. Mögliche feindliche Positionen werden Ihnen nach Triangulation übermittelt. \n\n3. (TS) ANMERKUNGEN: JMSDF-U-Boote ebenfalls im Gebiet möglich. Empfehlung: Luftsuchradar aktivieren, da U-Boot-gestartete Harpoons beim Abschuss kurzzeitig auf 2000 ft aufsteigen. \n\nBLITZ BLITZ BLITZ\nButtonText=Bestätigen und weiterspielen\nPopupStyle=NavalMessage
