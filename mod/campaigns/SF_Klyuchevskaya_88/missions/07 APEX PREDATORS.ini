Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 7 </size>\顶级掠食者\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName}已完成补给作业。护送补给部队前往津轻海峡，任务即完成。\n\n注意：补给部队正转移至富基诺补充物资。任务结束后无法进行补给或维修。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=接触报告——潜艇已被击沉\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于摧毁敌方潜艇的电文报告。\n\n2. (S) 另一支特遣舰队将护送补给部队前往富基诺。\n\n3. (S) 向南转移至勇士战区接受新任务。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=损失报告——补给舰损失\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于友军补给舰被摧毁的电文报告。\n\n2. (S) 这些补给舰的损失将大幅削弱太平洋战区的海上补给能力。\n\n3. (S) 击沉所有剩余潜艇并撤离该区域。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=潜艇警告\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (TS) 情况：信号情报显示，你部附近有美国甚低频潜艇对卫星通信。你部作战区域内没有友军潜艇。\n\n2. (TS) 判断：美国海军核动力攻击潜艇极有可能正准备伏击你部。一旦完成三角定位，可能的敌方位置将传送给你部。\n\n3. (TS) 备注：该区域也可能有日本海上自卫队常规潜艇活动。建议启用空中搜索雷达，因为潜射鱼叉导弹发射后会短暂爬升至2000英尺。\n\n特急 特急 特急\nButtonText=确认并继续\nPopupStyle=NavalMessage
