Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=CONTACT REPORT-SUBSUNK\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of enemy submarines. \n\n2. (S) Another task force will escort replenishment force to Fokino. \n\n3. (S) Transit South to OPBOX Bogotyr for new tasking. KTOF sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=CASREP - AOR LOST\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic regarding destruction of friendly replenishment assets. \n\n2. (S) Destruction of these AOR's significantly reduces underway replenishment ability in Pacific Theater. \n\n3. (S) Sink all remaining submarines and withdraw from area.\nButtonText=Continue Playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=SUB WARNING\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION: SIGINT indicate American ULF sub-to-satellite traffic near your position. No friendly submarine assets in your AO. \n\n2. (TS) ASSESSMENT: High probability USN SSNs preparing ambush against your force. Possible enemy locations will be downlinked to you once triangulated. \n\n3. (TS) COMMENTS: JMSDF SSKs also possible in area. Recommend you activate an air-search set as sub-launched harpoons will momentarily pop-up to 2000 ft on launch. \n\nFLASH FLASH FLASH\nButtonText=Acknowledge and continue\nPopupStyle=NavalMessage
