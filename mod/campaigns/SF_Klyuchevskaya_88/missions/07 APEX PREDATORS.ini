Taskforce2FlagshiplostMessage=Title=敗北！\nBody={FlagshipName}が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第7部 </size>\頂点捕食者\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName}は補給作業を完了した。補給部隊を津軽海峡まで護衛すれば任務は完了する。\n\n注：補給部隊は再補給のためフォキノへ移動する。任務終了後の補給・修理は利用できない。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=接触報告――潜水艦撃沈\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 敵潜水艦の撃沈を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 補給部隊をフォキノまで護衛する任務は別の任務部隊が担当する。\n\n3. (S) 新たな任務のため、作戦区域「ボガトィール」へ南進せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=被害報告――AOR損失\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 友軍補給資産の撃沈に関する貴官の通信を受信したことを確認する。\n\n2. (S) これらのAORの損失により、太平洋戦域における洋上補給能力は著しく低下する。\n\n3. (S) 残存するすべての潜水艦を撃沈し、当該海域より撤退せよ。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=潜水艦警報\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (TS) 状況：信号情報（SIGINT）により、貴部隊付近において米軍のULF帯潜水艦・衛星間通信が確認された。当該作戦海域に友軍潜水艦資産はない。\n\n2. (TS) 評価：米海軍のSSNが貴部隊への待ち伏せを準備している可能性が高い。三角測量により敵の推定位置が判明した時点で、貴官へダウンリンクされる。\n\n3. (TS) 所見：海上自衛隊のSSKも当該海域に存在する可能性がある。潜水艦発射のハープーンは発射直後に一時的に高度2000フィートまでポップアップするため、対空捜索用レーダーの起動を推奨する。\n\n最優先 最優先 最優先\nButtonText=了解し続行\nPopupStyle=NavalMessage
