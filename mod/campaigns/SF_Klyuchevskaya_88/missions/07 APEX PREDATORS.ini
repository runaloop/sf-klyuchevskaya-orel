Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 7 </size>\PRÉDATEURS SUPRÊMES\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName} a achevé ses opérations de ravitaillement. Escortez la force de ravitaillement jusqu'au détroit de Tsugaru et votre mission sera terminée. \n\nRemarque : la force de ravitaillement transite vers Fokino pour se réapprovisionner. Le ravitaillement et les réparations ne seront pas disponibles après la mission.\nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=RAPPORT DE CONTACT-SOUS-MARIN COULÉ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction de sous-marins ennemis. \n\n2. (S) Une autre force opérationnelle escortera la force de ravitaillement jusqu'à Fokino. \n\n3. (S) Transitez vers le sud jusqu'à OPBOX Bogotyr pour de nouvelles instructions. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=CASREP - PÉTROLIER PERDU\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message concernant la destruction de moyens de ravitaillement amis. \n\n2. (S) La destruction de ces pétroliers ravitailleurs réduit considérablement la capacité de ravitaillement à la mer dans le théâtre Pacifique. \n\n3. (S) Coulez tous les sous-marins restants et retirez-vous de la zone.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=ALERTE SOUS-MARINE\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION : le SIGINT indique un trafic sous-marin-satellite américain en ULF près de votre position. Aucun moyen sous-marin ami dans votre zone d'opérations. \n\n2. (TS) ÉVALUATION : forte probabilité que des SSN de l'US Navy préparent une embuscade contre votre force. Les positions ennemies possibles vous seront transmises une fois triangulées. \n\n3. (TS) COMMENTAIRES : des SSK de la JMSDF sont également possibles dans la zone. Il est recommandé d'activer un radar de veille aérienne, car les harpons lancés par sous-marin remontent brièvement à 2000 pieds au lancement. \n\nFLASH FLASH FLASH\nButtonText=Confirmer et continuer\nPopupStyle=NavalMessage
