Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody={FlagshipName} потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 7 </size>\ХИЩНИКИ ВЫСШЕГО ПОРЯДКА\n<size=24>26 0200Z ФЕВ 88</size>\\nBody=КУГ «Ключевская» завершило операцию пополнения запасов. Сопроводите группу снабжения к Сангарскому проливу — и задание выполнено. \n\nПримечание: группа снабжения переходит в Фокино для пополнения. После выполнения задания пополнение и ремонт будут недоступны.\nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ДОКЛАД ОБ ОБНАРУЖЕНИИ — ПЛ ПОТОПЛЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении вражеских подводных лодок. \n\n2. (С) Другое оперативное соединение возьмёт на себя сопровождение группы снабжения до Фокино. \n\n3. (С) Перейти на юг в район ОПБОКС БОГАТЫРЬ для новой задачи. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ДОНЕСЕНИЕ ОБ АВАРИИ — ТАНКЕР ПОТЕРЯН\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении дружественных средств снабжения. \n\n2. (С) Потеря этих танкеров значительно снижает возможности пополнения запасов в море на театре Тихого океана. \n\n3. (С) Уничтожить все оставшиеся подводные лодки и покинуть район.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ПРЕДУПРЕЖДЕНИЕ О ПОДЛОДКАХ\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (СС) ОБСТАНОВКА: РТР отмечает радиообмен американских ПЛ со спутником в диапазоне СНЧ рядом с вашей позицией. Дружественных подводных сил в вашем районе действий нет. \n\n2. (СС) ОЦЕНКА: Высокая вероятность подготовки атомными подлодками ВМС США засады на ваши силы. Возможные позиции противника будут переданы вам после уточнения. \n\n3. (СС) КОММЕНТАРИИ: Также возможны в районе дизель-электрические подлодки МССЯ. Рекомендуем включить станцию воздушного поиска, так как противокорабельные ракеты подлодок при пуске кратковременно поднимаются до высоты 2000 футов. \n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Принять к сведению и продолжить\nPopupStyle=NavalMessage
