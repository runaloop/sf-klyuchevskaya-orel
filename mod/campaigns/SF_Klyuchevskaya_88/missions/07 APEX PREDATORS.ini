Taskforce2FlagshiplostMessage=Title=패배!\nBody={FlagshipName}가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제7부 </size>\정점의 포식자들\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName}는 재보급 작전을 완료했다. 재보급부대를 쓰가루 해협까지 호위하면 임무가 완료된다. \n\n참고: 재보급부대는 재적재를 위해 포키노로 이동한다. 임무 종료 후 보급 및 수리는 이용할 수 없다.\nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=접촉 보고-잠수함 격침\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 적 잠수함 격침을 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 다른 기동부대가 재보급부대를 포키노까지 호위할 것이다. \n\n3. (S) 새로운 임무를 위해 남쪽 OPBOX 보가티르로 이동하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=피해보고 - 급유함 손실\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 우군 재보급 자산 파괴에 관한 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 이 급유함들의 손실은 태평양 전구에서의 항행 중 재보급 능력을 크게 저하시킨다. \n\n3. (S) 남은 잠수함을 모두 격침하고 해당 구역에서 철수하라.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=잠수함 경고\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (TS) 상황: SIGINT에 따르면 귀 부대 위치 근처에서 미국의 극저주파 잠수함-위성 통신이 감지되었다. 해당 작전구역에 우군 잠수함 전력은 없다. \n\n2. (TS) 평가: 미 해군 원자력 공격잠수함이 귀 부대에 대한 매복을 준비하고 있을 가능성이 높다. 삼각측량이 완료되면 예상 적 위치를 전송할 것이다. \n\n3. (TS) 논평: 일본 해상자위대 잠수함도 해당 구역에 있을 가능성이 있다. 잠수함 발사 하푼은 발사 시 순간적으로 2000피트까지 상승하므로 대공 탐지 장비를 가동할 것을 권고한다. \n\n긴급 긴급 긴급\nButtonText=확인 및 계속\nPopupStyle=NavalMessage
Taskforce2Timer1forSSNspotMessage=Title=원자력 공격잠수함 예상 위치 1\nBody=DATUM A01이 표시되었다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2Timer2forSSNspotMessage=Title=원자력 공격잠수함 예상 위치 1\nBody=DATUM A02가 표시되었다. \nButtonText=임무 계속\nPopupStyle=Notification
