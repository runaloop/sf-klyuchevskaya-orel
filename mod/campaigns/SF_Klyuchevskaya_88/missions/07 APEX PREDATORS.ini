Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 7 </size>\DEPREDADORES SUPREMOS\n<size=24>26 0200Z FEB 88</size>\\nBody={TaskForceName} ha completado las operaciones de reabastecimiento. Escolte a la fuerza de reabastecimiento hasta el Estrecho de Tsugaru y su misión estará completa. \n\nNota: la fuerza de reabastecimiento transita hacia Fokino para reabastecerse. El reabastecimiento y la reparación no estarán disponibles después de la misión.\nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2DeadSSNMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=INFORME DE CONTACTO-SUBMARINO HUNDIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción de submarinos enemigos. \n\n2. (S) Otra fuerza operativa escoltará a la fuerza de reabastecimiento hasta Fokino. \n\n3. (S) Transite al sur hacia la ZONA DE OPERACIONES BOGATYR para una nueva asignación. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AOR2lostMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=INFORME DE BAJAS - BUQUE DE REABASTECIMIENTO PERDIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes sobre la destrucción de activos de reabastecimiento amigos. \n\n2. (S) La destrucción de estos buques de reabastecimiento reduce significativamente la capacidad de reabastecimiento en ruta en el Teatro del Pacífico. \n\n3. (S) Hunda todos los submarinos restantes y retírese de la zona.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AORdetectedMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=ALERTA SUBMARINA\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUACIÓN: la SIGINT indica tráfico estadounidense de submarino a satélite en banda ULF cerca de su posición. No hay activos submarinos amigos en su zona de operaciones. \n\n2. (TS) EVALUACIÓN: es muy probable que los SSN de la USN estén preparando una emboscada contra su fuerza. Las posibles ubicaciones enemigas le serán transmitidas una vez triangulados. \n\n3. (TS) COMENTARIOS: también es posible la presencia de SSK de la JMSDF en la zona. Se recomienda activar un radar de búsqueda aérea, ya que los harpoon lanzados desde submarinos ascenderán momentáneamente a 2000 pies al ser lanzados. \n\nFLASH FLASH FLASH\nButtonText=Confirmar y continuar\nPopupStyle=NavalMessage
