Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 5 </size>\ВНЕЗАПНЫЙ УДАР\n<size=24>21 1900Z ФЕВ 88</size>\\nBody=КУГ «Ключевская» получило задачу нейтрализовать авиабазу Мисава. \n\nОжидается некоторое противодействие вражеской авиации.\n\nПримечание: из-за плотного графика операции после выполнения задания пункты ремонта и пополнения боезапаса не ожидаются. Расходуйте боеприпасы разумно.\nButtonText=Начать миссию\nPopupStyle=Intro
