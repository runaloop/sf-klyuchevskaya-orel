Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第5部 </size>\電撃奇襲\n<size=24>21 1900Z FEB 88</size>\\nBody={TaskForceName}は三沢基地の無力化を命じられた。\n\n若干の敵航空戦力による抵抗を予期せよ。\n\n注：作戦日程が厳しいため、任務終了後の修理・補給施設の利用は見込めない。弾薬は賢く使用せよ。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2MisawaDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=任務完了――三沢無力化\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 三沢基地への襲撃成功を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 本基地の破壊により、上陸作戦に対する敵の航空戦力は著しく減少する。\n\n3. (S) 函館の上陸部隊と会合するため、北方へ移動せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SAGsunkMessage=Title=米海軍水上戦闘群撃滅\nBody=米海軍水上戦闘群は殲滅された。我が上陸作戦への主要な脅威を一つ排除した。\nButtonText=作戦続行\nPopupStyle=Notification
