Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 5 </size>\ĐÒN ĐÁNH BẤT NGỜ\n<size=24>21 1900Z FEB 88</size>\\nBody={TaskForceName} được giao nhiệm vụ tiêu diệt Căn cứ Không quân Misawa. \n\nDự kiến có một số sự chống đối từ không quân đối phương.\n\nGhi chú: do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang được dự kiến sau nhiệm vụ này. Hãy sử dụng đạn dược một cách khôn ngoan.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2MisawaDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=HOÀN THÀNH NHIỆM VỤ-MISAWA BỊ TIÊU DIỆT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tập kích thành công Căn cứ Không quân Misawa. \n\n2. (S) Việc tiêu diệt căn cứ không quân này sẽ làm giảm đáng kể sự hiện diện của không quân đối phương phục vụ chiến dịch đổ bộ. \n\n3. (S) Di chuyển về phía bắc để gặp gỡ lực lượng đổ bộ tại Hakodate. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SAGsunkMessage=Title=Biên đội tác chiến mặt nước USN bị tiêu diệt\nBody=Biên đội tác chiến mặt nước USN đã bị tiêu diệt hoàn toàn. Các đồng chí đã loại bỏ một mối đe dọa lớn đối với chiến dịch đổ bộ của chúng ta. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
