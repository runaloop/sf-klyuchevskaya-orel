Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 9a </size>\THE ROZHESTVENSKY GAMBIT\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName} must escort SF Narod past an enemy blocking force. \n\nNote: Your task force will resupply in Sasebo post-mission. Certain ships from SF Narod will join your force once the mission is complete. \nButtonText=Start mission\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=MISSION ACCOMPLISHED-KIROV SAFE\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting arrival of Kirov to friendly air cover. \n\n2. (S) Survival of SF Narod significantly increases friendly ASuW and AA capability in AO. \n\n3. (S) Continue transit to Yokosuka for rest and refit. KTOF sends.\nButtonText=Continue Playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=DEFEAT\nBody=KIROV has been sunk!\nButtonText=Return to mission\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=Naha air base destroyed\nBody=Japanese airpower in Okinawa has been neutralised. This will make capturing the island much easier. \nButtonText=Continue mission\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=RAID WARNING\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION: SIGINT detected USAF VHF-band air command traffic over Iwo Jima. Intercepted segments indicate Iwo-Jima based F-15 fighters RV'd with a bomber force. \n\n2. (TS) ASSESSMENT: Raid assessed to include 4+ B-52, escorted by 2+ F-15. Raid estimated to enter HARPOON-D range in 1.5 hours. \n\n3. (TS) COMMENT: F-15 has sufficient range to escort B-52s to HARPOON launch points. Recommend scramble of land-based aircraft from Nyutabaru immediately.\n\nFLASH FLASH FLASH\nButtonText=Continue Playing\nPopupStyle=NavalMessage
Objective_FlagshipSurvive={FlagshipName} must survive
