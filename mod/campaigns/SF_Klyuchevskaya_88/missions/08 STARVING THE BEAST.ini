Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 8 </size>\MATANDO DE HAMBRE A LA BESTIA\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName} se ha acercado encubiertamente a la fuerza de reabastecimiento del NIMITZ. No sea detectado y destruya los auxiliares de la flota. \n\nNota: como estamos operando lejos de casa, el reabastecimiento y la reparación no estarán disponibles después de la misión.\nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=Mensaje del K-175\nBody=Almirante, tubos de misiles y sala de torpedos completamente cargados. Es un placer oírle, ¡hace dos semanas que no encontrábamos nada que valiera la pena hundir!\nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=ALERTA DE ATAQUE\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) SITUACIÓN: se ha interceptado un mensaje de socorro en texto plano de la fuerza de reabastecimiento del NIMITZ. \n\n2. (S) EVALUACIÓN: es probable que el CVBG del NIMITZ esté lanzando un ataque aéreo contra {TaskForceName}. Se espera que la incursión enemiga entre en alcance de HARPOON en 50 minutos, con rumbo al sudoeste. \n\n3. (S) COMENTARIOS: {TaskForceName} está fuera del alcance operativo del F-14 y el A-7. Es probable que la incursión enemiga no lleve escolta y consista únicamente en A-6. \n\nFLASH FLASH FLASH\nButtonText=Confirmar y continuar\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n10.ª DIVISIÓN SUBMARINA\nSubj=INFORME DE CONTACTO-CONVOY DESTRUIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción de la fuerza de reabastecimiento del NIMITZ. \n\n2. (S) La destrucción de esta fuerza obligará al enemigo a reubicar al CVBG del NIMITZ lejos de la cobertura aérea de Guam, ya que se espera que el CVBG del NIMITZ esté bajo en combustible y munición. \n\n3. (S) Regrese a la ZONA DE OPERACIONES BOGATYR para una nueva asignación. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=MPA Enemiga Detectada\nBody=Se ha detectado un vuelo de MPA enemiga. Despegue interceptores de inmediato. \nButtonText=Confirmar y continuar\nPopupStyle=Notification
