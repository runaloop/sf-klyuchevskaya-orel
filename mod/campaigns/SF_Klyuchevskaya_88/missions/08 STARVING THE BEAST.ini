Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 8 </size>\AFFAMER LA BÊTE\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName} s'est approchée furtivement de la force de ravitaillement du NIMITZ. Ne vous faites pas détecter et détruisez les navires auxiliaires de la flotte. \n\nRemarque : opérant loin de nos bases, le ravitaillement et les réparations ne seront pas disponibles après la mission.\nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=Message du K-175\nBody=Amiral, tubes lance-missiles et compartiment torpilles entièrement chargés. Heureux d'avoir de vos nouvelles, cela fait deux semaines que nous n'avons rien trouvé qui vaille la peine d'être coulé !\nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=ALERTE DE RAID\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) SITUATION : un message de détresse en clair a été intercepté depuis la force de ravitaillement du NIMITZ. \n\n2. (S) ÉVALUATION : le CVBG du NIMITZ va probablement lancer une frappe aérienne contre {TaskForceName}. Le raid ennemi entrera dans la portée HARPOON en 50 minutes, en provenance du sud-ouest. \n\n3. (S) COMMENTAIRES : {TaskForceName} est hors du rayon d'action des F-14 et A-7. Le raid ennemi est probablement sans escorte et ne comporte que des A-6. \n\nFLASH FLASH FLASH\nButtonText=Confirmer et continuer\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n10th SUBMARINE DIV\nSubj=RAPPORT DE CONTACT-CONVOI DÉTRUIT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction de la force de ravitaillement du NIMITZ. \n\n2. (S) La destruction de cette force contraindra l'ennemi à éloigner le CVBG du NIMITZ de la couverture aérienne de Guam, ce CVBG étant censé être à court de carburant et de munitions. \n\n3. (S) Revenez à OPBOX Bogotyr pour de nouvelles instructions. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=MPA ennemi détecté\nBody=Un vol de MPA ennemi a été détecté. Faites décoller les intercepteurs immédiatement. \nButtonText=Confirmer et continuer\nPopupStyle=Notification
