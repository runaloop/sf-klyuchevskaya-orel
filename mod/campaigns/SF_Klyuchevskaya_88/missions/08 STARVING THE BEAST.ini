Taskforce2FlagshiplostMessage=Title=THẤT BẠI!\nBody={FlagshipName} đã bị đánh chìm!\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 8 </size>\BỎ ĐÓI CON THÚ\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName} đã bí mật tiếp cận lực lượng tiếp tế của NIMITZ. Không để bị phát hiện và tiêu diệt các tàu hậu cần của đối phương. \n\nGhi chú: vì chúng ta đang hoạt động xa quê nhà, tiếp tế và sửa chữa sẽ không khả dụng sau nhiệm vụ.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=Điện từ K-175\nBody=Đô đốc, ống phóng tên lửa và khoang ngư lôi đã nạp đầy. Rất vui khi nghe tin từ đồng chí, đã hai tuần rồi chúng tôi chưa tìm thấy thứ gì đáng để đánh chìm!\nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=CẢNH BÁO ĐỢT TẤN CÔNG\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) TÌNH HÌNH: Đã chặn thu điện báo cấp cứu bằng văn bản thô từ lực lượng tiếp tế của NIMITZ. \n\n2. (S) ĐÁNH GIÁ: Biên đội tàu sân bay tấn công NIMITZ nhiều khả năng đang xuất kích đợt không tập nhằm vào {TaskForceName}. Dự kiến đợt tập kích của đối phương vào tầm bắn HARPOON trong 50 phút nữa, hướng tây nam. \n\n3. (S) NHẬN XÉT: {TaskForceName} đang ở ngoài tầm hoạt động của F-14 và A-7. Đợt tập kích của đối phương nhiều khả năng không có hộ tống và chỉ gồm máy bay A-6. \n\nFLASH FLASH FLASH\nButtonText=Xác nhận và tiếp tục\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSƯ ĐOÀN TÀU NGẦM 10\nSubj=BÁO CÁO TIẾP XÚC-ĐOÀN TÀU VẬN TẢI BỊ TIÊU DIỆT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt lực lượng tiếp tế của NIMITZ. \n\n2. (S) Việc tiêu diệt lực lượng này sẽ buộc đối phương phải điều Biên đội tàu sân bay tấn công NIMITZ ra xa vùng yểm trợ không quân từ Guam, vì Biên đội tàu sân bay tấn công NIMITZ dự kiến sẽ cạn nhiên liệu và đạn dược. \n\n3. (S) Trở về OPBOX Bogotyr để nhận nhiệm vụ tiếp theo. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=Phát hiện máy bay tuần tra biển của đối phương\nBody=Đã phát hiện chuyến bay của máy bay tuần tra biển (MPA) đối phương. Xuất kích tiêm kích đánh chặn ngay lập tức. \nButtonText=Xác nhận và tiếp tục\nPopupStyle=Notification
