Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 8 </size>\STARVING THE BEAST\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName} has covertly approached NIMITZ's replenishment force. Do not be detected and destroy the fleet auxiliaries. \n\nNote: as we are operating far from home, resupply and repair will not be available post mission.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=Message from K-175\nBody=Admiral, missile tubes and torpedo room fully loaded. Happy to hear from you, its been two weeks since we found anything worth sinking!\nButtonText=Continue playing\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=RAID WARNING\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) SITUATION: Plaintext distress messaged intercepted from NIMITZ replenishment force. \n\n2. (S) ASSESSMENT: NIMITZ CVBG likely launching airstrike against {TaskForceName}. Enemy raid to enter HARPOON range in 50 minutes, direction South West. \n\n3. (S) COMMENTS: {TaskForceName} is outside of F-14 and A-7 operating range. Enemy raid likely unescorted and consisting of A-6 only. \n\nFLASH FLASH FLASH\nButtonText=Acknowledge and continue\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n10th SUBMARINE DIV\nSubj=CONTACT REPORT-CONVOY DESTROYED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of NIMITZ replenishment force. \n\n2. (S) Destruction of this force will force enemy to relocate NIMITZ CVBG away from Guam aircover, as NIMITZ CVBG expected to be low on fuel and munitions. \n\n3. (S) Return to OPBOX Bogotyr for follow-on tasking. KTOF sends.\nButtonText=Continue Playing\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=Enemy MPA Detected\nBody=Enemy MPA flight detected. Scramble interceptors immediately. \nButtonText=Acknowledge and continue\nPopupStyle=Notification
