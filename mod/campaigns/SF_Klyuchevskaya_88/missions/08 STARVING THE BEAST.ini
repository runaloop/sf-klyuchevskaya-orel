Taskforce2FlagshiplostMessage=Title=패배!\nBody={FlagshipName}가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제8부 </size>\야수 굶기기\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName}는 니미츠의 재보급부대에 은밀히 접근했다. 발각되지 말고 함대 보조함을 격침하라. \n\n참고: 본국에서 멀리 떨어져 작전 중이므로 임무 종료 후 보급 및 수리는 이용할 수 없다.\nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=K-175로부터의 통신\nBody=제독님, 미사일 발사관과 어뢰실이 완전히 재장전되었습니다. 연락 주셔서 기쁩니다. 격침할 만한 표적을 찾지 못한 지 벌써 2주가 되었습니다!\nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=공습 경고\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (S) 상황: 니미츠 재보급부대로부터 평문 조난 통신이 감청되었다. \n\n2. (S) 평가: 니미츠 항모전투단이 {TaskForceName}에 대한 공습을 발진시킬 가능성이 높다. 적 공습은 남서쪽 방향에서 50분 후 도달할 것이다. \n\n3. (S) 논평: {TaskForceName}는 F-14 및 A-7 작전 반경 밖에 있다. 적 공습은 무호위이며 A-6로만 구성되었을 가능성이 높다. \n\n긴급 긴급 긴급\nButtonText=확인 및 계속\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제10잠수함사단\nSubj=접촉 보고-호송선단 격침\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 니미츠 재보급부대 파괴를 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 이 부대의 파괴로 니미츠 항모전투단은 연료와 탄약이 부족할 것으로 예상되어 괌 항공엄호로부터 멀리 재배치를 강요받을 것이다. \n\n3. (S) 후속 임무를 위해 OPBOX 보가티르로 귀환하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=적 해상초계기 탐지\nBody=적 해상초계기 편대가 탐지되었다. 즉시 요격기를 발진시켜라. \nButtonText=확인 및 계속\nPopupStyle=Notification
