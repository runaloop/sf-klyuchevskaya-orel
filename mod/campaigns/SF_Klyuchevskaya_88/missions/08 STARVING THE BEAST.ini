Taskforce2FlagshiplostMessage=Title=NIEDERLAGE!\nBody={FlagshipName} wurde versenkt!\nButtonText=Zur Mission zurückkehren\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 8 </size>\DAS BIEST AUSHUNGERN\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName} hat sich verdeckt dem Nachschubverband der NIMITZ genähert. Nicht entdeckt werden und die Flottenhilfsschiffe vernichten. \n\nHinweis: Da wir fern der Heimat operieren, stehen nach dieser Mission Nachschub und Reparatur nicht zur Verfügung.\nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=Meldung von K-175\nBody=Admiral, Flugkörperrohre und Torpedoraum vollständig beladen. Freut uns, von Ihnen zu hören, seit zwei Wochen haben wir nichts gefunden, das sich zu versenken lohnt!\nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=ANGRIFFSWARNUNG\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (S) LAGE: Notmeldung im Klartext vom Nachschubverband der NIMITZ abgefangen. \n\n2. (S) EINSCHÄTZUNG: Die NIMITZ-Trägerkampfgruppe startet wahrscheinlich einen Luftangriff gegen {TaskForceName}. Feindlicher Angriff tritt in 50 Minuten in HARPOON-Reichweite ein, Richtung Südwest. \n\n3. (S) ANMERKUNGEN: {TaskForceName} befindet sich außerhalb der Einsatzreichweite von F-14 und A-7. Feindlicher Angriff vermutlich unbegleitet und besteht nur aus A-6. \n\nBLITZ BLITZ BLITZ\nButtonText=Bestätigen und weiterspielen\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n10. U-Boot-Division\nSubj=KONTAKTMELDUNG - KONVOI VERNICHTET\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung des Nachschubverbands der NIMITZ. \n\n2. (S) Die Zerstörung dieses Verbands zwingt den Feind, die NIMITZ-Trägerkampfgruppe aus der Luftdeckung von Guam abzuziehen, da erwartet wird, dass der NIMITZ-Trägerkampfgruppe Treibstoff und Munition ausgehen. \n\n3. (S) Zum OPGEBIET BOGATYR zurückkehren für Folgeaufträge. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=Feindlicher Seefernaufklärer entdeckt\nBody=Feindlicher Seefernaufklärer entdeckt. Sofort Abfangjäger aufsteigen lassen. \nButtonText=Bestätigen und weiterspielen\nPopupStyle=Notification
