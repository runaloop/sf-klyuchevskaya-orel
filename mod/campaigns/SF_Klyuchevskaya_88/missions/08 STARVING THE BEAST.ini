Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody={FlagshipName} потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 8 </size>\ЗВЕРЯ — НА ГОЛОДНЫЙ ПАЁК\n<size=24>01 0700Z МАР 88</size>\\nBody=КУГ «Ключевская» скрытно приблизилось к группе снабжения НИМИЦ. Не дайте себя обнаружить и уничтожьте вспомогательные суда флота. \n\nПримечание: поскольку мы действуем далеко от дома, после выполнения задания пополнение и ремонт будут недоступны.\nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=Сообщение от К-175\nBody=Адмирал, ракетные и торпедные аппараты полностью заряжены. Рады слышать вас, уже две недели прошло с тех пор, как мы находили хоть что-то достойное потопления!\nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ПРЕДУПРЕЖДЕНИЕ О НАЛЁТЕ\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (С) ОБСТАНОВКА: Перехвачено открытое сообщение о бедствии от группы снабжения НИМИЦ. \n\n2. (С) ОЦЕНКА: Авианосная группа НИМИЦ вероятно поднимает авиаудар против КУГ «Ключевская». Ожидается вход вражеского налёта в зону действия HARPOON через 50 минут, направление юго-западное. \n\n3. (С) КОММЕНТАРИИ: КУГ «Ключевская» находится за пределами радиуса действия F-14 и A-7. Вражеский налёт вероятно без истребительного прикрытия и состоит только из A-6. \n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Принять к сведению и продолжить\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n10-я ДИВИЗИЯ ПОДВОДНЫХ ЛОДОК\nSubj=ДОКЛАД ОБ ОБНАРУЖЕНИИ — КОНВОЙ УНИЧТОЖЕН\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении группы снабжения НИМИЦ. \n\n2. (С) Уничтожение этой группы вынудит противника перевести авианосную группу НИМИЦ из зоны прикрытия Гуама, поскольку ожидается, что группа НИМИЦ будет испытывать нехватку топлива и боеприпасов. \n\n3. (С) Вернуться в район ОПБОКС БОГАТЫРЬ для дальнейшей задачи. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=Обнаружен вражеский МПА\nBody=Обнаружен полёт вражеского патрульного самолёта. Немедленно поднять истребители-перехватчики. \nButtonText=Принять к сведению и продолжить\nPopupStyle=Notification
