Taskforce2FlagshiplostMessage=Title=敗北！\nBody={FlagshipName}が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第8部 </size>\獣を飢えさせよ\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName}はニミッツの補給部隊へ密かに接近した。探知されぬよう、艦隊補助艦を撃滅せよ。\n\n注：母国から遠く離れて作戦行動中のため、任務終了後の補給・修理は利用できない。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=K-175からの通信\nBody=提督、ミサイル発射管および魚雷室は全弾装填済みです。連絡をいただき嬉しく思います――撃沈する価値のある目標を見つけてから、もう2週間になります！\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=空襲警報\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (S) 状況：ニミッツ補給部隊より平文の遭難信号を傍受。\n\n2. (S) 評価：ニミッツ空母戦闘群は{TaskForceName}に対する空襲を発艦させている可能性が高い。敵の来襲は南西方向より、50分以内にハープーンの射程内に進入する。\n\n3. (S) 所見：{TaskForceName}はF-14およびA-7の作戦行動半径外にある。敵の来襲は護衛なしでA-6のみで編成されている可能性が高い。\n\n最優先 最優先 最優先\nButtonText=了解し続行\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第10潜水艦師団\nSubj=接触報告――船団撃滅\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) ニミッツ補給部隊の撃滅を報告する貴官の通信を受信したことを確認する。\n\n2. (S) この部隊の撃滅により、燃料・弾薬の不足が見込まれるニミッツ空母戦闘群は、グアムの航空支援圏外へ移動を強いられるだろう。\n\n3. (S) 次の任務のため、作戦区域「ボガトィール」へ帰投せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=敵哨戒機検知\nBody=敵哨戒機を検知した。直ちに邀撃機を緊急発艦させよ。\nButtonText=了解し続行\nPopupStyle=Notification
