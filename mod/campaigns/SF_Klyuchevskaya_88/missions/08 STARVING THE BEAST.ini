Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 8 </size>\饿死巨兽\n<size=24>01 0700Z MAR 88</size>\\nBody={TaskForceName}已隐蔽接近尼米兹号的补给部队。切勿被发现，并摧毁这些舰队辅助船。\n\n注意：由于我们在远离本土的海域行动，任务结束后无法进行补给或维修。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2K-175foundMessage=Title=K-175发来的消息\nBody=司令，导弹发射管和鱼雷舱已装满。很高兴收到你的消息，我们已经两周没找到值得击沉的目标了！\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2SFKlyuchevskayadetectedMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=空袭警告\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (S) 情况：截获尼米兹补给部队发出的明码遇险电文。\n\n2. (S) 判断：尼米兹号航母战斗群极有可能正对{TaskForceName}发起空袭。敌方来袭预计50分钟后进入"鱼叉"导弹射程，方向为西南。\n\n3. (S) 备注：{TaskForceName}位于F-14和A-7的作战半径之外。敌方来袭很可能没有护航，且仅由A-6组成。\n\n特急 特急 特急\nButtonText=确认并继续\nPopupStyle=NavalMessage
Taskforce2RedVictoryMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第10潜艇支队\nSubj=接触报告——船队已被摧毁\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于摧毁尼米兹补给部队的电文报告。\n\n2. (S) 摧毁该部队将迫使敌方把尼米兹号航母战斗群转移至关岛空中掩护范围之外，因为尼米兹号航母战斗群届时燃料和弹药预计将严重不足。\n\n3. (S) 返回勇士战区接受后续任务。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage
Taskforce2AtsugiReconDetectedMessage=Title=发现敌方海上巡逻机\nBody=发现敌方海上巡逻机编队。立即紧急起飞截击机。\nButtonText=确认并继续\nPopupStyle=Notification
