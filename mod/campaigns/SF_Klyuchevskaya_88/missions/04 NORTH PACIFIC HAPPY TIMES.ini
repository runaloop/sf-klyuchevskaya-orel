Taskforce2FlagshiplostMessage=Title=NIEDERLAGE!\nBody={FlagshipName} wurde versenkt!\nButtonText=Zur Mission zurückkehren\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 4 </size>\HINEIN IN DEN NORDPAZIFIK\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName} muss zwei feindliche Konvois im Nordpazifik vernichten\n\nFeindliche Luft- und U-Boot-Kräfte werden im Gebiet nicht erwartet.\n\nHinweis: {TaskForceName} läuft nach dem Überfall nach Petropawlowsk über. Nachschub und Reparatur stehen nach der Mission zur Verfügung. \nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=KONTAKTMELDUNG - KONVOI VERNICHTET\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung beider Konvois. \n\n2. (S) KTOF gratuliert Ihnen zu Ihrem Erfolg. \n\n3. (S) Zur Erholung und Auffrischung nach Petropawlowsk übersetzen. KTOF, Ende.\nButtonText=Überlebende bergen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=Südlicher Konvoi vernichtet\nBody=Der letzte Frachter des südlichen Konvois verschwindet in einem gewaltigen Feuerball. Das Wasser ist bedeckt mit Rettungsflößen und schwimmenden Trümmern. \n\nVerbringen Sie kostbare Zeit damit, die hilflosen Überlebenden zu retten? Oder ziehen Sie weiter zum anderen Konvoi...\nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=Östlicher Konvoi vernichtet\nBody=Vom Gefechtsstand aus beobachten Sie, wie die Radarechos des östlichen Konvois eines nach dem anderen verschwinden, als Ihre letzte Salve einschlägt. Sie haben eine ganze US-Division in wenigen Stunden ausgelöscht. Selbst Ihre Genossen im Heer können sich solcher Taten nicht rühmen. \n\nJetzt füllt sich Ihr Radar mit den Notfunkbaken hunderter Rettungsflöße. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=Verringerte USN-Sicherungspräsenz\nBody=Es scheint, dass die Vernichtung des USN-Schnellkonvois vor zwei Tagen die feindliche Überwasseraktivität im Nordpazifik erheblich verringert hat. Entgegen den Vorkriegsschätzungen patrouilliert keine USN-SAG auf den Konvoirouten, um Überwasserangriffe abzuschrecken. \nButtonText=Weiterspielen\nPopupStyle=Notification
Objective_SinkEastConvoy=Östlichen Konvoi versenken
Objective_SinkSouthConvoy=Südlichen Konvoi versenken
Objective_FlagshipSurvive={FlagshipName} muss überleben
