Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 4 </size>\北太平洋欢乐时光\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName}必须摧毁北太平洋上的两支敌方船队。\n\n预计该区域没有敌方空中或水下力量。\n\n注意：袭击结束后{TaskForceName}将转移至彼得罗巴甫洛夫斯克。任务结束后可进行补给和维修。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=接触报告——船队已被摧毁\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于两支船队均已被摧毁的电文报告。\n\n2. (S) 红旗太平洋舰队祝贺你取得的胜利。\n\n3. (S) 转移至彼得罗巴甫洛夫斯克休整并补给。红旗太平洋舰队发。\nButtonText=救援幸存者\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=南方船队已被摧毁\nBody=南方船队最后一艘商船在巨大的火球中消失。海面上漂满了救生艇和残骸。\n\n你要花费宝贵的时间去救助这些无助的幸存者吗？还是转向另一支船队……\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=东方船队已被摧毁\nBody=在作战指挥中心，你注视着雷达上东方船队的光点在你最后一轮齐射落地后一个接一个消失。你在短短几小时内歼灭了整整一个美军编队。就连陆军的同志们也无法夸耀这样的战绩。\n\n如今，你的雷达屏幕上布满了数百艘救生艇发出的遇险信标。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=美国海军护航力量减弱\nBody=看来你两天前摧毁美国海军快速船队的行动，已大幅削弱了北太平洋的敌方水面活动。与战前的估计相反，如今并无美国海军水面行动群在航道上巡逻、威慑水面袭击。\nButtonText=继续游戏\nPopupStyle=Notification
Objective_SinkEastConvoy=击沉东方船队
Objective_SinkSouthConvoy=击沉南方船队
