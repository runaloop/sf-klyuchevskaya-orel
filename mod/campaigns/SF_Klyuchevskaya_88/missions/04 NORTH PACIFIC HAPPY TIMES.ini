Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody={FlagshipName} потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 4 </size>\СЧАСТЛИВЫЕ ВРЕМЕНА В СЕВЕРНОЙ ПАЦИФИКЕ\n<size=24>11 1900Z ФЕВ 88</size>\\nBody=КУГ «Ключевская» должно уничтожить два вражеских конвоя в северной части Тихого океана\n\nВражеская авиация и подводные лодки в районе не ожидаются.\n\nПримечание: после рейда КУГ «Ключевская» перейдёт в Петропавловск. После выполнения задания будет доступно пополнение и ремонт. \nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ДОКЛАД ОБ ОБНАРУЖЕНИИ — КОНВОЙ УНИЧТОЖЕН\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении обоих конвоев. \n\n2. (С) КТОФ поздравляет вас с успехом. \n\n3. (С) Перейти в Петропавловск для отдыха и пополнения запасов. КТОФ передаёт.\nButtonText=Спасти выживших\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=Южный конвой уничтожен\nBody=Последнее торговое судно южного конвоя исчезает в гигантском огненном шаре. Вода покрыта спасательными плотами и плавающими обломками. \n\nПотратите ли вы драгоценное время на спасение незадачливых выживших? Или пойдёте дальше, к другому конвою...\nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=Восточный конвой уничтожен\nBody=С БИЦ вы наблюдаете, как отметки восточного конвоя на радаре гаснут одна за другой с каждым новым залпом. За несколько часов вы уничтожили целую американскую дивизию. Даже ваши товарищи в армии не могут похвастаться такими успехами. \n\nТеперь ваши радары заполняются сигналами сотен спасательных плотов. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=Сокращённое присутствие охранения ВМС США\nBody=Похоже, уничтожение вами скоростного конвоя ВМС США два дня назад значительно снизило активность надводных сил противника в северной части Тихого океана. В отличие от довоенных оценок, никакие корабельные группы ВМС США не патрулируют конвойные маршруты и не сдерживают атаки на надводные силы. \nButtonText=Продолжить\nPopupStyle=Notification
Objective_SinkEastConvoy=Уничтожить восточный конвой
Objective_SinkSouthConvoy=Уничтожить южный конвой
