Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 4 </size>\TEMPS HEUREUX DANS LE PACIFIQUE NORD\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName} doit détruire deux convois ennemis dans le Pacifique Nord\n\nAucun moyen aérien ou sous-marin ennemi n'est attendu dans la zone.\n\nRemarque : {TaskForceName} transitera vers Petropavlovsk après le raid. Le ravitaillement et les réparations seront disponibles après la mission. \nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=RAPPORT DE CONTACT-CONVOI DÉTRUIT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction des deux convois. \n\n2. (S) Le KTOF vous félicite pour ce succès. \n\n3. (S) Rejoignez Petropavlovsk pour repos et ravitaillement. Fin de message du KTOF.\nButtonText=Secourir les survivants\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=Convoi du Sud détruit\nBody=Le dernier navire marchand du convoi du Sud disparaît dans une boule de feu massive. L'eau est recouverte de canots de sauvetage et de débris flottants. \n\nAllez-vous perdre un temps précieux à secourir des survivants sans défense ? Ou passer au convoi suivant...\nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=Convoi de l'Est détruit\nBody=Depuis le CIC, vous regardez les échos radar du convoi de l'Est disparaître un par un à mesure que votre dernière salve les atteint. Vous avez annihilé une division américaine entière en quelques heures. Même vos camarades de l'armée de terre ne peuvent se vanter d'un tel exploit. \n\nÀ présent, vos radars se remplissent des balises de détresse de centaines de canots de sauvetage. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=Présence d'escorte de l'US Navy réduite\nBody=Il semble que la destruction du convoi rapide de l'US Navy il y a deux jours ait considérablement réduit l'activité de surface hostile dans le Pacifique Nord. Contrairement aux estimations d'avant-guerre, aucun groupe de surface de l'US Navy ne patrouille les routes de convois ni ne dissuade les attaques de surface. \nButtonText=Continuer la partie\nPopupStyle=Notification
Objective_SinkEastConvoy=Couler le convoi de l'Est
Objective_SinkSouthConvoy=Couler le convoi du Sud
Objective_FlagshipSurvive={FlagshipName} doit survivre
[Language_ko]
Name=04 북태평양의 좋은 시절
Description=클류쳅스카야 기동부대가 북태평양 호송선단을 습격한다.
