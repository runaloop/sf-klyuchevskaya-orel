Taskforce2FlagshiplostMessage=Title=THẤT BẠI!\nBody={FlagshipName} đã bị đánh chìm!\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 4 </size>\VÀO BẮC THÁI BÌNH DƯƠNG\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName} phải tiêu diệt hai đoàn tàu vận tải của đối phương ở Bắc Thái Bình Dương\n\nKhông dự kiến có lực lượng không quân hay tàu ngầm của đối phương trong khu vực.\n\nGhi chú: {TaskForceName} sẽ di chuyển đến Petropavlovsk sau đợt tập kích. Tiếp tế và sửa chữa sẽ khả dụng sau nhiệm vụ. \nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=BÁO CÁO TIẾP XÚC-ĐOÀN TÀU VẬN TẢI BỊ TIÊU DIỆT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt cả hai đoàn tàu vận tải. \n\n2. (S) KTOF chúc mừng thành công của các đồng chí. \n\n3. (S) Chuyển đến Petropavlovsk để nghỉ ngơi và tiếp tế. KTOF gửi.\nButtonText=Cứu người sống sót\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=Đoàn tàu vận tải phía nam đã bị tiêu diệt\nBody=Chiếc tàu buôn cuối cùng trong đoàn tàu vận tải phía nam biến mất trong một quả cầu lửa khổng lồ. Mặt nước đầy bè cứu sinh và mảnh vỡ trôi dạt. \n\nBạn có dành thời gian quý báu để cứu những kẻ sống sót bất hạnh không? Hay tiếp tục tiến đến đoàn tàu vận tải kia...\nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=Đoàn tàu vận tải phía đông đã bị tiêu diệt\nBody=Từ CIC, bạn theo dõi các chấm sáng radar của đoàn tàu vận tải phía đông lần lượt biến mất khi loạt đạn cuối cùng của bạn trúng đích. Bạn đã tiêu diệt toàn bộ một sư đoàn của Mỹ chỉ trong vài giờ. Ngay cả các đồng chí trong lục quân cũng không thể tự hào về những chiến công như vậy. \n\nBây giờ, radar của bạn tràn ngập tín hiệu cấp cứu từ hàng trăm bè cứu sinh. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=Lực lượng hộ tống của USN suy giảm\nBody=Có vẻ như việc các đồng chí tiêu diệt Đoàn tàu vận tải nhanh của USN 2 ngày trước đã làm giảm đáng kể hoạt động của lực lượng nổi thù địch ở Bắc Thái Bình Dương. Trái với các dự báo trước chiến tranh, không có biên đội tác chiến mặt nước nào của USN tuần tra các tuyến đường vận tải và ngăn chặn các cuộc tấn công trên mặt nước. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
