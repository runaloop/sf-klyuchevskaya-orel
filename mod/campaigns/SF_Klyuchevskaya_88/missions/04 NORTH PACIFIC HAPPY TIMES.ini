Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 4 </size>\NORTH PACIFIC HAPPY TIMES\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName} must destroy two enemy convoys in the North Pacific\n\nEnemy air and submerged assets not expected in area.\n\nNote: {TaskForceName} will transit to Petropavlovsk after the raid. Resupply and repair will be available post mission. \nButtonText=Start mission\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=CONTACT REPORT-CONVOY DESTROYED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of both convoys. \n\n2. (S) KTOF congratulates you on your success. \n\n3. (S) Transfer to Petropavlovsk for rest and replenishment. KTOF sends.\nButtonText=Rescue Survivors\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=Southern Convoy Destroyed\nBody=The last merchant in the Southern convoy disappears in a massive fireball. The water is covered in life rafts and floating debris. \n\nDo you spend precious time saving hapless survivors? Or do you move on to the other convoy...\nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=Eastern Convoy Destroyed\nBody=From CIC, you watch radar blips of the Eastern convoy disappear one by one as your last salvo lands. You have annihilated an entire US division in a couple hours. Even your Comrades in the army cannot boast of such feats. \n\nNow, you radars fill with the distress beacons from hundreds of life rafts. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=Reduced USN Escort Presence\nBody=It seems your destruction of the USN Fast Convoy 2 days ago has significantly reduced hostile surface activity in the Northern Pacific. Contrary to pre-war estimates, there are no USN SAGs patrolling the convoy routes and detering surface attacks. \nButtonText=Continue Playing\nPopupStyle=Notification
Objective_SinkEastConvoy=Sink the Eastern Convoy
Objective_SinkSouthConvoy=Sink the Southern Convoy
