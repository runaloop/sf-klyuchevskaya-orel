Taskforce2FlagshiplostMessage=Title=패배!\nBody={FlagshipName}가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제4부 </size>\북태평양의 좋은 시절\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName}는 북태평양에서 적 호송선단 두 개를 격침해야 한다\n\n해당 구역에는 적 항공기 및 잠수 전력이 없을 것으로 예상된다.\n\n참고: {TaskForceName}는 습격 이후 페트로파블롭스크로 이동한다. 임무 종료 후 보급 및 수리가 가능하다. \nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=접촉 보고-호송선단 격침\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 두 호송선단 모두를 격침했다는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) KTOF는 귀 부대의 성과를 축하한다. \n\n3. (S) 휴식 및 재보급을 위해 페트로파블롭스크로 이동하라. KTOF 송신 종료.\nButtonText=생존자 구조\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=남부 호송선단 격침\nBody=남부 호송선단의 마지막 상선이 거대한 화염에 휩싸여 사라진다. 수면은 구명정과 부유물로 뒤덮여 있다. \n\n가련한 생존자를 구조하는 데 귀중한 시간을 쓸 것인가? 아니면 다른 호송선단으로 이동할 것인가...\nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=동부 호송선단 격침\nBody=전투정보실에서, 마지막 일제 사격이 명중하며 동부 호송선단의 레이더 반점들이 하나씩 사라지는 모습을 지켜본다. 몇 시간 만에 미군 사단 하나를 전멸시켰다. 육군의 동무들조차 이런 전과는 자랑할 수 없을 것이다. \n\n이제 레이더에는 수백 개의 구명정에서 나오는 조난 신호가 가득하다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=미 해군 호위 전력 감소\nBody=2일 전 미 해군 고속 호송선단을 격침한 것이 북태평양의 적 수상 활동을 크게 줄인 것으로 보인다. 전쟁 전 예측과는 달리, 호송로를 순찰하며 수상 공격을 억제하는 미 해군 수상타격단은 존재하지 않는다. \nButtonText=계속 진행\nPopupStyle=Notification
Objective_SinkEastConvoy=동부 호송선단 격침
Objective_SinkSouthConvoy=남부 호송선단 격침
Objective_FlagshipSurvive={FlagshipName}는 생존해야 한다
