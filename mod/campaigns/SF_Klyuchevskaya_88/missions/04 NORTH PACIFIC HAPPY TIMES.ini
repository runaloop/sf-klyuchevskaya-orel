Taskforce2FlagshiplostMessage=Title=¡DERROTA!\nBody=¡{FlagshipName} ha sido hundido!\nButtonText=Volver a la misión\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 4 </size>\TIEMPOS FELICES EN EL PACÍFICO NORTE\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName} debe destruir dos convoyes enemigos en el Pacífico Norte\n\nNo se espera presencia de activos aéreos ni sumergidos enemigos en la zona.\n\nNota: {TaskForceName} transitará a Petropávlovsk después de la incursión. El reabastecimiento y la reparación estarán disponibles después de la misión. \nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=INFORME DE CONTACTO-CONVOY DESTRUIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción de ambos convoyes. \n\n2. (S) KTOF le felicita por su éxito. \n\n3. (S) Transfiérase a Petropávlovsk para descanso y reabastecimiento. KTOF envía.\nButtonText=Rescatar supervivientes\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=Convoy del Sur Destruido\nBody=El último mercante del convoy del Sur desaparece en una enorme bola de fuego. El agua está cubierta de balsas salvavidas y restos flotantes. \n\n¿Gasta tiempo precioso salvando a los desafortunados supervivientes? ¿O sigue adelante hacia el otro convoy...\nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=Convoy del Este Destruido\nBody=Desde el CIC, observa cómo los ecos de radar del convoy del Este desaparecen uno a uno mientras cae su última andanada. Ha aniquilado a toda una división estadounidense en un par de horas. Ni siquiera sus camaradas del ejército pueden alardear de tales hazañas. \n\nAhora, sus radares se llenan de las balizas de socorro de cientos de balsas salvavidas. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=Presencia Reducida de Escoltas de la USN\nBody=Parece que la destrucción del Convoy Rápido de la USN hace dos días ha reducido significativamente la actividad de superficie hostil en el Pacífico Norte. Contrariamente a las estimaciones previas a la guerra, no hay SAG de la USN patrullando las rutas de convoyes y disuadiendo ataques de superficie. \nButtonText=Seguir jugando\nPopupStyle=Notification
Objective_SinkEastConvoy=Hundir el Convoy del Este
Objective_SinkSouthConvoy=Hundir el Convoy del Sur
Objective_FlagshipSurvive={FlagshipName} debe sobrevivir
