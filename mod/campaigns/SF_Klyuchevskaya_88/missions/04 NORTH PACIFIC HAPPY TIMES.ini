Taskforce2FlagshiplostMessage=Title=敗北！\nBody={FlagshipName}が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第4部 </size>\北太平洋の狂騒\n<size=24>11 1900Z FEB 88</size>\\nBody={TaskForceName}は北太平洋において敵船団2隊を撃滅しなければならない\n\n本海域において敵の航空戦力および潜水戦力は予期されていない。\n\n注：{TaskForceName}は襲撃後にペトロパブロフスクへ移動する。任務終了後、補給と修理が利用可能となる。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2BothConvoysDestroyedMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=接触報告――船団撃滅\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 両船団の撃滅を報告する貴官の通信を受信したことを確認する。\n\n2. (S) KTOFは貴官の成功を祝す。\n\n3. (S) 休息と補給のためペトロパブロフスクへ移動せよ。KTOFより。\nButtonText=生存者を救助\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2SouthConvoySunkMessage=Title=南方船団撃滅\nBody=南方船団最後の商船が、巨大な火球の中に消えていく。海面は救命ボートと漂流物で覆われている。\n\n貴重な時間を割いて不運な生存者を救助するか。それとも、もう一方の船団へ向かうか……\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2EastConvoySunkMessage=Title=東方船団撃滅\nBody=戦闘指揮所（CIC）から、最後の一斉射撃が命中し、東方船団のレーダー輝点が一つずつ消えていくのを見守る。貴官はわずか数時間で米軍の一個師団に相当する戦力を全滅させた。陸軍の同志たちさえ、これほどの戦果は誇れまい。\n\n今、貴官のレーダーは数百隻分の救命ボートから発せられる遭難信号で満たされている。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2NoReinforcementsMessage=Title=米海軍護衛戦力の減少\nBody=2日前に米海軍高速船団を撃滅した効果により、北太平洋における敵水上戦力の活動が大幅に減少したようだ。戦前の予測に反し、船団航路を巡視し水上攻撃を抑止する米海軍水上戦闘群は見当たらない。\nButtonText=作戦続行\nPopupStyle=Notification
Objective_SinkEastConvoy=東方船団の撃沈
Objective_SinkSouthConvoy=南方船団の撃沈
