Taskforce2FlagshiplostMessage=Title=¡DERROTA!\nBody=¡El K-242 ha sido hundido!\nButtonText=Volver a la misión\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 4A </size>\SUBMARINOS Y OBJETIVOS\n<size=24>16 1100Z Feb 88</size>\\nBody=El K-242 ha sido encargado de neutralizar un grupo ASW japonés que opera en la zona. Los objetivos prioritarios son el HARUNA DDH-141 y el KURAMA DDH-144. Todos los demás objetivos son opcionales. \nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=10.ª DIVISIÓN SUBMARINA\nSubj=INFORME SUBMARINO-BARRIDA LIMPIA\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción de ambos destructores de helicópteros. \n\n2. (S) La pérdida de estas unidades degrada gravemente la capacidad ASW enemiga en la zona de operaciones. \n\n3. (S) Buen trabajo, camarada, regrese a la zona de patrulla para nueva asignación. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=HARUNA Hundido\nBody=Informe de sonar: se reportan ruidos de rotura de casco desde el contacto de clase HARUNA. El destructor de helicópteros se está hundiendo. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=KURAMA Hundido\nBody=Un estruendo lejano reverbera por toda la sala de control mientras su torpedo impacta al KURAMA. Un rápido vistazo por el periscopio confirma lo evidente al ver al gran destructor hundirse de proa hacia las profundidades. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=Mensaje del K-175\nBody=El K-175 regresa a Petropávlovsk para rearmarse tras un ataque exitoso a un convoy. Los tubos de SS-N-12 están vacíos, pero quedan algunos torpedos. \nButtonText=Seguir jugando\nPopupStyle=Notification
Objective_FlagshipSurvive=El K-242 debe sobrevivir
Objective_SinkHaruna=Hundir el HARUNA
Objective_SinkKurama=Hundir el KURAMA
