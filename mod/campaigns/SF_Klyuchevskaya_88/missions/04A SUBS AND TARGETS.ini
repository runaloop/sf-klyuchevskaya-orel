Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=10th SUBMARINE DIV\nSubj=SUB REPORT-CLEAN SWEEP\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of both helicopter destroyers. \n\n2. (S) Loss of these units severely degrades enemy ASW capability in AO. \n\n3. (S) Good work, Comrade, return to patrol box for tasking. KTOF sends.\nButtonText=Continue Playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=HARUNA Sunk\nBody=Sonar report: Hull breakup noises reported from HARUNA-Class contact. The helicopter destroyer is sinking. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=KURAMA Sunk\nBody=A distant rumble reverberates throughout the control room as your torpedo impacts KURAMA. A quick periscope scan confirms the obvious as you watch the big destroyer plunge bow first into the deeps. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=Message from K-175\nBody=K-175 returning to Petropavlovsk for rearm after successful convoy attack. SS-N-12 tubes empty, but some torpedoes remain. \nButtonText=Continue Playing\nPopupStyle=Notification
