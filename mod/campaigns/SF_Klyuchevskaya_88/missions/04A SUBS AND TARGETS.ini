Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 4A </size>\潜艇与目标\n<size=24>16 1100Z Feb 88</size>\\nBody=K-242奉命消灭在该区域活动的一支日本反潜编队。优先目标为榛名号（DDH-141）和鞍马号（DDH-144）。其余目标均为可选。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=红旗太平洋舰队\nTo=K-242\nInfo=第10潜艇支队\nSubj=潜艇报告——全歼\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于两艘直升机驱逐舰均已被摧毁的电文报告。\n\n2. (S) 这些单位的损失严重削弱了敌方在本作战区域的反潜能力。\n\n3. (S) 干得好，同志，返回巡逻区域待命。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=榛名号已被击沉\nBody=声呐报告：榛名级目标传来船体碎裂的声音。这艘直升机驱逐舰正在下沉。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=鞍马号已被击沉\nBody=一声遥远的轰鸣响彻整个控制舱，你的鱼雷击中了鞍马号。潜望镜快速扫视确认了这一事实：这艘大型驱逐舰正舰首朝下沉入深海。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=K-175发来的消息\nBody=K-175在成功袭击船队后正返回彼得罗巴甫洛夫斯克补充弹药。SS-N-12发射管已空，但仍剩有部分鱼雷。\nButtonText=继续游戏\nPopupStyle=Notification
Objective_FlagshipSurvive=K-242必须存活
Objective_SinkHaruna=击沉榛名号
Objective_SinkKurama=击沉鞍马号
