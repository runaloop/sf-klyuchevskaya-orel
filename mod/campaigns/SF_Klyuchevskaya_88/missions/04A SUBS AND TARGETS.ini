Taskforce2FlagshiplostMessage=Title=THẤT BẠI!\nBody=K-242 đã bị đánh chìm!\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 4A </size>\TÀU NGẦM VÀ MỤC TIÊU\n<size=24>16 1100Z Feb 88</size>\\nBody=K-242 được giao nhiệm vụ tiêu diệt một biên đội chống ngầm của Nhật Bản đang hoạt động trong khu vực. Mục tiêu ưu tiên là HARUNA DDH-141 và KURAMA DDH-144. Mọi mục tiêu khác đều là tùy chọn. \nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=SƯ ĐOÀN TÀU NGẦM 10\nSubj=BÁO CÁO TÀU NGẦM-QUÉT SẠCH\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt cả hai tàu khu trục trực thăng. \n\n2. (S) Việc mất các đơn vị này làm suy giảm nghiêm trọng năng lực chống ngầm của đối phương trong khu vực tác chiến. \n\n3. (S) Làm tốt lắm, đồng chí, trở lại khu vực tuần tra để nhận nhiệm vụ mới. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=HARUNA bị đánh chìm\nBody=Báo cáo sonar: nghe thấy tiếng vỏ tàu vỡ từ mục tiêu lớp HARUNA. Tàu khu trục trực thăng đang chìm. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=KURAMA bị đánh chìm\nBody=Một tiếng động ầm ì xa xăm vang khắp phòng điều khiển khi ngư lôi của bạn trúng KURAMA. Một lượt quan sát nhanh qua kính tiềm vọng xác nhận điều hiển nhiên khi bạn nhìn thấy chiếc khu trục hạm lớn chìm dần xuống đáy biển, mũi tàu cắm xuống trước. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=Điện từ K-175\nBody=K-175 đang trở về Petropavlovsk để tái vũ trang sau đợt tấn công đoàn tàu vận tải thành công. Ống phóng SS-N-12 đã hết đạn, nhưng vẫn còn một số ngư lôi. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
