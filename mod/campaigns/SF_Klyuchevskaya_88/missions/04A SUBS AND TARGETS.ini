Taskforce2FlagshiplostMessage=Title=敗北！\nBody=K-242が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第4A部 </size>\潜水艦と標的\n<size=24>16 1100Z Feb 88</size>\\nBody=K-242は、当該海域で活動する日本の対潜部隊を無力化する任務を与えられた。優先目標ははるな DDH-141およびくらま DDH-144である。その他の目標はすべて任意とする。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=第10潜水艦師団\nSubj=潜水艦報告――一掃完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 両ヘリコプター搭載護衛艦の撃沈を報告する貴官の通信を受信したことを確認する。\n\n2. (S) これらの艦の損失により、当該作戦海域における敵の対潜能力は著しく低下する。\n\n3. (S) 見事な働きだ、同志。次の任務に備え、待機海域へ帰投せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=はるな 撃沈\nBody=ソナー報告：はるな型接触目標より船体破壊音を確認。ヘリコプター搭載護衛艦が沈没中である。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=くらま 撃沈\nBody=魚雷がくらまに命中し、遠くの轟音が発令所全体に響き渡る。潜望鏡での確認により、その大型駆逐艦が艦首を下にして深みへと沈んでいく様子が見て取れる。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=K-175からの通信\nBody=船団攻撃成功後、再武装のためK-175はペトロパブロフスクへ帰投中である。SS-N-12発射管は空だが、魚雷はまだ残っている。\nButtonText=作戦続行\nPopupStyle=Notification
