Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 4A </size>\U-BOOTE UND ZIELE\n<size=24>16 1100Z Feb 88</size>\\nBody=Die K-242 hat den Auftrag, eine japanische ASW-Gruppe im Gebiet zu neutralisieren. Vorrangige Ziele sind HARUNA DDH-141 und KURAMA DDH-144. Alle anderen Ziele sind optional. \nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=10. U-Boot-Division\nSubj=U-BOOT-MELDUNG - REINER TISCH\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung beider Hubschrauberzerstörer. \n\n2. (S) Der Verlust dieser Einheiten schwächt die feindliche U-Jagd-Fähigkeit im Einsatzgebiet erheblich. \n\n3. (S) Gute Arbeit, Genosse, zur Wartebox zurückkehren für weitere Aufträge. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=HARUNA versenkt\nBody=Sonarmeldung: Rumpfbruchgeräusche vom HARUNA-Klasse-Kontakt gemeldet. Der Hubschrauberzerstörer sinkt. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=KURAMA versenkt\nBody=Ein fernes Grollen hallt durch den Gefechtsstand, als Ihr Torpedo die KURAMA trifft. Ein kurzer Periskopblick bestätigt das Offensichtliche, während Sie beobachten, wie der große Zerstörer mit dem Bug voran in die Tiefe sinkt. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=Meldung von K-175\nBody=K-175 kehrt nach Petropawlowsk zurück zum Nachladen nach erfolgreichem Konvoiangriff. SS-N-12-Rohre leer, aber einige Torpedos verbleiben. \nButtonText=Weiterspielen\nPopupStyle=Notification
Objective_FlagshipSurvive=K-242 muss überleben
Objective_SinkHaruna=HARUNA versenken
Objective_SinkKurama=KURAMA versenken
