Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 4A </size>\SOUS-MARINS ET CIBLES\n<size=24>16 1100Z Feb 88</size>\\nBody=Le K-242 est chargé de neutraliser un groupe ASM japonais opérant dans la zone. Les cibles prioritaires sont le HARUNA DDH-141 et le KURAMA DDH-144. Toutes les autres cibles sont optionnelles. \nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=10th SUBMARINE DIV\nSubj=RAPPORT SOUS-MARIN-COUP DE BALAI\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction des deux destroyers porte-hélicoptères. \n\n2. (S) La perte de ces unités dégrade sévèrement la capacité ASM ennemie dans la zone d'opérations. \n\n3. (S) Bon travail, camarade, regagnez votre zone de patrouille pour de nouvelles instructions. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=HARUNA coulé\nBody=Rapport sonar : des bruits de rupture de coque signalés sur le contact de classe HARUNA. Le destroyer porte-hélicoptères est en train de sombrer. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=KURAMA coulé\nBody=Un grondement lointain résonne dans toute la salle de contrôle lorsque votre torpille frappe le KURAMA. Un rapide balayage au périscope confirme l'évidence tandis que vous regardez le grand destroyer plonger, la proue en premier, dans les profondeurs. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=Message du K-175\nBody=Le K-175 rentre à Petropavlovsk pour réarmement après une attaque de convoi réussie. Les tubes SS-N-12 sont vides, mais quelques torpilles restent. \nButtonText=Continuer la partie\nPopupStyle=Notification
Objective_FlagshipSurvive=Le K-242 doit survivre
Objective_SinkHaruna=Couler le HARUNA
Objective_SinkKurama=Couler le KURAMA
