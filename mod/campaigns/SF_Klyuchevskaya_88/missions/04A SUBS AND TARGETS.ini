Taskforce2FlagshiplostMessage=Title=패배!\nBody=K-242가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제4A부 </size>\잠수함과 표적\n<size=24>16 1100Z Feb 88</size>\\nBody=K-242는 해당 구역에서 활동 중인 일본 대잠부대를 무력화하라는 임무를 받았다. 우선 표적은 하루나 DDH-141과 구라마 DDH-144이다. 그 외 모든 표적은 선택 사항이다. \nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=KTOF\nTo=K-242\nInfo=제10잠수함사단\nSubj=잠수함 보고-완전 소탕\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 헬리콥터 구축함 두 척 모두를 격침했다는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 이들 함정의 손실은 작전구역 내 적 대잠 능력을 심각하게 저하시킨다. \n\n3. (S) 잘했다, 동무. 다음 임무를 위해 초계 구역으로 귀환하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=하루나 격침\nBody=소나 보고: 하루나급 접촉으로부터 선체 파괴음이 보고되었다. 헬리콥터 구축함이 침몰하고 있다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=구라마 격침\nBody=어뢰가 구라마에 명중하자 통제실 전체에 먼 진동이 울려 퍼진다. 잠망경으로 재빨리 확인하니, 대형 구축함이 함수부터 심해로 가라앉는 모습이 뚜렷하다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=K-175로부터의 통신\nBody=제독님, 미사일 발사관과 어뢰실이 완전히 재장전되었습니다. 연락 주셔서 기쁩니다. 격침할 만한 표적을 찾지 못한 지 벌써 2주가 되었습니다!\nButtonText=계속 진행\nPopupStyle=Notification
Objective_FlagshipSurvive=K-242는 생존해야 한다
Objective_SinkHaruna=하루나 격침
Objective_SinkKurama=구라마 격침
