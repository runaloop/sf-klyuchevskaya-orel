Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody=К-242 потоплена!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 4A </size>\ПОДЛОДКИ И ЦЕЛИ\n<size=24>16 1100Z Feb 88</size>\\nBody=К-242 получила задачу нейтрализовать японскую противолодочную группу, действующую в этом районе. Приоритетные цели — ХАРУНА DDH-141 и КУРАМА DDH-144. Все остальные цели необязательны. \nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2ASWFlagsKilledMessage=From=КТОФ\nTo=К-242\nInfo=10-я ДИВИЗИЯ ПОДВОДНЫХ ЛОДОК\nSubj=ДОКЛАД ПОДЛОДКИ — ПОЛНАЯ ЗАЧИСТКА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении обоих вертолётоносных эсминцев. \n\n2. (С) Потеря этих кораблей серьёзно снижает противолодочные возможности противника в районе действий. \n\n3. (С) Хорошая работа, товарищ, возвращайтесь в район патрулирования для получения новой задачи. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2HarunaKillMessage=Title=ХАРУНА потоплен\nBody=Доклад гидроакустиков: слышны звуки разрушения корпуса контакта класса ХАРУНА. Вертолётоносный эсминец тонет. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2KuramaKillMessage=Title=КУРАМА потоплен\nBody=Далёкий гул разносится по всему боевому посту, когда ваша торпеда попадает в КУРАМА. Быстрый осмотр в перископ подтверждает очевидное: большой эсминец уходит под воду носом вперёд. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2K-175messageMessage=Title=Сообщение от К-175\nBody=К-175 возвращается в Петропавловск для перезарядки после успешной атаки на конвой. Аппараты SS-N-12 пусты, но часть торпед осталась. \nButtonText=Продолжить\nPopupStyle=Notification
Objective_FlagshipSurvive=К-242 должна уцелеть
Objective_SinkHaruna=Уничтожить ХАРУНА
Objective_SinkKurama=Уничтожить КУРАМА
