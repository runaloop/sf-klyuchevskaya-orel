Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 6A </size>\LE FANTÔME GRIS\n<size=24>25 0000Z FEB 88</size>\\nBody=SF Narod a été pris au piège par un CVBG de l'US Navy. Sortez du piège et ne perdez ni le KIROV ni votre pétrolier ravitailleur.\n\nRemarque : la survie de certaines unités leur permettra d'apparaître comme renforts plus tard dans la campagne.\nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=RED BANNER NORTHERN FLEET\nTo=SF NAROD\nInfo=KTOF\n7th OPERATIONAL SQN \n169th MIXED AVIATION REGT\n17th OPERATIONAL SQN\nKTOF\nSubj=RAPPORT DE CONTACT-ENTERPRISE COULÉ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction de l'ENTERPRISE CVN-65. \n\n2. (S) La destruction de ce porte-avions réduit considérablement la menace aérienne et de surface ennemie dans la région. \n\n3. (S) La destruction de son groupe de combat est optionnelle. Poursuivez le transit vers la baie de Cam Ranh. Fin de message de la SF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=GENRIKH GASANOV coulé\nBody=SF Narod a perdu son unique pétrolier ravitailleur de flotte. Faites route au mieux vers Cochin, en Inde, pour y être interné par la marine indienne. \nButtonText=Retour à la mission\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=RED BANNER NORTHERN FLEET\nTo=SF NAROD\nInfo=7th OPERATIONAL SQN \n169th MIXED AVIATION REGT\n17th OPERATIONAL SQN\nSubj=ALERTE DE RAID\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION : le SIGINT indique une augmentation significative du trafic de commandement aérien VHF de l'US Navy. Cette augmentation correspond aux évaluations d'avant-guerre concernant le décollage d'une « Alpha Strike » américaine. \n\n2. (TS) ÉVALUATION : l'ENTERPRISE lance un groupe de frappe multi-axes contre SF Narod. Le raid contient probablement des A-6, A-7 et EA-6.\n\n3. (TS) COMMENTAIRES : aucun trafic de commandement de chasseurs reçu, le groupe de frappe est probablement sans escorte. \n\nFLASH FLASH FLASH\nButtonText=Confirmer et continuer\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=Pont d'envol de l'ENTERPRISE endommagé\nBody=L'ENTERPRISE n'est plus capable de faire décoller d'aéronefs.\nButtonText=Confirmer et continuer\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=Base aéronavale royale thaïlandaise d'U-Tapao\nBody=N'engagez pas les infrastructures aériennes thaïlandaises. L'ambassade soviétique en Thaïlande confirme que les aéronefs américains atterrissant sur cette base seront internés jusqu'à la fin des hostilités. \nButtonText=Confirmer et continuer\nPopupStyle=Notification
