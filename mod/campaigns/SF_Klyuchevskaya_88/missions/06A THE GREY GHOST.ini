Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 6A </size>\DER GRAUE GEIST\n<size=24>25 0000Z FEB 88</size>\\nBody=SF Narod wurde von einer USN-Trägerkampfgruppe gestellt. Brechen Sie aus der Falle aus und verlieren Sie weder die KIROV noch Ihren Versorger. \n\nHinweis: Das Überleben bestimmter Einheiten ermöglicht ihnen, später in der Kampagne als Verstärkung zu erscheinen.\nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=ROTBANNER-NORDFLOTTE\nTo=SF NAROD\nInfo=KTOF\n7. Operative Staffel \n169. Gemischtes Fliegerregiment\n17. Operative Staffel\nKTOF\nSubj=KONTAKTMELDUNG - ENTERPRISE VERSENKT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung der ENTERPRISE CVN-65. \n\n2. (S) Die Zerstörung dieses Trägers verringert die feindliche Luft- und Überwasserbedrohung in der Region erheblich. \n\n3. (S) Die Vernichtung ihrer Kampfgruppe ist optional. Durchfahrt zur Cam-Ranh-Bucht fortsetzen. SF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=GENRIKH GASANOV versenkt\nBody=SF Narod hat seinen einzigen Flottentanker verloren. Höchste Fahrt nach Cochin, Indien, setzen und sich von der indischen Marine internieren lassen. \nButtonText=Zur Mission zurückkehren\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=ROTBANNER-NORDFLOTTE\nTo=SF NAROD\nInfo=7. Operative Staffel \n169. Gemischtes Fliegerregiment\n17. Operative Staffel\nSubj=ANGRIFFSWARNUNG\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (TS) LAGE: SIGINT zeigt einen deutlichen Anstieg des USN-Luftführungsfunkverkehrs im UKW-Band. Der Anstieg entspricht Vorkriegseinschätzungen zum Start eines amerikanischen "Alpha Strike". \n\n2. (TS) EINSCHÄTZUNG: Die ENTERPRISE startet einen mehrachsigen Angriffsverband gegen SF Narod. Der Angriff enthält wahrscheinlich A-6-, A-7- und EA-6-Flugzeuge.\n\n3. (TS) ANMERKUNGEN: Kein Jagdführungsfunkverkehr empfangen, Angriffsverband vermutlich unbegleitet. \n\nBLITZ BLITZ BLITZ\nButtonText=Bestätigen und weiterspielen\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=Flugdeck der ENTERPRISE beschädigt\nBody=Die ENTERPRISE kann keine Flugzeuge mehr starten.\nButtonText=Bestätigen und weiterspielen\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=U-Tapao Fliegerhorst der Königlich Thailändischen Marine\nBody=Thailändische Luftinfrastruktur nicht angreifen. Die sowjetische Botschaft in Thailand bestätigt, dass amerikanische Flugzeuge, die auf dem Stützpunkt landen, bis zum Ende der Kampfhandlungen interniert werden. \nButtonText=Bestätigen und weiterspielen\nPopupStyle=Notification
