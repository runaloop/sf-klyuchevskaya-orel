Taskforce2FlagshiplostMessage=Title=敗北！\nBody=キーロフが撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第6A部 </size>\灰色の幽霊\n<size=24>25 0000Z FEB 88</size>\\nBody=SFナロードは米海軍空母戦闘群に捕捉された。包囲網を突破し、キーロフおよびAORを死守せよ。\n\n注：一部のユニットを生存させれば、以後のキャンペーンで増援として登場するようになる。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=赤旗北方艦隊\nTo=SFナロード\nInfo=KTOF\n第7作戦戦隊\n第169混成航空連隊\n第17作戦戦隊\nKTOF\nSubj=接触報告――エンタープライズ撃沈\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) エンタープライズ CVN-65の撃沈を報告する貴官の通信を受信したことを確認する。\n\n2. (S) この空母の撃沈により、当該地域における敵の航空・水上戦力の脅威は著しく低下する。\n\n3. (S) その戦闘群の撃滅は任意とする。カムラン湾への移動を継続せよ。SFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=ゲンリフ・ガサノフ 撃沈\nBody=SFナロードは唯一の艦隊給油艦を失った。最大速力でインドのコーチンへ向かい、インド海軍による抑留を受け入れよ。\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=赤旗北方艦隊\nTo=SFナロード\nInfo=第7作戦戦隊\n第169混成航空連隊\n第17作戦戦隊\nSubj=空襲警報\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (TS) 状況：信号情報（SIGINT）により、米海軍のVHF帯航空指揮通信が著しく増加していることが判明。この通信増加は、戦前の評価にある米軍「アルファ・ストライク」発艦の兆候と一致する。\n\n2. (TS) 評価：エンタープライズはSFナロードに対し多方向からの攻撃隊を発艦させている。攻撃隊にはA-6、A-7およびEA-6が含まれる可能性が高い。\n\n3. (TS) 所見：戦闘機部隊の指揮通信は受信されておらず、攻撃隊は護衛なしの可能性が高い。\n\n最優先 最優先 最優先\nButtonText=了解し続行\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=エンタープライズ飛行甲板損傷\nBody=エンタープライズはもはや航空機を発艦させることができない。\nButtonText=了解し続行\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=ウタパオ王立タイ海軍飛行場\nBody=タイ側の航空施設には交戦するな。駐タイソ連大使館の確認によれば、当基地に着陸した米軍機は敵対行為終結まで抑留されるとのことである。\nButtonText=了解し続行\nPopupStyle=Notification
