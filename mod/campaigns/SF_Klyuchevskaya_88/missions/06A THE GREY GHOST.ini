Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 6A </size>\EL FANTASMA GRIS\n<size=24>25 0000Z FEB 88</size>\\nBody=SF Narod ha sido interceptada por un CVBG de la USN. Salga de la trampa y no pierda al KIROV ni a su buque de reabastecimiento.\n\nNota: la supervivencia de ciertas unidades permitirá que aparezcan como refuerzos más adelante en la campaña.\nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=FLOTA DEL NORTE DE LA BANDERA ROJA\nTo=SF NAROD\nInfo=KTOF\n7.ª ESCUADRA OPERATIVA \n169.º REGIMIENTO MIXTO DE AVIACIÓN\n17.ª ESCUADRA OPERATIVA\nKTOF\nSubj=INFORME DE CONTACTO-ENTERPRISE HUNDIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción del ENTERPRISE CVN-65. \n\n2. (S) La destrucción de este portaaviones reduce significativamente la amenaza aérea y de superficie enemiga en la región. \n\n3. (S) La destrucción de su grupo de batalla es opcional. Continúe el tránsito hacia la Bahía de Cam Ranh. SF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=GENRIKH GASANOV hundido\nBody=SF Narod ha perdido su único petrolero de flota. Ponga rumbo lo más rápido posible hacia Cochín, India, para ser internados por la Armada india. \nButtonText=Volver a la misión\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=FLOTA DEL NORTE DE LA BANDERA ROJA\nTo=SF NAROD\nInfo=7.ª ESCUADRA OPERATIVA \n169.º REGIMIENTO MIXTO DE AVIACIÓN\n17.ª ESCUADRA OPERATIVA\nSubj=ALERTA DE ATAQUE\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUACIÓN: la SIGINT indica un aumento significativo en el tráfico de mando aéreo de la USN en banda VHF. El aumento del tráfico se correlaciona con las evaluaciones previas a la guerra sobre la salida de un "Alpha Strike" estadounidense. \n\n2. (TS) EVALUACIÓN: el ENTERPRISE está lanzando un paquete de ataque multieje contra SF Narod. El ataque probablemente incluye aeronaves A-6, A-7 y EA-6. \n\n3. (TS) COMENTARIOS: no se ha recibido tráfico de mando de cazas, es probable que el paquete de ataque no lleve escolta. \n\nFLASH FLASH FLASH\nButtonText=Confirmar y continuar\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=Cubierta de vuelo del ENTERPRISE dañada\nBody=El ENTERPRISE ya no puede lanzar aeronaves.\nButtonText=Confirmar y continuar\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=Aeródromo de la Marina Real Tailandesa de U-Tapao\nBody=No ataque la infraestructura aérea tailandesa. La embajada soviética en Tailandia confirma que las aeronaves estadounidenses que aterricen en la base serán internadas hasta que cesen las hostilidades. \nButtonText=Confirmar y continuar\nPopupStyle=Notification
