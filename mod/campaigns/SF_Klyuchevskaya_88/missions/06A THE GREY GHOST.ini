Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 6A </size>\BÓNG MA XÁM\n<size=24>25 0000Z FEB 88</size>\\nBody=SF Narod đã bị một biên đội tàu sân bay tấn công của USN bắt gặp. Hãy phá vòng vây và không để mất KIROV hay tàu chở dầu (AOR) của các đồng chí.\n\nGhi chú: nếu một số đơn vị sống sót, chúng sẽ xuất hiện làm viện binh sau này trong chiến dịch.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=HẠM ĐỘI PHƯƠNG BẮC CỜ ĐỎ\nTo=SF NAROD\nInfo=KTOF\nPHI ĐỘI TÁC CHIẾN 7 \nTRUNG ĐOÀN HÀNG KHÔNG HỖN HỢP 169\nPHI ĐỘI TÁC CHIẾN 17\nKTOF\nSubj=BÁO CÁO TIẾP XÚC-ENTERPRISE BỊ ĐÁNH CHÌM\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt ENTERPRISE CVN-65. \n\n2. (S) Việc tiêu diệt tàu sân bay này làm giảm đáng kể mối đe dọa từ không quân và lực lượng mặt nước của đối phương trong khu vực. \n\n3. (S) Việc tiêu diệt biên đội tàu sân bay của nó là tùy chọn. Tiếp tục di chuyển đến Vịnh Cam Ranh. SF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=GENRIKH GASANOV bị đánh chìm\nBody=SF Narod đã mất chiếc tàu chở dầu hạm đội duy nhất của mình. Hãy di chuyển với tốc độ tối đa đến Cochin, Ấn Độ, và chịu sự giam giữ của Hải quân Ấn Độ. \nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=HẠM ĐỘI PHƯƠNG BẮC CỜ ĐỎ\nTo=SF NAROD\nInfo=PHI ĐỘI TÁC CHIẾN 7 \nTRUNG ĐOÀN HÀNG KHÔNG HỖN HỢP 169\nPHI ĐỘI TÁC CHIẾN 17\nSubj=CẢNH BÁO ĐỢT TẤN CÔNG\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) TÌNH HÌNH: SIGINT cho thấy sự gia tăng đáng kể lưu lượng điện đài chỉ huy không quân băng tần VHF của USN. Sự gia tăng này trùng khớp với các đánh giá trước chiến tranh về việc Mỹ xuất kích "Đòn tấn công Alpha". \n\n2. (TS) ĐÁNH GIÁ: ENTERPRISE đang xuất kích một đợt tấn công đa hướng nhằm vào SF Narod. Đợt tấn công nhiều khả năng gồm máy bay A-6, A-7 và EA-6. \n\n3. (TS) NHẬN XÉT: Không thu được lưu lượng điện đài chỉ huy tiêm kích, đợt tấn công nhiều khả năng không có hộ tống. \n\nFLASH FLASH FLASH\nButtonText=Xác nhận và tiếp tục\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=Sàn cất/hạ cánh của ENTERPRISE bị hư hại\nBody=ENTERPRISE không còn khả năng cho máy bay xuất kích.\nButtonText=Xác nhận và tiếp tục\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=Sân bay Hải quân Hoàng gia Thái Lan U-Tapao\nBody=Không tấn công cơ sở hạ tầng không quân của Thái Lan. Đại sứ quán Liên Xô tại Thái Lan xác nhận rằng máy bay Mỹ hạ cánh tại căn cứ này sẽ bị giam giữ cho đến khi chiến sự kết thúc. \nButtonText=Xác nhận và tiếp tục\nPopupStyle=Notification
