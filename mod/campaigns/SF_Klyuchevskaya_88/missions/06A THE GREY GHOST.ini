Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 6A </size>\灰色幽灵\n<size=24>25 0000Z FEB 88</size>\\nBody="人民"特遣舰队遭美国海军航母战斗群拦截。请突破包围圈，切勿损失基洛夫号或你的补给舰。\n\n注意：让某些单位存活将使其在战役后续阶段作为增援出现。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=红旗北方舰队\nTo="人民"特遣舰队\nInfo=红旗太平洋舰队\n第7作战支队\n第169混成航空兵团\n第17作战支队\n红旗太平洋舰队\nSubj=接触报告——企业号已被击沉\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于摧毁企业号（CVN-65）的电文报告。\n\n2. (S) 摧毁该航母将大幅削弱该区域的敌方空中和水面威胁。\n\n3. (S) 摧毁其战斗群其余部分为可选项。继续向金兰湾转移。特遣舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=根里赫·加萨诺夫号已被击沉\nBody="人民"特遣舰队已失去唯一的舰队油船。请以最快速度驶向印度科钦，接受印度海军拘留。\nButtonText=返回任务\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=红旗北方舰队\nTo="人民"特遣舰队\nInfo=第7作战支队\n第169混成航空兵团\n第17作战支队\nSubj=空袭警告\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (TS) 情况：信号情报显示，美国海军甚高频空中指挥通信显著增加。该通信增量与战前对美军"阿尔法打击"出动的判断相符。\n\n2. (TS) 判断：企业号正对"人民"特遣舰队发起多方向打击。打击机群可能包含A-6、A-7和EA-6飞机。\n\n3. (TS) 备注：未收到战斗机指挥通信，打击机群可能没有护航。\n\n特急 特急 特急\nButtonText=确认并继续\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=企业号飞行甲板受损\nBody=企业号已无法再放飞飞机。\nButtonText=确认并继续\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=乌达帕奥泰国皇家海军机场\nBody=不要攻击泰国的空中基础设施。苏联驻泰大使馆确认，在该基地降落的美国飞机将被拘留，直至战事结束。\nButtonText=确认并继续\nPopupStyle=Notification
