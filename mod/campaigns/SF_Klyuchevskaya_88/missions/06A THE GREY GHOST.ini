Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody=КИРОВ потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 6A </size>\СЕРЫЙ ПРИЗРАК\n<size=24>25 0000Z ФЕВ 88</size>\\nBody=КУГ «Народ» перехвачено авианосной группой ВМС США. Вырвитесь из ловушки и не потеряйте КИРОВ или ваш танкер снабжения.\n\nПримечание: выжившие корабли смогут появиться как подкрепление позже в кампании.\nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=КРАСНОЗНАМЁННЫЙ СЕВЕРНЫЙ ФЛОТ\nTo=УС НАРОД\nInfo=КТОФ\n7-я ОПЕРАТИВНАЯ ЭСКАДРА \n169-й СМЕШАННЫЙ АВИАЦИОННЫЙ ПОЛК\n17-я ОПЕРАТИВНАЯ ЭСКАДРА\nКТОФ\nSubj=ДОКЛАД ОБ ОБНАРУЖЕНИИ — ЭНТЕРПРАЙЗ ПОТОПЛЕН\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении ЭНТЕРПРАЙЗ CVN-65. \n\n2. (С) Уничтожение этого авианосца значительно снижает авиационную и надводную угрозу противника в регионе. \n\n3. (С) Уничтожение его авианосной группы необязательно. Продолжайте переход в бухту Камрань. УС передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=ГЕНРИХ ГАСАНОВ потоплен\nBody=КУГ «Народ» потеряло свой единственный войсковой танкер. Следуйте максимальной скоростью в Кочин, Индия, и позвольте интернировать себя индийским флотом. \nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=КРАСНОЗНАМЁННЫЙ СЕВЕРНЫЙ ФЛОТ\nTo=УС НАРОД\nInfo=7-я ОПЕРАТИВНАЯ ЭСКАДРА \n169-й СМЕШАННЫЙ АВИАЦИОННЫЙ ПОЛК\n17-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ПРЕДУПРЕЖДЕНИЕ О НАЛЁТЕ\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (СС) ОБСТАНОВКА: РТР отмечает значительный рост радиообмена ВМС США в УКВ-диапазоне авиационного управления. Рост радиообмена соответствует довоенным оценкам вылета американской «альфа-удар» группы. \n\n2. (СС) ОЦЕНКА: ЭНТЕРПРАЙЗ поднимает многоосевую ударную группу против КУГ «Народ». Удар вероятно включает самолёты A-6, A-7 и EA-6.\n\n3. (СС) КОММЕНТАРИИ: Радиообмен истребительного управления не зафиксирован, ударная группа вероятно без истребительного прикрытия. \n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Принять к сведению и продолжить\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=Полётная палуба ЭНТЕРПРАЙЗ повреждена\nBody=ЭНТЕРПРАЙЗ больше не может поднимать самолёты.\nButtonText=Принять к сведению и продолжить\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=Аэродром ВМС Таиланда У-Тапао\nBody=Не атаковать тайскую военную инфраструктуру. Советское посольство в Таиланде подтверждает, что американские самолёты, садящиеся на этой базе, будут интернированы до конца боевых действий. \nButtonText=Принять к сведению и продолжить\nPopupStyle=Notification
