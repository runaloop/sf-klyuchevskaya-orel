Taskforce2FlagshiplostMessage=Title=패배!\nBody=키로프가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제6A부 </size>\회색 유령\n<size=24>25 0000Z FEB 88</size>\\nBody=나로드 기동부대가 미 해군 항모전투단에 발각되었다. 포위망을 뚫고 탈출하되 키로프와 급유함을 잃지 않도록 하라.\n\n참고: 특정 함선이 생존하면 향후 캠페인에서 증원 전력으로 합류할 수 있다.\nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=적기 북방 함대\nTo=나로드 기동부대\nInfo=KTOF\n제7작전전대 \n제169혼성항공연대\n제17작전전대\nKTOF\nSubj=접촉 보고-엔터프라이즈 격침\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 엔터프라이즈 CVN-65 격침을 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 이 항공모함의 파괴는 해당 지역의 적 항공 및 수상 위협을 크게 감소시킨다. \n\n3. (S) 나머지 전투단의 파괴는 선택 사항이다. 캄란만으로 이동을 계속하라. 적기 북방 함대 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=겐리흐 가사노프 격침\nBody=나로드 기동부대가 유일한 함대 급유함을 잃었다. 인도 코친으로 최고 속력으로 항진하여 인도 해군에 억류되어라. \nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=적기 북방 함대\nTo=나로드 기동부대\nInfo=제7작전전대 \n제169혼성항공연대\n제17작전전대\nSubj=공습 경고\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (TS) 상황: SIGINT에 따르면 미 해군의 VHF 대역 항공 지휘 통신이 크게 증가했다. 통신량 증가는 전쟁 전 예측한 미군 "알파 스트라이크" 발진과 일치한다. \n\n2. (TS) 평가: 엔터프라이즈가 나로드 기동부대에 대해 다축 타격 편대를 발진시키고 있다. 타격 편대는 A-6, A-7, EA-6 항공기로 구성되었을 가능성이 높다.\n\n3. (TS) 논평: 전투기 지휘 통신은 수신되지 않았으며 타격 편대는 무호위일 가능성이 높다. \n\n긴급 긴급 긴급\nButtonText=확인 및 계속\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=엔터프라이즈 비행갑판 손상\nBody=엔터프라이즈는 더 이상 항공기를 발진시킬 수 없다.\nButtonText=확인 및 계속\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=우타파오 태국 해군 비행장\nBody=태국 항공 시설을 공격하지 마라. 태국 주재 소련 대사관에 따르면, 이 기지에 착륙하는 미군 항공기는 종전까지 억류될 것이다. \nButtonText=확인 및 계속\nPopupStyle=Notification
