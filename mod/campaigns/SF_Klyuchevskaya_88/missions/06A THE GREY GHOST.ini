Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 6A </size>\THE GREY GHOST\n<size=24>25 0000Z FEB 88</size>\\nBody=SF Narod has been caught by a USN CVBG. Break out of the trap and don't lose KIROV or your AOR.\n\nNote: Survival of certain units will allow them to appear as reinforcements later in the campaign.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce2BigESunkMessage=From=RED BANNER NORTHERN FLEET\nTo=SF NAROD\nInfo=KTOF\n7th OPERATIONAL SQN \n169th MIXED AVIATION REGT\n17th OPERATIONAL SQN\nKTOF\nSubj=CONTACT REPORT-ENTERPRISE SUNK\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of ENTERPRISE CVN-65. \n\n2. (S) Destruction of this carrier significantly reduces enemy air and surface threat in the region. \n\n3. (S) Destruction of her battlegroup optional. Continue transit to Cam Ranh Bay. SF sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2GenrikhGasanovsunkMessage=Title=GENRIKH GASANOV sunk\nBody=SF Narod has lost its only fleet oiler. Make best speed for Cochin, India and be interned by the Indian Navy. \nButtonText=Return to mission\nPopupStyle=Outro
Taskforce2BigEstrikeMessage=From=RED BANNER NORTHERN FLEET\nTo=SF NAROD\nInfo=7th OPERATIONAL SQN \n169th MIXED AVIATION REGT\n17th OPERATIONAL SQN\nSubj=RAID WARNING\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION: SIGINT indicates significant increase in USN VHF-band air command traffic. Traffic increase correlates to pre-war assessments of US "Alpha Strike" sortieing. \n\n2. (TS) ASSESSMENT: ENTERPRISE launching multi-axis strike package against SF Narod. Strike likely contains A-6, A-7 and EA-6 aircraft.\n\n3. (TS) COMMENTS: No fighter command traffic received, strike package likely unescorted. \n\nFLASH FLASH FLASH\nButtonText=Acknowledge and continue\nPopupStyle=NavalMessage
Taskforce2BigEFDDamageMessage=Title=ENTERPRISE's flight deck damaged\nBody=ENTERPRISE is no longer capable of launching aircraft.\nButtonText=Acknowledge and continue\nPopupStyle=Notification
Taskforce2NoShootThaiMessage=Title=U-Tapao Royal Thai Navy Airfield\nBody=Do not engage Thai air infrastructure. Soviet embassy in Thailand confirms that US aircraft landing at the base will be interned until hostilities cease. \nButtonText=Acknowledge and continue\nPopupStyle=Notification
