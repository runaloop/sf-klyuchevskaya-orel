Taskforce2FlagshiplostMessage=Title=DEFEAT!\nBody={FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 6 </size>\SUDDEN STRIKE\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName} has been tasked to support friendly landing ops. \n\nLight enemy air opposition expected.\n\nNote: Note: replenishment force en route from Petropavlovsk. Resupply and repair will be available post mission.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n14th LANDING SHIP BDE\n55th NAVAL INFANTRY DIV\nSubj=MISSION ACCOMPLISHED-LANDING SUCCESSFUL\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting successful landing at Hakodate. \n\n2. (S) Reports from 55th Naval Infantry Divsion indicate beachhead secure and clear for follow-on forces. \n\n3. (S) Transit East to RV with Petropavlovsk replenishment force. KTOF sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n14th LANDING SHIP BDE\n55th NAVAL INFANTRY DIV\nSubj=CASREP - LANDING SHIP LOST\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic regarding sunk friendly landing ship. \n\n2. (S) Remaining landing ship cannot deliver sufficient forces to secure beachhead. \n\n3. (S) Withdraw all forces immediately.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n14th LANDING SHIP BDE\n55th NAVAL INFANTRY DIV\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION: SIGINT reports CONSTELLATION CV-64 sortied strike package at 22 0030Z FEB 88. \n\n2. (TS) ASSESSMENT: Enemy strike package high probability contains 16+ aircraft including F/A-18A, A-6E, A-7E, and EA-6B. Enemy raid expected from Southeast, will enter AGM-84D HARPOON range in 30 mins. \n\n3. (TS) COMMENTS: Fokino scrambling interceptors to assist. Priority targets are enemy jammers and fighters. Unlikely your force will intercept A-6E before they fire harpoons, however, our pilots are trained in destroying incoming sea-skimmers with guns. \n\nFLASH FLASH FLASH\nButtonText=Continue Playing\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=Friendly Interceptors Scrambled\nBody=6x MiG-23A are now on station. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=Enemy Reinforcements\nBody=The Japanese are sending tanks to reinforce the beaches. \n\nTanks are expected to approach East of the landing area. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=Landing beach secured\nBody=The landing area has been sanitized of all enemy air, naval and ground forces. \nButtonText=Victory\nPopupStyle=Notification
Taskforce2LandingAreaMessage=Title=14th Landing Ship Brigade reached objective.\nBody=55th Naval Infantry Division is now disembarking. \nButtonText=Acknowledge and Continue\nPopupStyle=Notification
Objective_FlagshipSurvive={FlagshipName} must survive
Objective_LandatSpot=Land 55th Naval Infantry Division at marked beachhead
Objective_ProtectAmphibs=Both landing ships must survive
