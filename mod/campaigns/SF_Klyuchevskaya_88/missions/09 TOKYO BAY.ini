Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 09 </size>\VỊNH TOKYO\n<size=24>03 0200Z MAR 88</size>\\nBody={TaskForceName} được giao nhiệm vụ tiêu diệt một đoàn tàu vận tải rút quân của Nhật Bản gần Vịnh Tokyo. \n\nGhi chú: lực lượng đặc nhiệm của các đồng chí sẽ gặp gỡ một đoàn tàu tiếp tế sau nhiệm vụ\nButtonText=Đóng\nPopupStyle=Intro
