Taskforce2TransitCompleteMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ДОКЛАД О ПРОХОДЕ — ЗАДАНИЕ ВЫПОЛНЕНО\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об успешном проходе Курильских островов.\n\n2. (С) Продолжить переход в район ОПБОКС РЮРИК и ожидать указаний по действиям против конвоев. \n\n3. (С) Отличная работа, товарищ. Будьте готовы к дальнейшим действиям. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody={FlagshipName} потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 3 </size>\В СЕВЕРНУЮ ЧАСТЬ ТИХОГО ОКЕАНА\n<size=24>09 2000Z ФЕВ 88</size>\\nBody=КУГ «Ключевская» должно пройти Курильские острова. Ожидается сильное противодействие подводных лодок. Впереди — богатая целями северная часть Тихого океана. \n\nВсе японские и американские торговые цели считаются враждебными, атака разрешена. \n\nПримечание: из-за плотного графика операции после выполнения задания пункты ремонта и пополнения боезапаса не ожидаются. Расходуйте боеприпасы разумно. \nButtonText=Начать миссию\nPopupStyle=Intro
