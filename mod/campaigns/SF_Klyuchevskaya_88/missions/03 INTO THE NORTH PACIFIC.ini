Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=BÁO CÁO VƯỢT EO-HOÀN THÀNH NHIỆM VỤ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc vượt qua Quần đảo Kuril thành công.\n\n2. (S) Tiếp tục di chuyển đến OPBOX RURIK và chờ chỉ thị tập kích đoàn tàu vận tải. \n\n3. (S) Làm tốt lắm, đồng chí. Duy trì trạng thái sẵn sàng cho các hoạt động sắp tới. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2FlagshiplostMessage=Title=THẤT BẠI!\nBody={FlagshipName} đã bị đánh chìm!\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 3 </size>\VÀO BẮC THÁI BÌNH DƯƠNG\n<size=24>09 2000Z FEB 88</size>\\nBody={TaskForceName} phải vượt qua Quần đảo Kuril. Dự kiến sẽ gặp sự chống đối mạnh từ tàu ngầm. Một vùng Bắc Thái Bình Dương đầy mục tiêu đang chờ đợi. \n\nMọi mục tiêu tàu buôn Nhật Bản và Mỹ đều được coi là thù địch và có thể tấn công tự do. \n\nGhi chú: do lịch trình hành quân gấp gáp, không có cơ sở sửa chữa hay tái vũ trang được dự kiến sau nhiệm vụ này. Hãy sử dụng đạn dược một cách khôn ngoan. \nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2ConvoySunkMessage=Title=Đoàn tàu vận tải nhanh bị đánh chìm\nBody=Hạm đội 7 của Mỹ sẽ rất tiếc nuối lô hàng TASM và SM-2MR này. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
