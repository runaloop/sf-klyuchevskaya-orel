Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 3 </size>\VERS LE PACIFIQUE NORD\n<size=24>09 2000Z FEB 88</size>\\nBody={TaskForceName} doit franchir les îles Kouriles. Attendez-vous à une forte opposition sous-marine. Un Pacifique Nord riche en cibles vous attend. \n\nTous les navires marchands japonais et américains sont considérés hostiles et peuvent être engagés librement. \n\nRemarque : en raison du calendrier opérationnel serré, aucune installation de réparation ou de réarmement n'est attendue après la mission. Utilisez vos munitions avec discernement. \nButtonText=Commencer la mission\nPopupStyle=Intro
