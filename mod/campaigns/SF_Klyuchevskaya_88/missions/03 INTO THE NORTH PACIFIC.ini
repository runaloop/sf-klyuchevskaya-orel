Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=RAPPORT DE TRANSIT-MISSION ACCOMPLIE\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant le franchissement réussi des îles Kouriles.\n\n2. (S) Poursuivez le transit vers OPBOX RURIK et attendez les instructions de raid sur les convois. \n\n3. (S) Excellent travail, camarade. Restez prêts pour les opérations à venir. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
