Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 3 </size>\HINEIN IN DEN NORDPAZIFIK\n<size=24>09 2000Z FEB 88</size>\\nBody={TaskForceName} muss die Kurilen durchfahren. Starker U-Boot-Widerstand ist zu erwarten. Ein zielreicher Nordpazifik erwartet Sie. \n\nAlle japanischen und amerikanischen Handelsschiffziele gelten als feindlich und dürfen ungehindert angegriffen werden. \n\nHinweis: Aufgrund des engen Einsatzplans werden nach dieser Mission keine Reparatur- oder Bewaffnungseinrichtungen erwartet. Munition mit Bedacht einsetzen. \nButtonText=Mission starten\nPopupStyle=Intro
