Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=INFORME DE TRÁNSITO-MISIÓN CUMPLIDA\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa del tránsito exitoso de las Islas Kuriles.\n\n2. (S) Continúe el tránsito hacia la ZONA DE OPERACIONES RURIK y espere instrucciones de ataque a convoyes. \n\n3. (S) Excelente trabajo, camarada. Manténgase listo para futuras operaciones. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
