Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제3부 </size>\북태평양 진입\n<size=24>09 2000Z FEB 88</size>\\nBody={TaskForceName}는 쿠릴 열도를 통과해야 한다. 강력한 잠수함 저항이 예상된다. 표적이 풍부한 북태평양이 기다리고 있다. \n\n일본 및 미국의 모든 상선 표적은 적대적인 것으로 간주하며 교전이 허용된다. \n\n참고: 촉박한 작전 일정으로 인해 임무 종료 후 수리 및 재무장 시설은 이용할 수 없을 것이다. 탄약을 신중히 사용하라. \nButtonText=임무 시작\nPopupStyle=Intro
