Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=DURCHFAHRTMELDUNG - AUFTRAG ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die erfolgreiche Durchfahrt der Kurilen.\n\n2. (S) Durchfahrt zum OPGEBIET RURIK fortsetzen und Anweisungen für Konvoiüberfälle abwarten. \n\n3. (S) Ausgezeichnete Arbeit, Genosse. Bereithalten für künftige Einsätze. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
