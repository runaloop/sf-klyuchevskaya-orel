Taskforce2TransitCompleteMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=通过报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于成功通过千岛群岛的电文报告。\n\n2. (S) 继续前往留里克战区，等待关于袭击船队的指示。\n\n3. (S) 干得好，同志。请为后续行动保持战备。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
