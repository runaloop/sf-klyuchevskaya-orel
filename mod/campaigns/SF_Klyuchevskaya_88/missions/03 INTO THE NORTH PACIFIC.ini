Taskforce2TransitCompleteMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=通過報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 千島列島通過成功を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 作戦区域「ルーリク」への移動を継続し、船団襲撃命令を待機せよ。\n\n3. (S) 見事な働きだ、同志。今後の作戦に備え、待機を継続せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2FlagshiplostMessage=Title=敗北！\nBody={FlagshipName}が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第3部 </size>\北太平洋への進出\n<size=24>09 2000Z FEB 88</size>\\nBody={TaskForceName}は千島列島を通過しなければならない。強力な潜水艦の抵抗を予期せよ。北太平洋には標的が豊富に待ち構えている。\n\n日米両国籍のすべての商船目標は敵性とみなし、自由に交戦してよい。\n\n注：作戦日程が厳しいため、任務終了後の修理・補給施設の利用は見込めない。弾薬は賢く使用せよ。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2ConvoySunkMessage=Title=高速船団撃沈\nBody=このTASMとSM-2MRの補給物資は、米第7艦隊にとって大きな痛手となるだろう。\nButtonText=作戦続行\nPopupStyle=Notification
