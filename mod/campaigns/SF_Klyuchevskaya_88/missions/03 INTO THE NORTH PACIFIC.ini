Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 3 </size>\HACIA EL PACÍFICO NORTE\n<size=24>09 2000Z FEB 88</size>\\nBody={TaskForceName} debe transitar a través de las Islas Kuriles. Se espera fuerte oposición submarina. Un Pacífico Norte rico en objetivos les espera. \n\nTodos los objetivos mercantes japoneses y estadounidenses se consideran hostiles y pueden ser atacados libremente. \n\nNota: debido al calendario operativo ajustado, no se esperan instalaciones de reparación ni rearme después de la misión. Use el armamento con inteligencia. \nButtonText=Iniciar misión\nPopupStyle=Intro
