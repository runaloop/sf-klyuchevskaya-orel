Taskforce2AllsubslostMessage=Title=¡DERROTA!\nBody=No le quedan submarinos.\nButtonText=Volver a la misión\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 8A </size>\EL SERVICIO SILENCIOSO\n<size=24>03 0100Z Mar 88</size>\\nBody=El K-242 y el K-525 han sido encargados de hundir al NIMITZ CVN-68. \n\nEl objetivo prioritario es el NIMITZ, cualquier crucero AEGIS, y luego cualquier crucero de misiles restante. Todos los demás objetivos son opcionales. \n\nSegún la disponibilidad logística, se le asignarán submarinos adicionales.\nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=10.ª DIVISIÓN SUBMARINA\n11.ª DIVISIÓN SUBMARINA\nSubj=INFORME SUBMARINO-OBJETIVO DESTRUIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción del NIMITZ y de escoltas de alto valor. \n\n2. (S) La pérdida de estas unidades degrada severamente el poder aéreo enemigo en la zona de operaciones. \n\n3. (S) Buen trabajo, camarada, regrese a Petropávlovsk para reabastecerse. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=NIMITZ Hundido\nBody=Tras recibir un castigo tremendo, el portaaviones estadounidense finalmente se hunde. El poder aéreo estadounidense se reduce de forma permanente en el teatro de operaciones. Por esta hazaña, seguramente será condecorado como Héroe de la Unión Soviética. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=VALLEY FORGE Hundido\nBody=Las emisiones características del radar SPY-1 se interrumpen de repente, seguidas poco después de un profundo estruendo por todo su submarino. El crucero estadounidense acaba de detonar su santabárbara de misiles de proa. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=CG de la USN hundido\nBody=Ambos cruceros estadounidenses han sido hundidos.\nButtonText=Seguir jugando\nPopupStyle=Notification
Objective_Onesublives=Al menos 1 submarino debe sobrevivir
Objective_SinkNimitz=Hundir el NIMITZ
Objective_SinkValleyForge=Hundir el VALLEY FORGE
Objective_SinkCG=[Opcional] Hundir todos los cruceros de misiles
