Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 8A </size>\THE SILENT SERVICE\n<size=24>03 0100Z Mar 88</size>\\nBody=K-242 and K-525 have been tasked to sink NIMITZ CVN-68. \n\nTarget priority is NIMITZ, any AEGIS cruiser, and then any remaining missile cruisers. All other targets are optional. \n\nDepending on logistics availability, additional subs will be tasked to you.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=10th SUBMARINE DIV\n11th SUBMARINE DIV\nSubj=SUB REPORT-TARGET DESTROYED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of NIMITZ and high-value escorts. \n\n2. (S) Loss of these units severely degrades enemy airpower in AO. \n\n3. (S) Good work, Comrade, return to Petropavlovsk for resupply. KTOF sends.\nButtonText=Continue Playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=NIMITZ Sunk\nBody=After taking tremendous punishment, the American aircraft carrier is finally going down. American airpower is permanently reduced in the theater. For this achievement you will surely be awared Hero of the Soviet Union. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=VALLEY FORGE Sunk\nBody=The distinct emissions of the SPY-1 radar suddenly cut out, followed shortly after by a deep rumble throughout your submarine. The American cruiser has just detonated its forward missile magazine. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=USN CG sunk Sunk\nBody=Both American cruisers have been sunk.\nButtonText=Continue Playing\nPopupStyle=Notification
