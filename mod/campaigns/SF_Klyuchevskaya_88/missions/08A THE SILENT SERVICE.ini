Taskforce2AllsubslostMessage=Title=战败！\nBody=你已没有潜艇剩余。\nButtonText=返回任务\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 8A </size>\静默部队\n<size=24>03 0100Z Mar 88</size>\\nBody=K-242和K-525奉命击沉尼米兹号（CVN-68）。\n\n目标优先级为尼米兹号、任意宙斯盾巡洋舰，其次为任意剩余导弹巡洋舰。其余目标均为可选。\n\n视后勤保障情况，可能会有额外潜艇加入本任务。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=红旗太平洋舰队\nTo=K-242\nInfo=第10潜艇支队\n第11潜艇支队\nSubj=潜艇报告——目标已摧毁\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于摧毁尼米兹号及其高价值护航舰的电文报告。\n\n2. (S) 这些单位的损失严重削弱了敌方在本作战区域的空中力量。\n\n3. (S) 干得好，同志，返回彼得罗巴甫洛夫斯克补给。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=尼米兹号已被击沉\nBody=在承受巨大打击之后，这艘美国航母终于沉没了。美国的空中力量在该战区被永久性削弱。凭此战功，你必将被授予苏联英雄称号。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=福吉谷号已被击沉\nBody=SPY-1雷达特有的辐射信号突然中断，紧接着一阵深沉的轰鸣响彻你的潜艇。这艘美国巡洋舰的前部导弹弹药库刚刚发生了殉爆。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=美国海军巡洋舰已被击沉\nBody=两艘美国巡洋舰均已被击沉。\nButtonText=继续游戏\nPopupStyle=Notification
Objective_Onesublives=至少1艘潜艇必须存活
