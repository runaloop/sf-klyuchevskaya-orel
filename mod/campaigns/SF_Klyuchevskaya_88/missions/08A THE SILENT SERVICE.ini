Taskforce2AllsubslostMessage=Title=敗北！\nBody=貴官の潜水艦はすべて失われた。\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第8A部 </size>\静かなる任務\n<size=24>03 0100Z Mar 88</size>\\nBody=K-242およびK-525は、ニミッツ CVN-68の撃沈を命じられた。\n\n優先目標はニミッツ、続いてイージス巡洋艦、その後残存するミサイル巡洋艦の順である。その他の目標はすべて任意とする。\n\n後方支援の状況によっては、追加の潜水艦が配属される。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=第10潜水艦師団\n第11潜水艦師団\nSubj=潜水艦報告――目標撃破\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) ニミッツおよび高価値護衛艦の撃沈を報告する貴官の通信を受信したことを確認する。\n\n2. (S) これらの艦の損失により、当該作戦海域における敵の航空戦力は著しく低下する。\n\n3. (S) 見事な働きだ、同志。補給のためペトロパブロフスクへ帰投せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=ニミッツ 撃沈\nBody=幾多の打撃を受けた末、米空母はついに沈没していく。当戦域における米軍の航空戦力は永続的に減少した。この戦功により、貴官には間違いなくソ連英雄勲章が授与されるであろう。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=フォージ 撃沈\nBody=SPY-1レーダー特有の電波が突然途絶え、その直後、貴艦全体に重い轟音が響き渡る。米巡洋艦の前部ミサイル弾庫が誘爆したのだ。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=米海軍CG撃沈\nBody=両方の米巡洋艦が撃沈された。\nButtonText=作戦続行\nPopupStyle=Notification
Objective_Onesublives=潜水艦を最低1隻生存させること
