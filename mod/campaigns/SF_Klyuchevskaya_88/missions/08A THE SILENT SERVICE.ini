Taskforce2AllsubslostMessage=Title=THẤT BẠI!\nBody=Các đồng chí không còn tàu ngầm nào.\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 8A </size>\LỰC LƯỢNG THẦM LẶNG\n<size=24>03 0100Z Mar 88</size>\\nBody=K-242 và K-525 được giao nhiệm vụ đánh chìm NIMITZ CVN-68. \n\nMục tiêu ưu tiên là NIMITZ, bất kỳ tuần dương hạm AEGIS nào, rồi sau đó là các tuần dương hạm mang tên lửa còn lại. Mọi mục tiêu khác đều là tùy chọn. \n\nTùy theo khả năng hậu cần, sẽ có thêm tàu ngầm được giao cho các đồng chí.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=SƯ ĐOÀN TÀU NGẦM 10\nSƯ ĐOÀN TÀU NGẦM 11\nSubj=BÁO CÁO TÀU NGẦM-MỤC TIÊU BỊ TIÊU DIỆT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt NIMITZ và các tàu hộ tống giá trị cao. \n\n2. (S) Việc mất các đơn vị này làm suy giảm nghiêm trọng sức mạnh không quân của đối phương trong khu vực tác chiến. \n\n3. (S) Làm tốt lắm, đồng chí, trở về Petropavlovsk để tiếp tế. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=NIMITZ bị đánh chìm\nBody=Sau khi hứng chịu tổn thất nặng nề, tàu sân bay Mỹ cuối cùng cũng chìm. Sức mạnh không quân của Mỹ trong khu vực đã bị suy giảm vĩnh viễn. Với thành tích này, các đồng chí chắc chắn sẽ được trao tặng danh hiệu Anh hùng Liên Xô. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=VALLEY FORGE bị đánh chìm\nBody=Tín hiệu đặc trưng của radar SPY-1 bất ngờ tắt hẳn, tiếp theo là một tiếng rung ầm sâu vang khắp tàu ngầm của các đồng chí. Tuần dương hạm Mỹ vừa cho nổ hầm chứa tên lửa phía trước. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=Tuần dương hạm USN bị đánh chìm\nBody=Cả hai tuần dương hạm của Mỹ đều đã bị đánh chìm.\nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Objective_Onesublives=Ít nhất 1 tàu ngầm phải sống sót
