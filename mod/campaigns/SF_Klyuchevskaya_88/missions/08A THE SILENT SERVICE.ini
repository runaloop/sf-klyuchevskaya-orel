Taskforce2AllsubslostMessage=Title=ПОРАЖЕНИЕ!\nBody=У вас не осталось ни одной подлодки.\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 8A </size>\БЕЗМОЛВНАЯ СЛУЖБА\n<size=24>03 0100Z Mar 88</size>\\nBody=К-242 и К-525 получили задачу уничтожить НИМИЦ CVN-68. \n\nПриоритет целей: НИМИЦ, любой крейсер AEGIS, затем любые оставшиеся ракетные крейсера. Все остальные цели необязательны. \n\nВ зависимости от логистических возможностей вам может быть придано дополнительное количество подлодок.\nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=КТОФ\nTo=К-242\nInfo=10-я ДИВИЗИЯ ПОДВОДНЫХ ЛОДОК\n11-я ДИВИЗИЯ ПОДВОДНЫХ ЛОДОК\nSubj=ДОКЛАД ПОДЛОДКИ — ЦЕЛЬ УНИЧТОЖЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении НИМИЦ и ценных кораблей охранения. \n\n2. (С) Потеря этих кораблей серьёзно снижает авиационную мощь противника в районе действий. \n\n3. (С) Хорошая работа, товарищ, возвращайтесь в Петропавловск для пополнения запасов. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=НИМИЦ потоплен\nBody=Получив колоссальные повреждения, американский авианосец наконец идёт на дно. Американская авиационная мощь на театре снижена навсегда. За этот подвиг вам, несомненно, присвоят звание Героя Советского Союза. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=ВЕЛЛИ-ФОРДЖ потоплен\nBody=Характерное излучение радара SPY-1 внезапно пропадает, а затем по вашей подлодке проходит глубокий гул. Американский крейсер только что подорвал свой носовой ракетный погреб. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=Крейсер ВМС США потоплен\nBody=Оба американских крейсера потоплены.\nButtonText=Продолжить\nPopupStyle=Notification
Objective_Onesublives=Должна уцелеть хотя бы 1 подлодка
Objective_SinkNimitz=Уничтожить НИМИЦ
Objective_SinkValleyForge=Уничтожить ВЕЛЛИ-ФОРДЖ
Objective_SinkCG=[Опционально] Уничтожить все ракетные крейсера
