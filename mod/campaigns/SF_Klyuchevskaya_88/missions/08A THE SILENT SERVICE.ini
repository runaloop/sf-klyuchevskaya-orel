Taskforce2AllsubslostMessage=Title=패배!\nBody=남은 잠수함이 없다.\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제8A부 </size>\침묵의 함대\n<size=24>03 0100Z Mar 88</size>\\nBody=K-242와 K-525는 니미츠 CVN-68을 격침하라는 임무를 받았다. \n\n우선 표적은 니미츠, 이후 이지스 순양함, 그다음 남은 미사일 순양함 순이다. 그 외 모든 표적은 선택 사항이다. \n\n병참 상황에 따라 추가 잠수함이 배정될 수 있다.\nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=제10잠수함사단\n제11잠수함사단\nSubj=잠수함 보고-표적 격침\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 니미츠 및 고가치 호위함 격침을 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 이들 전력의 손실은 작전구역 내 적 항공 전력을 심각하게 저하시킨다. \n\n3. (S) 잘했다, 동무. 재보급을 위해 페트로파블롭스크로 귀환하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=니미츠 격침\nBody=엄청난 타격을 받은 끝에 미국 항공모함이 마침내 침몰한다. 이 전구에서 미군의 항공 전력이 영구적으로 감소했다. 이 전공으로 귀관은 반드시 소련 영웅 칭호를 받을 것이다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=밸리 포지 격침\nBody=SPY-1 레이더의 특징적인 방사가 갑자기 끊기고, 곧이어 잠수함 전체에 깊은 진동이 전해진다. 미국 순양함이 전방 미사일 격납고를 방금 폭발시켰다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=미 해군 순양함 격침\nBody=미국 순양함 두 척 모두 격침되었다.\nButtonText=계속 진행\nPopupStyle=Notification
Objective_Onesublives=잠수함 최소 1척 생존
Objective_SinkNimitz=니미츠 격침
Objective_SinkValleyForge=밸리 포지 격침
Objective_SinkCG=[선택] 모든 미사일 순양함 격침
