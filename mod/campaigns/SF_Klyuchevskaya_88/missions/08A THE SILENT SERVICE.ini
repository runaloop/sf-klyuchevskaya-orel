Taskforce2AllsubslostMessage=Title=NIEDERLAGE!\nBody=Sie haben keine U-Boote mehr.\nButtonText=Zur Mission zurückkehren\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 8A </size>\DER LAUTLOSE DIENST\n<size=24>03 0100Z Mar 88</size>\\nBody=K-242 und K-525 haben den Auftrag, die NIMITZ CVN-68 zu versenken. \n\nZielpriorität ist NIMITZ, jeder AEGIS-Kreuzer und danach jeder verbleibende Lenkwaffenkreuzer. Alle anderen Ziele sind optional. \n\nJe nach logistischer Verfügbarkeit werden Ihnen zusätzliche U-Boote zugeteilt.\nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=10. U-Boot-Division\n11. U-Boot-Division\nSubj=U-BOOT-MELDUNG - ZIEL VERNICHTET\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung der NIMITZ und hochwertiger Geleitschiffe. \n\n2. (S) Der Verlust dieser Einheiten schwächt die feindliche Luftmacht im Einsatzgebiet erheblich. \n\n3. (S) Gute Arbeit, Genosse, zurückkehren nach Petropawlowsk zum Nachschub. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=NIMITZ versenkt\nBody=Nach gewaltigen Treffern geht der amerikanische Flugzeugträger endlich unter. Die amerikanische Luftmacht ist im Theater dauerhaft verringert. Für diese Leistung werden Sie sicherlich zum Helden der Sowjetunion ernannt. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=VALLEY FORGE versenkt\nBody=Die charakteristischen Emissionen des SPY-1-Radars brechen plötzlich ab, kurz darauf folgt ein tiefes Grollen durch Ihr U-Boot. Der amerikanische Kreuzer hat gerade sein vorderes Flugkörpermagazin zur Explosion gebracht. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=USN-Lenkwaffenkreuzer versenkt\nBody=Beide amerikanischen Kreuzer wurden versenkt.\nButtonText=Weiterspielen\nPopupStyle=Notification
Objective_Onesublives=Mindestens 1 U-Boot muss überleben
Objective_SinkNimitz=NIMITZ versenken
Objective_SinkValleyForge=VALLEY FORGE versenken
Objective_SinkCG=[Optional] Alle Lenkwaffenkreuzer versenken
