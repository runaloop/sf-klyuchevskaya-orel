Taskforce2AllsubslostMessage=Title=DÉFAITE !\nBody=Vous n'avez plus aucun sous-marin.\nButtonText=Retour à la mission\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 8A </size>\LE SERVICE SILENCIEUX\n<size=24>03 0100Z Mar 88</size>\\nBody=Le K-242 et le K-525 sont chargés de couler le NIMITZ CVN-68. \n\nLa cible prioritaire est le NIMITZ, suivi de tout croiseur AEGIS, puis de tout croiseur lance-missiles restant. Toutes les autres cibles sont optionnelles. \n\nSelon la disponibilité logistique, des sous-marins supplémentaires vous seront affectés.\nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo=K-242\nInfo=10th SUBMARINE DIV\n11th SUBMARINE DIV\nSubj=RAPPORT SOUS-MARIN-CIBLE DÉTRUITE\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction du NIMITZ et de ses escortes de haute valeur. \n\n2. (S) La perte de ces unités dégrade sévèrement la puissance aérienne ennemie dans la zone d'opérations. \n\n3. (S) Bon travail, camarade, regagnez Petropavlovsk pour vous réapprovisionner. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2NimitzKillMessage=Title=NIMITZ coulé\nBody=Après avoir subi d'énormes dégâts, le porte-avions américain finit par sombrer. La puissance aérienne américaine est durablement réduite dans le théâtre. Pour cet exploit, vous recevrez certainement le titre de Héros de l'Union soviétique. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2ValleyForgeKillMessage=Title=VALLEY FORGE coulé\nBody=Les émissions caractéristiques du radar SPY-1 s'interrompent soudainement, suivies peu après d'un profond grondement dans tout votre sous-marin. Le croiseur américain vient de faire exploser son soute à missiles avant. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2CGKillMessage=Title=Croiseur de l'US Navy coulé\nBody=Les deux croiseurs américains ont été coulés.\nButtonText=Continuer la partie\nPopupStyle=Notification
Objective_Onesublives=Au moins un sous-marin doit survivre
Objective_SinkNimitz=Couler le NIMITZ
Objective_SinkValleyForge=Couler le VALLEY FORGE
Objective_SinkCG=[Optionnel] Couler tous les croiseurs lance-missiles
