[AllowedVessels]
wp_rkr_kirov=Navire amiral de la Flotte du Nord de la Bannière rouge, ce croiseur lance-missiles à propulsion nucléaire a été transféré en raison des impératifs de la guerre. Il est armé d'une batterie de 20x missiles antinavires SS-N-19 Shipwreck d'une portée de 270 nm, dotés d'un guidage en essaim avancé. Il dispose également de 96x cellules de SAM SA-N-6 et d'une excellente suite sonar. \n\nCe navire est le mieux employé comme navire amiral d'escadre, bien protégé par des escortes ASW.
wp_rkr_slava=Navire amiral de la Flotte du Pacifique de la Bannière rouge, ce croiseur lance-missiles porte une impressionnante batterie de 16x missiles antinavires SS-N-12 Sandbox d'une portée de 300 nm et à guidage en essaim. Associé aux 16x SS-N-19 du Tbilisi, il permet de délivrer, une fois si le besoin s'en présente, une salve combinée de 32 missiles. Il transporte également 64x cellules de SAM SA-N-6 pour la défense aérienne de la flotte, ainsi qu'un VDS.
wp_takr_kiev=Porte-avions V/STOL pouvant emporter jusqu'à 36x Yak-38 Forger, Ka-25 Hormone et Ka-27 Helix, ce navire est conçu pour la lutte ASW de zone et la défense aérienne locale. Il porte également une batterie de 8x missiles SS-N-12 Sandbox pour une capacité offensive à longue portée. \n\nREMARQUE : la capacité de rechargement du SS-N-12 ne fonctionne pas totalement, vous pouvez obtenir jusqu'à 2 rechargements par mission, ne comptez donc pas sur cette fonctionnalité. \n\nREMARQUE : en difficile, ce porte-avions n'est pas livré avec son propre groupe aérien.
wp_cv_orel=La classe Orel du projet 1160 est le premier véritable porte-avions de flotte de la marine soviétique, doté de catapultes, de brins d'arrêt et d'une capacité d'emport allant jusqu'à 60 appareils : chasseurs MiG-23A Flogger, avions de frappe et de guerre électronique Ko-45, avions ASW P-42 et AEW P-42RLDN, ainsi que des hélicoptères Ka-27 Helix. Il offre à la force opérationnelle une véritable défense aérienne de flotte, une capacité de frappe à distance et une image radar aéroportée. Il porte également 16x missiles antinavires SS-N-19 Shipwreck, des SAM SA-N-7 et SA-N-4 ainsi que des CIWS, mais il s'agit de la coque la plus précieuse de la flotte, dont le remplacement serait extrêmement coûteux : veillez donc à toujours l'escorter.
wp_kr_sverdlov=Obsolètes à l'ère moderne du missile, ces croiseurs légers restent très efficaces dans les rôles de bombardement de surface et de raid contre les navires marchands. Avec de profonds magasins de canons de 6 pouces et une protection convenable, ces navires surclassent en portée et en puissance de feu presque tout navire de guerre de l'OTAN qu'ils rencontrent.
wp_bpk_kara=Le croiseur lance-missiles de la classe Kara est un croiseur bien équilibré, axé sur l'ASW et l'AAW. Il porte 8x missiles ASW polyvalents SS-N-14 Silex-B, permettant des attaques à distance contre les sous-marins de l'OTAN équipés de torpilles Mk-48. Il dispose également d'une bonne batterie SAM avec des SA-N-3 à double rampe pour la défense aérienne de zone et des SA-N-4 latéraux pour la défense rapprochée. Associé à un hangar pour hélicoptère et un VDS, le Kara est un bon combattant de surface polyvalent.
wp_bpk_kresta2=Le croiseur lance-missiles de la classe Kresta II est une modification à vocation ASW de la classe Kresta I. Cette classe échange 4x SS-N-3 Sepal contre 8x missiles ASW à distance SS-N-14 Silex-A et une batterie SA-N-3 à plus longue portée. Il dispose également d'un hangar pour hélicoptère, accueillant une seule variante de Ka-25.
wp_rkr_kresta1=Le croiseur lance-missiles de la classe Kresta I est basé sur la classe Kynda, échangeant la moitié de sa batterie SS-N-3B Sepal contre une meilleure tenue à la mer, une défense aérienne accrue et une portée supérieure. Il dispose également d'un hangar pour hélicoptère, accueillant une seule variante de Ka-25.
wp_rkr_kynda=Le croiseur lance-missiles de la classe Kynda est conçu avec une forte orientation ASuW. Avec 8x SS-N-3B Sepal et 8 rechargements supplémentaires, c'est une plateforme conçue pour les attaques antinavires à distance. Il possède toutefois une capacité ASW et AAW très limitée et nécessite donc des escortes AAW et ASW pour fonctionner efficacement.
wp_em_sovremenny=Le destroyer de la classe Sovremennyy est un destroyer bien équilibré, axé sur l'ASuW et la défense antiaérienne. Il porte 8x missiles supersoniques SS-N-22 Sunburn volant en rase-mer, capables de dévaster la plupart des combattants de surface. Le SA-N-7 à double rampe offre une cadence de tir élevée, jusqu'à 6 cibles individuelles et une bonne discrimination des cibles à basse altitude. Il possède également un hangar pouvant accueillir toute variante de Ka-25 ou Ka-27, ainsi qu'une très bonne suite ESM. Enfin, il dispose de 2 tourelles doubles de 130 mm, à cadence de tir élevée et longue portée, l'un des rares navires de guerre soviétiques capables de dépasser la portée du 5"/54.
wp_bpk_udaloy=Le destroyer de la classe Udaloy est conçu pour une orientation purement ASW. Avec 8x missiles ASW polyvalents SS-N-14 Silex-B, il dispose d'une capacité d'engagement à distance contre la torpille Mk-48. Il possède également une batterie SA-N-9 axée sur la défense rapprochée, offrant une protection à très courte portée contre les attaques de saturation à basse altitude. Avec 2 hangars pour hélicoptères et une excellente suite sonar, c'est le meilleur navire ASW de l'URSS.
wp_bpk_kashin=La classe Kashin est une série de destroyers axés sur l'AAW et l'ASW, datant des années 60. Les Kashin de la Flotte du Pacifique n'ont jamais reçu la modernisation du Projet 61MP et restent donc sans CIWS, VDS ni batteries SS-N-2. Leurs faibles capacités de défense aérienne signifient qu'ils ne devraient être employés que contre des menaces de surface et aériennes de faible niveau.
wp_bpk_kanin=La classe Kanin est une série de destroyers axés sur l'AAW, datant des années 60. Ils sont équipés de CIWS mais restent très vulnérables face aux attaques aériennes et aux missiles à basse altitude.
wp_skr_krivak1=La classe Krivak I est une série de navires « cheval de travail » dotés d'une défense aérienne à courte portée et d'une capacité ASW à distance. Ils sont équipés d'un VDS mais manquent de hangar pour hélicoptère, ce qui limite leurs recherches ASW. Leur absence de CIWS et les faibles performances de leur SAM à basse altitude signifient qu'ils sont le mieux employés en association avec de plus grands croiseurs soviétiques.
wp_skr_krivak2=La classe Krivak II est une amélioration de la précédente classe Krivak I. Elle porte le missile ASW polyvalent amélioré SS-N-14 Silex-B, offrant une capacité ASuW à courte portée. Elle est également mieux armée, avec des canons automatiques doubles de 4 pouces, offrant une bonne capacité de bombardement côtier et de tir. Elle partage cependant les mêmes faiblesses que la Krivak I, avec une AAW famélique et une détection ASW limitée à courte portée.

[AllowedHelicopters]
wp_ka-25=Le Ka-25PL est un hélicoptère ASW correct, capable de se loger dans tous les hangars soviétiques pour hélicoptères. Sa charge utile limitée impose des configurations soit à bouées acoustiques, soit à torpilles. Il dispose cependant d'un sonar plongeant et d'un radar de recherche de surface convenables. Le Ka-25PL propose également des configurations à bombes et roquettes, permettant un travail ASuW limité là où la menace aérienne est faible ou nulle. \n\nREMARQUE : peut transporter 10 passagers.
wp_ka-25ts=Le Ka-25TS est un hélicoptère de patrouille maritime dédié, doté d'un radar de recherche de surface à longue portée pour la désignation d'objectif à distance des salves de SS-N-3 Sepal, SS-N-12 Sandbox et SS-N-19 Shipwreck. Ces hélicoptères ne survivraient pas à des chasseurs hostiles ; ils sont donc mieux employés à basse altitude, radar éteint, ne remontant brièvement que pour l'acquisition de cible. \n\nREMARQUE : peut transporter 10 passagers.
wp_ka-27=Le Ka-27PL est une évolution à plus longue portée du Ka-25PL. Il apporte des gains importants en charge utile et en endurance. Ses configurations ASW sont équilibrées, supprimant les limitations « chasseur/tueur » du Ka-25PL. Comme son prédécesseur, il dispose d'un sonar plongeant et d'un radar de recherche de surface. La configuration de frappe emporte une charge plus lourde, à une portée bien supérieure à celle du Yak-38. \n\nREMARQUE : peut transporter 10 passagers.
wp_ka-29=Le Ka-29 est une variante d'hélicoptère d'attaque du Ka-27PL. Il emporte des missiles antichars guidés, des roquettes, des bombes et un canon automatique de 30 mm pour les missions d'attaque au sol. \n\nREMARQUE : peut transporter 16 passagers.

[AllowedAircraft]
wp_yak-38=Le Yak-38 Forger est un chasseur-bombardier V/STOL, adapté aux missions ASuW à faible risque et à la défense aérienne locale. Dépourvu de radar et de réservoirs largables, le Yak-38 est limité en portée et en capacités. Il est le mieux employé pour intercepter les MPA de l'OTAN et les bombardiers sans escorte. C'est également un moyen économique de couler le trafic marchand désarmé et les navires de surface faiblement armés de la JMSDF et de l'US Navy. Dans l'ensemble, ils sont destinés à protéger la force opérationnelle des missiles antinavires lancés à distance depuis les airs et à préserver les précieux missiles antinavires.\n\nREMARQUE : malgré la description en jeu, la portée effective avec les configurations ASuW est d'environ 100 nm.
wp_mig-23a=Le MiG-23A Flogger est un chasseur-bombardier supersonique, adapté à la défense aérienne locale et à un travail ASuW limité. Il dispose d'un radar de veille aérienne correct, d'un IRST à faible résolution et emporte des AAM à moyenne portée. Pour le combat rapproché, le MiG-23A peut être équipé de l'AA-11 Archer, un AAM IR à courte portée hautement maniable. Il porte également des configurations de frappe limitées. Ce chasseur est supérieur aux F-4 omniprésents tout au long de la campagne, mais nécessite un soutien de brouillage face aux F-14.
wp_taifun=Le Ko-45 est un avion d'attaque embarqué subsonique, la réponse soviétique à l'A-6 Intruder. Il emporte une lourde charge antinavire et d'attaque au sol à distance, avec des options de précision et de SEAD, et peut également voler en ravitailleur. C'est le fer de lance de l'aile aérienne des porte-avions de classe Orel.
wp_taifun_ew=Le Ko-45E est la version de guerre électronique du Ko-45, dans le rôle de l'EA-6 Prowler. Son brouilleur dégrade les radars ennemis et les engagements SAM au profit du dispositif de frappe, et il peut emporter des missiles anti-radar pour la SEAD. Très peu d'exemplaires sont disponibles, ne les risquez pas inutilement.
wp_p-42=Le P-42 est un avion ASW et de patrouille maritime embarqué, comparable au S-3 Viking. Avec ses bouées acoustiques et ses torpilles, il étend l'écran ASW de la force opérationnelle bien au-delà de la portée des hélicoptères et offre au porte-avions une plateforme de recherche de surface à longue endurance.
wp_mig-25pd=Le MiG-25PD Foxbat est un intercepteur supersonique conçu pour intercepter les bombardiers à haute altitude. Il est très rapide, avec un radar de veille aérienne correct, un IRST et des AAM à moyenne portée. Comparé au MiG-23A, il dispose d'un meilleur radar de veille aérienne, d'un AAM à plus longue portée et d'une autonomie presque double, mais il reste limité aux rôles air-air.
wp_su-24m=Le Su-24M est un bombardier supersonique à basse altitude. C'est le bombardier tactique le plus performant de l'URSS. Pour les missions ASuW à distance, il peut être équipé soit d'ASM en rase-mer AS-13 Kingbolt, soit de missiles anti-radar à distance AS-11 Kilter.
wp_il-38=L'Il-38 May est un MPA à longue portée comparable au P-3C de l'OTAN. Il peut déployer la torpille ASW AT-2 ou des grenades sous-marines PLAB-100. Il dispose également d'un impressionnant total de 144x bouées acoustiques RGB-1.
wp_tu-95rt=Le Tu-95RT Bear est un MPA à longue portée. Il dispose d'un radar de recherche de surface à longue portée et d'une bonne suite ESM. Cette plateforme accroît considérablement la connaissance de la situation de votre force opérationnelle face aux contacts de surface. Elle ne survivrait toutefois pas face à des chasseurs ennemis, ne la laissez donc jamais sans escorte.
wp_tu-16k=Le Tu-16K Badger est un bombardier stratégique subsonique. Il est équipé de l'ASM à distance AS-6 Kingfish, qui dispose d'un mode secondaire d'attaque au sol. Il peut également emporter le missile de brouillage à distance AS-2B Kipper. C'est une plateforme ASM adaptée à toutes les menaces de surface, à l'exception des CVBG américains.
wp_tu-22m2=Le Tu-22M2 Backfire est un bombardier stratégique supersonique. Il est équipé de l'ASM à distance AS-4 Kitchen ou du missile d'attaque au sol AS-4B. Sa grande vitesse et sa portée de tir à distance lui offrent une certaine marge de survie, même face aux CVBG américains.
wp_tu-16p=Modification du Badger, le Tu-16P Badger-J est un avion de guerre électronique à longue portée. Sa seule mission est de déployer le brouilleur ECM Buket, d'une portée de 135 nm. C'est un atout précieux, capable de protéger les chasseurs des AAM ennemis à longue portée ou d'aveugler les forces de surface adverses.
wp_p-42_rldn=En raison des impératifs de la guerre, cet avion prototype AEW a été précipitamment mis en service opérationnel limité. Il assure une détection à longue portée des contacts aériens et de surface jusqu'à 216 nm, complétée par une bonne suite ESM. C'est un multiplicateur de force majeur pour votre force opérationnelle, car il détectera les missiles en rase-mer et les attaquants à basse altitude bien avant vos radars de veille aérienne embarqués.