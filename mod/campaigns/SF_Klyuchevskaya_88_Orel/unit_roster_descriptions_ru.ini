[AllowedVessels]
wp_rkr_kirov=Флагман Краснознамённого Северного флота, этот атомный ракетный крейсер переброшен на театр военных действий по требованиям военного времени. Он несёт батарею из 20 ПКР П-700 «Гранит» с дальностью 270 миль и совершенной системой группового наведения. Также на борту 96 ячеек ЗУР ЗРК С-300Ф «Форт» и отличный гидроакустический комплекс. \n\nЛучше всего использовать этот корабль как флагман эскадры, надёжно прикрытый противолодочными кораблями охранения.
wp_rkr_slava=Флагман Краснознамённого Тихоокеанского флота, этот ракетный крейсер несёт внушительную батарею из 16 ПКР П-500 «Базальт» с дальностью 300 миль и групповым наведением. В сочетании с 16 П-700 «Гранит», которые несёт сам ТБИЛИСИ, при необходимости можно нанести один совместный залп из 32 ракет. Также корабль вооружён 64 ячейками ЗУР ЗРК С-300Ф «Форт» для ПВО соединения и оснащён буксируемой ГАС.
wp_takr_kiev=Авианесущий крейсер с самолётами вертикального/короткого взлёта и посадки, способный принять до 36 Як-38, Ка-25 и Ка-27, предназначен для зональной ПЛО и локальной ПВО соединения. Также несёт батарею из 8 ПКР П-500 «Базальт» для нанесения дальних ударов. \n\nПРИМЕЧАНИЕ: перезарядка П-500 работает не в полном объёме — за миссию можно получить до 2 перезарядок, не рассчитывайте на эту возможность. \n\nПРИМЕЧАНИЕ: на уровне сложности «трудный» этот корабль не имеет собственной авиагруппы.
wp_cv_orel=ТАВКР проекта 1160 «Орёл» — первый настоящий флотский авианосец советского ВМФ, с катапультами, аэрофинишёрами и авиагруппой до 60 самолётов: истребители МиГ-23А, ударные самолёты и самолёты РЭБ Ко-45, противолодочные П-42 и самолёты ДРЛО П-42РЛДН, а также вертолёты Ка-27. Он даёт соединению настоящую флотскую ПВО, дальний удар и воздушную радиолокационную картину. Также корабль несёт 16 ПКР П-700 «Гранит», ЗРК М-22 «Ураган» и «Оса-М», а также ЗАК, но это самый ценный корпус во флоте, замена которого крайне дорога, поэтому держите его под эскортом.
wp_kr_sverdlov=Устаревшие в эпоху ракетного оружия, эти лёгкие крейсеры всё ещё весьма пригодны для обстрела побережья и рейдерских действий против судоходства. С глубокими погребами 6-дюймовых орудий и неплохой защитой, эти корабли превзойдут в дальности и огневой мощи почти любой корабль НАТО, который им попадётся.
wp_bpk_kara=Большой противолодочный корабль проекта 1134-Б «Беркут-Б» — хорошо сбалансированный ракетный крейсер с уклоном в ПЛО и ПВО. Он несёт 8 ПЛУР УРК-5 «Раструб-Б» многоцелевого назначения, позволяющих наносить удары по натовским подлодкам с торпедами Mk-48 на безопасной дальности. Также корабль имеет неплохую батарею ЗУР: двухбалочный ЗРК М-11 «Шторм» для зональной ПВО и бортовые пусковые «Оса-М» для самообороны. В сочетании с вертолётным ангаром и буксируемой ГАС «Беркут-Б» — хороший многоцелевой надводный корабль.
wp_bpk_kresta2=Большой противолодочный корабль проекта 1134-А «Беркут-А» — противолодочная модификация крейсера проекта 1134. Вместо 4 ПКР П-35 этот корабль несёт 8 ПЛУР УРПК-3 «Метель» для дальних противолодочных ударов и батарею ЗРК М-11 «Шторм» увеличенной дальности. Также имеется вертолётный ангар для одного вертолёта семейства Ка-25.
wp_rkr_kresta1=Ракетный крейсер проекта 1134 «Беркут» создан на основе проекта 58 «Грозный»: половина батареи ПКР П-35 была принесена в жертву ради улучшенной мореходности, ПВО и дальности плавания. Также имеется вертолётный ангар для одного вертолёта семейства Ка-25.
wp_rkr_kynda=Ракетный крейсер проекта 58 «Грозный» создавался с явным упором на противокорабельные действия. С 8 ПКР П-35 и ещё 8 ракетами в перезарядке это платформа для дальних ударов по надводным целям. Однако его возможности ПЛО и ПВО крайне ограничены, поэтому для эффективной работы ему требуется эскорт с сильной ПВО и ПЛО.
wp_em_sovremenny=Эсминец проекта 956 «Сарыч» — хорошо сбалансированный корабль с уклоном в противокорабельные удары и ПВО. Он несёт 8 сверхзвуковых маловысотных ПКР П-270 «Москит», способных уничтожить почти любой надводный корабль. Двухбалочный ЗРК М-22 «Ураган» обеспечивает высокий темп огня, до 6 целей одновременно и хорошее различение низколетящих целей. Также корабль имеет ангар, вмещающий любой вариант вертолёта Ка-25 или Ка-27, и очень хорошую станцию РТР. Наконец, он несёт 2 двухорудийные 130-мм башни с высокой скорострельностью и большой дальностью — один из немногих советских кораблей, превосходящих по дальности орудие 5"/54.
wp_bpk_udaloy=Большой противолодочный корабль проекта 1155 «Фрегат» создан с чисто противолодочной направленностью. С 8 ПЛУР УРК-5 «Раструб-Б» многоцелевого назначения он способен наносить дальние удары, опережая по дальности торпеду Mk-48. Также корабль несёт батарею самооборонного ЗРК «Кинжал», обеспечивающую защиту на очень малой дальности от массированных низковысотных атак. С двумя вертолётными ангарами и превосходным гидроакустическим комплексом это лучший противолодочный корабль СССР.
wp_bpk_kashin=Большие противолодочные корабли проекта 61 «Комсомолец Украины» — серия эсминцев 60-х годов с уклоном в ПВО и ПЛО. Тихоокеанские корабли проекта 61 не прошли модернизацию по проекту 61МП и потому остались без ЗАК, буксируемой ГАС и батарей ПКР П-15 «Термит». Их слабые возможности ПВО означают, что применять их следует только против маловажных надводных и воздушных угроз.
wp_bpk_kanin=Большие противолодочные корабли проекта 57-А «Гневный» — серия эсминцев 60-х годов с уклоном в ПВО. Они оснащены ЗАК, но остаются очень слабыми против низковысотных воздушных и ракетных атак.
wp_skr_krivak1=Сторожевые корабли проекта 1135 «Буревестник» — рабочие лошадки флота с ближней ПВО и возможностью дальних противолодочных ударов. Они оснащены буксируемой ГАС, но не имеют вертолётного ангара, что ограничивает их возможности поиска подлодок. Отсутствие ЗАК и слабая работа ЗРК по низколетящим целям означают, что их лучше применять совместно с более крупными советскими крейсерами.
wp_skr_krivak2=Сторожевые корабли проекта 1135М «Буревестник» — улучшенный вариант предыдущего проекта 1135. Они несут усовершенствованную многоцелевую ПЛУР УРК-5 «Раструб-Б», дающую возможность ближних ударов по надводным целям. Также усилено артиллерийское вооружение — два спаренных автоматических 100-мм орудия обеспечивают неплохую поддержку при обстреле побережья. Однако они разделяют те же слабости, что и корабли проекта 1135: слабую ПВО и лишь ближнее обнаружение подлодок.

[AllowedHelicopters]
wp_ka-25=Ка-25ПЛ — неплохой противолодочный вертолёт, помещающийся в ангар любого советского корабля. Ограниченная полезная нагрузка вынуждает выбирать либо гидроакустические буи, либо торпеды. Тем не менее, вертолёт оснащён неплохой опускаемой ГАС и радаром надводного поиска. Ка-25ПЛ также может нести бомбы и НАР, что позволяет ограниченно применять его по надводным целям там, где угроза с воздуха мала или отсутствует. \n\nПРИМЕЧАНИЕ: может перевозить 10 пассажиров.
wp_ka-25ts=Ка-25Ц — специализированный вертолёт морской радиолокационной разведки и целеуказания с радаром надводного поиска большой дальности для загоризонтного наведения залпов П-35, П-500 «Базальт» и П-700 «Гранит». Эти вертолёты не переживут встречи с истребителями противника, поэтому лучше применять их на малой высоте с выключенным радаром, поднимаясь лишь для захвата целей. \n\nПРИМЕЧАНИЕ: может перевозить 10 пассажиров.
wp_ka-27=Ка-27ПЛ — модернизация Ка-25ПЛ с увеличенной дальностью. Он значительно превосходит предшественника по полезной нагрузке и продолжительности полёта. Его противолодочная нагрузка сбалансирована и не имеет ограничений «охотник-загонщик», присущих Ка-25ПЛ. Как и предшественник, он оснащён опускаемой ГАС и радаром надводного поиска. Ударный вариант нагрузки несёт больший груз на значительно большей дальности, чем Як-38. \n\nПРИМЕЧАНИЕ: может перевозить 10 пассажиров.
wp_ka-29=Ка-29 — боевой вариант Ка-27ПЛ. Он несёт ПТУР, НАР, бомбы и 30-мм автоматическую пушку для ударов по наземным целям. \n\nПРИМЕЧАНИЕ: может перевозить 16 пассажиров.

[AllowedAircraft]
wp_yak-38=Як-38 — истребитель-бомбардировщик вертикального/короткого взлёта и посадки, подходящий для действий по надводным целям с низким риском и локальной ПВО. Из-за отсутствия радара и подвесных баков Як-38 ограничен в дальности и возможностях. Лучше всего использовать его для перехвата натовских патрульных самолётов и бомбардировщиков без прикрытия. Он также является экономичным средством для уничтожения безоружных судов и слабо вооружённых кораблей Морских сил самообороны Японии и ВМС США. В целом эти самолёты предназначены для защиты соединения от дальних авиационных ракет и для сохранения дорогих противокорабельных ракет.\n\nПРИМЕЧАНИЕ: несмотря на описание в игре, реальная эффективная дальность с противокорабельной нагрузкой составляет около 100 миль.
wp_mig-23a=МиГ-23А — сверхзвуковой истребитель-бомбардировщик, подходящий для локальной ПВО и ограниченных ударов по надводным целям. Он оснащён неплохим радаром воздушного поиска, теплопеленгатором низкого разрешения и несёт ракеты «воздух-воздух» средней дальности. Для маневренного боя МиГ-23А может нести Р-73А — высокоманевренную ракету малой дальности с ИК ГСН. Также он несёт ограниченную ударную нагрузку. Этот истребитель превосходит F-4, преобладающие в кампании, но против F-14 ему требуется поддержка средств РЭБ.
wp_taifun=Ко-45 «Тайфун» — дозвуковой палубный ударный самолёт, советский ответ на A-6. Он несёт тяжёлую противокорабельную и ударную нагрузку большой дальности с высокоточными вариантами и средствами подавления ПВО, а также может использоваться в качестве танкера. Это ударная составляющая авиагруппы ТАВКР «Орёл».
wp_taifun_ew=Ко-45Э — вариант самолёта РЭБ на базе Ко-45, выполняющий роль, аналогичную EA-6B. Его станция помех ухудшает работу радаров и ЗРК противника в интересах ударной группы, а сам самолёт может нести противорадиолокационные ракеты для подавления ПВО. Таких машин очень мало, не рискуйте ими без необходимости.
wp_p-42=П-42 «Гарпун» — палубный противолодочный и патрульный самолёт, сопоставимый с S-3A. С гидроакустическими буями и торпедами он расширяет противолодочный рубеж соединения далеко за пределы дальности вертолётов и даёт авианосцу платформу большой продолжительности для надводного поиска.
wp_mig-25pd=МиГ-25ПД — сверхзвуковой перехватчик, предназначенный для перехвата высотных бомбардировщиков. Он очень быстрый, имеет неплохой радар воздушного поиска, теплопеленгатор и ракеты «воздух-воздух» средней дальности. По сравнению с МиГ-23А у него лучший радар воздушного поиска, ракеты большей дальности и почти вдвое большая дальность полёта, но он ограничен только задачами ПВО.
wp_su-24m=Су-24М — сверхзвуковой бомбардировщик малых высот, самый боеспособный тактический бомбардировщик СССР. Для дальних ударов по надводным целям он может нести либо маловысотные ПКР Х-59 «Овод», либо противорадиолокационные ракеты Х-58.
wp_il-38=Ил-38 — дальний морской патрульный самолёт, сопоставимый с натовским P-3C. Он может применять противолодочную торпеду АТ-2 или глубинные бомбы ПЛАБ-100. Также он несёт впечатляющий запас из 144 буёв РГБ-1.
wp_tu-95rt=Ту-95РЦ — дальний морской патрульный самолёт. Он оснащён радаром надводного поиска большой дальности и хорошей станцией РТР. Эта платформа значительно повышает осведомлённость соединения о надводной обстановке. Однако он не переживёт встречи с истребителями противника, поэтому не оставляйте его без прикрытия.
wp_tu-16k=Ту-16К — дозвуковой стратегический бомбардировщик. Он несёт дальнюю ПКР КСР-5 с дополнительным режимом удара по наземным целям. Также может нести дальнюю ракету-помеху К-10СП «Комета-10П». Это платформа для противокорабельных ракет, пригодная против любых надводных угроз, кроме авианосных групп ВМС США.
wp_tu-22m2=Ту-22М2 — сверхзвуковой стратегический бомбардировщик. Он несёт дальнюю ПКР Х-22 «Буря» или ракету Х-22МП для ударов по наземным целям. Его высокая скорость и большая дальность пуска ракет дают некоторый запас выживаемости даже против авианосных групп ВМС США.
wp_tu-16p=Ту-16П — модификация Ту-16, дальний самолёт РЭБ. Его единственная задача — применение станции помех «Букет» с дальностью действия 135 миль. Это ценный ресурс, способный прикрыть истребители от дальних ракет «воздух-воздух» противника или ослепить его надводные силы.
wp_p-42_rldn=По требованиям военного времени этот прототип самолёта ДРЛО был поспешно введён в ограниченную эксплуатацию. Он способен обнаруживать воздушные и надводные цели на дальности до 216 миль, дополняя это хорошей станцией РТР. Это важный фактор повышения боевой эффективности соединения, поскольку он обнаружит маловысотные ПКР и низколетящие атакующие самолёты задолго до того, как это сделают корабельные радары воздушного поиска.
