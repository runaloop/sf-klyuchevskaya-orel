[AllowedVessels]
wp_rkr_kirov=赤旗北方艦隊の旗艦であるこの原子力ミサイル巡洋艦は、戦時の必要により転属してきた。射程270海里、高度な群制御誘導を備えたSS-N-19シップレック対艦ミサイル20発を装備する。また、SA-N-6艦対空ミサイル96セルと優れたソナー・スイートを有する。\n\n本艦は戦隊旗艦として運用し、対潜(ASW)護衛艦で十分に護衛するのが最善である。
wp_rkr_slava=赤旗太平洋艦隊の旗艦であるこのミサイル巡洋艦は、射程300海里、群制御誘導を備えたSS-N-12サンドボックス対艦ミサイル16発という印象的な兵装を有する。トビリシ自身のSS-N-19 16発と組み合わせれば、必要とあらば一度に合計32発の斉射を放つことができる。また、艦隊防空用のSA-N-6艦対空ミサイル64セルと可変深度ソナー(VDS)を搭載している。
wp_takr_kiev=最大36機のYak-38フォージャー、Ka-25ホルモン、Ka-27ヘリックスを搭載可能なV/STOL空母であり、区域対潜(ASW)戦および局地防空を目的として設計されている。また、長射程の攻撃力としてSS-N-12サンドボックス8発を搭載する。\n\n注：SS-N-12の再装填機能は完全には作動しない。1任務につき最大2回の再装填が得られる場合があるが、この機能に依存してはならない。\n\n注：難易度「難しい」では、本艦は自前の航空団を伴わない。
wp_cv_orel=プロジェクト1160「オリョール」級は、カタパルトと着艦制動装置を備え、最大60機を搭載可能なソ連海軍初の真の艦隊用空母である。MiG-23Aフロッガー戦闘機、Ko-45攻撃機および電子戦機、P-42対潜(ASW)機とP-42RLDN早期警戒(AEW)機、さらにKa-27ヘリックスを運用する。本艦は任務部隊に本格的な艦隊防空、スタンドオフ攻撃、そして空中からのレーダー情報を提供する。また、SS-N-19シップレック対艦ミサイル16発、SA-N-7およびSA-N-4艦対空ミサイル、近接防御火器(CIWS)を搭載しているが、艦隊中最も貴重な船体であり、代替艦の建造は極めて高額であるため、必ず護衛を付けること。
wp_kr_sverdlov=現代のミサイル時代においては旧式となったが、この軽巡洋艦は艦砲射撃および通商破壊の役割において依然として高い能力を発揮する。6インチ砲の豊富な弾薬庫と適切な防御力を備え、遭遇するほぼすべてのNATO艦艇に対し射程と火力で優位に立つ。
wp_bpk_kara=カラ級ミサイル巡洋艦は、対潜(ASW)と防空(AAW)に重点を置いた、バランスの取れたミサイル巡洋艦である。SS-N-14サイレックスB多用途対潜ミサイル8発を搭載し、Mk-48搭載のNATO潜水艦へのスタンドオフ攻撃を可能にする。また、区域防空用の前後配置SA-N-3と、近接防空用の翼配置SA-N-4という優れた艦対空ミサイル兵装も有する。ヘリコプター格納庫と可変深度ソナー(VDS)を組み合わせ、カラ級は優秀な多用途水上戦闘艦である。
wp_bpk_kresta2=クレスタII級ミサイル巡洋艦は、クレスタI級を対潜(ASW)重視に改設計したものである。本級はSS-N-3セパル4発を廃し、代わりにSS-N-14サイレックスAスタンドオフ対潜ミサイル8発と、より長射程のSA-N-3兵装を搭載する。また、Ka-25の派生型1機分のヘリコプター格納庫を有する。
wp_rkr_kresta1=クレスタI級ミサイル巡洋艦はキンダ級を基に設計され、SS-N-3Bセパル兵装の半数を廃することで、耐航性、防空能力、および航続距離を向上させている。また、Ka-25の派生型1機分のヘリコプター格納庫を有する。
wp_rkr_kynda=キンダ級ミサイル巡洋艦は、対水上(ASuW)戦に大きく重点を置いて設計されている。SS-N-3Bセパル8発と追加の8発分の再装填弾を備え、スタンドオフ対艦攻撃を目的とした艦である。しかし対潜(ASW)および防空(AAW)能力は極めて限定的であり、効果的に運用するには防空・対潜担当の護衛艦を必要とする。
wp_em_sovremenny=ソヴレメンヌイ級駆逐艦は、対水上(ASuW)戦と対空戦に重点を置いた、バランスの取れた駆逐艦である。SS-N-22サンバーン超音速シースキミングミサイル8発を搭載し、ほとんどの水上戦闘艦を粉砕する。連装のSA-N-7は高い発射速度を有し、最大6個の個別目標に対処可能で、低空目標の識別能力にも優れる。また、Ka-25またはKa-27のいずれの派生型も収容可能な格納庫と、極めて優秀な電子支援手段(ESM)スイートを備える。さらに、高発射速度・長射程の130mm連装砲2基を搭載し、5インチ/54口径砲に対して射程で優位に立てる数少ないソ連艦の一つである。
wp_bpk_udaloy=ウダロイ級駆逐艦は、純粋に対潜(ASW)戦を目的として設計されている。SS-N-14サイレックスB多用途対潜ミサイル8発により、Mk-48魚雷に対するスタンドオフ能力を有する。また、近接防空に特化したSA-N-9兵装を備え、低空飽和攻撃に対する超近接防御を提供する。ヘリコプター格納庫2基と優秀なソナー・スイートを備え、これはソ連が誇る最良の対潜艦である。
wp_bpk_kashin=カシン級は、1960年代に遡る防空(AAW)および対潜(ASW)重視の駆逐艦群である。太平洋艦隊所属のカシン級は61MP計画改修を受けておらず、近接防御火器(CIWS)、可変深度ソナー(VDS)、SS-N-2兵装のいずれも持たない。防空能力が弱いため、脅威度の低い水上・航空脅威に対してのみ運用すべきである。
wp_bpk_kanin=カニン級は、1960年代に遡る防空(AAW)重視の駆逐艦群である。近接防御火器(CIWS)を装備しているが、低空からの航空・ミサイル攻撃には非常に脆弱である。
wp_skr_krivak1=クリバクI級は、短距離防空能力とスタンドオフ対潜(ASW)能力を備えた、汎用性の高い主力艦群である。可変深度ソナー(VDS)を装備するがヘリコプター格納庫を持たないため、対潜捜索能力には限りがある。近接防御火器(CIWS)を持たず、低空目標に対する艦対空ミサイル性能も低いため、より大型のソ連巡洋艦と連携して運用するのが最善である。
wp_skr_krivak2=クリバクII級は、先行するクリバクI級の改良型である。改良型のSS-N-14サイレックスB多用途対潜ミサイルを搭載し、短射程の対水上(ASuW)能力を提供する。また、連装4インチ自動砲へと火力が強化され、良好な艦砲射撃能力を有する。しかし、防空(AAW)能力の弱さと短射程の対潜探知能力という、クリバクI級と同様の弱点を抱えている。

[AllowedHelicopters]
wp_ka-25=Ka-25PLは、ソ連のすべてのヘリコプター格納庫に収容可能な、まずまずの性能を持つ対潜(ASW)ヘリコプターである。搭載量が限られるため、ソノブイまたは魚雷のいずれかの兵装構成を選ばざるを得ない。しかし、まずまずの性能を持つディッピングソナーと水上捜索レーダーを備える。Ka-25PLには爆弾およびロケット弾の兵装構成もあり、対空脅威がほとんどない、または存在しない状況下で限定的な対水上(ASuW)戦を行うことができる。\n\n注：兵員10名を輸送可能。
wp_ka-25ts=Ka-25TSは、専用に開発された海上哨戒(MPA)ヘリコプターであり、SS-N-3セパル、SS-N-12サンドボックス、SS-N-19シップレックの斉射に対するスタンドオフ目標捕捉のための長射程水上捜索レーダーを搭載する。これらのヘリコプターは敵戦闘機に対しては生存できないため、低空でレーダーを停止させ、目標捕捉のためだけに一時的に上昇させる運用が最善である。\n\n注：兵員10名を輸送可能。
wp_ka-27=Ka-27PLは、Ka-25PLを長射程化した改良型である。搭載量と滞空時間が大幅に向上している。対潜(ASW)兵装構成はバランスが取れており、Ka-25PLにあった「索敵（ハンター）」「攻撃（キラー）」の区別による制限がない。先代機と同様、ディッピングソナーと水上捜索レーダーを備える。攻撃用兵装構成では、Yak-38よりもはるかに長い射程でより重い兵装を搭載できる。\n\n注：兵員10名を輸送可能。
wp_ka-29=Ka-29は、Ka-27PLの攻撃ヘリコプター派生型である。地上攻撃任務のため、対戦車誘導ミサイル（ATGM）、ロケット弾、爆弾、および30mm機関砲を搭載する。\n\n注：兵員16名を輸送可能。

[AllowedAircraft]
wp_yak-38=Yak-38フォージャーは、低リスクの対水上(ASuW)戦および局地防空に適したV/STOL戦闘攻撃機である。レーダーおよび増槽タンクを持たないため、Yak-38の航続距離と能力は限定的である。NATOの哨戒機や護衛のない爆撃機の迎撃に最適である。また、無防備な商船や、装備の乏しい海上自衛隊・米海軍の水上艦艇を経済的に撃沈する手段でもある。総じて、任務部隊をスタンドオフ空対艦ミサイルから守り、貴重な対艦ミサイルを温存する目的で運用される。\n\n注：ゲーム内説明とは異なり、対水上(ASuW)兵装構成での実用射程は約100海里である。
wp_mig-23a=MiG-23Aフロッガーは、局地防空および限定的な対水上(ASuW)戦に適した超音速戦闘攻撃機である。まずまずの性能を持つ空対空捜索レーダー、低解像度の赤外線捜索追尾装置（IRST）を備え、中距離空対空ミサイルを搭載する。近接格闘戦では、高機動性を持つ短距離赤外線誘導空対空ミサイルAA-11アーチャーを装備できる。限定的な攻撃用兵装構成も搭載可能である。本機は本キャンペーン全編に頻出するF-4よりも優れているが、F-14に対してはジャミング支援を必要とする。
wp_taifun=Ko-45は亜音速の艦上攻撃機であり、ソ連版のA-6イントルーダーに相当する。重量級のスタンドオフ対艦・対地攻撃兵装を搭載し、精密攻撃および敵防空網制圧（SEAD）の選択肢も備え、空中給油機としても運用できる。オリョール級航空団の攻撃力の中核を担う。
wp_taifun_ew=Ko-45Eは、EA-6プラウラーの役割を担うKo-45の電子戦仕様である。搭載するジャマーは、攻撃隊のために敵のレーダーおよび地対空ミサイルの交戦能力を低下させ、敵防空網制圧（SEAD）用の対電波放射ミサイルも搭載できる。機数は極めて少なく、無用な危険にさらしてはならない。
wp_p-42=P-42は、S-3バイキングに相当する艦上対潜(ASW)・海上哨戒機である。ソノブイと魚雷により、任務部隊の対潜警戒圏をヘリコプターの行動半径をはるかに超えて拡大し、空母に長時間滞空可能な水上捜索プラットフォームを提供する。
wp_mig-25pd=MiG-25PDフォックスバットは、高高度爆撃機の迎撃を目的として設計された超音速迎撃機である。極めて高速であり、まずまずの性能を持つ空対空捜索レーダー、IRST、中距離空対空ミサイルを備える。MiG-23Aと比較すると、より優れた空対空捜索レーダー、より長射程の空対空ミサイル、そしてほぼ2倍の航続距離を有するが、対空任務にのみ限定される。
wp_su-24m=Su-24Mは超音速の低空侵入爆撃機であり、ソ連が誇る最も有能な戦術爆撃機である。スタンドオフの対水上(ASuW)戦のため、AS-13キングボルト・シースキミング対艦ミサイル、またはAS-11キルター・スタンドオフ対電波放射ミサイルのいずれかを装備できる。
wp_il-38=Il-38メイは、NATOのP-3Cに相当する長距離海上哨戒(MPA)機である。AT-2対潜魚雷またはPLAB-100爆雷を投下できる。また、RGB-1ソノブイを144個という驚異的な数搭載する。
wp_tu-95rt=Tu-95RTベアは長距離海上哨戒(MPA)機である。長射程の水上捜索レーダーと優れた電子支援手段(ESM)スイートを備える。本機は水上目標に対する任務部隊の状況認識能力を大幅に向上させる。しかし、敵戦闘機に対しては生存できないため、護衛なしで行動させてはならない。
wp_tu-16k=Tu-16Kバジャーは亜音速の戦略爆撃機である。副次的に対地攻撃モードを持つAS-6キングフィッシュ・スタンドオフ対艦ミサイルを装備する。また、AS-2Bキッパー・スタンドオフ・ジャミングミサイルも搭載可能である。米空母戦闘群を除くすべての水上脅威に対応可能な対艦ミサイル・プラットフォームである。
wp_tu-22m2=Tu-22M2バックファイアは超音速の戦略爆撃機である。AS-4キッチン・スタンドオフ対艦ミサイル、またはAS-4B対地攻撃ミサイルを装備する。高速性とスタンドオフ射程により、米空母戦闘群に対してもある程度の生存性の余地を確保できる。
wp_tu-16p=バジャーの改修型であるTu-16P バジャーJは、長距離電子戦機である。その唯一の目的は、射程135海里のブケートECMジャマーを展開することである。これは、味方戦闘機を敵の長射程空対空ミサイルから守り、あるいは敵水上部隊のセンサーを無力化できる貴重な資産である。
wp_p-42_rldn=戦時の必要により、この試作早期警戒(AEW)機は限定的な実戦運用へと急遽投入された。216海里までの航空・水上目標を長射程で探知可能であり、優れた電子支援手段(ESM)スイートも備える。艦載の対空捜索装置よりもはるかに早くシースキミングミサイルや低空侵入機を探知できるため、任務部隊にとって大きな戦力増強要素となる。
