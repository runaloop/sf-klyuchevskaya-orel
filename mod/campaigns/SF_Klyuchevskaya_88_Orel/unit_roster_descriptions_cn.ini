[AllowedVessels]
wp_rkr_kirov=红旗北方舰队的旗舰，这艘核动力导弹巡洋舰因战时需要而调往此处。她装备20枚P-700花岗岩（SS-N-19海难）反舰导弹，射程270海里，具备先进的蜂群式制导。她还装有96具S-300F堡垒（SA-N-6轰鸣）防空导弹发射单元，以及出色的声呐套件。\n\n本舰最适合作为分舰队旗舰使用，并应由反潜护卫舰充分掩护。
wp_rkr_slava=红旗太平洋舰队的旗舰，这艘导弹巡洋舰携带16枚P-500玄武岩（SS-N-12沙盒）反舰导弹，射程300海里，具备蜂群式制导能力。配合第比利斯自身的16枚SS-N-19，你可以在必要时打出一次32枚导弹的联合齐射。她还装有64具S-300F堡垒（SA-N-6轰鸣）防空导弹发射单元用于舰队防空，并配备变深声呐。
wp_takr_kiev=一艘垂直/短距起降航母，最多可搭载36架雅克-38"铸造者"、卡-25"激素"和卡-27"螺旋"，专为区域反潜和局部防空而设计。她还装有8枚P-500玄武岩（SS-N-12沙盒）反舰导弹，具备远程进攻打击能力。\n\n注意：SS-N-12的再装填功能无法完全正常工作，每次任务你可能最多获得2次再装填，请不要依赖此功能。\n\n注意：在困难难度下，该航母不会自带航空联队。
wp_cv_orel=1160型雕级是苏联海军首型真正意义上的舰队航母，配备弹射器、拦阻装置，最多可搭载60架飞机：米格-23A"鞭挞者"战斗机、柯-45攻击及电子战飞机、P-42反潜机和P-42RLDN预警机，此外还有卡-27"螺旋"直升机。她为特遣舰队提供真正的舰队防空、防区外打击能力和空中雷达情报。她还装有16枚P-700花岗岩（SS-N-19海难）反舰导弹、M-22飓风（SA-N-7牛虻）和M-4黄蜂-M（SA-N-4壁虎）防空导弹以及近防系统，但她是舰队中最宝贵的舰体，替换成本极其高昂，务必为她提供护航。
wp_kr_sverdlov=在导弹时代已属过时，但这些轻巡洋舰在水面炮击和商船破袭任务中依然表现出色。凭借深厚的6英寸弹药库和不错的防护，这些舰艇几乎能在射程和火力上压制任何北约军舰。
wp_bpk_kara=卡拉级导弹巡洋舰是一款兼顾反潜和防空的均衡型导弹巡洋舰。她携带8枚URPK-3暴风雪（SS-N-14石英B）多用途反潜导弹，可对配备Mk-48鱼雷的北约潜艇实施防区外打击。她还配有不错的防空导弹组合——用于区域防空的双臂式M-11风暴（SA-N-3高脚杯），以及用于点防御的翼装式M-4黄蜂-M（SA-N-4壁虎）。配合直升机库和变深声呐，卡拉级是出色的多用途水面战斗舰。
wp_bpk_kresta2=卡列斯塔II级导弹巡洋舰是在卡列斯塔I级基础上改进而来的反潜专用型号。该级舰以8枚URPK-3暴风雪（SS-N-14石英A）防区外反潜导弹取代了4枚SS-N-3"萼片"，并配备射程更远的M-11风暴（SA-N-3高脚杯）导弹组。她还配有可容纳1架卡-25型直升机的机库。
wp_rkr_kresta1=卡列斯塔I级导弹巡洋舰以金达级为基础，以一半的P-35（SS-N-3B萼片）导弹组为代价，换取了更好的适航性、防空能力和续航力。她同样配有可容纳1架卡-25型直升机的机库。
wp_rkr_kynda=金达级导弹巡洋舰专为强大的反舰能力而设计。凭借8枚P-35（SS-N-3B萼片）导弹及额外8枚备弹，这是一款专为防区外反舰作战而生的平台。然而她的反潜和防空能力非常有限，因此需要防空和反潜护卫舰协同才能有效发挥作用。
wp_em_sovremenny=现代级驱逐舰是一款兼顾反舰和防空的均衡型驱逐舰。她携带8枚P-270白蛉（SS-N-22日炙）超音速掠海反舰导弹，足以摧毁大多数水面战斗舰。双臂式M-22飓风（SA-N-7牛虻）系统射速很高，可同时应对多达6个目标，并具备出色的低空目标识别能力。她还配有可容纳任意卡-25或卡-27型号的机库，以及非常出色的电子支援措施套件。此外，她装有2座双联130毫米舰炮，射速高、射程远，是少数能在射程上压制5"/54舰炮的苏联军舰之一。
wp_bpk_udaloy=无畏级驱逐舰专为纯反潜任务设计。凭借8枚URPK-3暴风雪（SS-N-14石英B）多用途反潜导弹，她对Mk-48鱼雷具备防区外打击能力。她还装有专注点防御的3K95匕首（SA-N-9臂铠）系统，可在低空饱和攻击中提供极近程防御。凭借2座直升机库和出色的声呐套件，这是苏联最好的反潜舰艇。
wp_bpk_kashin=卡辛级是一系列兼顾防空和反潜的驱逐舰，最早可追溯至上世纪60年代。太平洋舰队的卡辛级从未接受61MP工程改装，因此没有近防系统、变深声呐或SS-N-2导弹组。由于防空能力薄弱，只应用于对付低威胁的水面和空中目标。
wp_bpk_kanin=卡宁级是一系列专注防空的驱逐舰，同样可追溯至上世纪60年代。她们配有近防系统，但面对低空空袭和导弹攻击时依然非常脆弱。
wp_skr_krivak1=克里瓦克I级是一款主力护卫舰，具备短程防空能力和防区外反潜能力。她配有变深声呐，但没有直升机库，限制了其反潜搜索范围。由于缺少近防系统且低空防空导弹性能不佳，最好与苏联的大型巡洋舰协同使用。
wp_skr_krivak2=克里瓦克II级是前代克里瓦克I级的改进型。她配备改进型URK-5喇叭口-B（SS-N-14石英B）多用途反潜导弹，具备短程反舰能力。她还换装了双联4英寸自动舰炮，具备不错的岸轰和火力性能。但她与克里瓦克I级存在相同的弱点：防空能力薄弱，反潜探测距离较短。

[AllowedHelicopters]
wp_ka-25=卡-25PL"激素"是一款性能不错的反潜直升机，可搭载于所有苏联直升机库。其载荷有限，只能选择声呐浮标或鱼雷挂载方案。不过她配有不错的吊放声呐和水面搜索雷达。卡-25PL还可挂载炸弹和火箭弹，能在敌方防空威胁很小或不存在的情况下执行有限的反舰任务。\n\n注意：可运送10名乘员。
wp_ka-25ts=卡-25TS是一款专为对海上巡逻而设计的直升机，装有远程水面搜索雷达，可为P-35、P-500玄武岩和P-700花岗岩齐射提供防区外目标指示。这些直升机无法在敌方战斗机面前存活，因此最好在低空、关闭雷达的状态下使用，仅在需要目标获取时才短暂开机。\n\n注意：可运送10名乘员。
wp_ka-27=卡-27PL"螺旋"是卡-25PL的远程升级型号，载荷量和续航力都有显著提升。她的反潜挂载方案更为均衡，摆脱了卡-25PL"猎手/杀手"分工的限制。与前型一样，她配有吊放声呐和水面搜索雷达。其打击挂载方案的载荷远超雅克-38，射程也更远。\n\n注意：可运送10名乘员。
wp_ka-29=卡-29是卡-27PL的攻击直升机型号。她携带反坦克导弹、火箭弹、炸弹和一门30毫米自动炮，用于对地攻击任务。\n\n注意：可运送16名乘员。

[AllowedAircraft]
wp_yak-38=雅克-38"铸造者"是一款垂直/短距起降战斗轰炸机，适合执行低风险反舰任务和局部防空。由于没有雷达和副油箱，雅克-38的航程和作战能力有限。她最适合用于拦截北约海上巡逻机和无护航轰炸机。她也是击沉无武装商船以及火力薄弱的日本海上自卫队和美国海军水面舰艇的经济手段。总体而言，她们的任务是保护特遣舰队免受防区外空射导弹的威胁，并节省宝贵的反舰导弹。\n\n注意：尽管游戏内描述如此，配备反舰挂载方案时的有效作战半径约为100海里。
wp_mig-23a=米格-23A"鞭挞者"是一款超音速战斗轰炸机，适合执行局部防空和有限的反舰任务。她配有不错的空中搜索雷达、分辨率较低的红外搜索跟踪系统，并可携带中程空对空导弹。在近距格斗中，米格-23A可挂载AA-11"弓箭手"——一款机动性极高的近程红外制导空对空导弹。她还可挂载有限的打击弹药。这款战斗机的性能优于整个战役中常见的F-4，但面对F-14时需要电子干扰支援。
wp_taifun=柯-45是一款亚音速舰载攻击机，是苏联对A-6"入侵者"的回应。她携带重型防区外反舰和对地打击弹药，具备精确打击和压制敌防空（SEAD）选项，也可用作加油机。她是1160型雕级航空联队的打击力量。
wp_taifun_ew=柯-45E是柯-45的电子战型号，扮演类似EA-6"徘徊者"的角色。她的干扰吊舱可削弱敌方雷达和防空导弹对打击编队的攻击能力，还可挂载反辐射导弹执行压制敌防空（SEAD）任务。该型号数量极少，切勿无谓冒险损失她们。
wp_p-42=P-42是一款舰载反潜和海上巡逻机，性能可与S-3"海盗"相比。凭借声呐浮标和鱼雷，她将特遣舰队的反潜屏障扩展至远超直升机的范围，并为航母提供了一个长航时的水面搜索平台。
wp_mig-25pd=米格-25PD"狐蝠"是一款超音速拦截机，专为拦截高空轰炸机而设计。她速度极快，配有不错的空中搜索雷达、红外搜索跟踪系统和中程空对空导弹。与米格-23A相比，她的空中搜索雷达更好，空对空导弹射程更远，航程几乎是其两倍；但只能执行空战任务。
wp_su-24m=苏-24M是一款超音速低空轰炸机，是苏联最强的战术轰炸机。执行防区外反舰任务时，她可挂载AS-13"主销"（Kh-59）掠海反舰导弹，或AS-11"顺利"（Kh-58）防区外反辐射导弹。
wp_il-38=伊尔-38"五月"是一款远程海上巡逻机，性能可与北约的P-3C相比。她可投放AT-2反潜鱼雷或PLAB-100深水炸弹。她还携带多达144枚RGB-1声呐浮标，数量惊人。
wp_tu-95rt=图-95RT"熊"是一款远程海上巡逻机。她配有远程水面搜索雷达和出色的电子支援措施套件。该平台能大幅提升你的特遣舰队对水面目标的态势感知能力。然而她在敌方战斗机面前生存能力较差，切勿让她在无护航状态下执行任务。
wp_tu-16k=图-16K"獾"是一款亚音速战略轰炸机。她挂载AS-6（Kh-26）防区外反舰导弹，该弹也具备次要的对地攻击模式。她还可挂载AS-2B"茶壶"防区外干扰导弹。这是一款可对付除美国航母战斗群外几乎所有水面威胁的反舰导弹平台。
wp_tu-22m2=图-22M2"逆火"是一款超音速战略轰炸机。她挂载AS-4"厨房"（Kh-22暴风）防区外反舰导弹，或AS-4B对地攻击型导弹。她的高速性能和防区外射程，即便面对美国航母战斗群也能提供一定的生存空间。
wp_tu-16p=图-16P"獾-J"是"獾"的改型，是一款远程电子战飞机。她唯一的任务是投放"花束"电子对抗干扰机，射程达135海里。这是一项宝贵的资产，可掩护己方战斗机免受远程敌方空对空导弹威胁，或使敌方水面部队陷入雷达致盲。
wp_p-42_rldn=由于战时急需，这款原型预警机被匆忙投入有限的实战部署。她可提供最远216海里的空中和水面目标远程探测能力，并配有出色的电子支援措施套件。这是你特遣舰队的重要力量倍增器，能在己方舰载空中搜索雷达发现掠海导弹和低空攻击机之前，提前将其探测出来。
