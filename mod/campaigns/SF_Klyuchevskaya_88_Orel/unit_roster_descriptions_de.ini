[AllowedVessels]
wp_rkr_kirov=Als Flaggschiff der Rotbanner-Nordflotte wurde dieser nuklearbetriebene Lenkwaffenkreuzer kriegsbedingt verlegt. Er ist mit einer Batterie von 20x SS-N-19 Shipwreck-Seezielflugkörpern mit 270 nm Reichweite und fortschrittlicher Schwarmlenkung bewaffnet. Zudem verfügt er über 96 Zellen für SA-N-6-Flugabwehrraketen und eine ausgezeichnete Sonarausstattung. \n\nDieses Schiff wird am besten als Geschwaderflaggschiff eingesetzt, gut abgeschirmt durch U-Jagd-Geleitschiffe.
wp_rkr_slava=Als Flaggschiff der Rotbanner-Pazifikflotte führt dieser Lenkwaffenkreuzer eine eindrucksvolle Batterie von 16x SS-N-12 Sandbox-Seezielflugkörpern mit 300 nm Reichweite und Schwarmlenkung. Zusammen mit den 16x SS-N-19 der TBILISI selbst können Sie einmalig eine kombinierte Salve von 32 Flugkörpern abgeben, sollte die Notwendigkeit bestehen. Er trägt außerdem 64 Zellen für SA-N-6-Flugabwehrraketen zur Verbandsflugabwehr sowie eine Schleppsonaranlage (VDS).
wp_takr_kiev=Ein V/STOL-Träger mit einer Kapazität von bis zu 36x Yak-38 Forger, Ka-25 Hormone und Ka-27 Helix, konzipiert für die U-Jagd im Seegebiet und die örtliche Luftverteidigung. Er trägt außerdem eine Batterie von 8x SS-N-12 Sandbox für weitreichende Offensivschläge. \n\nHINWEIS: Die Nachladefunktion der SS-N-12 arbeitet nicht vollständig, Sie erhalten pro Mission höchstens 2x Nachladungen, verlassen Sie sich also nicht auf dieses Merkmal. \n\nHINWEIS: Im Schwierigkeitsgrad "Schwer" kommt dieser Träger ohne eigene Fluggruppe.
wp_cv_orel=Die Orel-Klasse des Projekts 1160 ist der erste echte Flottenträger der sowjetischen Marine, mit Katapulten, Fangseilen und einer Kapazität von bis zu 60 Flugzeugen: MiG-23A Flogger-Jäger, Ko-45-Angriffs- und EloKa-Flugzeuge, P-42-U-Jagd- und P-42RLDN-AEW-Flugzeuge sowie Ka-27 Helix-Hubschrauber. Sie verschafft der Task Force echte Verbandsflugabwehr, stand-off-fähige Angriffskraft und ein luftgestütztes Radarbild. Zudem führt sie 16x SS-N-19 Shipwreck-Seezielflugkörper, SA-N-7- und SA-N-4-Flugabwehrraketen sowie Nahbereichsabwehrsysteme mit sich, doch sie ist der wertvollste Rumpf der Flotte, und ein Ersatz ist außerordentlich teuer - halten Sie sie daher stets eskortiert.
wp_kr_sverdlov=Im Zeitalter moderner Flugkörper veraltet, sind diese leichten Kreuzer im Küstenbeschuss und bei der Handelsschifffahrtsjagd weiterhin sehr leistungsfähig. Mit tiefen Munitionskammern für 15,2-cm-Geschütze und ordentlichem Schutz übertreffen diese Schiffe fast jedes NATO-Kriegsschiff an Reichweite und Feuerkraft.
wp_bpk_kara=Der Lenkwaffenkreuzer der Kara-Klasse ist ein ausgewogenes Schiff mit Schwerpunkt auf U-Jagd und Flugabwehr. Er trägt 8x SS-N-14 Silex-B-Mehrzweck-U-Jagd-Flugkörper, die stand-off-Angriffe gegen NATO-U-Boote mit Mk-48-Torpedos ermöglichen. Zudem verfügt er über eine ordentliche Flugabwehrbatterie mit dem beidseitig einsetzbaren SA-N-3 für die Verbandsflugabwehr und dem flügelmontierten SA-N-4 für die Nahbereichsverteidigung. In Verbindung mit Hubschrauberhangar und Schleppsonaranlage ist die Kara-Klasse ein gutes Mehrzweck-Überwasserschiff.
wp_bpk_kresta2=Der Lenkwaffenkreuzer der Kresta 2-Klasse ist eine auf U-Jagd ausgelegte Modifikation der Kresta-Klasse. Diese Klasse tauscht 4x SS-N-3 Sepal gegen 8x SS-N-14 Silex-A stand-off-fähige U-Jagd-Flugkörper und eine SA-N-3-Batterie mit größerer Reichweite. Sie verfügt außerdem über einen Hubschrauberhangar für eine einzelne Ka-25-Variante.
wp_rkr_kresta1=Der Lenkwaffenkreuzer der Kresta-Klasse basiert auf der Kynda-Klasse und tauscht die Hälfte seiner SS-N-3B Sepal-Batterie gegen verbesserte Seetauglichkeit, Flugabwehr und Reichweite. Er verfügt ebenfalls über einen Hubschrauberhangar für eine einzelne Ka-25-Variante.
wp_rkr_kynda=Der Lenkwaffenkreuzer der Kynda-Klasse ist mit starkem Schwerpunkt auf der Seezielbekämpfung konzipiert. Mit 8x SS-N-3B Sepal und 8 weiteren Nachladungen ist dies eine Plattform für die stand-off-fähige Bekämpfung von Überwasserzielen. Er verfügt jedoch nur über sehr begrenzte U-Jagd- und Flugabwehrfähigkeiten und benötigt daher Flugabwehr- und U-Jagd-Geleitschiffe, um wirksam zu operieren.
wp_em_sovremenny=Der Zerstörer der Sovremennyy-Klasse ist ein ausgewogenes Schiff mit Schwerpunkt auf Seezielbekämpfung und Flugabwehr. Er trägt 8x SS-N-22 Sunburn, überschallschnelle seeskimmende Flugkörper, die die meisten Überwassereinheiten vernichten. Das doppelte SA-N-7-System bietet eine hohe Feuergeschwindigkeit, bis zu 6 Einzelziele und eine gute Zielunterscheidung im Tiefflugbereich. Zudem verfügt er über einen Hangar für jede Ka-25- oder Ka-27-Variante und eine sehr gute ESM-Ausstattung. Schließlich führt er 2 doppelläufige 130-mm-Geschütze mit hoher Feuergeschwindigkeit und großer Reichweite - eines der wenigen sowjetischen Kriegsschiffe, das das 5"/54-Geschütz an Reichweite übertrifft.
wp_bpk_udaloy=Der Zerstörer der Udaloy-Klasse ist rein auf die U-Jagd ausgelegt. Mit 8x SS-N-14 Silex-B-Mehrzweck-U-Jagd-Flugkörpern verfügt er über stand-off-Fähigkeit gegen den Mk-48-Torpedo. Zudem besitzt er eine auf Nahbereichsverteidigung ausgelegte SA-N-9-Batterie, die Verteidigung auf kürzeste Distanz gegen Tiefflug-Sättigungsangriffe bietet. Mit 2 Hubschrauberhangars und einer ausgezeichneten Sonarausstattung ist dies das beste U-Jagd-Schiff der UdSSR.
wp_bpk_kashin=Die Kashin-Klasse ist eine Reihe von Zerstörern mit Schwerpunkt auf Flugabwehr und U-Jagd, die auf die 60er Jahre zurückgeht. Die Kashin-Klasse der Pazifikflotte erhielt nie die Kampfwertsteigerung nach Projekt 61MP und bleibt daher ohne Nahbereichsabwehrsystem, Schleppsonaranlage oder SS-N-2-Batterien. Ihre schwache Flugabwehrfähigkeit bedeutet, dass sie nur gegen Überwasser- und Luftbedrohungen geringer Gefährlichkeit eingesetzt werden sollten.
wp_bpk_kanin=Die Kanin-Klasse ist eine Reihe von Zerstörern mit Schwerpunkt auf Flugabwehr, die auf die 60er Jahre zurückgeht. Sie sind mit Nahbereichsabwehrsystemen ausgerüstet, bleiben jedoch gegen Tiefflug- und Flugkörperangriffe sehr schwach.
wp_skr_krivak1=Die Krivak I-Klasse ist ein Arbeitspferd mit Kurzstrecken-Flugabwehr und stand-off-fähiger U-Jagd. Sie ist mit einer Schleppsonaranlage ausgestattet, verfügt jedoch über keinen Hubschrauberhangar, was ihre U-Jagd-Suche einschränkt. Das Fehlen eines Nahbereichsabwehrsystems und die schwache Leistung ihrer Flugabwehrraketen im Tiefflugbereich bedeuten, dass sie am besten im Verbund mit größeren sowjetischen Kreuzern eingesetzt wird.
wp_skr_krivak2=Die Krivak II-Klasse ist eine Weiterentwicklung der vorangegangenen Krivak I-Klasse. Sie führt den verbesserten SS-N-14 Silex-B-Mehrzweck-U-Jagd-Flugkörper und bietet damit Kurzstrecken-Seezielfähigkeit. Zudem ist sie stärker bewaffnet, mit doppelläufigen automatischen 10-cm-Geschützen, die eine gute Küstenbeschuss- und Artilleriefähigkeit bieten. Sie teilt jedoch dieselben Schwächen wie die Krivak I, mit schwacher Flugabwehr und nur kurzreichweitiger U-Jagd-Ortung.

[AllowedHelicopters]
wp_ka-25=Die Ka-25PL ist ein ordentlicher U-Jagd-Hubschrauber, der in allen sowjetischen Hubschrauberhangars untergebracht werden kann. Sie hat eine begrenzte Zuladung, wodurch entweder Sonarbojen oder Torpedos mitgeführt werden können. Sie verfügt jedoch über ein ordentliches Tauchsonar und ein Seezielsuchradar. Die Ka-25PL kann auch mit Bomben und Raketen ausgerüstet werden, was begrenzte Seezielangriffe dort ermöglicht, wo kaum oder keine Luftbedrohung besteht. \n\nHINWEIS: Kann 10 Passagiere transportieren.
wp_ka-25ts=Die Ka-25TS ist ein speziell konstruierter MPA-Hubschrauber mit einem weitreichenden Seezielsuchradar für die stand-off-Zielzuweisung von SS-N-3 Sepal-, SS-N-12 Sandbox- und SS-N-19 Shipwreck-Salven. Diese Hubschrauber überleben feindliche Jäger nicht, daher werden sie am besten im Tiefflug mit ausgeschaltetem Radar eingesetzt und steigen nur zur Zielerfassung kurz auf. \n\nHINWEIS: Kann 10 Passagiere transportieren.
wp_ka-27=Die Ka-27PL ist eine weitreichendere Weiterentwicklung der Ka-25PL. Sie bringt deutliche Steigerungen bei Zuladung und Reichweite. Ihre U-Jagd-Beladung ist ausgewogen und hebt die Hunter/Killer-Einschränkung der Ka-25PL auf. Wie ihr Vorgänger verfügt sie über Tauchsonar und Seezielsuchradar. Die Angriffsbeladung führt eine schwerere Zuladung über deutlich größere Reichweite als die Yak-38 mit sich. \n\nHINWEIS: Kann 10 Passagiere transportieren.
wp_ka-29=Die Ka-29 ist eine Kampfhubschrauber-Variante der Ka-27PL. Sie führt Panzerabwehrlenkflugkörper, Raketen, Bomben und eine 30-mm-Maschinenkanone für den Erdkampf mit sich. \n\nHINWEIS: Kann 16 Passagiere transportieren.

[AllowedAircraft]
wp_yak-38=Die Yak-38 Forger ist ein V/STOL-Jagdbomber, geeignet für risikoarme Seezielangriffe und die örtliche Luftverteidigung. Ohne Radar und Zusatztanks ist die Yak-38 in Reichweite und Fähigkeiten begrenzt. Sie wird am besten zur Abfangjagd gegen NATO-Seefernaufklärer und unbegleitete Bomber eingesetzt. Sie ist außerdem ein wirtschaftliches Mittel, um unbewaffneten Handelsverkehr und schwach bewaffnete JMSDF- und USN-Überwassereinheiten zu versenken. Insgesamt sind sie dazu bestimmt, die Task Force vor stand-off-fähigen, luftgestützten Flugkörpern zu schützen und wertvolle Seezielflugkörper zu bewahren.\n\nHINWEIS: Trotz der Beschreibung im Spiel liegt die effektive Reichweite mit Seezielbeladung bei etwa 100 nm.
wp_mig-23a=Die MiG-23A Flogger ist ein überschallschneller Jagdbomber, geeignet für die örtliche Luftverteidigung und begrenzte Seezielangriffe. Sie besitzt ein ordentliches Luftsuchradar, ein IRST mit schlechter Auflösung und führt Luft-Luft-Raketen mittlerer Reichweite mit sich. Für den Nahkampf kann die MiG-23A die AA-11 Archer ausrüsten, eine hochwendige, kurzreichweitige Infrarot-Luft-Luft-Rakete. Sie führt außerdem begrenzte Angriffsbeladungen mit sich. Dieser Jäger ist den in der Kampagne verbreiteten F-4 überlegen, benötigt jedoch Störunterstützung gegen F-14.
wp_taifun=Die Ko-45 ist ein unterschallschnelles, trägergestütztes Angriffsflugzeug, die sowjetische Antwort auf die A-6 Intruder. Sie führt eine schwere, stand-off-fähige Beladung für Seeziel- und Landangriffe mit Präzisionsoptionen und SEAD-Fähigkeit mit sich und kann auch als Tanker fliegen. Sie ist der Angriffsarm der Fluggruppe der Orel-Klasse.
wp_taifun_ew=Die Ko-45E ist die elektronische Kampfversion der Ko-45, in der Rolle der EA-6 Prowler. Ihr Störsender beeinträchtigt feindliche Radare und Flugabwehrraketen-Einsätze für den Angriffsverband, und sie kann Antiradar-Raketen für SEAD mitführen. Nur sehr wenige stehen zur Verfügung, setzen Sie sie nicht unnötig ein.
wp_p-42=Die P-42 ist ein trägergestütztes U-Jagd- und Seefernaufklärungsflugzeug, vergleichbar mit der S-3 Viking. Mit Sonarbojen und Torpedos erweitert sie den U-Jagd-Schirm der Task Force weit über die Reichweite von Hubschraubern hinaus und verschafft dem Träger eine Plattform mit großer Ausdauer für die Seezielsuche.
wp_mig-25pd=Die MiG-25PD Foxbat ist ein überschallschneller Abfangjäger, konzipiert zum Abfangen von Höhenbombern. Sie ist sehr schnell, besitzt ein ordentliches Luftsuchradar, IRST und Luft-Luft-Raketen mittlerer Reichweite. Im Vergleich zur MiG-23A verfügt sie über ein besseres Luftsuchradar, eine Luft-Luft-Rakete größerer Reichweite und fast die doppelte Reichweite, ist jedoch auf reine Luftkampfrollen beschränkt.
wp_su-24m=Die Su-24M ist ein überschallschneller Tiefflugbomber. Sie ist der leistungsfähigste taktische Bomber der UdSSR. Für stand-off-fähige Seezielangriffe kann sie entweder AS-13 Kingbolt seeskimmende Seezielflugkörper oder AS-11 Kilter stand-off-fähige Antiradar-Raketen ausrüsten.
wp_il-38=Die Il-38 May ist ein weitreichender Seefernaufklärer, vergleichbar mit der NATO P-3C. Sie kann den AT-2 U-Jagd-Torpedo oder PLAB-100-Wasserbomben einsetzen. Zudem führt sie beeindruckende 144x RGB-1-Sonarbojen mit sich.
wp_tu-95rt=Die Tu-95RT Bear ist ein weitreichender Seefernaufklärer. Sie besitzt ein weitreichendes Seezielsuchradar und eine gute ESM-Ausstattung. Diese Plattform steigert das Lagebild der Task Force gegen Überwasserkontakte erheblich. Sie ist jedoch gegen feindliche Jäger nicht überlebensfähig, lassen Sie sie also nicht unbegleitet.
wp_tu-16k=Die Tu-16K Badger ist ein unterschallschneller strategischer Bomber. Sie rüstet die AS-6 Kingfish stand-off-fähige Seezielflugkörper aus, die über einen sekundären Landangriffsmodus verfügt. Sie kann auch die AS-2B Kipper stand-off-fähige Störflugkörper mitführen. Dies ist eine Seezielflugkörper-Plattform, die für alle Überwasserbedrohungen unterhalb amerikanischer Trägerkampfgruppen geeignet ist.
wp_tu-22m2=Die Tu-22M2 Backfire ist ein überschallschneller strategischer Bomber. Sie rüstet die AS-4 Kitchen stand-off-fähige Seezielflugkörper oder die AS-4B Landangriffsrakete aus. Ihre hohe Geschwindigkeit und stand-off-Reichweite verschaffen ihr eine gewisse Überlebensfähigkeit selbst gegen amerikanische Trägerkampfgruppen.
wp_tu-16p=Eine Modifikation der Badger, die Tu-16P Badger-J ist ein weitreichendes EloKa-Flugzeug. Ihr einziger Zweck ist der Einsatz des Buket-ECM-Störsenders mit einer Reichweite von 135 nm. Dies ist ein wertvolles Mittel, das Jäger vor feindlichen Luft-Luft-Raketen großer Reichweite abschirmen oder feindliche Überwasserkräfte blenden kann.
wp_p-42_rldn=Kriegsbedingt wurde dieses AEW-Prototypflugzeug eilig in begrenzten Einsatzdienst gestellt. Es kann Luft- und Überwasserkontakte auf bis zu 216 nm Entfernung erfassen, ergänzt durch eine gute ESM-Ausstattung. Dies ist ein bedeutender Kräftevervielfacher für Ihre Task Force, da es seeskimmende Flugkörper und Tiefflugangreifer lange vor den bordgestützten Luftsuchradaren erkennt.
