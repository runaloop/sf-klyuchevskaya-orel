Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第6部 </size>\電撃奇襲\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName}は友軍上陸作戦の支援を命じられた。\n\n軽度の敵航空戦力による抵抗を予期せよ。\n\n注：補給部隊がペトロパブロフスクより向かっている。任務終了後、補給と修理が利用可能となる。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第14上陸艇旅団\n第55海軍歩兵師団\nSubj=任務完了――上陸成功\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 函館への上陸成功を報告する貴官の通信を受信したことを確認する。\n\n2. (S) 第55海軍歩兵師団からの報告によれば、橋頭堡は確保され、後続部隊の展開が可能である。\n\n3. (S) ペトロパブロフスク補給部隊と会合するため、東方へ移動せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第14上陸艇旅団\n第55海軍歩兵師団\nSubj=被害報告――揚陸艦損失\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 友軍揚陸艦の撃沈に関する貴官の通信を受信したことを確認する。\n\n2. (S) 残存する揚陸艦だけでは橋頭堡確保に十分な兵力を輸送できない。\n\n3. (S) 全部隊は直ちに撤退せよ。\nButtonText=任務へ戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第14上陸艇旅団\n第55海軍歩兵師団\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (TS) 状況：信号情報（SIGINT）により、コンステレーション CV-64が22日0030Z FEBに攻撃隊を発艦させたことが判明。\n\n2. (TS) 評価：敵攻撃隊はF/A-18A、A-6E、A-7E、およびEA-6Bを含む16機以上で編成されている可能性が高い。敵の来襲は南東方向より予期され、30分以内にAGM-84Dハープーンの射程内に進入する。\n\n3. (TS) 所見：フォキノより支援の邀撃機を緊急発艦させている。優先目標は敵の電子妨害機および戦闘機である。貴部隊がA-6Eのハープーン発射前に迎撃することは困難と見込まれるが、我が方の搭乗員は機銃による接近中の低空侵入対艦ミサイルの撃破訓練を受けている。\n\n最優先 最優先 最優先\nButtonText=作戦続行\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=友軍邀撃機、緊急発艦\nBody=MiG-23A 6機が配置に到着した。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=敵増援部隊\nBody=日本軍は海岸防衛を増強するため戦車部隊を送り込んでいる。\n\n戦車部隊は上陸地域の東方から接近すると予期される。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=上陸海岸確保\nBody=上陸地域における敵の航空・海上・地上戦力はすべて排除された。\nButtonText=勝利\nPopupStyle=Notification
Taskforce2LandingAreaMessage=Title=第14上陸艇旅団、目標地点に到達\nBody=第55海軍歩兵師団が上陸を開始した。\nButtonText=了解し続行\nPopupStyle=Notification
