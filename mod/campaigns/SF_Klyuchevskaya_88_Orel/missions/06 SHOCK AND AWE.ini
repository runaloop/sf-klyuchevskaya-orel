Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody={FlagshipName} потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 6 </size>\ШОК И ТРЕПЕТ\n<size=24>21 2300Z ФЕВ 88</size>\\nBody=КУГ «Ключевская» получило задачу поддержать дружественную десантную операцию. \n\nОжидается слабое противодействие вражеской авиации.\n\nПримечание: Примечание: группа пополнения запасов из Петропавловска на подходе. После выполнения задания будет доступно пополнение и ремонт.\nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n14-я БРИГАДА ДЕСАНТНЫХ КОРАБЛЕЙ\n55-я ДИВИЗИЯ МОРСКОЙ ПЕХОТЫ\nSubj=ЗАДАНИЕ ВЫПОЛНЕНО — ВЫСАДКА УСПЕШНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об успешной высадке в Хакодате. \n\n2. (С) По докладам 55-й дивизии морской пехоты плацдарм закреплён и готов для приёма последующих сил. \n\n3. (С) Перейти на восток для встречи (RV) с группой пополнения запасов из Петропавловска. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n14-я БРИГАДА ДЕСАНТНЫХ КОРАБЛЕЙ\n55-я ДИВИЗИЯ МОРСКОЙ ПЕХОТЫ\nSubj=ДОНЕСЕНИЕ ОБ АВАРИИ — ДЕСАНТНЫЙ КОРАБЛЬ ПОТЕРЯН\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения о потоплении дружественного десантного корабля. \n\n2. (С) Оставшийся десантный корабль не может доставить достаточные силы для удержания плацдарма. \n\n3. (С) Немедленно отвести все силы.\nButtonText=Вернуться к миссии\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n14-я БРИГАДА ДЕСАНТНЫХ КОРАБЛЕЙ\n55-я ДИВИЗИЯ МОРСКОЙ ПЕХОТЫ\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (СС) ОБСТАНОВКА: РТР докладывает о вылете ударной группы КОНСТЕЛЛЕЙШН CV-64 в 22 0030Z ФЕВ 88. \n\n2. (СС) ОЦЕНКА: Ударная группа противника с высокой вероятностью включает 16+ самолётов, в том числе F/A-18A, A-6E, A-7E и EA-6B. Ожидается налёт с юго-востока, вход в зону действия ПКР AGM-84D HARPOON — через 30 минут. \n\n3. (СС) КОММЕНТАРИИ: Фокино поднимает истребители-перехватчики для помощи. Приоритетные цели — вражеские РЭБ-самолёты и истребители. Ваши силы вряд ли успеют перехватить A-6E до пуска гарпунов, однако наши лётчики обучены поражать низколетящие противокорабельные ракеты пушечным огнём. \n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=Дружественные истребители-перехватчики поднялись\nBody=6x МиГ-23А уже в воздухе. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=Подкрепления противника\nBody=Японцы направляют танки для усиления обороны побережья. \n\nОжидается, что танки подойдут с востока от района высадки. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=Пункт высадки закреплён\nBody=Район высадки очищен от всех вражеских воздушных, морских и наземных сил. \nButtonText=Победа\nPopupStyle=Notification
Taskforce2LandingAreaMessage=Title=14-я бригада десантных кораблей достигла цели.\nBody=55-я дивизия морской пехоты начинает высадку. \nButtonText=Принять к сведению и продолжить\nPopupStyle=Notification
