Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 6 </size>\冲击与震撼\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName}奉命支援友军登陆行动。\n\n预计会遭遇轻微的敌方空中抵抗。\n\n注意：补给部队正从彼得罗巴甫洛夫斯克赶来。任务结束后可进行补给和维修。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第14登陆舰旅\n第55海军步兵师\nSubj=任务完成——登陆成功\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于成功在函馆登陆的电文报告。\n\n2. (S) 第55海军步兵师报告称登陆场已经巩固，可供后续部队通过。\n\n3. (S) 向东转移，与彼得罗巴甫洛夫斯克补给部队会合。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第14登陆舰旅\n第55海军步兵师\nSubj=损失报告——登陆舰损失\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于友军登陆舰被击沉的电文报告。\n\n2. (S) 剩余登陆舰无法运送足够兵力巩固登陆场。\n\n3. (S) 立即撤出所有部队。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第14登陆舰旅\n第55海军步兵师\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (TS) 情况：信号情报显示，星座号（CV-64）已于22日0030Z派出打击机群。\n\n2. (TS) 判断：敌方打击机群极有可能包含16架以上飞机，其中包括F/A-18A、A-6E、A-7E和EA-6B。敌方来袭预计从东南方向进入，30分钟后进入AGM-84D"鱼叉"导弹射程。\n\n3. (TS) 备注：富基诺方向正紧急起飞截击机前来支援。优先目标为敌方干扰机和战斗机。你部不太可能在A-6E发射鱼叉导弹前将其拦截，但我方飞行员已受训以航炮摧毁来袭的掠海导弹。\n\n特急 特急 特急\nButtonText=继续游戏\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=友军截击机已升空\nBody=6架米格-23A现已进入战位。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=敌方增援\nBody=日方正派出坦克增援海滩防线。\n\n预计坦克将从登陆区东侧接近。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=登陆海滩已巩固\nBody=登陆区域内所有敌方空中、海上和地面力量已被清除。\nButtonText=胜利\nPopupStyle=Notification
Taskforce2LandingAreaMessage=Title=第14登陆舰旅已到达目标区域。\nBody=第55海军步兵师正在下船登陆。\nButtonText=确认并继续\nPopupStyle=Notification
