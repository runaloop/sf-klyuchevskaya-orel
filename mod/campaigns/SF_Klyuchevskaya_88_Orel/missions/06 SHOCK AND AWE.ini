Taskforce2FlagshiplostMessage=Title=THẤT BẠI!\nBody={FlagshipName} đã bị đánh chìm!\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 6 </size>\ĐÒN ĐÁNH BẤT NGỜ\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName} được giao nhiệm vụ hỗ trợ chiến dịch đổ bộ của quân bạn. \n\nDự kiến có sự chống đối nhẹ từ không quân đối phương.\n\nGhi chú: lực lượng tiếp tế đang trên đường từ Petropavlovsk. Tiếp tế và sửa chữa sẽ khả dụng sau nhiệm vụ.\nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nLỮ ĐOÀN TÀU ĐỔ BỘ 14\nSƯ ĐOÀN HẢI QUÂN LỤC CHIẾN 55\nSubj=HOÀN THÀNH NHIỆM VỤ-ĐỔ BỘ THÀNH CÔNG\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc đổ bộ thành công tại Hakodate. \n\n2. (S) Báo cáo từ Sư đoàn Hải quân Lục chiến 55 cho biết đầu cầu đổ bộ đã an toàn và sẵn sàng cho các lực lượng tiếp theo. \n\n3. (S) Di chuyển về phía đông để gặp gỡ lực lượng tiếp tế từ Petropavlovsk. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nLỮ ĐOÀN TÀU ĐỔ BỘ 14\nSƯ ĐOÀN HẢI QUÂN LỤC CHIẾN 55\nSubj=BÁO CÁO THIỆT HẠI - MẤT TÀU ĐỔ BỘ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc mất một tàu đổ bộ của quân bạn. \n\n2. (S) Tàu đổ bộ còn lại không thể chuyển đủ lực lượng để giữ vững đầu cầu đổ bộ. \n\n3. (S) Rút toàn bộ lực lượng ngay lập tức.\nButtonText=Trở lại nhiệm vụ\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nLỮ ĐOÀN TÀU ĐỔ BỘ 14\nSƯ ĐOÀN HẢI QUÂN LỤC CHIẾN 55\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) TÌNH HÌNH: SIGINT báo cáo CONSTELLATION CV-64 đã xuất kích đợt tấn công vào lúc 22 0030Z FEB 88. \n\n2. (TS) ĐÁNH GIÁ: Đợt tấn công của đối phương có khả năng cao gồm 16+ máy bay, bao gồm F/A-18A, A-6E, A-7E và EA-6B. Dự kiến đợt tập kích đến từ hướng đông nam, sẽ vào tầm bắn AGM-84D HARPOON trong 30 phút nữa. \n\n3. (TS) NHẬN XÉT: Fokino đang xuất kích tiêm kích đánh chặn để hỗ trợ. Mục tiêu ưu tiên là máy gây nhiễu và tiêm kích của đối phương. Lực lượng của các đồng chí khó có thể đánh chặn A-6E trước khi chúng bắn harpoon, tuy nhiên, các phi công của chúng ta được huấn luyện để tiêu diệt tên lửa bay sát mặt biển bằng pháo. \n\nFLASH FLASH FLASH\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=Tiêm kích đánh chặn của quân bạn đã xuất kích\nBody=6 chiếc MiG-23A hiện đã có mặt tại vị trí trực chiến. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=Viện binh của đối phương\nBody=Nhật Bản đang gửi xe tăng để tăng viện cho bãi biển. \n\nDự kiến xe tăng sẽ tiếp cận từ phía đông khu vực đổ bộ. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=Bãi đổ bộ đã được bảo đảm an toàn\nBody=Khu vực đổ bộ đã được quét sạch toàn bộ lực lượng không quân, hải quân và lục quân của đối phương. \nButtonText=Chiến thắng\nPopupStyle=Notification
Taskforce2LandingAreaMessage=Title=Lữ đoàn tàu đổ bộ 14 đã đến mục tiêu.\nBody=Sư đoàn Hải quân Lục chiến 55 hiện đang đổ bộ. \nButtonText=Xác nhận và tiếp tục\nPopupStyle=Notification
