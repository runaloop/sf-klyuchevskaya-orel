Taskforce2FlagshiplostMessage=Title=NIEDERLAGE!\nBody={FlagshipName} wurde versenkt!\nButtonText=Zur Mission zurückkehren\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 6 </size>\SCHOCK UND EHRFURCHT\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName} hat den Auftrag, befreundete Landungsoperationen zu unterstützen. \n\nLeichter feindlicher Luftwiderstand ist zu erwarten.\n\nHinweis: Nachschubverband aus Petropawlowsk ist unterwegs. Nachschub und Reparatur stehen nach der Mission zur Verfügung.\nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\n14. Landungsschiffbrigade\n55. Marineinfanteriedivision\nSubj=AUFTRAG ERFÜLLT - LANDUNG ERFOLGREICH\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die erfolgreiche Landung bei Hakodate. \n\n2. (S) Meldungen der 55. Marineinfanteriedivision zeigen den Landekopf gesichert und frei für Nachfolgekräfte. \n\n3. (S) Ostwärts übersetzen zum Treffpunkt mit dem Nachschubverband aus Petropawlowsk. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n14. Landungsschiffbrigade\n55. Marineinfanteriedivision\nSubj=SCHADENSMELDUNG - LANDUNGSSCHIFF VERLOREN\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über ein versenktes befreundetes Landungsschiff. \n\n2. (S) Das verbleibende Landungsschiff kann keine ausreichenden Kräfte anlanden, um den Landekopf zu sichern. \n\n3. (S) Alle Kräfte sofort zurückziehen.\nButtonText=Zur Mission zurückkehren\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n14. Landungsschiffbrigade\n55. Marineinfanteriedivision\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (TS) LAGE: SIGINT meldet, dass die CONSTELLATION CV-64 um 22 0030Z FEB 88 einen Angriffsverband ausgesandt hat. \n\n2. (TS) EINSCHÄTZUNG: Der feindliche Angriffsverband enthält mit hoher Wahrscheinlichkeit 16+ Flugzeuge, darunter F/A-18A, A-6E, A-7E und EA-6B. Feindlicher Angriff aus Südost erwartet, tritt in 30 Minuten in AGM-84D HARPOON-Reichweite ein. \n\n3. (TS) ANMERKUNGEN: Fokino lässt Abfangjäger zur Unterstützung aufsteigen. Vorrangige Ziele sind feindliche Störsender und Jäger. Es ist unwahrscheinlich, dass Ihre Kräfte die A-6E vor dem Harpoon-Abschuss abfangen, doch unsere Piloten sind darin geschult, anfliegende Seeskimmer mit Bordkanonen zu zerstören. \n\nBLITZ BLITZ BLITZ\nButtonText=Weiterspielen\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=Befreundete Abfangjäger gestartet\nBody=6x MiG-23A befinden sich jetzt in Warteposition. \nButtonText=Weiterspielen\nPopupStyle=Notification
