Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 6 </size>\GOLPE REPENTINO\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName} ha sido encargada de apoyar operaciones de desembarco amigas. \n\nSe espera oposición aérea enemiga ligera.\n\nNota: fuerza de reabastecimiento en camino desde Petropávlovsk. El reabastecimiento y la reparación estarán disponibles después de la misión.\nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n14.ª BRIGADA DE BUQUES DE DESEMBARCO\n55.ª DIVISIÓN DE INFANTERÍA NAVAL\nSubj=MISIÓN CUMPLIDA-DESEMBARCO EXITOSO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa del desembarco exitoso en Hakodate. \n\n2. (S) Los informes de la 55.ª División de Infantería Naval indican que la cabeza de playa está asegurada y despejada para las fuerzas de seguimiento. \n\n3. (S) Transite al este para reunirse con la fuerza de reabastecimiento de Petropávlovsk. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n14.ª BRIGADA DE BUQUES DE DESEMBARCO\n55.ª DIVISIÓN DE INFANTERÍA NAVAL\nSubj=INFORME DE BAJAS - BUQUE DE DESEMBARCO PERDIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes sobre el hundimiento de un buque de desembarco amigo. \n\n2. (S) El buque de desembarco restante no puede entregar suficientes fuerzas para asegurar la cabeza de playa. \n\n3. (S) Retire todas las fuerzas de inmediato.\nButtonText=Volver a la misión\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n14.ª BRIGADA DE BUQUES DE DESEMBARCO\n55.ª DIVISIÓN DE INFANTERÍA NAVAL\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUACIÓN: la SIGINT informa que el CONSTELLATION CV-64 lanzó un paquete de ataque a las 22 0030Z FEB 88. \n\n2. (TS) EVALUACIÓN: es muy probable que el paquete de ataque enemigo incluya 16 o más aeronaves, entre ellas F/A-18A, A-6E, A-7E y EA-6B. Se espera que la incursión enemiga llegue desde el sudeste y entre en alcance del AGM-84D HARPOON en 30 minutos. \n\n3. (TS) COMENTARIOS: Fokino está enviando interceptores para asistir. Los objetivos prioritarios son los perturbadores y cazas enemigos. Es poco probable que su fuerza intercepte a los A-6E antes de que disparen los harpoon, sin embargo, nuestros pilotos están entrenados para destruir con cañones los misiles rasantes entrantes. \n\nFLASH FLASH FLASH\nButtonText=Seguir jugando\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=Interceptores Amigos Despegados\nBody=6 MiG-23A están ahora en estación. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=Refuerzos Enemigos\nBody=Los japoneses están enviando tanques para reforzar las playas. \n\nSe espera que los tanques se acerquen desde el este de la zona de desembarco. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=Playa de desembarco asegurada\nBody=La zona de desembarco ha sido saneada de todas las fuerzas aéreas, navales y terrestres enemigas. \nButtonText=Victoria\nPopupStyle=Notification
