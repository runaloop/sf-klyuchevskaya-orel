Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제6부 </size>\돌발 기습\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName}는 우군 상륙 작전을 지원하라는 임무를 받았다. \n\n경미한 적 항공 저항이 예상된다.\n\n참고: 페트로파블롭스크로부터 재보급 부대가 이동 중이다. 임무 종료 후 보급 및 수리가 가능하다.\nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=제10작전전대\n제14상륙함여단\n제55해군보병사단\nSubj=임무 완료-상륙 성공\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 하코다테 상륙 성공을 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 제55해군보병사단의 보고에 따르면 상륙거점이 확보되었으며 후속 부대의 진입이 가능하다. \n\n3. (S) 페트로파블롭스크 재보급 부대와의 집결을 위해 동쪽으로 이동하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제14상륙함여단\n제55해군보병사단\nSubj=피해보고 - 상륙함 손실\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 우군 상륙함 격침에 관한 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 남은 상륙함으로는 상륙거점을 확보할 충분한 전력을 상륙시킬 수 없다. \n\n3. (S) 모든 전력을 즉시 철수시켜라.\nButtonText=임무로 돌아가기\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제14상륙함여단\n제55해군보병사단\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (TS) 상황: SIGINT에 따르면 컨스텔레이션 CV-64가 22 0030Z FEB 88에 타격 편대를 발진시켰다. \n\n2. (TS) 평가: 적 타격 편대는 F/A-18A, A-6E, A-7E, EA-6B를 포함해 16기 이상으로 편성되었을 가능성이 높다. 적 공습은 남동쪽에서 예상되며 30분 후 AGM-84D 하푼 사거리에 진입할 것이다. \n\n3. (TS) 논평: 포키노에서 지원을 위해 요격기를 발진시키고 있다. 우선 표적은 적 전자전기 및 전투기이다. 귀 부대가 A-6E의 하푼 발사 전에 요격할 가능성은 낮으나, 우리 조종사들은 접근하는 시스키밍 미사일을 기관포로 격추하는 훈련을 받았다. \n\n긴급 긴급 긴급\nButtonText=계속 진행\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=우군 요격기 발진\nBody=MiG-23A 6기가 현재 대기 중이다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=적 증원군\nBody=일본군이 해안 방어를 위해 전차를 파견하고 있다. \n\n전차는 상륙 지역 동쪽에서 접근할 것으로 예상된다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=상륙 해안 확보\nBody=상륙 지역의 모든 적 항공, 해상, 지상 전력이 소탕되었다. \nButtonText=승리\nPopupStyle=Notification
