Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 6 </size>\CHOC ET EFFROI\n<size=24>21 2300Z FEB 88</size>\\nBody={TaskForceName} est chargée de soutenir des opérations de débarquement amies. \n\nUne légère opposition aérienne ennemie est attendue.\n\nRemarque : Remarque : une force de ravitaillement est en route depuis Petropavlovsk. Le ravitaillement et les réparations seront disponibles après la mission.\nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n14th LANDING SHIP BDE\n55th NAVAL INFANTRY DIV\nSubj=MISSION ACCOMPLIE-DÉBARQUEMENT RÉUSSI\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant le débarquement réussi à Hakodate. \n\n2. (S) Les rapports de la 55e division d'infanterie navale indiquent que la tête de pont est sécurisée et dégagée pour les forces de suite. \n\n3. (S) Transitez vers l'est pour votre RV avec la force de ravitaillement de Petropavlovsk. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2AmphibslostMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n14th LANDING SHIP BDE\n55th NAVAL INFANTRY DIV\nSubj=CASREP - NAVIRE DE DÉBARQUEMENT PERDU\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message concernant la perte d'un navire de débarquement ami. \n\n2. (S) Le navire de débarquement restant ne peut acheminer des forces suffisantes pour sécuriser la tête de pont. \n\n3. (S) Repliez immédiatement toutes les forces.\nButtonText=Retour à la mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2ConstellationStrikeMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n14th LANDING SHIP BDE\n55th NAVAL INFANTRY DIV\nSubj=\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION : le SIGINT signale qu'un groupe de frappe du CONSTELLATION CV-64 a décollé à 22 0030Z FEB 88. \n\n2. (TS) ÉVALUATION : le groupe de frappe ennemi contient très probablement 16 aéronefs ou plus, dont des F/A-18A, A-6E, A-7E et EA-6B. Le raid ennemi est attendu depuis le sud-est et entrera dans la portée des AGM-84D HARPOON dans 30 minutes. \n\n3. (TS) COMMENTAIRES : Fokino fait décoller des intercepteurs en soutien. Les cibles prioritaires sont les brouilleurs et les chasseurs ennemis. Il est peu probable que votre force intercepte les A-6E avant qu'ils ne tirent leurs harpons, cependant, nos pilotes sont entraînés à détruire au canon les engins rasants entrants. \n\nFLASH FLASH FLASH\nButtonText=Continuer la partie\nPopupStyle=NavalMessage
Taskforce2FokinoResponseMessage=Title=Intercepteurs amis décollés\nBody=6 MiG-23A sont désormais en poste. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2HokkaidoReinforcementsMessage=Title=Renforts ennemis\nBody=Les Japonais envoient des chars pour renforcer les plages. \n\nCes chars sont attendus à l'est de la zone de débarquement. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2AllDeadVictoryMessage=Title=Plage de débarquement sécurisée\nBody=La zone de débarquement a été purgée de toutes les forces aériennes, navales et terrestres ennemies. \nButtonText=Victoire\nPopupStyle=Notification
Taskforce2LandingAreaMessage=Title=La 14e brigade de navires de débarquement a atteint son objectif.\nBody=La 55e division d'infanterie navale débarque à présent. \nButtonText=Confirmer et continuer\nPopupStyle=Notification
