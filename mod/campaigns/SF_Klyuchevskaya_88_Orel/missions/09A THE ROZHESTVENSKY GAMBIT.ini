Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 9a </size>\罗杰斯特文斯基的赌局\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName}必须护送"人民"特遣舰队突破敌方封锁部队。\n\n注意：你的特遣舰队将在任务结束后于佐世保补给。"人民"特遣舰队的部分舰船将在任务结束后加入你的特遣舰队。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第11作战支队\nSubj=任务完成——基洛夫号安全\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于基洛夫号已到达友军空中掩护范围的电文报告。\n\n2. (S) "人民"特遣舰队的存活将大幅提升本作战区域内的友军反舰和防空能力。\n\n3. (S) 继续转移至横须贺休整补充。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=战败\nBody=基洛夫号已被击沉！\nButtonText=返回任务\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=那霸空军基地已被摧毁\nBody=日军在冲绳的空中力量已被消灭。这将使夺取该岛变得更为容易。\nButtonText=继续任务\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第11作战支队\nSubj=空袭警告\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (TS) 情况：信号情报在硫磺岛上空探测到美国空军甚高频空中指挥通信。截获片段显示，以硫磺岛为基地的F-15战斗机已与一支轰炸机部队会合。\n\n2. (TS) 判断：来袭机群预计包含4架以上B-52，由2架以上F-15护航。来袭预计1.5小时后进入AGM-84D"鱼叉"导弹射程。\n\n3. (TS) 备注：F-15的作战半径足以护航B-52抵达"鱼叉"导弹发射点。建议立即从新田原紧急起飞陆基飞机。\n\n特急 特急 特急\nButtonText=继续游戏\nPopupStyle=NavalMessage
