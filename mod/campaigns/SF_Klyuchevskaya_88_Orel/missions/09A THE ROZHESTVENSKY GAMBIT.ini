Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 9a </size>\NƯỚC CỜ ROZHESTVENSKY\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName} phải hộ tống SF Narod vượt qua một lực lượng chặn đường của đối phương. \n\nGhi chú: lực lượng đặc nhiệm của các đồng chí sẽ được tiếp tế tại Sasebo sau nhiệm vụ. Một số tàu của SF Narod sẽ gia nhập lực lượng của các đồng chí khi nhiệm vụ hoàn thành. \nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nPHI ĐỘI TÁC CHIẾN 11\nSubj=HOÀN THÀNH NHIỆM VỤ-KIROV AN TOÀN\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc Kirov đã đến khu vực được yểm trợ không quân của quân bạn. \n\n2. (S) Việc SF Narod sống sót làm tăng đáng kể năng lực tác chiến mặt nước và phòng không của quân bạn trong khu vực. \n\n3. (S) Tiếp tục di chuyển đến Yokosuka để nghỉ ngơi và tái trang bị. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=THẤT BẠI\nBody=KIROV đã bị đánh chìm!\nButtonText=Trở lại nhiệm vụ\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=Căn cứ không quân Naha đã bị tiêu diệt\nBody=Sức mạnh không quân của Nhật Bản tại Okinawa đã bị vô hiệu hóa. Điều này sẽ giúp việc chiếm đảo dễ dàng hơn nhiều. \nButtonText=Tiếp tục nhiệm vụ\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nPHI ĐỘI TÁC CHIẾN 11\nSubj=CẢNH BÁO ĐỢT TẤN CÔNG\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) TÌNH HÌNH: SIGINT phát hiện lưu lượng điện đài chỉ huy không quân băng tần VHF của USAF trên khu vực Iwo Jima. Các đoạn chặn thu cho thấy tiêm kích F-15 đóng tại Iwo Jima đã gặp gỡ với một lực lượng máy bay ném bom. \n\n2. (TS) ĐÁNH GIÁ: Đợt tập kích được đánh giá gồm 4+ chiếc B-52, được hộ tống bởi 2+ chiếc F-15. Dự kiến đợt tập kích sẽ vào tầm bắn HARPOON-D trong 1,5 giờ nữa. \n\n3. (TS) NHẬN XÉT: F-15 có tầm hoạt động đủ để hộ tống B-52 đến điểm phóng HARPOON. Khuyến nghị xuất kích ngay máy bay từ căn cứ mặt đất tại Nyutabaru.\n\nFLASH FLASH FLASH\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage
