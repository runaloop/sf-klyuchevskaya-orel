Taskforce2FlagshiplostMessage=Title=敗北！\nBody={FlagshipName}が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第9a部 </size>\ロジェストヴェンスキーの賭け\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName}は、敵の阻止部隊を突破してSFナロードを護衛しなければならない。\n\n注：貴任務部隊は任務終了後、佐世保にて補給を受ける。SFナロード所属の一部艦艇は、任務完了後に貴任務部隊へ合流する。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第11作戦戦隊\nSubj=任務完了――キーロフ安全確保\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) キーロフが友軍航空掩護圏内に到達したことを報告する貴官の通信を受信したことを確認する。\n\n2. (S) SFナロードの生存により、当該作戦海域における友軍の対水上戦および対空戦能力は大幅に向上する。\n\n3. (S) 休息と整備のため横須賀への移動を継続せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=敗北\nBody=キーロフが撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=那覇基地撃破\nBody=沖縄における日本軍の航空戦力は無力化された。これにより、当該島の攻略は大幅に容易となる。\nButtonText=任務続行\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第11作戦戦隊\nSubj=空襲警報\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (TS) 状況：信号情報（SIGINT）により、硫黄島上空における米空軍のVHF帯航空指揮通信を検知。傍受した通信断片によれば、硫黄島基地のF-15戦闘機が爆撃機部隊と会合したことを示している。\n\n2. (TS) 評価：来襲する部隊はB-52 4機以上、F-15 2機以上による護衛を伴うと評価される。来襲は1.5時間以内にハープーンDの射程内に進入すると推定される。\n\n3. (TS) 所見：F-15はB-52をハープーン発射点まで護衛するのに十分な行動半径を有する。新田原からの地上配備機の緊急発艦を直ちに推奨する。\n\n最優先 最優先 最優先\nButtonText=作戦続行\nPopupStyle=NavalMessage
