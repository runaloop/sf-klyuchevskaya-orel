Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 9a </size>\DAS ROSCHESTWENSKI-GAMBIT\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName} muss SF Narod an einem feindlichen Sperrverband vorbei eskortieren. \n\nHinweis: Ihre Task Force wird nach der Mission in Sasebo Nachschub aufnehmen. Bestimmte Schiffe von SF Narod schließen sich Ihren Kräften an, sobald die Mission abgeschlossen ist. \nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n11. Operative Staffel\nSubj=AUFTRAG ERFÜLLT - KIROV IN SICHERHEIT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Ankunft der Kirov unter befreundeter Luftdeckung. \n\n2. (S) Das Überleben von SF Narod erhöht die befreundete Seeziel- und Luftabwehrfähigkeit im Einsatzgebiet erheblich. \n\n3. (S) Durchfahrt nach Yokosuka fortsetzen zur Erholung und Instandsetzung. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=NIEDERLAGE\nBody=KIROV wurde versenkt!\nButtonText=Zur Mission zurückkehren\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=Fliegerhorst Naha zerstört\nBody=Die japanische Luftmacht auf Okinawa wurde neutralisiert. Dies wird die Einnahme der Insel deutlich erleichtern. \nButtonText=Mission fortsetzen\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n11. Operative Staffel\nSubj=ANGRIFFSWARNUNG\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (TS) LAGE: SIGINT erfasste USAF-Luftführungsfunkverkehr im UKW-Band über Iwojima. Abgefangene Segmente deuten darauf hin, dass auf Iwojima stationierte F-15-Jäger sich mit einem Bomberverband getroffen haben. \n\n2. (TS) EINSCHÄTZUNG: Der Angriff umfasst schätzungsweise 4+ B-52, begleitet von 2+ F-15. Der Angriff tritt voraussichtlich in 1,5 Stunden in HARPOON-D-Reichweite ein. \n\n3. (TS) ANMERKUNG: Die F-15 hat ausreichende Reichweite, um die B-52 bis zu den Harpoon-Abschusspunkten zu begleiten. Empfehlung: Sofortiger Alarmstart landgestützter Flugzeuge von Nyutabaru.\n\nBLITZ BLITZ BLITZ\nButtonText=Weiterspielen\nPopupStyle=NavalMessage
