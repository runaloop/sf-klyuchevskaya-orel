Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Parte 9a </size>\EL GAMBITO ROZHESTVENSKY\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName} debe escoltar a SF Narod más allá de una fuerza de bloqueo enemiga. \n\nNota: su fuerza operativa se reabastecerá en Sasebo tras finalizar la misión. Ciertos buques de SF Narod se unirán a su fuerza una vez completada la misión. \nButtonText=Iniciar misión\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n11.ª ESCUADRA OPERATIVA\nSubj=MISIÓN CUMPLIDA-KIROV A SALVO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la llegada del Kirov a la cobertura aérea amiga. \n\n2. (S) La supervivencia de SF Narod aumenta significativamente la capacidad ASuW y AA amiga en la zona de operaciones. \n\n3. (S) Continúe el tránsito hacia Yokosuka para descanso y reacondicionamiento. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=DERROTA\nBody=¡El KIROV ha sido hundido!\nButtonText=Volver a la misión\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=Base aérea de Naha destruida\nBody=El poder aéreo japonés en Okinawa ha sido neutralizado. Esto hará que la captura de la isla sea mucho más fácil. \nButtonText=Continuar la misión\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n11.ª ESCUADRA OPERATIVA\nSubj=ALERTA DE ATAQUE\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUACIÓN: la SIGINT detectó tráfico de mando aéreo de la USAF en banda VHF sobre Iwo Jima. Los segmentos interceptados indican que cazas F-15 basados en Iwo Jima se reunieron con una fuerza de bombarderos. \n\n2. (TS) EVALUACIÓN: se calcula que la incursión incluye 4 o más B-52, escoltados por 2 o más F-15. Se estima que la incursión entrará en alcance de HARPOON-D en 1,5 horas. \n\n3. (TS) COMENTARIO: el F-15 tiene alcance suficiente para escoltar a los B-52 hasta los puntos de lanzamiento de HARPOON. Se recomienda el despegue inmediato de aeronaves de base terrestre desde Nyutabaru.\n\nFLASH FLASH FLASH\nButtonText=Seguir jugando\nPopupStyle=NavalMessage
