Taskforce2FlagshiplostMessage=Title=패배!\nBody={FlagshipName}가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제9A부 </size>\로제스트벤스키의 도박\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName}는 적 차단부대를 뚫고 나로드 기동부대를 호위해야 한다. \n\n참고: 귀 기동부대는 임무 종료 후 사세보에서 보급을 받는다. 나로드 기동부대 소속 일부 함선은 임무 완료 후 귀 부대에 합류한다. \nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제11작전전대\nSubj=임무 완료-키로프 안전\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 키로프가 우군 항공엄호권에 도착했음을 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 나로드 기동부대의 생존은 작전구역 내 우군 대함 및 대공 능력을 크게 향상시킨다. \n\n3. (S) 휴식과 재정비를 위해 요코스카로 계속 이동하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=패배\nBody=키로프가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=나하 공군기지 파괴\nBody=오키나와의 일본 항공 전력이 무력화되었다. 이는 섬 점령을 훨씬 쉽게 만들 것이다. \nButtonText=임무 계속\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제11작전전대\nSubj=공습 경고\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (TS) 상황: SIGINT가 이오지마 상공에서 미 공군의 VHF 대역 항공 지휘 통신을 감지했다. 감청된 내용은 이오지마 기지 F-15 전투기가 폭격기 편대와 집결했음을 나타낸다. \n\n2. (TS) 평가: 이번 공습은 F-15 2기 이상의 호위를 받는 B-52 4기 이상으로 편성된 것으로 평가된다. 공습은 1.5시간 후 하푼-D 사거리에 진입할 것으로 예상된다. \n\n3. (TS) 논평: F-15는 B-52를 하푼 발사 지점까지 호위할 충분한 항속거리를 가지고 있다. 즉시 뉴타바루의 지상 기지 항공기를 발진시킬 것을 권고한다.\n\n긴급 긴급 긴급\nButtonText=계속 진행\nPopupStyle=NavalMessage
