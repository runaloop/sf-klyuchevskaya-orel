Taskforce2FlagshiplostMessage=Title=ПОРАЖЕНИЕ!\nBody={FlagshipName} потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 9a </size>\ГАМБИТ РОЖЕСТВЕНСКОГО\n<size=24>06 0600Z МАР 88</size>\\nBody=КУГ «Ключевская» должно сопроводить КУГ «Народ» через заградительные силы противника. \n\nПримечание: ваше оперативное соединение пополнит запасы в Сасебо после выполнения задания. Некоторые корабли из КУГ «Народ» присоединятся к вашим силам после завершения миссии. \nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n11-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ЗАДАНИЕ ВЫПОЛНЕНО — КИРОВ В БЕЗОПАСНОСТИ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения о прибытии КИРОВА под дружественное воздушное прикрытие. \n\n2. (С) Сохранение КУГ «Народ» значительно увеличивает возможности дружественных сил в противокорабельной и противовоздушной борьбе в районе действий. \n\n3. (С) Продолжить переход в Йокосуку для отдыха и пополнения. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=ПОРАЖЕНИЕ\nBody=КИРОВ потоплен!\nButtonText=Вернуться к миссии\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=Авиабаза Наха уничтожена\nBody=Японская авиационная мощь на Окинаве нейтрализована. Это значительно облегчит захват острова. \nButtonText=Продолжить миссию\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n11-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ПРЕДУПРЕЖДЕНИЕ О НАЛЁТЕ\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (СС) ОБСТАНОВКА: РТР обнаружила радиообмен ВВС США в УКВ-диапазоне авиационного управления над Иводзимой. Перехваченные фрагменты указывают, что истребители F-15 с базы на Иводзиме встретились с бомбардировочной группой. \n\n2. (СС) ОЦЕНКА: Налёт оценивается как включающий 4+ B-52 в сопровождении 2+ F-15. Ожидается вход налёта в зону действия HARPOON-D через 1,5 часа. \n\n3. (СС) КОММЕНТАРИЙ: F-15 обладает достаточной дальностью, чтобы сопровождать B-52 до точек пуска HARPOON. Рекомендуем немедленно поднять наземную авиацию с Нютабару.\n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Продолжить\nPopupStyle=NavalMessage
