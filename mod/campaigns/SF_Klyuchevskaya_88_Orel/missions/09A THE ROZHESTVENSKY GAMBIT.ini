Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 9a </size>\LE GAMBIT ROJESTVENSKI\n<size=24>06 0600Z MAR 88</size>\\nBody={TaskForceName} doit escorter SF Narod au-delà d'une force de blocage ennemie. \n\nRemarque : votre force opérationnelle se ravitaillera à Sasebo après la mission. Certains navires de SF Narod rejoindront votre force une fois la mission terminée. \nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2RedVictoryMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=MISSION ACCOMPLIE-KIROV SAUF\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant l'arrivée du Kirov sous couverture aérienne amie. \n\n2. (S) La survie de SF Narod accroît considérablement les capacités amies de lutte antisurface et antiaérienne dans la zone d'opérations. \n\n3. (S) Poursuivez le transit vers Yokosuka pour repos et remise en état. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2KirovLostMessage=Title=DÉFAITE\nBody=Le KIROV a été coulé !\nButtonText=Retour à la mission\nPopupStyle=Notification
Taskforce2NahaDestroyedMessage=Title=Base aérienne de Naha détruite\nBody=La puissance aérienne japonaise à Okinawa a été neutralisée. Cela facilitera grandement la capture de l'île. \nButtonText=Continuer la mission\nPopupStyle=Notification
Taskforce2GuamStrikeMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=ALERTE DE RAID\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION : le SIGINT a détecté un trafic de commandement aérien VHF de l'USAF au-dessus d'Iwo Jima. Les segments interceptés indiquent que des chasseurs F-15 basés à Iwo Jima ont fait leur RV avec une force de bombardiers. \n\n2. (TS) ÉVALUATION : le raid comprendrait 4 B-52 ou plus, escortés par 2 F-15 ou plus. Il devrait entrer dans la portée HARPOON-D dans 1h30. \n\n3. (TS) COMMENTAIRE : le F-15 a un rayon d'action suffisant pour escorter les B-52 jusqu'aux points de tir des HARPOON. Il est recommandé de faire décoller immédiatement des aéronefs basés à terre depuis Nyutabaru.\n\nFLASH FLASH FLASH\nButtonText=Continuer la partie\nPopupStyle=NavalMessage
