Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Partie 10 </size>\FIN DE PARTIE\n<size=24>10 0400Z MAR 88</size>\\nBody={TaskForceName} est chargée de couler le CONSTELLATION et son groupe de combat. Il s'agit de la dernière mission de la campagne. Bonne chance. \nButtonText=Commencer la mission\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=MISSION ACCOMPLIE-CONSTELLATION COULÉ\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Nous confirmons réception de votre message signalant la destruction du CONSTELLATION CV-64. \n\n2. (S) La perte de ce porte-avions contraindra les États-Unis à des pourparlers de paix. \n\n3. (S) Coulez son groupe de combat puis transitez vers Sasebo pour un repos bien mérité. Fin de message du KTOF.\nButtonText=Continuer la partie\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=Écran américain décimé\nBody=Le CVBG a perdu toutes ses escortes armées de SM-2. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=MISSOURI coulé\nBody=Le cuirassé ennemi a été coulé. Le CVBG du CONSTELLATION vient de perdre son unique porteur de TASM. \nButtonText=Continuer la partie\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=ALERTE DE RAID-CONSTELLATION\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) SITUATION : le CONSTELLATION a probablement achevé la récupération et le réarmement de ses A-6. \n\n2. (S) ÉVALUATION : attendez-vous à ce que le CONSTELLATION lance prochainement des frappes antinavires. \n\n3. (S) COMMENTAIRES : en raison de la fenêtre de temps limitée pour le décollage, attendez-vous à ce que le raid ennemi provienne directement du porte-avions. \n\nFLASH FLASH FLASH\nButtonText=Continuer la partie\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=ALERTE DE RAID-BASE AÉRIENNE D'ANDERSON\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION : la source compartimentée KINZHAL, en vue de Guam, signale le décollage de B-52 depuis la base aérienne d'Andersen\n\n2. (TS) ÉVALUATION : ce raid vise probablement {TaskForceName}. Attendez-vous à ce qu'il entre dans la portée HARPOON dans 1h30. \n\n3. (TS) COMMENTAIRES : KINZHAL ne signale aucune escorte de chasseurs pour ce raid. \n\nFLASH FLASH FLASH\nButtonText=Continuer la partie\nPopupStyle=NavalMessage
