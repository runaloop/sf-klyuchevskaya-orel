Taskforce2FlagshiplostMessage=Title=패배!\nBody={FlagshipName}가 격침되었다!\nButtonText=임무로 돌아가기\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>클류쳅스카야 기동부대 '88 - 제10부 </size>\종반전\n<size=24>10 0400Z MAR 88</size>\\nBody={TaskForceName}는 컨스텔레이션과 그 전투단을 격침하라는 임무를 받았다. 이는 캠페인의 최종 임무이다. 행운을 빈다. \nButtonText=임무 시작\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=제10작전전대\nSubj=임무 완료-컨스텔레이션 격침\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 컨스텔레이션 CV-64 격침을 알리는 귀 부대의 통신을 수신했음을 확인한다. \n\n2. (S) 이 항공모함의 손실은 미국을 평화 협상으로 이끌 것이다. \n\n3. (S) 전투단을 격침한 후 마땅한 휴식을 위해 사세보로 이동하라. KTOF 송신 종료.\nButtonText=계속 진행\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=미군 방어선 소진\nBody=항모전투단이 SM-2 무장 호위함을 모두 잃었다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=미주리 격침\nBody=적 전함이 격침되었다. 컨스텔레이션 항모전투단은 유일한 TSAM 탑재함을 잃었다. \nButtonText=계속 진행\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제11작전전대\nSubj=공습 경고-컨스텔레이션\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (S) 상황: 컨스텔레이션이 A-6 항공기의 회수 및 재무장을 완료한 것으로 보인다. \n\n2. (S) 평가: 컨스텔레이션이 곧 대함 공습을 발진시킬 것으로 예상된다. \n\n3. (S) 논평: 발진 가능 시간이 제한적이므로, 적 공습은 항공모함으로부터 직접 발진할 것으로 예상된다. \n\n긴급 긴급 긴급\nButtonText=계속 진행\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=적기 태평양 함대\nTo={TaskForceName}\nInfo=제10작전전대\n제11작전전대\nSubj=공습 경고-앤더슨 공군기지\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=긴급 긴급 긴급\n\n1. (TS) 상황: 구획화된 정보원 KINZHAL이 괌 인근에서 앤더슨 공군기지의 B-52 발진을 보고했다.\n\n2. (TS) 평가: 이번 공습은 {TaskForceName}를 목표로 할 가능성이 높다. 공습은 1.5시간 후 하푼 사거리에 진입할 것으로 예상된다. \n\n3. (TS) 논평: KINZHAL은 이번 공습에 전투기 호위가 없다고 보고했다. \n\n긴급 긴급 긴급\nButtonText=계속 진행\nPopupStyle=NavalMessage
