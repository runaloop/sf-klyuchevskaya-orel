Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Phần 10 </size>\TÀN CUỘC\n<size=24>10 0400Z MAR 88</size>\\nBody={TaskForceName} được giao nhiệm vụ đánh chìm CONSTELLATION và biên đội của nó. Đây là nhiệm vụ cuối cùng trong chiến dịch. Chúc may mắn. \nButtonText=Bắt đầu nhiệm vụ\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nSubj=HOÀN THÀNH NHIỆM VỤ-CONSTELLATION BỊ ĐÁNH CHÌM\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Chúng tôi xác nhận đã nhận được điện báo của các đồng chí về việc tiêu diệt CONSTELLATION CV-64. \n\n2. (S) Việc mất tàu sân bay này sẽ buộc Mỹ phải tiến tới đàm phán hòa bình. \n\n3. (S) Đánh chìm biên đội của nó rồi di chuyển đến Sasebo để nghỉ ngơi xứng đáng. KTOF gửi.\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=Lực lượng hộ tống của Mỹ suy giảm\nBody=Biên đội tàu sân bay tấn công đã mất toàn bộ tàu hộ tống mang tên lửa SM-2. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=MISSOURI bị đánh chìm\nBody=Thiết giáp hạm của đối phương đã bị đánh chìm. Biên đội tàu sân bay tấn công CONSTELLATION vừa mất chiếc tàu mang TSAM duy nhất của họ. \nButtonText=Tiếp tục chơi\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nPHI ĐỘI TÁC CHIẾN 11\nSubj=CẢNH BÁO ĐỢT TẤN CÔNG-CONSTELLATION\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) TÌNH HÌNH: CONSTELLATION nhiều khả năng đã hoàn tất việc thu hồi và tái vũ trang máy bay A-6. \n\n2. (S) ĐÁNH GIÁ: Dự kiến CONSTELLATION sẽ sớm bắt đầu xuất kích các đợt tấn công chống tàu. \n\n3. (S) NHẬN XÉT: Do khung thời gian xuất kích hạn chế, dự kiến đợt tập kích của đối phương sẽ đến trực tiếp từ tàu sân bay. \n\nFLASH FLASH FLASH\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=HẠM ĐỘI THÁI BÌNH DƯƠNG CỜ ĐỎ\nTo={TaskForceName}\nInfo=PHI ĐỘI TÁC CHIẾN 10\nPHI ĐỘI TÁC CHIẾN 11\nSubj=CẢNH BÁO ĐỢT TẤN CÔNG-CĂN CỨ KHÔNG QUÂN ANDERSON\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) TÌNH HÌNH: Nguồn tin biệt lập KINZHAL tại khu vực Guam báo cáo B-52 xuất kích từ Căn cứ Không quân Andersen\n\n2. (TS) ĐÁNH GIÁ: Đợt tập kích này nhiều khả năng nhằm vào {TaskForceName}. Dự kiến đợt tập kích sẽ vào tầm bắn HARPOON trong 1,5 giờ nữa. \n\n3. (TS) NHẬN XÉT: KINZHAL báo cáo đợt tập kích này không có hộ tống tiêm kích. \n\nFLASH FLASH FLASH\nButtonText=Tiếp tục chơi\nPopupStyle=NavalMessage
