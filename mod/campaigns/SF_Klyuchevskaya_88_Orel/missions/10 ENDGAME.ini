Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 — часть 10 </size>\ЭНДШПИЛЬ\n<size=24>10 0400Z МАР 88</size>\\nBody=КУГ «Ключевская» получило задачу уничтожить КОНСТЕЛЛЕЙШН и его авианосную группу. Это последняя миссия кампании. Удачи. \nButtonText=Начать миссию\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=КТОФ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ЗАДАНИЕ ВЫПОЛНЕНО — КОНСТЕЛЛЕЙШН ПОТОПЛЕН\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (С) Подтверждаем получение вашего сообщения об уничтожении КОНСТЕЛЛЕЙШН CV-64. \n\n2. (С) Потеря этого авианосца вынудит США сесть за стол переговоров. \n\n3. (С) Уничтожить его авианосную группу, затем перейти в Сасебо для заслуженного отдыха. КТОФ передаёт.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=Охранение США истощено\nBody=Авианосная группа потеряла все свои корабли охранения с ЗРК SM-2. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=МИССУРИ потоплен\nBody=Вражеский броненосец потоплен. Авианосная группа КОНСТЕЛЛЕЙШН только что потеряла свой единственный носитель крылатых ракет TASM. \nButtonText=Продолжить\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n11-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ПРЕДУПРЕЖДЕНИЕ О НАЛЁТЕ — КОНСТЕЛЛЕЙШН\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (С) ОБСТАНОВКА: КОНСТЕЛЛЕЙШН вероятно завершил приём и перезарядку самолётов A-6. \n\n2. (С) ОЦЕНКА: Ожидается, что КОНСТЕЛЛЕЙШН вскоре начнёт вылеты противокорабельных ударных групп. \n\n3. (С) КОММЕНТАРИИ: Из-за ограниченного окна вылета ожидается, что вражеский налёт придёт непосредственно с авианосца. \n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=КРАСНОЗНАМЁННЫЙ ТИХООКЕАНСКИЙ ФЛОТ\nTo=КУГ «Ключевская»\nInfo=10-я ОПЕРАТИВНАЯ ЭСКАДРА\n11-я ОПЕРАТИВНАЯ ЭСКАДРА\nSubj=ПРЕДУПРЕЖДЕНИЕ О НАЛЁТЕ — АВИАБАЗА АНДЕРСЕН\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=МОЛНИЯ МОЛНИЯ МОЛНИЯ\n\n1. (СС) ОБСТАНОВКА: агентурный источник КИНЖАЛ в районе Гуама докладывает о вылете B-52 с авиабазы Андерсен\n\n2. (СС) ОЦЕНКА: этот налёт вероятно направлен против КУГ «Ключевская». Ожидается вход налёта в зону действия HARPOON через 1,5 часа. \n\n3. (СС) КОММЕНТАРИИ: КИНЖАЛ докладывает об отсутствии истребительного сопровождения для этого налёта. \n\nМОЛНИЯ МОЛНИЯ МОЛНИЯ\nButtonText=Продолжить\nPopupStyle=NavalMessage
