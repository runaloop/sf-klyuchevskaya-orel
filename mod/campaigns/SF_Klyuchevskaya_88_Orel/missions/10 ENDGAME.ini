Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Part 10 </size>\终局\n<size=24>10 0400Z MAR 88</size>\\nBody={TaskForceName}奉命击沉星座号及其战斗群。这是本战役的最后一次任务。祝你好运。\nButtonText=开始任务\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\nSubj=任务完成——星座号已被击沉\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) 我们确认收到你部关于摧毁星座号（CV-64）的电文报告。\n\n2. (S) 损失这艘航母将迫使美国走上和谈桌。\n\n3. (S) 击沉其战斗群其余舰船后转移至佐世保，享受来之不易的休整。红旗太平洋舰队发。\nButtonText=继续游戏\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=美方护航力量已被消耗\nBody=该航母战斗群已损失所有配备SM-2导弹的护航舰。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=密苏里号已被击沉\nBody=敌方战列舰已被击沉。星座号航母战斗群刚刚失去了唯一的战斧巡航导弹载舰。\nButtonText=继续游戏\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第11作战支队\nSubj=空袭警告——星座号\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (S) 情况：星座号很可能已完成A-6飞机的回收与再武装。\n\n2. (S) 判断：预计星座号将很快开始派出反舰打击机群。\n\n3. (S) 备注：由于出动窗口有限，预计敌方来袭将直接从航母起飞。\n\n特急 特急 特急\nButtonText=继续游戏\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=红旗太平洋舰队\nTo={TaskForceName}\nInfo=第10作战支队\n第11作战支队\nSubj=空袭警告——安德森空军基地\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=特急 特急 特急\n\n1. (TS) 情况：代号"匕首"的隔离信源报告，关岛附近有B-52从安德森空军基地起飞。\n\n2. (TS) 判断：此次来袭很可能针对{TaskForceName}。预计来袭将在1.5小时后进入"鱼叉"导弹射程。\n\n3. (TS) 备注："匕首"报告称此次来袭没有战斗机护航。\n\n特急 特急 特急\nButtonText=继续游戏\nPopupStyle=NavalMessage
