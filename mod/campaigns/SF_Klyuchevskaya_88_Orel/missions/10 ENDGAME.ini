Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - Teil 10 </size>\ENDSPIEL\n<size=24>10 0400Z MAR 88</size>\\nBody={TaskForceName} hat den Auftrag, die CONSTELLATION und ihre Kampfgruppe zu versenken. Dies ist die letzte Mission der Kampagne. Viel Glück. \nButtonText=Mission starten\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=10. Operative Staffel\nSubj=AUFTRAG ERFÜLLT - CONSTELLATION VERSENKT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Wir bestätigen den Empfang Ihrer Meldung über die Vernichtung der CONSTELLATION CV-64. \n\n2. (S) Der Verlust dieses Trägers wird die USA zu Friedensverhandlungen zwingen. \n\n3. (S) Ihre Kampfgruppe versenken und dann nach Sasebo übersetzen zur wohlverdienten Ruhe. KTOF, Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=US-Sicherung aufgebraucht\nBody=Die Trägerkampfgruppe hat alle mit SM-2 bewaffneten Geleitschiffe verloren. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=MISSOURI versenkt\nBody=Das feindliche Schlachtschiff wurde versenkt. Die CONSTELLATION-Trägerkampfgruppe hat gerade ihren einzigen TSAM-Träger verloren. \nButtonText=Weiterspielen\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n11. Operative Staffel\nSubj=ANGRIFFSWARNUNG - CONSTELLATION\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (S) LAGE: Die CONSTELLATION hat wahrscheinlich die Bergung und Nachrüstung ihrer A-6-Flugzeuge abgeschlossen. \n\n2. (S) EINSCHÄTZUNG: Erwarten Sie, dass die CONSTELLATION in Kürze Angriffe gegen Überwasserziele startet. \n\n3. (S) ANMERKUNGEN: Aufgrund des begrenzten Startfensters ist zu erwarten, dass der feindliche Angriff direkt vom Träger kommt. \n\nBLITZ BLITZ BLITZ\nButtonText=Weiterspielen\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=ROTBANNER-PAZIFIKFLOTTE\nTo={TaskForceName}\nInfo=10. Operative Staffel\n11. Operative Staffel\nSubj=ANGRIFFSWARNUNG - ANDERSEN AFB\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=BLITZ BLITZ BLITZ\n\n1. (TS) LAGE: Die abgeschirmte Quelle KINZHAL bei Guam meldet den Start von B-52 vom Luftwaffenstützpunkt Andersen\n\n2. (TS) EINSCHÄTZUNG: Dieser Angriff richtet sich wahrscheinlich gegen {TaskForceName}. Angriff tritt voraussichtlich in 1,5 Stunden in HARPOON-Reichweite ein. \n\n3. (TS) ANMERKUNGEN: KINZHAL meldet keine Jagdbegleitung für diesen Angriff. \n\nBLITZ BLITZ BLITZ\nButtonText=Weiterspielen\nPopupStyle=NavalMessage
