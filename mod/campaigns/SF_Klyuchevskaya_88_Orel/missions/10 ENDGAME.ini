Taskforce2FlagshiplostMessage=Title=敗北！\nBody={FlagshipName}が撃沈された！\nButtonText=任務へ戻る\nPopupStyle=Outro
Taskforce2StartMessage=Title=<size=24>SF Klyuchevskaya '88 - 第10部 </size>\終局\n<size=24>10 0400Z MAR 88</size>\\nBody={TaskForceName}は、コンステレーションおよびその戦闘群の撃沈を命じられた。これは本キャンペーン最後の任務である。健闘を祈る。\nButtonText=任務開始\nPopupStyle=Intro
Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=第10作戦戦隊\nSubj=任務完了――コンステレーション撃沈\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) コンステレーション CV-64の撃沈を報告する貴官の通信を受信したことを確認する。\n\n2. (S) この空母の損失により、米国は和平交渉を強いられるだろう。\n\n3. (S) その戦闘群を撃沈した後、当然の休息のため佐世保へ移動せよ。KTOFより。\nButtonText=作戦続行\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=米軍護衛戦力消耗\nBody=空母戦闘群はSM-2搭載護衛艦をすべて失った。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=ミズーリ 撃沈\nBody=敵戦艦は撃沈された。コンステレーション空母戦闘群は、唯一のTSAM搭載艦を失った。\nButtonText=作戦続行\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第11作戦戦隊\nSubj=空襲警報――コンステレーション\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (S) 状況：コンステレーションはA-6機の収容・再武装をすでに完了した可能性が高い。\n\n2. (S) 評価：コンステレーションは近く対艦攻撃隊を発艦させると予期される。\n\n3. (S) 所見：発艦可能な時間帯が限られているため、敵の来襲は空母より直接行われると予期される。\n\n最優先 最優先 最優先\nButtonText=作戦続行\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=赤旗太平洋艦隊\nTo={TaskForceName}\nInfo=第10作戦戦隊\n第11作戦戦隊\nSubj=空襲警報――アンダーセン基地\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=最優先 最優先 最優先\n\n1. (TS) 状況：グアム付近の統制情報源「キンジャル」より、アンダーセン空軍基地からのB-52発艦を報告\n\n2. (TS) 評価：この来襲は{TaskForceName}を標的としている可能性が高い。来襲は1.5時間以内にハープーンの射程内に進入すると予期せよ。\n\n3. (TS) 所見：「キンジャル」の報告によれば、この来襲には戦闘機の護衛が伴わない。\n\n最優先 最優先 最優先\nButtonText=作戦続行\nPopupStyle=NavalMessage
