Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\nSubj=MISSION ACCOMPLISHED-CONSTELLATION SUNK\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) We confirm receipt of your message traffic reporting destruction of CONSTELLATION CV-64. \n\n2. (S) Loss of this carrier will force the US to peace talks. \n\n3. (S) Sink her battle group and then transit to Sasebo for well earned rest. KTOF sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=US screen depleted\nBody=The CVBG has lost all of its SM-2 armed escorts. \nButtonText=Continue Playing\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=MISSOURI sunk\nBody=The enemy battleship has been sunk. CONSTELLATION CVBG just lost their only TSAM carrier. \nButtonText=Continue playing\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=RAID WARNING-CONSTELLATION\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) SITUATION: CONSTELLATION likely has completed recovery and rearming of A-6 aircraft. \n\n2. (S) ASSESSMENT: Expect CONSTELLATION to begin sortieing anti-shipping strikes shortly. \n\n3. (S) COMMENTS: Due to limited time window for sortie, expect enemy raid to come directly from carrier. \n\nFLASH FLASH FLASH\nButtonText=Continue Playing\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=RED BANNER PACIFIC FLEET\nTo={TaskForceName}\nInfo=10th OPERATIONAL SQN\n11th OPERATIONAL SQN\nSubj=RAID WARNING-ANDERSON AFB\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUATION: Compartmented source KINZHAL IVO Guam reports sortie of B-52 from Anderson AFB\n\n2. (TS) ASSESSMENT: This raid likely directed at {TaskForceName}. Expect raid to enter HARPOON range in 1.5 hours. \n\n3. (TS) COMMENTS: KINZHAL reports no fighter escort for this raid. \n\nFLASH FLASH FLASH\nButtonText=Continue playing\nPopupStyle=NavalMessage
