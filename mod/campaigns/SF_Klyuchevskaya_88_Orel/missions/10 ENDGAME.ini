Taskforce2CONSTELLATIONsunkMessage=From=KTOF\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\nSubj=MISIÓN CUMPLIDA-CONSTELLATION HUNDIDO\nPrecedence=Immediate\nClassification=Secret\nTemplate=USSR\nBody=1. (S) Confirmamos recepción de su tráfico de mensajes que informa de la destrucción del CONSTELLATION CV-64. \n\n2. (S) La pérdida de este portaaviones obligará a los estadounidenses a iniciar negociaciones de paz. \n\n3. (S) Hunda a su grupo de batalla y luego transite a Sasebo para un merecido descanso. KTOF envía.\nButtonText=Seguir jugando\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce2CGsunkMessage=Title=Pantalla estadounidense agotada\nBody=El CVBG ha perdido a todas sus escoltas armadas con SM-2. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2BBsunkMessage=Title=MISSOURI hundido\nBody=El acorazado enemigo ha sido hundido. El CVBG del CONSTELLATION acaba de perder a su único portador de TSAM. \nButtonText=Seguir jugando\nPopupStyle=Notification
Taskforce2A-6RaidMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n11.ª ESCUADRA OPERATIVA\nSubj=ALERTA DE ATAQUE-CONSTELLATION\nPrecedence=Flash\nClassification=Secret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (S) SITUACIÓN: es probable que el CONSTELLATION haya completado la recuperación y el rearme de sus aeronaves A-6. \n\n2. (S) EVALUACIÓN: se espera que el CONSTELLATION comience a lanzar ataques antibuque en breve. \n\n3. (S) COMENTARIOS: debido a la ventana de tiempo limitada para el despegue, se espera que la incursión enemiga provenga directamente del portaaviones. \n\nFLASH FLASH FLASH\nButtonText=Seguir jugando\nPopupStyle=NavalMessage
Taskforce2B-52RaidMessage=From=FLOTA DEL PACÍFICO DE LA BANDERA ROJA\nTo={TaskForceName}\nInfo=10.ª ESCUADRA OPERATIVA\n11.ª ESCUADRA OPERATIVA\nSubj=ALERTA DE ATAQUE-BASE AÉREA ANDERSON\nPrecedence=Flash\nClassification=TopSecret\nTemplate=USSR\nBody=FLASH FLASH FLASH\n\n1. (TS) SITUACIÓN: la fuente compartimentada KINZHAL en las inmediaciones de Guam informa del despegue de B-52 desde la Base Aérea Anderson\n\n2. (TS) EVALUACIÓN: es probable que esta incursión esté dirigida contra {TaskForceName}. Se espera que la incursión entre en alcance de HARPOON en 1,5 horas. \n\n3. (TS) COMENTARIOS: KINZHAL no informa de escolta de cazas para esta incursión. \n\nFLASH FLASH FLASH\nButtonText=Seguir jugando\nPopupStyle=NavalMessage
