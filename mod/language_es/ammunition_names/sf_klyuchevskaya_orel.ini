[AmmunitionNames]
wp_aa-10a=AA-10A,Alamo,SARH AAM,El AA-10A Alamo (Vympel R-27R) es un misil aire-aire soviético de medio alcance con guiado por Radar semiactivo. Diseñado para sustituir a la serie de misiles AA-7 anterior, el AA-10 es el BVRAAM soviético más reciente en servicio, y destaca por su alta velocidad, buena maniobrabilidad y un buscador resistente a las contramedidas.
wp_aa-10b=AA-10B,Alamo,IR AAM,El AA-10B Alamo (Vympel R-27T) es un misil aire-aire soviético de medio alcance con guiado infrarrojo. Diseñado para sustituir a la serie de misiles AA-7 anterior, el AA-10 es el BVRAAM soviético más reciente en servicio, y destaca por su alta velocidad, buena maniobrabilidad y un buscador resistente a las contramedidas.
wp_aa-10c=AA-10C,Alamo,SARH AAM,El AA-10C Alamo (Vympel R-27ER) es un misil aire-aire soviético de largo alcance con guiado por Radar semiactivo. Diseñado para sustituir a la serie de misiles AA-7 anterior, el AA-10 es el BVRAAM soviético más reciente en servicio, y destaca por su alta velocidad, buena maniobrabilidad y un buscador resistente a las contramedidas.\nLos modelos 'Long-Burn' AA-10C/D tienen motores cohete mucho más grandes que los modelos AA-10A/B, lo que les permite alcanzar una velocidad máxima sin igual y un alcance máximo considerablemente mayor.
wp_aa-10d=AA-10D,Alamo,IR AAM,El AA-10D Alamo (Vympel R-27ET) es un misil aire-aire soviético de largo alcance con guiado infrarrojo. Diseñado para sustituir a la serie de misiles AA-7 anterior, el AA-10 es el BVRAAM soviético más reciente en servicio, y destaca por su alta velocidad, buena maniobrabilidad y un buscador resistente a las contramedidas.\nLos modelos 'Long-Burn' AA-10C/D tienen motores cohete mucho más grandes que los modelos AA-10A/B, lo que les permite alcanzar una velocidad máxima sin igual y un alcance máximo considerablemente mayor.
usn_rim-66h=RIM-66H,SM-2MR,SAM/ASuW,El Standard Missile 2 es una familia de misiles tierra-aire de defensa de área guiados por Radar (con una capacidad antisuperficie secundaria de corto alcance) caracterizados por sus propulsores de larga combustión y su rendimiento completo contra la mayoría de las amenazas. El Standard Missile 2 reemplaza el buscador SM-1 de guiado por Radar semiactivo con una guía de curso medio por enlace de datos avanzado, con guiado terminal por Radar en los últimos segundos de vuelo. El SM-2 permite mantener muchos más misiles en el aire a la vez que iluminadores hay disponibles, lo que proporciona una ventaja masiva sobre los buques armados con SM-1.\n\nEl SM-2MR Block II (RIM-66H) es la versión AEGIS (Mark 41 VLS) de la familia SM-2 Block II, lanzada verticalmente desde una celda Mk-41, lo que aumenta drásticamente la cadencia de fuego a costa de ampliar el alcance mínimo de lanzamiento.
wp_sa-n-1d=SA-N-1D,Goa,SAM/ASuW,El SA-N-1D Goa (M-1 Volna-N) es una modificación del sistema de misiles tierra-aire naval soviético más temprano. Esta versión tiene una eficacia considerablemente mejorada contra blancos que vuelan a ras de mar.
wp_sa-n-3b=SA-N-3B,Goblet,SAM/ASuW,El SA-N-3B Goblet (M-11 Shtorm) es un sistema de misiles tierra-aire naval soviético. El sistema se instaló en varias clases de cruceros de misiles y en los portahelicópteros y portaaviones STOVL de la Unión Soviética. Tiene una capacidad antisuperficie secundaria, y esta versión tiene un rendimiento considerablemente mejorado contra blancos que vuelan a baja altura.
wp_sa-n-4c=SA-N-4C,Gecko,SAM/ASuW,El SA-N-4C Gekko (M-4 Osa) es la versión naval del Osa SAM terrestre (OTAN: SA-8 Gecko (nótese la diferencia en la ortografía)) con dos misiles en un lanzador giratorio retráctil. Este es el último modelo de Osa disponible en el mar, y cuenta con un rendimiento a baja altitud y ECCM enormemente mejorado, además de una mayor fiabilidad general.
wp_sa-n-10=SA-N-10,Grouse,SAM,El SA-N-10 Grouse (9K38 Igla) es un misil tierra-aire portátil, conocido también para la OTAN como SA-18 cuando se usa desde lanzadores terrestres. En los buques se utiliza como sistema de defensa de punto.
wp_sa-n-12=SA-N-12,Grizzly,SAM/ASuW,El SA-N-12 Gadfly (9M317 Uragan-Tornado) es la versión naval del sistema de misiles tierra-aire terrestre 9K37 Buk (SA-17 Grizzly). El Ezh mejora al Uragan original con mayor alcance, mejor ECCM y una mayor capacidad contra misiles que vuelan a ras de mar.
wp_ss-n-22b=SS-N-22B,Sunburn-B,ASM,El SS-N-22B Sunburn (3M82 P-270 Moskit-M) es un arma antibuque supersónica soviética de tipo standoff lanzada desde superficie. Vuela siguiendo un perfil HI-LO con una fase terminal supersónica a ras de mar, durante la cual el misil realiza maniobras evasivas en zigzag para aumentar su capacidad de supervivencia frente a las defensas antiaéreas.\nEn comparación con el modelo Sunburn original, el Moskit-M (3M82, SS-N-22B) de finales de los años 80 tiene la capacidad de volar una trayectoria HI-LO y una mayor capacidad de combustible para un mayor alcance total, además de volar más rápido y más bajo que su predecesor.
wp_ss-1c=SS-1C,Scud-B,TBM,El SS-1C Scud-B (R-17 Elbrus 9K72) es un misil balístico táctico soviético derivado originalmente del misil balístico V-2, y se ha extendido muy ampliamente debido a su bajo costo y flexibilidad. Aunque carece de guiado terminal preciso y requiere un largo periodo de repostaje antes del lanzamiento, estos misiles aún pueden representar una amenaza significativa para instalaciones sin defensas antiaéreas avanzadas.
usn_rum-139a=RUM-139A,VL-ASROC,ASW,El RUM-139A VL-ASROC (ASROC de lanzamiento vertical) es un misil antisubmarino de tipo standoff. Desarrollado como sucesor provisional del RUR-5 de la década de 1960, el RUM-139A es un misil antisubmarino de alcance extendido destinado a ser usado desde el Mark 41 Vertical Launching System, y lleva el torpedo Mark 46 NEARTIP mejorado. Aunque técnicamente no contaba con financiación para su adquisición durante la Guerra Fría, a finales de los años 80 hay disponibles varias unidades de preproducción, lo que permite una capacidad limitada de misil ASW a los buques de guerra VLS recién puestos en servicio.
wp_53-61=53-61M,,Torpedo WH,El 53-61 es un torpedo soviético pesado con guiado por estela, diseñado para destruir buques de superficie. Este es el primer torpedo soviético que sigue la estela, con una velocidad y un alcance elevados para su época.
wp_saet-50=SAET-50M,,Torpedo ASuW,El SAET-50 es un torpedo soviético pesado eléctrico antibuque con guiado por Sonar pasivo. Desarrollado a partir del torpedo G7es 'Zaunkönig' de la guerra, el SAET-50 es el primer torpedo autoguiado soviético en servicio, y aunque se consideró obsoleto y fue sucedido por torpedos más capaces, permaneció en los arsenales durante una parte significativa de la Guerra Fría, especialmente en servicio de exportación.
wp_set-53=SET-53M,,Torpedo ASW,El SET-53M es un torpedo soviético pesado eléctrico antisubmarino con guiado por Sonar pasivo. Desarrollado a partir del SAET-50, el SET-53 es el primer torpedo antisubmarino pesado soviético construido y, aunque fue reemplazado en servicio por sistemas más capaces en poco tiempo, estas armas permanecieron en los arsenales durante la mayor parte de la Guerra Fría, especialmente en servicio de exportación.
rn_dc_mk11=Mark XI,,Bomba de profundidad,La bomba de profundidad Mark XI es una bomba de profundidad aérea británica diseñada durante la Segunda Guerra Mundial que ha permanecido en servicio durante el resto del siglo XX.
usn_mk-81=Mk-81,,Bomba,La Mark 81 es una bomba tonta de propósito general de baja resistencia de 250 libras (110 kg).
