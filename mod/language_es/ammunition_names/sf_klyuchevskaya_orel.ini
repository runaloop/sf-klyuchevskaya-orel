rn_type_182_decoy=Type 182,,Decoy,The Type 182 towed countermeasure is a British torpedo decoy used by the Royal Navy on surface vessels. This decoy can emit false sonar pulses to jam incoming torpedo seekers, so long as the decoy is between the torpedo and the ship.
wp_dc_shell_helicopter=BB-1,,DC,BB-1 soviet depth charge for use against enemy submarines.
