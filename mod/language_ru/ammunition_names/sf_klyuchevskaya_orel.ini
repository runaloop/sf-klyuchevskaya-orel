[AmmunitionNames]
wp_aa-10a=Р-27Р,,ПАРЛГСН РВВ,Р-27Р – советская ракета «воздух-воздух» средней дальности с полуактивным радиолокационным наведением. Созданная на смену ракетам семейства Р-23/Р-24, Р-27 – новейшая советская ракета средней дальности на вооружении; она отличается высокой скоростью, хорошей манёвренностью и помехозащищённой головкой самонаведения.
wp_aa-10b=Р-27Т,,ИК РВВ,Р-27Т – советская ракета «воздух-воздух» средней дальности с инфракрасным наведением. Созданная на смену ракетам семейства Р-23/Р-24, Р-27 – новейшая советская ракета средней дальности на вооружении; она отличается высокой скоростью, хорошей манёвренностью и помехозащищённой головкой самонаведения.
wp_aa-10c=Р-27ЭР,,ПАРЛГСН РВВ,Р-27ЭР – советская ракета «воздух-воздух» большой дальности с полуактивным радиолокационным наведением. Созданная на смену ракетам семейства Р-23/Р-24, Р-27 – новейшая советская ракета средней дальности на вооружении; она отличается высокой скоростью, хорошей манёвренностью и помехозащищённой головкой самонаведения.\nВарианты Р-27ЭР/ЭТ с увеличенной энергетикой получили значительно более мощный ракетный двигатель, чем Р-27Р/Т, что даёт непревзойдённую максимальную скорость и заметно большую дальность.
wp_aa-10d=Р-27ЭТ,,ИК РВВ,Р-27ЭТ – советская ракета «воздух-воздух» большой дальности с инфракрасным наведением. Созданная на смену ракетам семейства Р-23/Р-24, Р-27 – новейшая советская ракета средней дальности на вооружении; она отличается высокой скоростью, хорошей манёвренностью и помехозащищённой головкой самонаведения.\nВарианты Р-27ЭР/ЭТ с увеличенной энергетикой получили значительно более мощный ракетный двигатель, чем Р-27Р/Т, что даёт непревзойдённую максимальную скорость и заметно большую дальность.
usn_rim-66h=RIM-66H,Стандарт SM-2MR,ЗУР/ПКР,Standard Missile 2 – семейство зенитных управляемых ракет зональной ПВО с радиолокационным наведением (и вспомогательной противокорабельной возможностью на малой дальности), отличающихся длительной работой маршевого двигателя и сбалансированными характеристиками против большинства угроз. Вместо полуактивной радиолокационной ГСН ракеты SM-1 в SM-2 применено наведение на маршевом участке по каналу передачи данных с радиолокационным самонаведением лишь в последние секунды полёта. Благодаря этому в воздухе одновременно может находиться гораздо больше ракет, чем у корабля радаров подсветки, что даёт огромное преимущество перед кораблями с SM-1.\n\nSM-2MR Block II (RIM-66H) – вариант семейства SM-2 Block II для системы AEGIS, запускаемый вертикально из ячейки установки Mk 41. Это резко повышает темп стрельбы ценой увеличения минимальной дальности пуска.
wp_sa-n-1d=В-601М,Волна-Н,ЗУР/ПКР,М-1 «Волна-Н» – модификация самого раннего советского корабельного зенитно-ракетного комплекса. Эта версия значительно эффективнее против целей, летящих над самой водой.
wp_sa-n-3b=В-611М,Шторм-Н,ЗУР/ПКР,М-11 «Шторм-Н» – советский корабельный зенитно-ракетный комплекс. Устанавливался на ракетные крейсера нескольких проектов, а также на противолодочные крейсера-вертолётоносцы и тяжёлые авианесущие крейсера. Имеет вспомогательную возможность поражения надводных целей; эта версия значительно лучше справляется с низколетящими целями.
wp_sa-n-4c=9М33М5,Оса-МА2,ЗУР/ПКР,М-4 «Оса» – корабельный вариант войскового ЗРК «Оса» с двумя ракетами на убирающейся поворотной пусковой установке. Это новейшая корабельная модификация «Осы»: её возможности по маловысотным целям и помехозащищённость существенно улучшены, а надёжность в целом выше.
wp_sa-n-10=9М39,Игла,ЗУР,9К38 «Игла» – переносной зенитно-ракетный комплекс. На кораблях используется как средство самообороны ближнего рубежа.
wp_sa-n-12=9М317,Ураган,ЗУР/ПКР,9М317 – ракета корабельного ЗРК «Ураган-Торнадо», морского варианта войскового ЗРК 9К37 «Бук». По сравнению с исходным «Ураганом» «Ёж» имеет большую дальность, лучшую помехозащищённость и более высокую эффективность против низколетящих противокорабельных ракет.
wp_ss-n-22b=П-270М,Москит-М,ПКР,3М82 П-270 «Москит-М» – советская сверхзвуковая противокорабельная ракета корабельного базирования. Летит по профилю «высоко-низко» со сверхзвуковым маловысотным конечным участком, на котором выполняет противозенитный манёвр «змейка» для повышения живучести.\nПо сравнению с исходным «Москитом» модификация конца 1980-х «Москит-М» (3М82) способна лететь по траектории «высоко-низко», несёт больший запас топлива для увеличенной дальности и летит быстрее и ниже предшественника.
wp_ss-1c=Р-17,Эльбрус,ОТР,Р-17 комплекса 9К72 «Эльбрус» – советская оперативно-тактическая баллистическая ракета, восходящая к баллистической ракете Фау-2 и получившая очень широкое распространение благодаря низкой стоимости и гибкости. Хотя у неё нет точного наведения на конечном участке и перед пуском требуется длительная заправка, она остаётся серьёзной угрозой для объектов без современной ПВО.
usn_rum-139a=RUM-139A,VL-ASROC,ПЛУР,RUM-139A VL-ASROC (ASROC вертикального пуска) – противолодочная ракета для поражения подводных лодок на удалении. Созданная как промежуточная замена RUR-5 1960-х годов, RUM-139A имеет увеличенную дальность, запускается из установки вертикального пуска Mk 41 и несёт улучшенную торпеду Mk 46 NEARTIP. Хотя в годы холодной войны её закупки официально не финансировались, к концу 1980-х имеется некоторое количество предсерийных ракет, что даёт новым кораблям с установками вертикального пуска ограниченные противолодочные ракетные возможности.
wp_53-61=53-61М,,Торпеда с кильватерным наведением,53-61 – советская тяжёлая торпеда с самонаведением по кильватерному следу, предназначенная для поражения надводных кораблей. Первая советская торпеда, наводящаяся по кильватерному следу, с высокими для своего времени скоростью и дальностью.
wp_saet-50=САЭТ-50М,,Противокорабельная торпеда,САЭТ-50 – советская тяжёлая электрическая противокорабельная торпеда с пассивным акустическим самонаведением. Созданная на основе немецкой торпеды G7es «Цаункёниг» времён Второй мировой войны, САЭТ-50 стала первой советской самонаводящейся торпедой на вооружении. Хотя она устарела и уступила место более совершенным торпедам, она оставалась на складах значительную часть холодной войны, особенно в экспортных поставках.
wp_set-53=СЭТ-53М,,Противолодочная торпеда,СЭТ-53М – советская тяжёлая электрическая противолодочная торпеда с пассивным акустическим самонаведением. Созданная на основе САЭТ-50, СЭТ-53 стала первой советской тяжёлой противолодочной торпедой. Хотя её довольно быстро сменили более совершенные системы, эти торпеды оставались на складах большую часть холодной войны, особенно в экспортных поставках.
rn_dc_mk11=Mark XI,,ПЛ Бомба,Mark XI – британская авиационная глубинная бомба, созданная во время Второй мировой войны и остававшаяся на вооружении до конца XX века.
usn_mk-81=Mk-81,,Бомба,Mark 81 - это свободнопадающая бомба общего назначения с малым лобовым сопротивлением весом 250 фунтов (110 кг).
