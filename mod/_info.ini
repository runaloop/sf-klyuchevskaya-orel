[Language_en]
Name=SF Klyuchevskaya '88: Orel Edition
Description=A 14-mission Soviet Task Force Mode campaign in the Western Pacific, 1988. Orel Edition of StickHeroes' SF Klyuchevskaya '88: the flagship is TAVKR Tbilisi, a Project 1160 Orel-class carrier with a MiG-23A, Ko-45 and P-42 air wing, instead of the Kiev-class Minsk. Localized into all nine game languages. Keeps the original mod's Soviet callsigns, gun-only Yak-38 loadout, Tu-95RT AEW loadout and the MiG-23A 2x R-24R air-to-air loadout, and adds two experimental MiG-23A loadouts with R-27ER and R-27ET missiles.

[Language_ja]
Name=SF Klyuchevskaya '88: Orel Edition
Description=1988年の西太平洋を舞台とする、ソ連任務部隊モードの全14ミッションキャンペーン。StickHeroes氏の「SF Klyuchevskaya '88」のオリョール・エディションであり、キエフ級ミンスクの代わりに、MiG-23A、Ko-45、P-42航空団を擁するプロジェクト1160オリョール級空母TAVKRトビリシを旗艦とする。全9か国語にローカライズ済み。原作モッドのソ連側コールサイン、砲のみを装備したYak-38の兵装構成、Tu-95RTのAEW兵装構成、およびMiG-23Aの空対空ミサイルR-24R×2発の兵装構成をそのまま維持している。さらに、R-27ERおよびR-27ETを搭載するMiG-23Aの試験的な兵装構成を2種類追加している。

[Language_cn]
Name=SF Klyuchevskaya '88: Orel Edition
Description=一场14任务的苏联特遣舰队模式战役，背景设定在1988年的西太平洋。本作为StickHeroes的《SF Klyuchevskaya '88》的雕级版：旗舰改为TAVKR 第比利斯——一艘配备米格-23A、柯-45和P-42航空联队的1160型雕级航母，取代了原版的基辅级明斯克号。已本地化为全部九种游玩语言。保留了原版模组的苏联呼号、仅配备航炮的雅克-38挂载方案、图-95RT预警挂载方案，以及米格-23A的2枚R-24R空对空导弹挂载方案。另新增两套米格-23A试验性挂载方案，分别携带R-27ER和R-27ET导弹。

[Language_es]
Name=SF Klyuchevskaya '88: Orel Edition
Description=Una campaña soviética de Modo Fuerza Operativa de 14 misiones en el Pacífico Occidental, 1988. Orel Edition de SF Klyuchevskaya '88 de StickHeroes: el buque insignia es el TAVKR Tbilisi, un portaaviones de la clase Orel, Proyecto 1160, con un ala aérea de MiG-23A, Ko-45 y P-42, en lugar del Minsk de la clase Kiev. Localizada a los nueve idiomas del juego. Conserva los distintivos de llamada soviéticos originales del mod, la carga exclusiva de cañón del Yak-38, la carga AEW del Tu-95RT y la carga aire-aire de 2x R-24R del MiG-23A, y añade dos cargas experimentales para el MiG-23A con misiles R-27ER y R-27ET.

[Language_ko]
Name=SF Klyuchevskaya '88: Orel Edition
Description=1988년 서태평양을 배경으로 한 14개 임무로 구성된 소련 기동부대 모드 캠페인입니다. StickHeroes의 SF Klyuchevskaya '88을 기반으로 한 Orel Edition으로, 키예프급 항공모함 민스크 대신 프로젝트 1160 오룔급 항공모함인 TAVKR 트빌리시가 기함으로 등장하며, MiG-23A, Ko-45, P-42로 구성된 항공단을 운용합니다. 게임의 9개 언어 전부로 현지화되었습니다. 원작 모드의 소련식 콜사인, 총기 전용 Yak-38 무장, Tu-95RT AEW 무장, MiG-23A의 R-24R 공대공 미사일 2발 무장을 그대로 유지하며, R-27ER 및 R-27ET 미사일을 장착하는 MiG-23A 시험용 무장 2종을 추가합니다.

[Language_vn]
Name=SF Klyuchevskaya '88: Orel Edition
Description=Một chiến dịch Task Force Mode của Liên Xô gồm 14 nhiệm vụ tại Tây Thái Bình Dương, năm 1988. Đây là Orel Edition của SF Klyuchevskaya '88 của StickHeroes: kỳ hạm là TAVKR Tbilisi, một tàu sân bay lớp Project 1160 Orel với không đoàn gồm MiG-23A, Ko-45 và P-42, thay cho Minsk lớp Kiev. Đã được bản địa hóa sang cả chín ngôn ngữ của game. Giữ nguyên các hô hiệu Liên Xô, cấu hình vũ khí chỉ dùng pháo của Yak-38, cấu hình cảnh báo sớm của Tu-95RT và cấu hình không đối không 2x R-24R của MiG-23A từ mod gốc, đồng thời bổ sung hai cấu hình vũ khí thử nghiệm cho MiG-23A với tên lửa R-27ER và R-27ET.

[Language_fr]
Name=SF Klyuchevskaya '88: Orel Edition
Description=Une campagne soviétique en Mode Force Opérationnelle de 14 missions dans le Pacifique occidental, 1988. Édition Orel de SF Klyuchevskaya '88 de StickHeroes : le navire amiral est le TAVKR Tbilisi, un porte-avions de classe Orel (Projet 1160) avec un groupe aérien composé de MiG-23A, de Ko-45 et de P-42, à la place du Minsk de classe Kiev. Localisée dans les neuf langues du jeu. Conserve les indicatifs radio soviétiques du mod original, l'armement du Yak-38 réduit aux canons seuls, l'équipement AEW du Tu-95RT et l'armement air-air du MiG-23A avec 2x R-24R, et ajoute deux armements expérimentaux pour le MiG-23A avec des missiles R-27ER et R-27ET.

[Language_de]
Name=SF Klyuchevskaya '88: Orel Edition
Description=Eine Soviet-Task-Force-Modus-Kampagne mit 14 Missionen im Westpazifik, 1988. Orel Edition von StickHeroes' SF Klyuchevskaya '88: Das Flaggschiff ist der TAVKR Tbilisi, ein Flugzeugträger des Projekts 1160 der Orel-Klasse mit einer Trägergruppe aus MiG-23A, Ko-45 und P-42, anstelle der Minsk der Kiew-Klasse. In alle neun Sprachen des Spiels lokalisiert. Behält die sowjetischen Rufzeichen der Originalmod, die reine Bordkanonenbewaffnung der Yak-38, die Tu-95RT-AEW-Beladung und die Beladung der MiG-23A mit 2x R-24R Luft-Luft-Flugkörpern bei und fügt zwei experimentelle Beladungen für die MiG-23A mit R-27ER- und R-27ET-Flugkörpern hinzu.

[Language_ru]
Name=SF Klyuchevskaya '88: Orel Edition
Description=Советская кампания на 14 миссий в режиме оперативного соединения, действие происходит в западной части Тихого океана в 1988 году. Orel Edition мода StickHeroes «SF Klyuchevskaya '88»: флагманом служит ТАВКР Тбилиси, авианосец проекта 1160 «Орёл», с авиакрылом из МиГ-23А, Ко-45 и П-42, вместо авианосца «Минск» типа «Киев». Переведена на все девять языков игры. Сохранены советские позывные оригинального мода, вооружение Як-38 только пушками, конфигурация Ту-95РЦ для ДРЛО и вооружение МиГ-23А двумя ракетами Р-24Р воздух-воздух. Добавлены два опытных варианта вооружения МиГ-23А с ракетами Р-27ЭР и Р-27ЭТ.

