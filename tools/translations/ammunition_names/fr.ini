[AmmunitionNames]
usn_rim-66h=RIM-66H,SM-2MR,SAM/ASu,Le Standard Missile 2 est une famille de missiles surface-air de défense de zone à guidage radar (dotés d'une capacité secondaire anti-navire à courte portée), caractérisés par leurs propulseurs d'entretien à combustion longue et leurs performances équilibrées face à la plupart des menaces. Le Standard Missile 2 remplace l'autodirecteur radar semi-actif du SM-1 par un guidage de mi-course avancé par liaison de données, avec autoguidage radar terminal durant les dernières secondes du vol. Le SM-2 permet de maintenir en l'air beaucoup plus de missiles qu'il n'y a d'illuminateurs, ce qui procure un avantage considérable par rapport aux navires armés de SM-1.\n\nLe SM-2MR Block II (RIM-66H) est la version AEGIS (VLS Mark 41) de la famille SM-2 Block II, lancée verticalement depuis une cellule Mk-41, ce qui augmente considérablement la cadence de tir au prix d'une portée minimale de lancement plus grande.
wp_sa-n-1d=SA-N-1D,Goa,SAM/ASu,Le SA-N-1D Goa (M-1 Volna-N) est une modification du premier système de missile surface-air naval soviétique. Cette version offre une efficacité nettement améliorée contre les cibles volant en rase-mer.
wp_sa-n-3b=SA-N-3B,Goblet,SAM/ASu,Le SA-N-3B Goblet (M-11 Shtorm-N) est un système de missile surface-air naval soviétique. Le système a été installé sur un certain nombre de classes de croiseurs lance-missiles et sur les porte-hélicoptères et les porte-avions STOVL de l'Union soviétique. Il dispose d'une capacité anti-surface secondaire, et cette version offre des performances nettement améliorées contre les cibles volant à basse altitude.
wp_sa-n-4c=SA-N-4C,Gecko,SAM/ASu,Le SA-N-4 Gekko (M-4 Osa) est la version navale du SAM terrestre Osa (OTAN : SA-8 Gecko (notez l'orthographe différente)) avec deux missiles sur un lanceur rotatif rétractable. Il s'agit du dernier modèle d'Osa disponible en mer ; il offre des performances très améliorées à basse altitude et en matière de résistance aux contre-mesures électroniques (ECCM), ainsi qu'une fiabilité globale accrue.
wp_sa-n-10=SA-N-10,Grouse,SAM,Le 9K38 Igla (OTAN : SA-N-10 Grail) est un missile surface-air portable, également connu de l'OTAN sous le nom de SA-18 lorsqu'il est utilisé depuis des lanceurs terrestres. Sur les navires, il est employé comme système de défense ponctuelle.
wp_sa-n-12=SA-N-12,Grizzly,SAM/ASu,Le 9M317 Uragan-Tornado (OTAN : SA-N-12 Gadfly) est la version navale du système de missile surface-air terrestre 9K37 Buk (SA-17 Grizzly). L'Ezh est une amélioration de l'Uragan d'origine, avec une portée plus longue, une meilleure résistance aux ECCM et une plus grande capacité contre les missiles rasant la mer.
wp_ss-n-22b=SS-N-22B,Sunburn-B,ASu,Le 3M82 P-270 Moskit-M (OTAN : SS-N-22B Sunburn) est une arme anti-navire soviétique supersonique à distance lancée depuis la surface. Il vole selon un profil HI-LO avec une phase terminale supersonique en rase-mer, au cours de laquelle le missile effectue des manœuvres d'évitement en serpentin pour augmenter sa capacité de survie face aux défenses aériennes.\nPar rapport au modèle Sunburn d'origine, le Moskit-M (3M82, SS-N-22B) de la fin des années 1980 peut voler selon une trajectoire HI-LO et dispose d'une capacité de carburant accrue pour une portée globale plus longue, tout en volant plus vite et plus bas que son prédécesseur.
wp_ss-1c=SS-1C,Scud-B,TBM,Le R-17 Elbrus 9K72 (OTAN : SS-1C Scud-B) est un missile balistique tactique soviétique dérivé à l'origine du missile balistique V-2, et très largement diffusé en raison de son faible coût et de sa flexibilité. Bien qu'il ne dispose pas d'un guidage terminal précis et nécessite une longue période de ravitaillement avant le lancement, ce missile peut encore représenter une menace importante pour les installations dépourvues de défenses aériennes avancées.
usn_rum-139a=RUM-139A,VL-ASROC,ASM,Le RUM-139A VL-ASROC (Vertical-Launch ASROC) est un missile anti-sous-marin à distance. Développé comme successeur intérimaire du RUR-5 des années 1960, le RUM-139A est un missile anti-sous-marin à portée étendue destiné à être utilisé depuis le système de lancement vertical Mark 41, et emporte la torpille améliorée Mark 46 NEARTIP. Bien que son acquisition n'ait pas été officiellement financée pendant la Guerre froide, un certain nombre de munitions de présérie sont disponibles à la fin des années 1980, offrant une capacité ASM limitée aux navires équipés de VLS nouvellement mis en service.
wp_53-61=53-61M,,Torpille WH,La 53-61 est une torpille lourde soviétique à guidage de sillage, conçue pour détruire les navires de surface. Il s'agit de la toute première torpille soviétique à suivi de sillage, avec une vitesse et une portée élevées pour son époque.
wp_saet-50=SAET-50M,,Torpille ASu,La SAET-50 est une torpille lourde électrique soviétique anti-navire à guidage sonar passif. Développée à partir de la torpille G7es « Zaunkönig » de la Seconde Guerre mondiale, la SAET-50 est la première torpille à autodirecteur soviétique en service ; bien que jugée obsolète et remplacée par des torpilles plus performantes, elle est restée en stock pendant une grande partie de la Guerre froide, notamment en service à l'exportation.
wp_set-53=SET-53M,,Torpille ASM,La SET-53M est une torpille lourde électrique soviétique anti-sous-marine à guidage sonar passif. Développée à partir de la SAET-50, la SET-53 est la première torpille lourde anti-sous-marine soviétique construite ; bien qu'elle ait été rapidement remplacée en service par des systèmes plus performants, ces armes sont restées en stock pendant la majeure partie de la Guerre froide, notamment en service à l'exportation.
rn_dc_mk11=Mark XI,,Grenade ASM,La grenade sous-marine Mark XI est une grenade anti-sous-marine aéroportée britannique conçue pendant la Seconde Guerre mondiale, qui est restée en service tout au long du reste du XXe siècle.
usn_mk-81=Mk-81,,Bombe,La Mark 81 est une bombe muette polyvalente à faible traînée de 250 lb (110 kg).
