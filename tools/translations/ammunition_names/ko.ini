[AmmunitionNames]
usn_rim-66h=RIM-66H,SM-2MR,함대공 미사일,스탠다드 미사일 2는 레이더 유도 방식의 구역 방어용 지대공 미사일(보조 단거리 대함정 능력을 갖춘)의 한 계열로, 오래 연소하는 지속기와 대부분의 위협에 대한 균형 잡힌 성능을 특징으로 합니다. 스탠다드 미사일 2는 세미액티브 레이더 호밍 방식의 SM-1 탐색기를 고급 데이터링크 중간 유도로 대체하고, 비행 마지막 몇 초 동안 종말 레이더 호밍을 수행합니다. SM-2는 조명기보다 더 많은 미사일을 한 번에 공중에 띄울 수 있게 하여 SM-1을 장비한 함정에 비해 막대한 이점을 제공합니다.\n\nSM-2MR 블록 II(RIM-66H)는 SM-2 블록 II 계열의 이지스(Mark 41 VLS) 버전으로, Mk-41 셀에서 수직 발사되어 최소 발사 거리가 늘어나는 대신 발사 속도가 크게 향상됩니다.
wp_sa-n-1d=M-1,볼나-N,함대공 미사일,M-1 볼나-N(SA-N-1D 고아)은 소련 최초의 함대공 미사일 체계의 개량형입니다. 이 버전은 해면 밀착 비행 표적에 대한 효과가 크게 향상되었습니다.
wp_sa-n-3b=M-11,시토름-N,함대공 미사일,M-11 시토름-N(SA-N-3B 고블렛)은 소련의 개함방공 체계입니다. 본 체계는 다수의 미사일 순양함들과 소련의 헬리콥터 항모 및 STOVL 항공모함에 설치되었습니다. 부가적으로 대함 능력을 갖추고 있으며, 이 버전은 저고도 비행 표적에 대한 성능이 크게 향상되었습니다.
wp_sa-n-4c=M-4,오사-MA2,함대공 미사일,M-4 오사(SA-N-4 게코)는 지상 발사형 오사 SAM(SA-8 게코, 스펠링이 다른 점에 유의)의 함선용 버전으로, 2발의 미사일을 접이식 회전 발사대에 탑재합니다. 해상에서 사용 가능한 오사의 최신 모델로, 저고도 및 ECCM 성능이 대폭 향상되었으며 전반적인 신뢰성도 더욱 높아졌습니다.
wp_ss-1c=R-17,엘브루스,전술 탄도미사일,R-17 엘브루스 9K72(NATO: SS-1C 스커드-B)는 V-2 탄도 미사일에서 유래한 소련의 전술 탄도 미사일로, 낮은 비용과 유연성 덕분에 매우 널리 확산되었습니다. 정확한 종말 유도 능력이 없고 발사 전 연료 주입에 오랜 시간이 필요하지만, 고급 방공 체계가 없는 시설에는 여전히 심각한 위협이 될 수 있습니다.
wp_53-61=53-61M,,항적추적 어뢰,53-61은 수상함을 격파하기 위해 설계된 소련의 항적추적 중어뢰입니다. 소련 최초의 항적추적 어뢰로, 당시로서는 빠른 속도와 긴 사거리를 갖췄습니다.
wp_saet-50=SAET-50M,,대함 어뢰,SAET-50은 수동 소나 유도 방식의 소련제 전기추진식 대함 중어뢰입니다. 전시에 개발된 G7es '짜운쾨니히' 어뢰에서 발전한 SAET-50은 소련 최초로 실전 배치된 유도 어뢰이며, 더 우수한 어뢰들이 등장하면서 구식으로 간주되어 대체되었지만, 특히 수출용으로 냉전 기간의 상당 부분 동안 재고로 남아 있었습니다.
wp_set-53=SET-53M,,대잠 어뢰,SET-53M은 수동 소나 유도 방식의 소련제 전기추진식 대잠 중어뢰입니다. SAET-50에서 발전한 SET-53은 소련이 최초로 제작한 대잠 중어뢰이며, 얼마 지나지 않아 더 우수한 체계로 대체되었지만, 특히 수출용으로 냉전의 대부분 기간 동안 재고로 남아 있었습니다.
rn_dc_mk11=마크 XI,,폭뢰,마크 XI 폭뢰는 제2차 세계대전 중에 설계된 영국제 항공 투하 폭뢰로, 20세기 말까지 계속 사용되었습니다.
usn_mk-81=Mk.81,,폭탄,Mk.81은 110kg(250lb) 저저항 범용 무유도 폭탄입니다.
fin_cal_100mm_d10_tk=100mm
usn_cal_20mm_apds=20mm APDS
wp_cal_30mm_ak230=30mm
