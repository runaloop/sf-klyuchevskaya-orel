[AmmunitionNames]
wp_sa-n-1d=V-601M,波浪-N,面对空/反水面,M-1波浪-N（SA-N-1D）是苏联海军最早的面对空导弹系统的改进型。这一型号对掠海飞行目标的作战效能大幅提升。
wp_sa-n-3b=V-611M,风暴-N,面对空/反水面,M-11风暴-N（SA-N-3B）是苏联海军的面对空导弹系统，装备了多型导弹巡洋舰，以及苏联的直升机航母和短距起飞垂直降落航母。这款导弹具有次级反水面能力，这一型号对抗低空飞行目标的能力大幅提升。
wp_sa-n-4c=9M33M5,黄蜂-MA2,面对空/反水面,M-4黄蜂（SA-N-4）是陆基9K33黄蜂（SA-8）的海军版，其可伸缩旋转发射架悬挂两枚导弹。这是黄蜂导弹在海上的最新型号，低空性能和抗电子干扰性能大幅提升，整体可靠性也更高。
wp_53-61=53-61M,,尾流自导鱼雷,53-61是苏联的重型尾流自导鱼雷，设计用于摧毁水面舰艇。这是苏联最早的尾流跟踪鱼雷，在其所处的时代具有较高的航速和射程。
wp_saet-50=SAET-50M,,反水面鱼雷,SAET-50是苏联的重型电动反舰鱼雷，采用被动声学自导。它由战时的德国G7es“鹪鹩”鱼雷发展而来，是苏联最早服役的自导鱼雷。虽然它后来被认为已经过时，并被性能更强的鱼雷取代，但在冷战的相当长一段时间里仍留在库存中，尤其是在出口服役方面。
wp_set-53=SET-53M,,反潜鱼雷,SET-53M是苏联的重型电动反潜鱼雷，采用被动声学自导。它由SAET-50发展而来，是苏联最早建造的重型反潜鱼雷，虽然很快就被性能更强的系统取代，但在冷战的大部分时间里仍留在库存中，尤其是在出口服役方面。
fin_cal_100mm_d10_tk=100mm
