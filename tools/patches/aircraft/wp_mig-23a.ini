# SF Klyuchevskaya '88: Orel Edition. MiG-23A loadouts on top of the game's own file.
# The standard air-to-air loadouts keep the R-24 the original mod gave them. Two
# experimental R-27 loadouts are appended at the end of the list;
# they pick the missile by mission year (R-27ER/ET from 1987) from tables of their own,
# copied from the game's, so they keep working if the game changes its tables.
# tools/make_unit_files.py applies these keys to the game's own file and writes the
# result to mod/aircraft/; every other value comes from the game.

[WeaponSystems]
AvailableLoadouts=AirToAir,AirToAirLongRange,AirToAirIntercept,Strike,StrikeLongRange,StrikePrecision,CAS,AntiArmor,Recon,Gun,AirToAirR27SARH,AirToAirR27IR
DateBased_SFK_R27_SARH=0,wp_aa-7c|1985,wp_aa-10a|1987,wp_aa-10c
DateBased_SFK_R27_IR=0,wp_aa-7d|1985,wp_aa-10b|1987,wp_aa-10d
DateBased_SFK_WVR=0,wp_aa-2-2|1984,wp_aa-11

[WeaponSystem1Default]
Station1=wp_aa-7d|AA-7
Station2=wp_aa-7d|AA-7

[WeaponSystem1AirToAir]
Station1=wp_aa-7c|AA-7
Station2=wp_aa-7c|AA-7

[WeaponSystem1AirToAirIntercept]
Station1=wp_aa-7c|AA-7
Station2=wp_aa-7c|AA-7

[WeaponSystem1AirToAirR27SARH]
SubModelsToHide=APU-60-2_Left,APU-60-2_Right
ReadyUpTime=15
CoolDownTime=60
Station1=DateBased_SFK_R27_SARH|AA-7
Station2=DateBased_SFK_R27_SARH|AA-7
Station6=DateBased_SFK_WVR|AA-11
Station7=DateBased_SFK_WVR|AA-11
Station5=wp_fueltank800_f
Station10=wp_ua

[WeaponSystem1AirToAirR27IR]
SubModelsToHide=APU-60-2_Left,APU-60-2_Right
ReadyUpTime=15
CoolDownTime=60
Station1=DateBased_SFK_R27_IR|AA-7
Station2=DateBased_SFK_R27_IR|AA-7
Station6=DateBased_SFK_WVR|AA-11
Station7=DateBased_SFK_WVR|AA-11
Station5=wp_fueltank800_f
